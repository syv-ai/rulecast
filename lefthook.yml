# Git hooks, installed by `pnpm install` (prepare script).
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,mjs,cjs,ts,json,jsonc}"
      run: pnpm exec biome check --write --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.ts"
      run: pnpm typecheck

pre-push:
  jobs:
    - name: test
      run: pnpm test
