<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conventions review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* The review page at the end of a conventions session (agents/CONVENTIONS.md, step 8). The agent fills DATA below.
   A fixed frame: the header stays put, the list scrolls. No borders or dividers: surfaces separate by tone alone.
   No label is tinted in its own background's hue. Conventions read as prose (serif); provenance reads as data (mono). */
:root{
  --bg:#eceef1; --card:#ffffff; --sunk:#f3f4f6; --raise:#e1e4e9; --ink:#151a21; --soft:#3b4451; --muted:#5f6977;
  --accent:#2f47b8; --on:#ffffff; --gone:#9a2f32; --back:#1f6b43;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1318; --card:#1a2028; --sunk:#222a33; --raise:#2c3540; --ink:#e8ecf1; --soft:#c5ccd6; --muted:#97a1ae;
  --accent:#93a6f5; --on:#0f1318; --gone:#ef9497; --back:#7fcf9f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1318; --card:#1a2028; --sunk:#222a33; --raise:#2c3540; --ink:#e8ecf1; --soft:#c5ccd6; --muted:#97a1ae;
  --accent:#93a6f5; --on:#0f1318; --gone:#ef9497; --back:#7fcf9f; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);padding-inline:16px;overflow:hidden;
  display:grid;grid-template-rows:auto minmax(0,1fr)}
button,textarea{font:inherit;color:inherit;border:0}
button{cursor:pointer;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{width:100%;max-width:820px;margin:0 auto}
header{padding:18px 0 14px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font:400 23px/1.2 var(--serif);margin-right:auto}
.count{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.primary{background:var(--ink);color:var(--card);border-radius:8px;padding:7px 14px;font-size:14px}
.status{margin:8px 0 0;font-size:13px;color:var(--muted)}
main{overflow:auto;padding-bottom:48px}
section{margin:0 0 26px}
h2{font:500 13px/1.4 var(--mono);color:var(--soft);margin:6px 0 10px}
h2 .what{font-family:var(--sans);font-weight:400;color:var(--muted);margin-left:6px}
.item{background:var(--card);border-radius:12px;padding:14px 16px;margin:0 0 8px}
.item.removed{background:var(--sunk)}
.item.removed .text{text-decoration:line-through;color:var(--muted)}
.text{font:400 17px/1.5 var(--serif);margin:0;white-space:pre-wrap}
.reason{margin:6px 0 0;font-size:14px;color:var(--soft)}
.from{margin:8px 0 0;font:12.5px/1.6 var(--mono);color:var(--muted)}
.from a{color:inherit;text-decoration:underline;text-decoration-color:var(--raise);text-underline-offset:3px}
.tools{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.tool{background:var(--sunk);border-radius:7px;padding:4px 10px;font-size:13px;color:var(--soft)}
.tool:hover{background:var(--raise);color:var(--ink)}
.flag{font:500 12px var(--mono);margin-left:auto}
.flag.gone{color:var(--gone)} .flag.back{color:var(--back)} .flag.edited,.flag.noted{color:var(--accent)}
textarea{width:100%;background:var(--sunk);border-radius:8px;padding:10px 12px;margin-top:10px;resize:vertical;min-height:70px;outline:none}
textarea.edit{font:400 16px/1.5 var(--serif)}
.answers .item{background:var(--sunk)}
.q{font-weight:500;margin:0}
.a{margin:4px 0 0;color:var(--soft)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 14px;
  border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
.empty{color:var(--muted)}
@media (max-width:560px){h1{font-size:20px}.text{font-size:16px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="bar"><h1 id="title">Conventions</h1><span class="count" id="count"></span>
    <button class="primary" id="copy" type="button">Copy for the chat</button></div>
  <p class="status" id="status">Edit, remove or comment on anything. Tell your agent in the chat when you're done.</p>
</div></header>
<main><div class="wrap" id="list"></div></main>
<div class="toast" id="toast" role="status"></div>
<script>
/* The agent replaces the null below with:
   { repository: "name",
     answers: [{ id: "q1", question: "…", answer: "what the developer said, in their words" }],
     items:   [{ id: "c1", file: "AGENTS.md" | "docs/conventions/<area>.md" | "docs/conventions/declined.md",
                 text: "the principle or convention, in plain words",
                 reason: "declined items only: the developer's reason",
                 from: ["q1"], lenses: ["fail-fast"] }] }
   Choices are saved per item in the db collection "review" when the page runs as an Artifact with db, and are always
   in "Copy for the chat". */
const DATA = /*DATA*/null;
const LENS_URL = "https://syv-ai.github.io/rulecast/agents/lenses/entries/";
const D = DATA || { repository: "this repository", answers: [], items: [] };
const S = {};               // item id -> { removed, restored, text, comment }
const open = {};            // item id -> "edit" | "comment"
let db = null;
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const declined = (it) => it.file === "docs/conventions/declined.md";
const toast = (m) => { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2600); };

function groups() {
  const order = (f) => f === "AGENTS.md" ? 0 : declined({ file: f }) ? 2 : 1;
  const files = [...new Set(D.items.map((i) => i.file))].sort((a, b) => order(a) - order(b) || a.localeCompare(b));
  return files.map((f) => ({ file: f, items: D.items.filter((i) => i.file === f) }));
}

function render() {
  const list = $("list"); list.replaceChildren();
  $("title").textContent = `Conventions for ${D.repository}`;
  document.title = `Conventions for ${D.repository}`;
  const changed = D.items.filter((i) => { const s = S[i.id] || {}; return s.removed || s.restored || s.text || s.comment; }).length;
  $("count").textContent = `${D.items.length} items${changed ? ` · ${changed} changed` : ""}`;
  if (!D.items.length) list.append(el("p", "empty", "Nothing to review yet."));
  for (const g of groups()) {
    const sec = el("section"); const h = el("h2", null, g.file);
    h.append(el("span", "what", g.file === "AGENTS.md" ? "principles" : declined(g) ? "what you said no to, with your reason" : "conventions"));
    sec.append(h);
    for (const it of g.items) sec.append(card(it));
    list.append(sec);
  }
  if (D.answers.length) {
    const sec = el("section", "answers"); sec.append(el("h2", null, "Your answers"));
    for (const a of D.answers) { const c = el("div", "item"); c.id = `answer-${a.id}`; c.append(el("p", "q", a.question), el("p", "a", a.answer)); sec.append(c); }
    list.append(sec);
  }
}

function card(it) {
  const s = S[it.id] || {}, no = declined(it);
  const c = el("article", "item"); c.id = `item-${it.id}`;
  if (!no && s.removed) c.classList.add("removed");
  c.append(el("p", "text", s.text || it.text));
  if (it.reason) c.append(el("p", "reason", `Your reason: ${it.reason}`));
  const from = el("p", "from");
  const qs = (it.from || []).map((q) => D.answers.find((a) => a.id === q)).filter(Boolean);
  if (qs.length) { from.append("from: "); qs.forEach((a, i) => { if (i) from.append(", "); const l = el("a", null, a.question); l.href = `#answer-${a.id}`; from.append(l); }); }
  if ((it.lenses || []).length) { if (qs.length) from.append(" · "); from.append("lens: "); it.lenses.forEach((id, i) => { if (i) from.append(", "); const l = el("a", null, id); l.href = LENS_URL + id + ".md"; l.target = "_blank"; l.rel = "noopener"; from.append(l); }); }
  if (from.childNodes.length) c.append(from);
  const tools = el("div", "tools");
  const btn = (label, fn) => { const b = el("button", "tool", label); b.type = "button"; b.onclick = fn; tools.append(b); };
  if (no) btn(s.restored ? "Keep it declined" : "Bring back", () => save(it.id, { restored: !s.restored }));
  else {
    btn(open[it.id] === "edit" ? "Close" : "Edit", () => toggle(it.id, "edit"));
    btn(s.removed ? "Keep it" : "Remove", () => save(it.id, { removed: !s.removed }));
  }
  btn(open[it.id] === "comment" ? "Close" : s.comment ? "Comment ·" : "Comment", () => toggle(it.id, "comment"));
  const flag = no ? (s.restored && ["back", "brought back"]) : s.removed ? ["gone", "removed"] : s.text ? ["edited", "edited"] : null;
  const f = flag || (s.comment && ["noted", "commented"]);
  if (f) tools.append(el("span", `flag ${f[0]}`, f[1]));
  c.append(tools);
  if (open[it.id]) {
    const edit = open[it.id] === "edit", t = el("textarea", edit ? "edit" : null);
    t.value = edit ? s.text || it.text : s.comment || "";
    t.setAttribute("aria-label", edit ? "Your wording" : "Your comment");
    t.placeholder = edit ? "" : "What should change, or why";
    t.onchange = () => { const v = t.value.trim(); save(it.id, edit ? { text: v && v !== it.text ? v : "" } : { comment: v }, true); };
    c.append(t);
    requestAnimationFrame(() => t.focus());
  }
  return c;
}

function toggle(id, what) { open[id] = open[id] === what ? null : what; render(); }

async function save(id, patch, keepOpen) {
  S[id] = { ...(S[id] || {}), ...patch };
  if (!keepOpen) open[id] = open[id] === "edit" && patch.removed ? null : open[id];
  render();
  if (!db) return;
  try { await db.collection("review").doc(id).set({ ...S[id], at: Date.now() }); }
  catch (e) { toast("Couldn't save that. It's kept on this page; use Copy for the chat."); }
}

function forChat() {
  const lines = [`Conventions for ${D.repository}: my review`];
  for (const it of D.items) {
    const s = S[it.id] || {}, bits = [];
    if (declined(it) && s.restored) bits.push("bring back");
    if (!declined(it) && s.removed) bits.push("remove");
    if (s.text) bits.push(`reword → "${s.text}"`);
    if (s.comment) bits.push(`comment: ${s.comment}`);
    if (bits.length) lines.push(`- ${it.id} (${it.file}) "${it.text}": ${bits.join("; ")}`);
  }
  if (lines.length === 1) lines.push("- No changes: keep everything as listed.");
  return lines.join("\n");
}

$("copy").onclick = async () => {
  const text = forChat();
  try { await navigator.clipboard.writeText(text); toast("Copied. Paste it into the chat."); }
  catch (e) { const t = el("textarea"); t.value = text; document.body.append(t); t.select(); try { document.execCommand("copy"); toast("Copied. Paste it into the chat."); } catch (_) { toast("Select the text and copy it."); } t.remove(); }
};

render();

(async () => {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try { db = await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) return;
  $("status").textContent = "Your choices save as you go. Tell your agent in the chat when you're done.";
  db.collection("review").onSnapshot((snap) => {
    for (const d of snap.docs) { const { at, ...rest } = d.data(); if (!open[d.id]) S[d.id] = rest; }
    render();
  });
})();
</script>
</body>
</html>
