version: 2
updates:
  # Pinned action versions rot silently; a weekly PR is the cheapest way to notice.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Grouped by risk rather than by dev-vs-production, because that is the axis that decides
  # whether a PR can be merged on sight. Splitting on dependency-type put majors in with patches,
  # so one upgrade nobody can take yet held every safe update behind it, as typescript 7 and zod 4
  # did for a while. Dependabot already folds both directories into one PR when an update applies
  # to both.
  - package-ecosystem: npm
    directories:
      - /
      - /packages/rulecast
    schedule:
      interval: weekly
    ignore:
      # 5 needs Node 22; CI still tests on Node 20 and engines promises 20.12.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      # vitest's vite. 7 and 8 need Node 20.19, and 8 crashes on start on 20.12.
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      # 9 needs Node 22. tsup only bundles the JS now; declarations come from tsc.
      - dependency-name: tsup
        update-types: ["version-update:semver-major"]
      # Matches engines: newer types would accept Node APIs that crash on Node 20.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR a week for everything routine, expected to be green and merged unread.
      routine:
        patterns: ["*"]
        update-types: [minor, patch]
      # Majors still arrive grouped, but in their own PR, where a red build is information
      # about that upgrade rather than noise blocking the others.
      majors:
        patterns: ["*"]
        update-types: [major]
