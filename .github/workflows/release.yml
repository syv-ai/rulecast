name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Trusted publishing: npm exchanges this workflow's OIDC token for a short-lived credential,
      # which is what authorises the publish — there is no npm token in this repository. It also
      # generates provenance by itself, so the published package still carries a signed link back
      # to this run. Configured on npmjs.com against syv-ai/rulecast and this file's name.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets reads the history to work out what has been released.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # `pnpm install` runs lefthook install, so the push this action makes runs pre-push, which
      # runs the suite. That is deliberate — it caught a test that hard-coded "running 0.0.0" and
      # would have broken the 0.1.0 bump — but it means a test failure here surfaces as
      # "failed to push some refs". Read the log above the git error.
      #
      # With pending changesets this opens or updates the version PR and stops. With none, and a
      # version that is not on npm yet, it publishes, tags, and cuts the GitHub Release that
      # binaries.yml then attaches binaries to.
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "release: version packages"
          commit: "release: version packages"
          # rulecast tags itself, below. changesets would tag a workspace package
          # `@syv-ai/rulecast@0.1.0`, and this repository is also a rule repo consumed by git tag:
          # latestTag (core/repos/tags.ts) accepts only vX.Y.Z, so that tag would make
          # `rulecast init` report "no version tags" and offer nobody any catalog rules.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN: setup-node's registry-url writes an .npmrc pointing at it, and an
          # empty one gets in the way of the OIDC exchange. No NPM_CONFIG_PROVENANCE either —
          # trusted publishing attests without being asked.

      # Only after a successful publish. The tag is what the catalog, the drafting prompt and
      # `rulecast autoupdate` all resolve, and what binaries.yml hangs its uploads on.
      - name: Tag and release
        if: steps.changesets.outputs.published == 'true'
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/rulecast/package.json').version")
          pnpm release-notes > /tmp/notes.md
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file /tmp/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # lefthook's pre-push runs the suite. On the version-PR push that is a useful gate, but
          # here npm publish has already happened: a flaky test would leave the package published
          # with no tag, no release, and so no binaries, and an npm version cannot be republished.
          LEFTHOOK: "0"
