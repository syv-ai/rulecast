name: pages

# The docs site, https://syv-ai.github.io/rulecast/. Its code is main's; its content (README.md,
# agents/, the version, the renderer goldens) is a release's, so the site documents what
# `npx @syv-ai/rulecast` installs and its raw agents/SETUP.md always means the latest release.
#
# Not `on: push` or `on: release`: release.yml creates the tag with GITHUB_TOKEN, which starts no
# workflow run, so it calls this directly once a release is tagged (as it does binaries.yml).
# workflow_dispatch redeploys by hand: "latest" for the newest tag, or "main" for a docs fix that
# cannot wait for a release. Any other tag builds main's site around that tag's content, which is
# not quite the site that tag shipped: main's page table decides the pages, so a page main no longer
# has (v0.12.0's guides/commands.md and guides/claude-code-plugin.md) is not served, and an old URL
# that main redirects is redirected. Redirects name a page with no anchor, so they land in any
# release's content. To restore an old release's site exactly, build that tag's own checkout.
#
# The site's code is main's and its content is exactly the release's (content-from removes main's
# copy first). Main's code copes with a release older than itself: a page whose source the release
# lacks is left off, the Commands page falls back to the README's table, and no install.sh is served
# without one. What it cannot cope with fails the build, not quietly: a README section main's site
# does not place, or content its own pages need, such as the renderer goldens of the landing demo.
on:
  workflow_call:
    inputs:
      ref:
        description: The release tag whose content to publish, such as v0.6.0.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Content from "latest" (the newest vX.Y.Z tag), a tag, or "main".
        required: true
        default: latest
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # content-from needs the tags.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Sets SITE_CONTENT_REF for the build below (through $GITHUB_ENV), so its GitHub links name the
      # tag. Only this job sets it: a local build or test run always uses the working tree's content.
      - run: pnpm --filter @syv-ai/rulecast-site content-from "${{ inputs.ref }}"
      - run: pnpm --filter @syv-ai/rulecast-site build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
