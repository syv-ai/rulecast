name: binaries

# Not `on: release`. The release is created by release.yml with GITHUB_TOKEN, and an event raised
# by GITHUB_TOKEN does not start a new workflow run — so this never fired for v0.2.0 or v0.3.0 and
# both shipped with no binaries, silently. release.yml calls it directly instead, and the ordering
# is explicit rather than event-driven. workflow_dispatch is for backfilling a release that missed.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and attach to, such as v0.3.0.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and attach to, such as v0.3.0.
        required: true
        type: string

jobs:
  attach:
    strategy:
      fail-fast: false
      matrix:
        # The same four as ci.yml and packages/rulecast/scripts/build-binary.ts. Each builds on its
        # own runner because bun cannot cross-compile a binary that embeds @ast-grep/napi's
        # platform-specific native module.
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm binary

      # Prove it runs before attaching it to a release people will download.
      - run: pnpm vitest run test/binary.test.ts
        working-directory: packages/rulecast
        env:
          RULECAST_BINARY: ${{ github.workspace }}/packages/rulecast/binaries/rulecast-${{ matrix.target }}

      # A binary nobody can verify is a binary nobody should run.
      - name: Checksum
        working-directory: packages/rulecast/binaries
        run: shasum -a 256 "rulecast-${{ matrix.target }}" > "rulecast-${{ matrix.target }}.sha256"

      - name: Attach to the release
        working-directory: packages/rulecast/binaries
        run: |
          gh release upload "${{ inputs.tag }}" \
            "rulecast-${{ matrix.target }}" "rulecast-${{ matrix.target }}.sha256" \
            --clobber --repo "${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
