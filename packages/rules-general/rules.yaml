# Rules without an id prefix. "@" paths in context are relative to this directory.
- id: generated-code
  name: Generated code is never edited by hand
  description: "Flags edits to generated files: *.gen.* files and __generated__/ directories."
  files: '\.gen\.[cm]?[jt]sx?$|(^|/)__generated__/'
  severity: error
  detect:
    path: {}
  message: "{{file}} is generated. Change its source and regenerate it; never edit it by hand."
  context:
    - "@generated-code.md"
  # A `path` rule has no good example to give: every file it matches is a violation, and a file it
  # does not match is not the rule's business. `files` is the rule, and the bad cases pin its shape.
  examples:
    bad:
      - path: frontend/src/client/sdk.gen.ts
        code: |
          export const listUsers = () => request("/users")
      - path: src/__generated__/schema.ts
        code: |
          export type Query = { users: User[] }
- id: vendored-code
  name: Vendored code is never edited in place
  description: "Flags edits to vendored code: vendor/ and third_party/ directories."
  files: '(^|/)(vendor|third_party)/'
  severity: error
  detect:
    path: {}
  message: "{{file}} is vendored. Update the dependency and re-vendor it (or patch it upstream); never edit it in place."
  context:
    - "@vendored-code.md"
  # As with generated-code: every file `files` matches is a violation, so only bad examples.
  examples:
    bad:
      - path: vendor/github.com/acme/lib/lib.go
        code: |
          package lib
      - path: third_party/zlib/inflate.c
        code: |
          int inflate(void);
