- id: core-subdomain
  name: Core, Supporting and Generic Subdomains
  family: principle
  group: architecture
  says: Sort the business areas a system covers into core (what sets the business apart), supporting (needed and
    specific, but no edge) and generic (solved problems), and spend design rigour on the core while keeping
    the rest simple or buying it.
  names: Also called Core domain, Subdomain types, Distillation. Eric Evans, Domain-Driven Design (2003), ch. 15
    (Distillation, in part IV, Strategic Design), which names Core Domain and Generic Subdomains and speaks of
    supporting elements only in passing. The three-way split with supporting subdomains was made standard by
    Vaughn Vernon's Implementing Domain-Driven Design (2013) and Vlad Khononov's Learning Domain-Driven Design
    (2021), which ties each type to a choice of implementation pattern.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A rich domain model (aggregates, value objects, events, thorough tests) in one or two modules, and plain
      CRUD or transaction scripts elsewhere.
    - Authentication, billing, email or search delegated to a library or service rather than written in-house.
    - A short document or README section naming which module is core and why.
    - The strongest developers and most review attention on the core module.
  forces:
    - The same heavy patterns are applied everywhere, so simple admin screens take as long as the hard parts.
    - The team has built its own version of something it could have bought (auth, scheduling, PDF rendering).
    - The part that makes the product different is buried in code no more careful than the rest.
    - Deciding which DDD patterns to use, and where, needs a rule better than "everywhere" or "nowhere".
  overuse:
    - Labelling everything core, so the classification guides nothing.
    - Treating supporting code as unimportant and letting it rot, when it still has to work.
    - Building a "core" from scratch that is actually generic, such as a home-grown identity system.
  remedy: null
  counter: >
    This is where DDD's rigour pays and where it doesn't. Khononov's heuristic is the clearest: core
    subdomains get a domain model (or an event-sourced one) because their logic is complex and changes;
    supporting subdomains get a transaction script or active record; generic ones are bought or adopted. So
    the tactical patterns are overkill for CRUD and for supporting and generic areas, and a CRUD app with no
    distinctive logic may have no core worth modelling at all. Classifications move: a core idea can become a
    commodity, and a supporting area can become core when the business competes on it, so revisit them. For
    developer tools and libraries the core is usually the technical problem itself, and the business framing
    fits less well. Teams tend to overrate how much of their system is core; asking "would we lose customers
    if a competitor had this?" helps.
  in: {}
  related:
    - bounded-context
    - reinventing-the-wheel
    - over-engineering
    - yagni
    - domain-allergy
    - aggregate
  tell: null
  interview_only: false
  example:
    before: |
      # office_locations: an admin table edited twice a year
      class OfficeLocation(AggregateRoot): ...
      class OfficeLocationFactory: ...
      class OfficeLocationRepository: ...
      class OfficeLocationRenamed(DomainEvent): ...

      # dynamic pricing: the product's edge
      fn price(room, date) -> float:
          return base_rates[room.type] * (1.2 if date.is_weekend else 1.0)
    after: |
      # supporting: plain CRUD is enough
      fn update_office_location(id, fields): db.update("office_locations", id, fields)

      # core: the rigour goes here
      class RatePlan:                       # aggregate with invariants and tests
          fn quote(room: RoomType, stay: StayDates, demand: DemandForecast) -> Quote:
              ...                           # floors, ceilings, length-of-stay rules
      class Quote: ...                      # value object
    note: Effort moves from ceremony around an admin table to the pricing model that sets the business apart.
  sources:
    - cite: Eric Evans, Domain-Driven Design Reference (2015), Core Domain, Generic Subdomains, Domain Vision
        Statement, Highlighted Core, Segregated Core
      url: https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf
      how: read
    - cite: Eric Evans, Domain-Driven Design (2003), ch. 15
      url: https://www.domainlanguage.com/ddd/
      how: recalled
    - cite: Vlad Khononov, Learning Domain-Driven Design (2021), ch. 1 and 10 (design heuristics)
      url: https://www.oreilly.com/library/view/learning-domain-driven-design/9781098100124/
      how: recalled
    - cite: Vaughn Vernon, Implementing Domain-Driven Design (2013), ch. 2
      url: null
      how: recalled
  matters_most_for:
    - web-api
    - fullstack-web
    - platforms
    - distributed
- id: dependency-rule
  name: The Dependency Rule
  family: principle
  group: architecture
  says: >
    Source code dependencies point inward, toward policy. Business rules never import the database, the web
    framework or the UI; those outer parts depend on the rules, and where control has to flow outward the
    inner code defines an interface for the outer code to implement.
  names: >
    Named by Robert C. Martin in "The Clean Architecture" (2012) and the book Clean Architecture (2017). It
    generalises his Dependency Inversion Principle (the D in SOLID) and his Stable Dependencies and Stable
    Abstractions principles to whole systems. The same rule underlies Cockburn's ports and adapters and
    Palermo's onion architecture.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Domain or core modules whose imports are only the standard library and each other.
    - Interfaces declared in the inner package and implemented in an outer one (repository in domain,
      SqlRepository in infrastructure).
    - Plain data (DTOs, records) crossing boundaries rather than ORM rows or framework request objects.
    - Build or lint rules (separate projects, crates, import contracts) that fail when an inner module imports
      an outer one.
  forces:
    - A framework or ORM upgrade forces edits in business-rule files.
    - Domain code can't be unit tested without booting the framework or a database.
    - Framework types (request objects, ORM entities, SDK clients) appear in the signatures of business
      functions.
    - The rules are expected to outlive the current framework or delivery mechanism.
  overuse:
    - Wrapping types that are effectively part of the language platform (dates, decimals, collections) so the
      core imports "nothing".
    - Treating a thin CRUD app's handlers as outer rings around an empty core.
    - Copying every value into a boundary DTO even when the inner and outer shape are identical and owned by
      the same team.
  remedy: Invert the offending import by declaring an interface in the inner module and implementing it in the
    outer one, and map framework types to plain data at the boundary.
  counter: >
    The rule assumes there is a stable core worth protecting. In small apps, scripts, and code whose whole
    point is the framework (a Django admin, a CLI wrapper over one SDK), following it buys indirection and
    nothing else. Committing deliberately to a framework is a legitimate choice, and some teams accept ORM
    entities as domain objects to avoid a mapping layer. Martin's own descriptions of the rings are schematic;
    the rule is the inward direction, not a fixed count of layers, and treating the four circles as mandatory
    projects is a common misreading.
  in:
    python: >
      Nothing stops a circular or outward import until runtime. import-linter "layers" and "forbidden"
      contracts are the usual enforcement. Watch for Pydantic or SQLAlchemy models used as the domain model;
      that may be an accepted trade, but it means the core depends on them.
    typescript: >
      Enforce with dependency-cruiser, eslint-plugin-boundaries or Nx module boundaries. Type-only imports
      (`import type`) still create a design dependency even though they vanish at runtime.
    java: >
      ArchUnit tests or JPMS module-info exports enforce it. Annotations from JPA, Jackson or Spring on domain
      classes are an outward dependency, even though they look like metadata.
    csharp: >
      Separate assemblies make the compiler enforce it: the core project references no infrastructure project.
      EF Core attributes on domain entities break it; fluent configuration in the infrastructure project keeps
      it.
    go: >
      Go forbids import cycles between packages, which helps but doesn't fix direction. Consumer-declared
      interfaces keep inner packages from importing adapters; an `internal/` tree limits who can import what.
    rust: >
      Crates in a workspace can't form cycles, so putting the core in its own crate with no dependency on the
      adapter crates enforces the rule at build time. Inside one crate, module privacy is the only tool.
  related:
    - ports-and-adapters
    - layered-architecture
    - solid
    - law-of-leaky-abstractions
  tell: >
    Path-aware, for Python, TypeScript and Java: a file under a domain, core or entities directory that
    imports a web framework, ORM or cloud SDK (Python `fastapi`, `flask`, `django`, `sqlalchemy`, `boto3`;
    TypeScript `express`, `@nestjs/*`, `prisma`, `typeorm`; Java `org.springframework.*`,
    `jakarta.persistence.*`). Only meaningful in a codebase that has declared such a directory as its core.
  interview_only: false
  sources:
    - cite: Robert C. Martin, The Clean Architecture (blog, 2012)
      url: https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
      how: read
    - cite: Robert C. Martin, Clean Architecture (2017), The Dependency Rule
      url: null
      how: recalled
  example:
    before: |
      # domain/credit.py
      import web_framework.Request
      import orm.Session

      class CreditPolicy:
          fn approve(request: Request, session: Session) -> bool:
              applicant = session.query(ApplicantRow).get(request.params["id"])
              return applicant.income > 3 * applicant.monthly_debt
    after: |
      # domain/credit.py  (imports nothing from outer layers)
      interface Applicants:
          fn get(id) -> Applicant

      class CreditPolicy:
          fn approve(applicant: Applicant) -> bool:
              return applicant.income > 3 * applicant.monthly_debt

      # web/credit_handler.py  (outer layer depends inward)
      fn handle(request: Request):
          applicant = applicants.get(request.params["id"])
          return policy.approve(applicant)
    note: The policy no longer knows about requests or ORM sessions; the handler, which is outer, does the
      translation and depends on the policy.
  matters_most_for:
    - web-api
    - fullstack-web
    - mobile
    - desktop
- id: least-privilege
  name: Least privilege
  family: principle
  group: security
  says: >
    Give every user, process, service account, token and plugin only the permissions its job needs, for only
    as long as it needs them, so a mistake or a compromise can do only that much harm.
  names: >
    Stated as one of eight design principles by Jerome Saltzer and Michael Schroeder in "The Protection of
    Information in Computer Systems" (1975), beside fail-safe defaults and separation of privilege. Also
    called the principle of least authority (POLA) in capability-security writing. OWASP pairs it with
    separation of duties in the Secure Product Design Cheat Sheet, and deny-by-default access control in
    A01:2025.
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - iac
    - serverless
    - platforms
    - plugin-host
    - distributed
  looks_like:
    - Separate database roles per service, with read-only roles for reporting and no app using the admin
      account.
    - Cloud IAM policies naming specific actions and resources rather than "*".
    - API tokens and OAuth grants with narrow scopes and expiry.
    - Plugins, hooks or extensions that declare the capabilities they need and get nothing else.
    - Containers running as a non-root user with a read-only filesystem.
  forces:
    - Several components share credentials or one powerful service account.
    - Code runs that the core team didn't write (plugins, hooks, user scripts, dependencies).
    - The system handles data or actions whose misuse would be costly (payments, personal data,
      infrastructure).
    - A credential could leak through logs, a laptop or a CI job, and you want the leak to be small.
  overuse:
    - Permissions so fine-grained that every change needs a ticket, so people grant wildcards to get unstuck
      and the end state is worse.
    - Permission prompts so frequent that users approve everything without reading.
    - A capability system for a script only its author runs.
  remedy: null
  counter: >
    Privilege has an operational cost: someone must define, review and fix the grants, and each denial at the
    wrong moment slows the team. Small teams and early prototypes often run with broad permissions knowingly
    and tighten at the first real user data or the first external code; that's a reasonable order if the
    deadline is real. Least privilege that is too painful to live with decays into wildcards, so the design
    has to make the narrow grant the easy one.
  in:
    rust: >
      Wasm plugin hosts (wasmtime with WASI) grant capabilities explicitly: a guest gets no files, sockets or
      environment unless the host passes them in, which makes least privilege the default for plugins.
    typescript: >
      Deno's permission flags (--allow-net, --allow-read with paths) and Node's permission model apply it to
      scripts; the more common gap is long-lived npm and cloud tokens with full scopes in CI.
  related:
    - secure-by-default
    - defense-in-depth
    - broken-object-level-authorization
    - hard-coded-secrets
  tell: null
  interview_only: false
  example:
    before: |
      # nightly analytics export
      fn export_daily_orders():
          db = connect(user="app_admin", password=secrets.get("ADMIN_DB_PASSWORD"))
          rows = db.query("SELECT * FROM orders WHERE day = ?", [yesterday()])
          storage.put("exports/orders.csv", to_csv(rows))   # bucket token can read and delete everything
    after: |
      # nightly analytics export
      fn export_daily_orders():
          db = connect(user="analytics_reader", password=secrets.get("ANALYTICS_DB_PASSWORD"))
          rows = db.query("SELECT id, day, total, region FROM orders_export WHERE day = ?",
                          [yesterday()])
          storage.put("exports/orders.csv", to_csv(rows))   # token may only write under exports/
    note: The job now runs as a read-only role on a view without personal columns, with a storage token that can
      only add exports, so a leak of either credential exposes little.
  sources:
    - cite: OWASP Cheat Sheet Series, Secure Product Design, Least Privilege and Separation of Duties (CC BY-SA 4.0)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Secure_Product_Design_Cheat_Sheet.html
      how: read
    - cite: OWASP Cheat Sheet Series, Authorization, least privilege and deny by default (CC BY-SA 4.0)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
      how: read
    - cite: OWASP Top 10 2025, A01:2025 Broken Access Control (CC BY 3.0)
      url: https://top10.owasp.org/2025/A01_2025-Broken_Access_Control/
      how: read
    - cite: Saltzer and Schroeder, The Protection of Information in Computer Systems, Proc. IEEE 63(9), 1975
      url: https://www.cs.virginia.edu/~evans/cs551/saltzer/
      how: recalled
- id: secure-by-default
  name: Secure by default
  family: principle
  group: security
  says: >
    The out-of-the-box setting is the safe one, and anything dangerous (network access, disabled TLS checks,
    open CORS, debug mode, running untrusted code) must be switched on explicitly, by a setting whose name
    says it is dangerous.
  names: >
    Rooted in Saltzer and Schroeder's "fail-safe defaults" (1975): base access decisions on permission rather
    than exclusion. "Secure by default" is the second D of Microsoft's SD3 (secure by design, by default and
    in deployment) from Howard and LeBlanc's Writing Secure Code (2nd ed., 2002), and the name of CISA's 2023
    Secure by Design and Default guidance. OWASP's Secure Product Design Cheat Sheet and A02:2025 Security
    Misconfiguration ask for it.
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - library-sdk
    - plugin-host
    - cli-devtool
    - platforms
    - iac
  looks_like:
    - Configuration options whose default is the restrictive value, with dangerous ones named as such
      (dangerously_allow_network, danger_accept_invalid_certs, allow_unsafe).
    - Hooks, plugins or scripts that get no network, file or shell access unless the config grants it.
    - Authorization that denies routes unless a policy allows them, with public routes marked explicitly.
    - Debug pages, API explorers and verbose errors off unless an environment flag turns them on.
    - New storage buckets, ports and admin consoles closed until opened.
  forces:
    - Your software is configured by people who won't read the security section (users of a library, a CLI, a
      platform, a plugin host).
    - An option exists whose unsafe value is useful in development and harmful in production.
    - Extensions, hooks or user code run inside your process or with your credentials.
    - Most users will keep whatever the default is, so the default decides the security of most deployments.
  overuse:
    - Defaults so locked down that the first-run experience fails, so tutorials tell everyone to disable the
      protection and the opt-out becomes the real default.
    - A dangerous flag that turns off many protections at once, so people who need one weaken all of them.
    - Prompting at runtime for every capability instead of letting a config declare it once.
  remedy: null
  counter: >
    Strict defaults have an adoption cost; a development tool that can't fetch anything until configured may
    lose users to one that can. Changing a default to the safe value later breaks everyone who relied on the
    old one (Hyrum's law), so it needs a deprecation path rather than a silent flip. Some argue that developer
    tools running on the user's own machine with the user's own permissions gain little from sandboxing
    defaults; that weakens once the tool runs third-party hooks, plugins or agent-written code.
  in:
    python: >
      Django's startproject writes DEBUG = True, and FastAPI serves /docs and /openapi.json unless disabled,
      so production settings must flip them. requests verifies TLS by default; verify=False is the opt-out.
    typescript: >
      The cors package's default allows any origin, and Express sends no security headers without helmet.
      Node's TLS rejects bad certificates unless rejectUnauthorized is false or NODE_TLS_REJECT_UNAUTHORIZED
      is 0.
    java: With Spring Boot, adding Spring Security requires authentication for every route and enables CSRF
      protection by default; permitAll is the explicit opt-out. Defining your own SecurityFilterChain replaces
      that default, so end it with anyRequest().authenticated() (or denyAll) to keep deny-by-default.
    csharp: >
      ASP.NET Core allows anonymous access unless [Authorize] is applied; setting a FallbackPolicy that
      requires an authenticated user makes it deny by default, with [AllowAnonymous] as the opt-out.
    go: >
      net/http's Server and default Client have no timeouts, an unsafe default to override. InsecureSkipVerify
      is the named opt-out for TLS checks.
    rust: >
      reqwest and rustls verify certificates by default, and the opt-outs are named
      danger_accept_invalid_certs and dangerous(), the shape this principle asks for.
  related:
    - least-privilege
    - defense-in-depth
    - principle-of-least-astonishment
    - hyrums-law
    - ssrf
  tell: >
    Written for python, typescript, go, csharp and rust. A safe default switched off in code outside tests:
    verify=False, rejectUnauthorized false, NODE_TLS_REJECT_UNAUTHORIZED set to 0, InsecureSkipVerify true,
    ServerCertificateCustomValidationCallback returning true, danger_accept_invalid_certs(true), DEBUG = True
    in a settings file not named for development, or a CORS configuration allowing any origin with
    credentials.
  interview_only: false
  example:
    before: |
      class HookConfig:
          command: str
          timeout_seconds: int = 30
          allow_network: bool = True

      fn run_hook(config: HookConfig, event: Event):
          sandbox = Sandbox(network=config.allow_network)
          sandbox.run(config.command, stdin=event.to_json(), timeout=config.timeout_seconds)
    after: |
      class HookConfig:
          command: str
          timeout_seconds: int = 30
          dangerously_allow_network: bool = False   # must be set explicitly per hook

      fn run_hook(config: HookConfig, event: Event):
          if config.dangerously_allow_network:
              audit.warn("hook has network access", command=config.command)
          sandbox = Sandbox(network=config.dangerously_allow_network)
          sandbox.run(config.command, stdin=event.to_json(), timeout=config.timeout_seconds)
    note: A hook gets no network unless its config opts in with a setting that says it is dangerous, so the common
      case is safe and the exception is visible in review.
  sources:
    - cite: OWASP Cheat Sheet Series, Secure Product Design, secure defaults and failing securely (CC BY-SA 4.0)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Secure_Product_Design_Cheat_Sheet.html
      how: read
    - cite: OWASP Top 10 2025, A02:2025 Security Misconfiguration (CC BY 3.0)
      url: https://top10.owasp.org/2025/A02_2025-Security_Misconfiguration/
      how: read
    - cite: Saltzer and Schroeder, The Protection of Information in Computer Systems (1975), fail-safe defaults
      url: https://www.cs.virginia.edu/~evans/cs551/saltzer/
      how: recalled
    - cite: Howard and LeBlanc, Writing Secure Code, 2nd ed. (2002), SD3
      url: null
      how: recalled
    - cite: CISA, Secure by Design (2023)
      url: https://www.cisa.gov/securebydesign
      how: recalled
- id: defense-in-depth
  name: Defense in depth
  family: principle
  group: security
  says: >
    Protect anything that matters with several independent layers of control, so one missed check, bug or
    misconfiguration doesn't expose it on its own.
  names: >
    A military term for trading space for time with layered defences, adopted for information security by the
    NSA and the US Department of Defense around 2000. Listed as a principle in OWASP's Secure Product Design
    Cheat Sheet. Related to Saltzer and Schroeder's separation of privilege (1975) and to the Swiss cheese
    model of accidents (James Reason).
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - platforms
    - web-api
    - distributed
    - fullstack-web
  looks_like:
    - Authorization checked in the handler and also enforced by a tenant filter or row-level security in the
      data layer.
    - Parameterized queries plus a database role that can't drop tables or read other schemas.
    - Input validated at the edge, output encoded at the sink, and a Content Security Policy as a backstop.
    - Network segmentation so a compromised web tier can't reach the database admin port or internal tools.
    - Monitoring and alerting that would notice when the layers in front fail.
  forces:
    - A single check guards something costly (other tenants' data, money, admin actions).
    - The check lives in code many people change, so a regression is likely sooner or later.
    - Your controls depend on components you don't control (a framework default, a gateway config, a cloud
      policy).
    - Detecting a breach late would cost more than a second layer does.
  overuse:
    - Layers that share a failure mode (two checks reading the same spoofable header), which add complexity
      and no independence.
    - The same validation copied into every layer, so changing a rule means changing five places that drift
      (shotgun surgery).
    - Using extra layers as a reason not to fix the primary control properly.
  remedy: null
  counter: >
    Every layer costs code, latency and operational attention, and layers that can't fail independently only
    look like depth. For low-value data or an internal tool, one well-tested control is often the better
    trade. The layers also need an owner each: a second check nobody tests tends to rot unnoticed until the
    day it's needed. Depth is not a substitute for getting the primary control right.
  in: {}
  related:
    - least-privilege
    - secure-by-default
    - validate-at-the-boundary
    - broken-object-level-authorization
    - shotgun-surgery
  tell: null
  interview_only: false
  example:
    before: |
      route GET "/projects/{id}/documents"
      fn list_documents(id: str, user: User) -> list[Document]:
          if not memberships.is_member(user, id):
              return forbidden()
          return db.query("SELECT * FROM documents WHERE project_id = ?", [id])
          # every other query on documents must remember its own check
    after: |
      route GET "/projects/{id}/documents"
      fn list_documents(id: str, user: User) -> list[Document]:
          if not memberships.is_member(user, id):
              return forbidden()
          return tenant_db(user.org_id).query(
              "SELECT * FROM documents WHERE project_id = ?", [id])

      # tenant_db connects with a role under row-level security:
      # rows outside the caller's organisation are invisible to any query
    note: The handler check stays, and a data-layer policy independently hides other organisations' rows, so a
      forgotten check elsewhere leaks nothing across tenants.
  sources:
    - cite: OWASP Cheat Sheet Series, Secure Product Design, Defense-in-Depth (CC BY-SA 4.0)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Secure_Product_Design_Cheat_Sheet.html
      how: read
    - cite: OWASP Cheat Sheet Series, Insecure Direct Object Reference Prevention, random ids as defense in depth
        (CC BY-SA 4.0)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.html
      how: read
    - cite: Saltzer and Schroeder, The Protection of Information in Computer Systems (1975), separation of privilege
      url: https://www.cs.virginia.edu/~evans/cs551/saltzer/
      how: recalled
    - cite: "NSA, Information Assurance Technical Framework (IATF), Release 3.0 (September 2000): the
        Defense-in-Depth Strategy"
      url: null
      how: recalled
- id: validate-at-the-boundary
  name: Validate at the boundary
  family: principle
  group: security
  says: >
    Check data where it enters from a less trusted place (a request, a file, a queue, a CLI argument, a
    third-party API), against an allow-list of what is acceptable, and reject the rest there, so the code
    inside can rely on what it receives.
  names: >
    Also called input validation at trust boundaries; the trust boundary comes from threat modelling (Howard
    and LeBlanc, Shostack). OWASP's Input Validation Cheat Sheet and Proactive Controls set the practice.
    Alexis King's "Parse, don't validate" (2019) is the type-driven form: turn the checked input into a type
    that can't hold invalid values (see parse-dont-validate).
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - web-api
    - cli-devtool
    - data-pipeline
    - library-sdk
    - plugin-host
    - event-driven
  looks_like:
    - Request schemas (Pydantic, zod, Bean Validation, DataAnnotations) on every handler, rejecting bad input
      with a 400 before business code runs.
    - Messages from queues and rows from third-party APIs parsed into typed records at the consumer's edge.
    - Domain code that takes typed values (EmailAddress, a date range) and has no defensive checks of its own
      for format.
    - Size, length and count limits applied before parsing large bodies.
    - Unknown fields rejected or ignored by an explicit choice.
  forces:
    - Data enters from several places (HTTP, CLI, files, queues, plugins) and the same checks are scattered or
      missing inside.
    - Functions deep in the code re-check the same strings defensively because they can't tell whether anyone
      checked.
    - A partner API or another team's service sends data you don't control (OWASP's API10:2023, unsafe
      consumption of APIs).
    - Bad data has been found in storage, and nobody knows which path let it in.
  overuse:
    - Treating validation as the defence against injection or XSS; it isn't, and OWASP is explicit that
      parameterized queries and output encoding are still needed at the sink.
    - Over-strict rules that reject real input (names with apostrophes, non-Latin scripts, long TLDs, plus
      signs in emails).
    - Validating at the boundary only, then letting invariants that matter (balance never negative) go
      unchecked in the domain, where they belong.
    - Validating internal calls between modules of the same program as if each were a trust boundary.
  remedy: null
  counter: >
    The boundary is where trust changes, which isn't always the outer edge: a message queue fed by another
    team, a file written by a user, a plugin's return value are boundaries too, and treating only HTTP as one
    misses them. Validation at the edge doesn't replace business invariants in the domain or encoding at
    output. Postel's law (be liberal in what you accept) pulls the other way for protocols and public APIs,
    and its critics argue that liberal acceptance entrenches broken input; a strict boundary with clear errors
    is the safer default for application input. Parse, don't validate goes further and argues the check should
    produce a type, not a boolean, so the evidence can't be lost.
  in:
    python: >
      FastAPI validates Pydantic request models before the handler runs; Django forms and DRF serializers do
      the same. Pydantic models with constrained types (constr, conint, Annotated validators) carry the result
      inward.
    typescript: >
      TypeScript types are erased at runtime, so a type annotation on req.body checks nothing. A runtime
      schema (zod, valibot, io-ts) at the handler, with z.infer for the inner type, is the boundary.
    java: >
      Bean Validation (@Valid on a @RequestBody, with @NotNull, @Size, @Pattern) runs at the Spring MVC
      boundary; records with checks in their compact constructors carry it inward.
    csharp: "[ApiController] returns 400 automatically when DataAnnotations fail on the bound model. Since .NET
      10, minimal APIs do the same once AddValidation() is registered: DataAnnotations on handler parameters
      and their types are checked, and failures return a 400 problem-details response. FluentValidation is now
      usually called explicitly in the handler or from an endpoint filter, since its auto-validation package
      is deprecated. Binding to a record with required members and value objects keeps the checked shape
      inside."
    go: >
      There is no built-in validator; decode into a struct, then validate in a constructor or with
      go-playground/validator, and return a typed value rather than passing the raw struct on.
    rust: >
      serde with #[serde(try_from = "...")] or a newtype implementing TryFrom rejects invalid values while
      deserializing, so the rest of the code holds only checked types.
  related:
    - parse-dont-validate
    - trusting-client-input
    - injection
    - postels-law
    - primitive-obsession
    - defense-in-depth
  tell: null
  interview_only: false
  example:
    before: |
      fn ingest(message: dict):
          store_reading(message)

      fn store_reading(m: dict):
          if m.get("celsius") is None: return        # silently dropped
          db.insert("readings", m)                   # whatever keys arrived

      fn alert_if_hot(m: dict):
          if float(m["celsius"]) > 80: ...           # may crash on bad input
    after: |
      class Reading:
          sensor_id: SensorId
          celsius: float       # -60..150
          taken_at: Timestamp

      fn ingest(message: dict):
          reading = Reading.parse(message) or return dead_letter(message, reason)
          store_reading(reading)
          alert_if_hot(reading)

      fn alert_if_hot(r: Reading):
          if r.celsius > 80: ...
    note: The message is checked once at the queue consumer and becomes a typed Reading, so inner functions stop
      re-checking and bad messages go to a dead-letter queue with a reason instead of vanishing.
  sources:
    - cite: OWASP Cheat Sheet Series, Input Validation (CC BY-SA 4.0)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
      how: read
    - cite: OWASP Top 10 2025, A05:2025 Injection, validation as a secondary defence (CC BY 3.0)
      url: https://top10.owasp.org/2025/A05_2025-Injection/
      how: read
    - cite: OWASP API Security Top 10 2023, API10:2023 Unsafe Consumption of APIs (CC BY-SA 4.0)
      url: https://api-security.owasp.org/editions/2023/en/0xaa-unsafe-consumption-of-apis/
      how: recalled
    - cite: Alexis King, Parse, don't validate (2019)
      url: https://lexi-lambda.github.io/blog/2019/11/05/parse-don-t-validate/
      how: recalled
    - cite: Howard and LeBlanc, Writing Secure Code, 2nd ed. (2002), trust boundaries and threat modelling
      url: null
      how: recalled
- id: error-handling-policy
  name: Error Handling Policy
  family: practice
  group: design
  says: Decide once, for the whole codebase, how errors are represented (values, exceptions or panics), which
    ones may abort the program, and at which layer each kind is handled, so every module fails the same way.
  names: Also called error model or error strategy. No single originator. Joe Duffy's "The Error Model" (2016,
    from Microsoft's Midori project) is the clearest statement of the split between recoverable errors and
    bugs. Rob Pike's "Errors are values" (2015) states Go's position, and the Rust book's chapter on errors
    states Rust's.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Some modules throw, some return null, some return error codes, and callers guess which.
    - Library code that panics, calls unwrap or expect on input it didn't produce, or calls exit.
    - The same failure logged at several layers, or at none.
    - Error types that are strings, so callers match on message text.
    - No stated place where errors become user-facing messages, HTTP responses or exit codes.
  forces:
    - More than one person or agent writes error handling, and each brings a habit from another language.
    - The code is a library, so callers need to be able to recover and it must not decide for them.
    - The code has a user-facing boundary (CLI, HTTP, UI) where errors must become one consistent shape.
    - The language offers more than one mechanism (Rust Result and panic, Go error and panic, C# exceptions
      and Try methods).
  overuse:
    - A custom error type for every function, so the hierarchy is bigger than the code it describes.
    - Forcing Result-style returns onto a language and ecosystem built on exceptions, with conversion at every
      boundary.
    - A policy document nobody can apply because it doesn't say where the boundaries are.
  remedy: null
  counter: >
    A short script or a prototype doesn't need a policy; letting it crash with a stack trace is fine.
    Practitioners genuinely disagree on the mechanism itself (checked exceptions, unchecked exceptions, result
    types), and that argument is not worth having inside one codebase; follow the language's mainstream. What
    matters is consistency and a clear line between expected failures, which callers handle, and bugs, which
    should stop the program.
  in:
    go: >
      Errors are values returned last. Wrap with fmt.Errorf and %w, and test with errors.Is and errors.As
      rather than comparing strings. Panic is for programmer errors and impossible states; a library should
      not let a panic cross its API, and should not call log.Fatal or os.Exit.
    rust: >
      Result for recoverable errors, panic for bugs. Libraries usually define an error enum (often with
      thiserror) and avoid unwrap and expect on anything callers control; applications often use anyhow for
      context. Document panics in a Panics section. The ? operator is the normal way to propagate.
    java: >
      Checked exceptions for conditions callers are expected to recover from was the original intent, but the
      community largely moved to unchecked exceptions, and lambdas and streams don't play well with checked
      ones. Choose and say which. Never let a library throw raw Exception.
    csharp: >
      Exceptions are the mechanism, with no checked exceptions. The Try pattern (bool TryX(out result)) covers
      the expected-failure case. Prefer the framework's exception types (ArgumentException,
      InvalidOperationException) and throw; rather than throw ex, which resets the stack trace.
    python: >
      Exceptions everywhere, with a small hierarchy rooted in one package-level base exception so callers can
      catch everything from the library at once. Use raise ... from err to keep the cause.
    typescript: >
      Anything can be thrown, and the type system doesn't track it. Some codebases return discriminated unions
      for expected failures and throw only for bugs; pick one per layer. Always throw Error subclasses so
      stack traces exist.
  related:
    - fail-fast
    - swallowed-errors
    - exceptions-for-control-flow
    - inconsistent-error-contract
    - fail-open-vs-fail-closed
  tell: >
    Rust: `.unwrap()` or `.expect(` in a library crate's non-test source. Go: `panic(`, `log.Fatal` or
    `os.Exit(` outside package main and tests.
  interview_only: false
  example:
    before: |
      # shipping-rates library
      fn quote(parcel: Parcel, zone: str) -> Money:
          table = RATE_TABLES.get(zone)
          if table is None:
              print("unknown zone " + zone)
              exit(1)
          return table.price_for(parcel.weight)
    after: |
      # shipping-rates library
      class UnknownZone(RatesError):
          zone: str

      fn quote(parcel: Parcel, zone: str) -> Money:
          table = RATE_TABLES.get(zone)
          if table is None:
              raise UnknownZone(zone)
          return table.price_for(parcel.weight)

      # the application's boundary decides: a 422 for the API, an exit code for the CLI
    note: The library reports an expected failure in its own error type and leaves the decision to abort to the
      application.
  sources:
    - cite: Joe Duffy, The Error Model (2016)
      url: https://joeduffyblog.com/2016/02/07/the-error-model/
      how: recalled
    - cite: Rob Pike, Errors are values, The Go Blog (2015)
      url: https://go.dev/blog/errors-are-values
      how: recalled
    - cite: The Rust Programming Language, ch. 9, To panic! or Not to panic!
      url: https://doc.rust-lang.org/book/ch09-03-to-panic-or-not-to-panic.html
      how: recalled
    - cite: Rust API Guidelines, C-GOOD-ERR and C-FAILURE
      url: https://rust-lang.github.io/api-guidelines/
      how: recalled
  matters_most_for:
    - library-sdk
    - cli-devtool
    - web-api
    - plugin-host
    - platforms
- id: fail-fast
  name: Fail Fast
  family: principle
  group: design
  says: Detect a bad state as early as possible and stop right there with a clear error, instead of carrying on
    and failing later in a place that hides the cause.
  names: Also called Crash early, Dead programs tell no lies. Jim Shore's column "Fail Fast" in IEEE Software
    (2004), edited by Martin Fowler, named it for software. Hunt and Thomas made the same case as "crash
    early" in The Pragmatic Programmer (1999). Erlang's "let it crash" is a related idea from Joe Armstrong.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Configuration read and checked at startup, with the process refusing to start on bad values.
    - Guard clauses and assertions at the top of functions that check inputs and invariants.
    - Constructors that reject invalid arguments rather than building a half-valid object.
    - "Its absence: null checks scattered far from where the null came in, and defaults that hide missing
      settings."
  forces:
    - A bug report's stack trace points somewhere unrelated to the real cause.
    - Missing or malformed configuration is only discovered when a rare path first runs in production.
    - Corrupt data has been written because nothing stopped the code that produced it.
    - Invariants live in people's heads instead of in checks.
  overuse:
    - Crashing a long-running service on one bad request instead of rejecting that request.
    - Assertions on conditions that are normal in production, such as a dependency briefly unavailable.
    - Failing a whole batch for one bad record when the job's contract is to process what it can and report
      the rest.
    - A tool that must not block its host failing closed on its own internal bugs.
  remedy: null
  counter: >
    Fail fast is about where a bug is detected, not a licence to crash. At the right boundary, a system can
    fail fast internally and still degrade gracefully outward: reject one request, skip one record, or let the
    host carry on (see fail-open vs fail-closed). Erlang pairs "let it crash" with supervisors that restart
    the failed part, and without that structure crashing is just downtime. Embedded and safety-critical
    systems often can't stop, and must move to a safe state instead.
  in:
    python: |
      assert is stripped under -O, so don't use it for checks that must hold in production; raise explicitly.
    java: >
      Objects.requireNonNull and Guava's Preconditions are the idiomatic guards. assert is disabled by default
      at runtime.
    csharp: >
      ArgumentNullException.ThrowIfNull and nullable reference types catch many of these at the boundary or at
      compile time.
    go: >
      Return an error early from the constructor or main; reserve panic for broken invariants. Validate flags
      and config before starting goroutines.
    rust: >
      The type system does much of this (parse into validated types). debug_assert! only runs in debug builds;
      use assert! or a returned error for checks that must hold in release.
    typescript: >
      Types are erased at runtime, so data from outside (JSON, env, CLI args) must be checked at the boundary
      with a schema validator to fail fast.
  related:
    - swallowed-errors
    - error-handling-policy
    - fail-open-vs-fail-closed
    - murphys-law
  tell: null
  interview_only: false
  example:
    before: |
      fn start_mailer():
          server = MailServer()
          server.run()

      class MailServer:
          fn send_digest(user):
              host = env.get("SMTP_HOST")            # missing in prod
              port = int(env.get("SMTP_PORT", "0"))
              smtp.connect(host, port)               # fails hours later, at 06:00
              ...
    after: |
      fn start_mailer():
          config = MailConfig(
              host=require_env("SMTP_HOST"),
              port=parse_port(require_env("SMTP_PORT")),
          )                                          # refuses to start if either is wrong
          server = MailServer(config)
          server.run()

      class MailServer:
          fn send_digest(user):
              smtp.connect(self.config.host, self.config.port)
              ...
    note: Settings are checked when the process starts, so a bad deploy fails at once with the name of the missing
      variable instead of at the first scheduled send.
  sources:
    - cite: Jim Shore, Fail Fast, IEEE Software (2004)
      url: https://martinfowler.com/ieeeSoftware/failFast.pdf
      how: recalled
    - cite: Andrew Hunt and David Thomas, The Pragmatic Programmer, Crash Early
      url: https://pragprog.com/titles/tpp20/the-pragmatic-programmer-20th-anniversary-edition/
      how: recalled
    - cite: Joe Armstrong, Making reliable distributed systems in the presence of software errors (2003)
      url: https://erlang.org/download/armstrong_thesis_2003.pdf
      how: recalled
  matters_most_for:
    - cli-devtool
    - web-api
    - data-pipeline
    - library-sdk
    - serverless
- id: fail-open-vs-fail-closed
  name: Fail Open vs Fail Closed
  family: principle
  group: design
  says: For each place where a check or a dependency can fail, decide on purpose whether failure lets things
    through (fail open) or stops them (fail closed), and make the code do that; the anti-pattern is leaving it
    to whatever the error path happens to do.
  names: "Also called fail-safe vs fail-secure (locks and physical engineering: a fail-safe door unlocks on
    power loss, a fail-secure door locks), and fail-safe defaults on the security side. The word \"fail-safe\"
    points in opposite directions in the two traditions: for doors it means fail open, for access control it
    means deny. Saltzer and Schroeder's \"The Protection of Information in Computer Systems\" (1975) made
    fail-safe defaults (deny unless access is explicitly granted) a design principle, crediting E. Glaser
    (1965)."
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Authorization code where an exception in the policy lookup falls through to "allowed".
    - A rate limiter, feature flag client or license check whose behaviour when its backend is down nobody has
      written down.
    - A linter hook, telemetry call or plugin whose own crash blocks the editor, build or commit it runs
      inside.
    - A circuit breaker or fallback with a default value, and no comment on why that default is safe.
    - Different defaults for the same kind of failure in different modules.
  forces:
    - Security checks (authentication, authorization, input validation, signature checks) must fail closed,
      because failing open is a bypass.
    - "Tooling that runs inside someone else's workflow (agent hooks, git hooks, editor plugins, observability
      agents) usually must fail open: its own bug must not block the host's work."
    - Availability-critical paths where a down dependency would otherwise take the whole product down.
    - Error paths that are rarely exercised, so their default behaviour is accidental.
  overuse:
    - Failing open on everything for availability, including checks that guard money, data or access.
    - Failing closed on everything for safety, so a flaky optional dependency takes the product down.
    - Treating "the check found a problem" and "the check itself broke" as the same thing; a tool can fail
      open on its own crash and still fail closed on a real finding.
  remedy: null
  counter: >
    Both directions are legitimate; the principle is to choose, not to prefer one. The choice is per surface,
    not per codebase, and one tool can need both: a hook that blocks an edit on a confirmed finding (closed)
    but lets the edit through when the hook itself crashes (open). Failing open is only honest if the failure
    is still reported somewhere visible; silent fail-open is swallowing. For small internal scripts the
    distinction rarely matters.
  in:
    go: >
      The zero value of a bool is false, so `allowed, _ := check()` fails closed by accident and `denied, _ :=
      check()` fails open by accident. Name results so the zero value is the safe one.
    python: >
      A broad except around an authorization call that returns True is the classic fail-open bug. For a
      fail-open boundary, catch at the outermost layer only and log the traceback.
    typescript: >
      A rejected promise in middleware that isn't awaited can let the request continue to the handler. Make
      sure the deny path is the one taken when the check throws.
  related:
    - fail-fast
    - swallowed-errors
    - error-handling-policy
    - postels-law
    - murphys-law
  tell: null
  interview_only: false
  example:
    before: |
      fn can_download(user, report) -> bool:
          try:
              return policy_service.allows(user, "download", report.id)
          except ServiceError:
              return True             # nobody decided this; it just made the error go away

      fn run_lint_hook(edit):
          findings = lint(edit)       # a crash here aborts the user's edit
          return block_if(findings)
    after: |
      fn can_download(user, report) -> bool:
          try:
              return policy_service.allows(user, "download", report.id)
          except ServiceError as e:
              log.error("policy check failed, denying", e)
              return False            # access control fails closed

      fn run_lint_hook(edit):
          try:
              findings = lint(edit)
          except Exception as e:
              report_internal_error(e)
              return ALLOW            # the tool's own bug fails open; real findings still block
          return block_if(findings)
    note: Each surface now states its failure direction, closed for access and open for a tool that must not block
      its host, and both still report the error.
  sources:
    - cite: Jerome Saltzer and Michael Schroeder, The Protection of Information in Computer Systems (1975),
        fail-safe defaults
      url: https://www.cs.virginia.edu/~evans/cs551/saltzer/
      how: recalled
    - cite: OWASP Secure by Design / Security by Design Principles, fail securely
      url: https://owasp.org/www-project-developer-guide/
      how: recalled
    - cite: Michael Nygard, Release It! (2nd ed.), stability patterns (circuit breaker, fail fast, steady state)
      url: https://pragprog.com/titles/mnee2/release-it-second-edition/
      how: recalled
  matters_most_for:
