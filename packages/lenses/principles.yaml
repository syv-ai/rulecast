- id: authorize-before-side-effects
  name: Authorize before side effects
  family: principle
  group: security
  says: >
    Decide whether the caller may do the thing before doing any part of it: no file write, delete, email,
    payment, outbound call or cache change happens until the permission check has passed.
  names: >
    A plain practitioners' name, not a coined one; also said as "check, then act" or "authorize first". It is
    the ordering half of complete mediation, one of Jerome Saltzer and Michael Schroeder's design principles
    in "The Protection of Information in Computer Systems" (1975). MITRE files the failure under CWE-696
    (Incorrect Behavior Order) and, where the checked state can change before use, CWE-367 (time-of-check
    time-of-use). Broken Object Level Authorization is about a missing check; this is about a check that runs
    too late.
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - web-api
    - fullstack-web
    - platforms
    - plugin-host
    - serverless
  looks_like:
    - Handlers that load the target, call one policy or authorization service, and only then write, send or
      call out.
    - Request pipelines that run authorization before body validation that hits the database, and before any
      handler code.
    - Upload and import endpoints that check edit rights before touching storage, and write to a temporary
      location until the record is saved.
    - A cross-user test on every mutating endpoint, including the ones that write files or call other services.
  forces:
    - A handler writes files, deletes objects, sends messages or calls third parties before it persists the
      record, so a check living in the save path comes too late.
    - The permission check lives in a service or repository method that the handler reaches last.
    - Annotations or decorators that check after the method returns (post-authorization) are used on methods
      that change state.
    - Several steps that can each fail, where a late refusal would leave half the work done.
  overuse:
    - Checking permissions twice or three times along one path because nobody trusts the first check.
    - Refusing to do cheap, harmless reads (parsing the body, looking up the record) before authorizing, when
      the decision needs them.
    - Locking rows for the whole request to rule out time-of-check races on data that rarely changes.
  remedy: null
  counter: >
    Some decisions depend on the loaded record or the parsed input, so the order is load, decide, act, not
    decide before reading anything; reads with no visible effect may come first. Where the check is on state
    that can change between check and act (balances, seats, locks), ordering alone isn't enough and the check
    must be inside the same transaction or a conditional write. Systems that must act first and settle later
    (offline-first apps, eventual consistency) compensate instead of checking up front, which is a deliberate
    trade with the Saga pattern's costs.
  in:
    python: FastAPI dependencies run before the handler body, so a permission dependency that loads the target and
      checks it is the natural first step; a check left in a service the handler calls after writing a file
      runs too late. Django's permission mixins check in dispatch, before the handler, but only at model or
      user level. DRF's has_object_permission runs only when the view calls get_object or
      check_object_permissions, so a view that loads the object some other way and writes first never runs it.
    typescript: >
      In NestJS, guards run before pipes and the handler, so authorization in a guard precedes validation and
      side effects. In Express or Next.js server actions there is no fixed slot; the check is just a line that
      has to come first.
    java: >
      Spring Security's @PreAuthorize runs before the method and @PostAuthorize after it returns, so
      @PostAuthorize on a method that writes has already done the write when it refuses.
    csharp: >
      In ASP.NET Core, [Authorize] policies run before the action; resource-based checks with
      IAuthorizationService must be called in the action before the side effect. MediatR pipelines put an
      authorization behaviour ahead of validation and the handler by registration order.
  related:
    - broken-object-level-authorization
    - least-privilege
    - fail-fast
    - defense-in-depth
    - fail-open-vs-fail-closed
    - saga
  tell: null
  interview_only: false
  example:
    before: |
      route PUT "/pages/{page_id}/cover"
      fn replace_cover(page_id: str, upload: File, user: User) -> Page:
          page = pages.get(page_id)
          storage.delete(page.cover_path)
          page.cover_path = storage.put("covers/" + page_id, upload)
          if not can_edit(user, page):
              raise Forbidden()          # the old cover is already gone
          return pages.save(page)
    after: |
      route PUT "/pages/{page_id}/cover"
      fn replace_cover(page_id: str, upload: File, user: User) -> Page:
          page = pages.get(page_id)
          if not can_edit(user, page):
              raise Forbidden()
          old_path = page.cover_path
          page.cover_path = storage.put("covers/" + page_id + "/" + new_id(), upload)
          saved = pages.save(page)
          storage.delete(old_path)
          return saved
    note: The refusal now comes before any storage change, and the old file is removed only after the new one is
      saved, so neither a forbidden caller nor a failed save leaves the page without a cover.
  sources:
    - cite: Jerome Saltzer and Michael Schroeder, The Protection of Information in Computer Systems (1975), complete
        mediation
      url: https://www.cs.virginia.edu/~evans/cs551/saltzer/
      how: recalled
    - cite: MITRE CWE-696, Incorrect Behavior Order
      url: https://cwe.mitre.org/data/definitions/696.html
      how: recalled
    - cite: MITRE CWE-367, Time-of-check Time-of-use (TOCTOU) Race Condition
      url: https://cwe.mitre.org/data/definitions/367.html
      how: recalled
    - cite: OWASP Cheat Sheet Series, Authorization Cheat Sheet (CC BY-SA 4.0)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
      how: recalled
- id: unauthenticated-vs-forbidden
  name: 401 Unauthorized versus 403 Forbidden
  family: principle
  group: api
  says: >
    Answer 401 when the server doesn't know who the caller is (no credentials, or invalid or expired ones),
    with a WWW-Authenticate challenge, and 403 when it knows who they are and the answer is still no, because
    clients act differently on each: 401 means sign in again, 403 means don't retry.
  names: >
    Defined in RFC 9110, HTTP Semantics (Roy Fielding, Mark Nottingham and Julian Reschke, 2022), sections
    15.5.2 and 15.5.4; earlier in RFC 7235 and RFC 7231, and first in RFC 2616. The 401 reason phrase
    "Unauthorized" is a long-standing misnomer for unauthenticated. RFC 6750 (OAuth 2.0 Bearer Token Usage)
    maps invalid_token to 401 and insufficient_scope to 403. RFC 9110 also allows 404 in place of 403 to hide
    that a resource exists.
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - web-api
    - fullstack-web
    - mobile
    - library-sdk
  looks_like:
    - One place that maps "no or bad credentials" to 401 and "authenticated but not allowed" to 403.
    - 401 responses carrying a WWW-Authenticate header (Bearer, with error="invalid_token" for an expired
      token).
    - A frontend or SDK that refreshes the token or logs out on 401 and shows a "no access" message on 403.
    - A written choice about which resources answer 404 instead of 403 when the caller may not know they exist.
  forces:
    - Clients branch on the status (refresh the token, log out, show a permission message), so mixing them up
      logs users out when they only lacked a role, or retries forever.
    - Several authentication schemes or frameworks are in play, each with its own default status.
    - Some resources are private enough that their existence is itself sensitive.
  overuse:
    - Adding WWW-Authenticate challenges for cookie-session browser apps where no client reads them.
    - Renaming established statuses in a public API to be correct, which breaks clients that depend on the old
      behaviour.
    - Returning 404 for every permission failure, including on resources the caller can plainly see, which
      makes debugging access problems hard.
  remedy: null
  counter: >
    The main counter-view is to hide existence: RFC 9110 lets a server answer 404 rather than 403 so a caller
    can't learn which ids are real, and many APIs do this for private resources; the cost is that a user who
    should have access gets a confusing "not found". Cookie-session apps often have no meaningful challenge
    scheme, so they send 401 without WWW-Authenticate or redirect to login, which breaks the letter of the RFC
    and is widely tolerated. In a published API the existing codes are part of the contract (Hyrum's law), so
    a fix goes through versioning or deprecation, not a quiet change.
  in:
    python: FastAPI's built-in security classes answer 401 with WWW-Authenticate for missing or invalid
      credentials since 0.122.0; earlier releases answered 403 from HTTPBearer, the API-key classes and others
      (only the OAuth2 classes sent 401), and overriding make_not_authenticated_error restores the old code
      for clients that depend on it. DRF returns 403 for unauthenticated requests when the first
      authentication class has no authenticate_header, as SessionAuthentication doesn't.
    typescript: >
      NestJS: a guard returning false throws ForbiddenException (403); throw UnauthorizedException yourself,
      or use the Passport AuthGuard, for missing or bad credentials. Express has no default; Passport
      strategies with a challenge send 401 with WWW-Authenticate.
    java: >
      Spring Security sends authentication failures to the AuthenticationEntryPoint (401 for bearer tokens, a
      login redirect for form login) and authorization failures to the AccessDeniedHandler (403).
    csharp: ASP.NET Core's Challenge produces 401 and Forbid 403. Cookie authentication turns both into redirects
      to the login and access-denied paths for page endpoints; since .NET 10 it returns 401 and 403 for
      recognised API endpoints ([ApiController], JSON minimal APIs), and on earlier versions the redirect
      events must be overridden for API routes.
  related:
    - inconsistent-error-contract
    - broken-object-level-authorization
    - user-enumeration
    - hyrums-law
    - principle-of-least-astonishment
  tell: null
  interview_only: false
  example:
    before: |
      fn current_user(req: Request) -> User:
          user = tokens.verify(req.header("Authorization"))
          if user is None:
              raise HttpError(403, "not allowed")
          return user

      fn download_build(req: Request, build_id: str) -> Stream:
          user = current_user(req)
          build = builds.get(build_id)
          if not build.project.has_member(user):
              raise HttpError(401, "unauthorized")
          return build.artifact_stream()
    after: |
      fn current_user(req: Request) -> User:
          user = tokens.verify(req.header("Authorization"))
          if user is None:
              raise HttpError(401, headers={"WWW-Authenticate": "Bearer error=\"invalid_token\""})
          return user

      fn download_build(req: Request, build_id: str) -> Stream:
          user = current_user(req)
          build = builds.get(build_id)
          if build is None or not build.project.has_member(user):
              raise HttpError(404)       # outsiders can't learn which builds exist
          if not user.can("download", build.project):
              raise HttpError(403, "your role can't download artifacts")
          return build.artifact_stream()
    note: An expired token now asks the client to sign in again, an outsider sees nothing, and a member without
      the right role gets a 403 the client won't retry.
  sources:
    - cite: RFC 9110, HTTP Semantics, sections 15.5.2 (401), 15.5.4 (403) and 15.5.5 (404)
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-15.5.2
      how: read
    - cite: RFC 6750, The OAuth 2.0 Authorization Framework, Bearer Token Usage, section 3.1
      url: https://www.rfc-editor.org/rfc/rfc6750.html#section-3.1
      how: recalled
    - cite: OWASP Cheat Sheet Series, REST Security, HTTP return codes (CC BY-SA 4.0)
      url: https://cheatsheetseries.owasp.org/cheatsheets/REST_Security_Cheat_Sheet.html
      how: recalled
- id: idempotency
  name: Idempotency
  family: principle
  group: architecture
  says: >
    Design operations so that doing one twice has the same effect as doing it once, because networks, clients,
    queues and schedulers will repeat it: idempotent HTTP methods, idempotency keys for POST, and consumers
    that recognise a message they have already handled.
  names: >
    From mathematics. For HTTP, RFC 9110 section 9.2.2 (Fielding, Nottingham and Reschke, 2022) defines PUT,
    DELETE and the safe methods as idempotent and says clients shouldn't retry other methods automatically.
    The IETF httpapi draft "The Idempotency-Key HTTP Header Field" (Jayadeba Jena and Sanjay Dalal, last
    revision -07, 2025, expired without becoming an RFC) standardises the key header that payment APIs
    popularised. In messaging, Gregor Hohpe and Bobby Woolf's Enterprise Integration Patterns (2003) name the
    Idempotent Receiver; microservices.io calls it the Idempotent Consumer.
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - web-api
    - distributed
    - event-driven
    - serverless
    - data-pipeline
  looks_like:
    - POST endpoints that create money movements, orders or messages accept an Idempotency-Key header and
      store the key with the result.
    - A processed-messages table or a unique constraint on a message or event id, checked in the same
      transaction as the consumer's write.
    - Writes expressed as upserts or set-to-value ("status = shipped") rather than increments or appends.
    - Pipeline steps that overwrite a partition or use merge, so a rerun replaces output instead of doubling
      it.
    - Outbound calls to payment or messaging providers passing an idempotency key of their own.
  forces:
    - Clients or proxies retry on timeout, and the original request may have succeeded.
    - The broker delivers at least once (most do), or the Outbox pattern can publish a message twice.
    - Jobs, serverless functions and pipeline runs are retried by the platform after partial failure.
    - The operation moves money, sends something to a person or creates a record a duplicate of which is
      costly.
  overuse:
    - Idempotency keys and a dedupe store on endpoints that are already naturally idempotent (PUT of a full
      value, DELETE) or whose duplicates are harmless.
    - Keeping every key forever instead of for a published window, so the store grows without bound.
    - Adding a dedupe table where a unique constraint on a natural key would do the same job.
  remedy: null
  counter: "Idempotency is not free: it needs a store, a retention window, handling of in-flight duplicates and
    a fingerprint check so a reused key with a different body is refused. Where a duplicate is harmless (a
    view counter, a cache warm-up) or the system is exactly-once end to end inside one transactional store,
    the machinery isn't worth it. RFC 9110 notes the property is about the intended effect only, so logs and
    audit rows may still differ per request. The idempotency-key draft expired in 2026 without becoming an
    RFC, so its status codes (400 for a missing key, 409 for a request still in flight, 422 for a key reused
    with another body) are a widely copied convention, not a standard."
  in:
    python: >
      Celery with acks_late and retries can run a task more than once, so tasks should be written to be
      repeatable. requests and httpx don't retry POST by default; urllib3's Retry skips non-idempotent methods
      unless allowed_methods says otherwise.
    typescript: BullMQ ignores a job added with a jobId that already exists, but only while that job is still
      stored; once removeOnComplete or removeOnFail has removed it, the same id is accepted again, so the
      dedupe window is the retention window (BullMQ's deduplication option gives an explicit one). Retry
      wrappers around fetch apply to POST too unless you restrict them.
    java: >
      Kafka's enable.idempotence stops producer retries from writing duplicates to the log, but it doesn't
      make consumers idempotent; a consumer that crashes before committing offsets reprocesses records.
    csharp: >
      MassTransit's transactional outbox includes an inbox that records received message ids, which gives an
      idempotent consumer when the handler's writes share its transaction.
  related:
    - outbox
    - saga
    - fallacies-of-distributed-computing
    - pipes-and-filters
    - circuit-breaker
    - command-query-separation
  tell: null
  interview_only: false
  example:
    before: |
      route POST "/refunds"
      fn create_refund(body: RefundRequest, user: User) -> Refund:
          refund = refunds.insert(order_id=body.order_id, amount=body.amount)
          payments.send_refund(body.order_id, body.amount)
          return refund
      # a client that times out and retries refunds the customer twice
    after: |
      route POST "/refunds"
      fn create_refund(body: RefundRequest, key: str, user: User) -> Response:
          prior = idempotency.find(user.id, key)
          if prior and prior.fingerprint != fingerprint(body):
              return error(422, "key reused with a different request")
          if prior and prior.in_progress:
              return error(409, "original request still running")
          if prior:
              return prior.response
          idempotency.start(user.id, key, fingerprint(body))    # unique on (user, key)
          refund = refunds.insert(order_id=body.order_id, amount=body.amount)
          payments.send_refund(body.order_id, body.amount, idempotency_key=key)
          return idempotency.finish(user.id, key, created(refund))
    note: A retried request with the same key gets the first response back instead of a second refund, and the key
      is passed on so the payment provider dedupes too.
  sources:
    - cite: RFC 9110, HTTP Semantics, section 9.2.2 Idempotent Methods
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-9.2.2
      how: read
    - cite: IETF httpapi, The Idempotency-Key HTTP Header Field, draft-ietf-httpapi-idempotency-key-header-07
      url: https://datatracker.ietf.org/doc/draft-ietf-httpapi-idempotency-key-header/
      how: read
    - cite: Gregor Hohpe and Bobby Woolf, Enterprise Integration Patterns (2003), Idempotent Receiver
      url: https://www.enterpriseintegrationpatterns.com/patterns/messaging/IdempotentReceiver.html
      how: recalled
    - cite: Chris Richardson, microservices.io, Idempotent Consumer
      url: https://microservices.io/patterns/communication-style/idempotent-consumer.html
      how: recalled
- id: additive-features
  name: Additive Features
  family: principle
  group: api
  says: >
    A build-time feature or conditional-compilation flag should only add to a public API, never remove or
    change what is already there, because a dependency graph turns on the union of every flag that anyone in
    it asked for.
  names: >
    The Cargo book states it under Features, "Feature unification" and "Features should be additive", and
    lists the SemVer consequences in its SemVer Compatibility chapter. The same problem shows up as #ifdef in
    C and C++ headers, build tags in Go, per-target-framework #if in C#, extras and optional imports in
    Python, and conditional exports in npm packages. No separate coiner; the Cargo book is where the rule is
    written down.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A feature or macro named no_std, minimal, disable-x or legacy that turns something off.
    - Struct fields or enum variants of a public type that exist only under a feature flag.
    - The same public function with a different signature or return type depending on a flag.
    - A pair of features documented as "do not enable together", or a compile_error! guarding them.
    - Bug reports that a library broke only when some other crate or package in the graph enabled a feature.
    - CI that builds only the default feature set, never all features or none.
  forces:
    - The package is a library, so other packages in the same graph can switch its flags on behind its users'
      backs.
    - A flag is meant to shrink the build (no allocator, no std, no network) and is easiest to write as a
      switch that removes things.
    - A heavy dependency is optional, and the types that mention it end up behind the flag too.
    - Two backends (TLS libraries, async runtimes, allocators) look like a choice between exclusive flags.
  overuse:
    - Refusing all conditional compilation, so every user pays for every optional dependency.
    - Treating per-platform code (target_os, GOOS) as if it had to be additive; a platform is chosen once for
      the whole build and isn't unified.
    - Splitting a small library into many crates or packages just to avoid one exclusive choice.
  remedy: >
    Name features by what they add (std, serde, tls-rustls), not by what they remove. Keep public types the
    same shape under every flag: put flag-dependent data behind private fields and methods, or mark the type
    non-exhaustive. Where two options really exclude each other, the Cargo book suggests splitting packages,
    picking one by priority when both are on, or making it a run-time option. Test the feature combinations in
    CI (cargo hack --feature-powerset, a build-tag matrix).
  counter: >
    Platform and target selection isn't unified across a graph, so cfg on the operating system or target
    framework may change the API by design; the rule is about flags that dependents can turn on. Some choices
    are exclusive by nature (which global allocator, which panic strategy, which TLS backend), and the Cargo
    book accepts rare exclusive features guarded by a compile error when the alternatives are worse. In an
    application or a binary that nothing depends on, flags aren't unified with anyone else's and the risk
    mostly goes away. In C and C++, macros that change a struct's layout are an ABI break between translation
    units, which is worse than an API break; there the rule is stricter, not looser.
  in:
    rust: Cargo builds one copy of a crate with the union of features requested anywhere in the graph. A
      cfg(feature) field on a struct with public fields, or a cfg(feature) variant on an exhaustive enum,
      breaks downstream struct literals or matches when someone else enables the feature. Removing a feature
      is a major change. So is moving existing items behind one, unless that feature is on by default.
      cargo-hack checks combinations.
    go: >
      Build tags apply to the whole program being built, so a tag set for the final binary changes every
      package that checks it. Files selected by tags should export the same names and signatures, as per-OS
      files (_linux.go, _windows.go) usually do.
    python: >
      Extras (pip install pkg[fast]) are unified in one environment: if any package asks for an extra, every
      user gets it. Code that changes results, not only speed, when an optional import succeeds has the same
      problem as a non-additive feature.
    typescript: >
      Conditional exports in package.json pick a file per environment (node, browser, custom conditions). Each
      condition's type declarations should export the same names, or consumers break when their bundler picks
      another condition.
    csharp: >
      A multi-targeted library compiles once per target framework with #if NET8_0_OR_GREATER and similar.
      Adding APIs on newer targets is fine; removing or changing one on a newer target breaks consumers when
      they move up.
    cpp: >
      An #ifdef in a public header that changes a class's members or layout is an ODR and ABI hazard: two
      translation units built with different macros disagree about the same type.
  related:
    - breaking-change-surface
    - semantic-versioning-discipline
    - non-exhaustive-types
    - hyrums-law
  tell: 'Rust only. Flags #[cfg(not(feature = "..."))] on a pub item (not pub(crate)) that has no #[cfg(feature
    = "...")] item of the same name and signature in the same file. Also flags #[cfg(feature = "...")] on a
    field of a pub struct that is not #[non_exhaustive] and whose fields are all pub, and on a variant of a
    pub enum that is not #[non_exhaustive].'
  interview_only: false
  example:
    before: |
      # compression library, feature "minimal" strips things out
      class Options:              # public fields
          level: int
          if not feature("minimal"):
              dictionary: bytes

      if not feature("minimal"):
          fn compress_with_dict(data, dict) -> bytes: ...

      # one crate enables "minimal" for its small build;
      # every other user of the library in the graph loses compress_with_dict
    after: |
      # feature "dictionary" adds things, never removes them
      class Options:
          level: int
          private dictionary: bytes or None

          if feature("dictionary"):
              fn with_dictionary(dict) -> Options: ...

      if feature("dictionary"):
          fn compress_with_dict(data, dict) -> bytes: ...
    note: The flag now only adds a function and a builder method, and the public shape of Options is the same
      under every combination, so whoever turns the flag on breaks nobody.
  sources:
    - cite: The Cargo Book, Features (Feature unification; Features should be additive; Mutually exclusive features;
        SemVer compatibility)
      url: https://doc.rust-lang.org/cargo/reference/features.html
      how: read
    - cite: The Cargo Book, SemVer Compatibility (Cargo features)
      url: https://doc.rust-lang.org/cargo/reference/semver.html
      how: recalled
    - cite: Go command documentation, Build constraints
      url: https://pkg.go.dev/cmd/go#hdr-Build_constraints
      how: recalled
  matters_most_for:
    - library-sdk
    - embedded
    - plugin-host
    - compilers-tooling
- id: versioned-plugin-protocol
  name: Versioned Plugin Protocol
  family: practice
  group: api
  says: >
    Give a plugin or extension protocol its own version number, separate from the release of the host that
    speaks it, and have host and plugin state which protocol versions they speak, so the host can ship
    releases freely and an incompatible pair fails clearly at load time.
  names: >
    Also called protocol versioning, a plugin handshake, or capability negotiation. No single coiner; it is
    established practice in HashiCorp's go-plugin (a handshake carrying a protocol version) and Terraform's
    plugin protocol (versions 5 and 6, each mapped to a range of CLI releases), and the Language Server
    Protocol negotiates capabilities in its initialize request instead of a number. POSA's Microkernel (1996)
    gives the architecture it belongs to.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A protocol or apiVersion field in the plugin manifest, handshake message or first request, checked by
      the host when it loads the plugin.
    - A host that declares the range of protocol versions it supports, and an error naming both sides when
      they don't overlap.
    - A plugin SDK package versioned on its own schedule, whose major version follows the protocol, not the
      host.
    - Its absence, in a host that sends only its own release number and leaves each plugin to compare it with
      semver and guess.
    - Its absence, in plugin SDK packages version-locked to the host, so every host release looks like a
      possible break to plugin authors.
  forces:
    - Third parties write plugins and install them separately from the host, on their own schedule.
    - The host releases often for reasons that don't touch the plugin contract.
    - Plugins run out of process (a subprocess speaking JSON, RPC, WebAssembly), so no compiler checks that
      the two sides agree.
    - The protocol needs to change one day, and there is no way to tell an old plugin from a new one.
  overuse:
    - A versioned protocol for plugins that live in the same repository and ship with the host.
    - Bumping the protocol version for additive changes that old plugins can safely ignore.
    - Negotiating dozens of fine-grained capabilities where one version number would do.
    - Supporting every old protocol version forever, so the host carries adapters nobody uses.
  remedy: >
    Put a protocol version in the first message or the manifest, and have the host pick the highest version
    both sides speak or refuse with a clear message. Make minor changes additive (new optional fields, new
    optional hooks) and read them tolerantly; reserve a new major protocol version for real breaks. Version
    the plugin SDK by the protocol, and publish which host releases speak which protocol versions.
  counter: >
    When plugins are compiled against an SDK package that is already versioned apart from the host, that
    package's semver is the protocol version, and a second number adds nothing. VS Code ties its extension API
    to the editor's own version (engines.vscode) and makes it work by only ever adding to the API, so a host
    that never breaks its contract can get by with its release number. Version numbers are also coarse:
    capability negotiation, as in LSP, lets each side use what the other supports without a lockstep bump, at
    the cost of more branches. Every supported protocol version is code the host has to keep and test.
  in:
    rust: >
      Rust has no stable ABI, so in-process plugins as dynamic libraries need the same compiler and crate
      versions; most hosts use a subprocess with JSON or RPC, or WebAssembly, and version that protocol. A
      separately published plugin-API crate is the usual place for the protocol types.
    go: >
      The standard plugin package requires the same toolchain and dependency versions as the host, so most
      hosts run plugins out of process; HashiCorp's go-plugin carries a protocol version in its handshake and
      refuses a mismatch.
    python: Plugins are usually found through entry points and called through hooks (pluggy). Adding a hook, or
      adding an argument to an existing hook, is additive, because implementations take only the arguments
      they name. Removing or renaming an argument, or changing what it means, is a protocol break that needs a
      version check.
    typescript: >
      VS Code extensions declare engines.vscode, the minimum host version, and type against @types/vscode; the
      host keeps the API additive instead of carrying a separate protocol number.
  related:
    - microkernel
    - semantic-versioning-discipline
    - breaking-change-surface
    - tolerant-reader
    - deprecation-policy
    - contract-test
  tell: null
  interview_only: false
  example:
    before: |
      # host -> plugin, first message
      send(plugin, {"host_version": "0.9.3", "pages": pages})

      # in the plugin
      fn on_start(msg):
          if semver(msg["host_version"]) < semver("0.9.0"):
              log("warning: may not work with this host")
          ...   # no way to know whether the message shape changed
    after: |
      # host -> plugin
      send(plugin, {"protocol": [2, 3], "host_version": "0.9.3"})
      reply = receive(plugin)                  # {"protocol": 2}
      if reply["protocol"] not in [2, 3]:
          fail("plugin " + name + " speaks protocol " + str(reply["protocol"])
               + ", this host speaks 2 or 3")
      send(plugin, encode_pages(pages, version = reply["protocol"]))
    note: The protocol has its own number, the host says which versions it speaks, and a mismatch fails at load
      with both sides named, while host releases that don't touch the protocol no longer matter to plugins.
  sources:
    - cite: HashiCorp, Terraform Plugin Protocol
      url: https://developer.hashicorp.com/terraform/plugin/terraform-plugin-protocol
      how: read
    - cite: HashiCorp, go-plugin (handshake and protocol version)
      url: https://github.com/hashicorp/go-plugin
      how: recalled
    - cite: Microsoft, Language Server Protocol specification, capabilities and the initialize request
      url: https://microsoft.github.io/language-server-protocol/
      how: recalled
    - cite: Buschmann et al., Pattern-Oriented Software Architecture vol. 1 (1996), Microkernel
      url: null
      how: recalled
  matters_most_for:
    - plugin-host
    - plugins-extensions
    - cli-devtool
    - compilers-tooling
    - platforms
- id: ui-thread-confinement
  name: UI thread confinement
  family: principle
  group: design
  says: >
    UI state and widgets are touched only from the one thread or event loop that owns them, and anything slow
    or blocking (network, disk, heavy computation, waiting) runs elsewhere and hands its result back to that
    thread as a message or posted task.
  names: "\"Thread confinement\" as a named technique goes back to Doug Lea's Concurrent Programming in Java
    (2nd edition, 1999, section 2.3, confinement within threads). Brian Goetz's Java Concurrency in Practice
    (2006, section 3.3 and chapter 9) made it widely known and names Swing's single-threaded event model as
    the standard example. Each toolkit states the rule in its own docs: Swing's Event Dispatch Thread rule
    (Oracle's Swing tutorial, \"Concurrency in Swing\"), Android's single-thread model (\"don't block the UI
    thread; don't touch the UI toolkit from outside it\") with StrictMode and the ANR dialog to enforce it,
    WPF's Dispatcher and thread affinity, JavaFX's application thread, and the browser's main thread with Web
    Workers for heavy work. In event-loop servers and TUIs the same rule is \"don't block the event loop\".
    Also called UI-thread affinity or the single-threaded UI rule."
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - tui
    - desktop
    - mobile
    - web-frontend
    - games
  looks_like:
    - Helpers that post work to the UI thread (runOnUiThread, View.post, invokeLater, Platform.runLater,
      Dispatcher.Invoke, call_from_thread, Program.Send) at the points where background results come back.
    - Assertions or guards that the caller is on the UI thread (isEventDispatchThread, Looper checks,
      CheckAccess, an assertOnUIThread helper).
    - Worker or background abstractions (SwingWorker, coroutines on an IO dispatcher, Web Workers, tea.Cmd,
      spawn_blocking) that take slow work off the loop.
    - Before the fix, network or file calls inside click or key handlers, and freezes or "not responding"
      reports when a call is slow.
    - Before the fix, worker threads or goroutines that write straight into widget or model fields, with rare,
      unreproducible rendering glitches or crashes.
  forces:
    - The toolkit is single-threaded and not thread-safe, as nearly all UI toolkits are.
    - Handlers do network, disk or subprocess work whose latency varies, so the UI freezes on a slow day.
    - Results from background work have to update what the user sees.
    - Bugs that appear only under load or on slow machines, which is how races on UI state show up.
  overuse:
    - Moving trivial, fast work off the UI thread, so a simple handler becomes a round trip through a worker
      and a callback with ordering bugs of its own.
    - Spawning a thread per action with no cancellation, so stale results arrive after the user has moved on
      and overwrite newer state.
    - Wrapping every call in a hop to the UI thread "to be safe", including from code already on it, which
      hides where the boundary really is.
  remedy: null
  counter: >
    Single-threaded confinement is a design choice with costs. Some frameworks make parts of the UI
    thread-safe, or render on a separate thread (Flutter's raster thread, browsers' compositor), and then the
    rule applies only to the parts they say. For short scripts, prototypes and one-shot CLIs with no event
    loop, a blocking call is simply the clearest code. Moving work off the UI thread brings cancellation,
    ordering and stale-result problems, so a short synchronous step with a spinner can beat a poorly managed
    background task. Multithreaded UI toolkits have been tried; Graham Hamilton's essay on them
    ("Multithreaded toolkits: A failed dream?") is the usual explanation of why the field settled on one
    thread.
  in:
    python: >
      tkinter, Qt and most GUI toolkits require widget calls from the main thread; use a queue polled with
      after(), Qt signals across threads, or Textual's workers and call_from_thread. In asyncio code a
      blocking call (time.sleep, requests, a sync database driver) stalls the whole loop; use
      asyncio.to_thread or an async client.
    typescript: >
      The browser main thread runs both scripts and rendering, so long synchronous work causes jank; split it,
      or move it to a Web Worker that posts messages back. Node's event loop has the same rule for servers and
      CLIs: avoid the Sync variants of fs, crypto and child_process on hot paths.
    java: >
      Swing: touch components only on the EDT, using invokeLater and SwingWorker. JavaFX: Platform.runLater
      and Task. Android: the main thread owns views, StrictMode flags disk and network on it, and coroutines
      on Dispatchers.IO or an Executor do the slow work.
    csharp: >
      WPF and WinForms controls have thread affinity; marshal with Dispatcher.InvokeAsync or Control.Invoke.
      await in a UI handler resumes on the UI thread through its SynchronizationContext, so async is the usual
      way to keep it free. Blocking on .Result or .Wait() from the UI thread is the classic deadlock;
      libraries use ConfigureAwait(false) to avoid it.
    go: >
      Go has no main thread by default, but GUI bindings often need one (macOS requires the main OS thread, so
      runtime.LockOSThread in init), and Fyne asks for fyne.Do from other goroutines. In Bubble Tea, Update
      and View run on the program's goroutine; slow work goes in a tea.Cmd, and other goroutines report back
      with Program.Send, never by mutating the model.
    rust: >
      Many toolkits make UI handles !Send, so the compiler enforces confinement (gtk-rs objects; use
      glib::MainContext::spawn_local or channels). winit's event loop must run on the main thread on some
      platforms. In tokio, blocking inside async code stalls a worker; use spawn_blocking.
  related:
    - observer
    - model-view-update
    - functional-core-imperative-shell
    - immutability-by-default
    - global-state
    - resource-leak
  tell: "Written for python and rust, for event-loop blocking only. Inside an async function: time.sleep, a
    blocking HTTP call (requests, urllib, httpx.Client) or subprocess.run/check_output in Python;
    std::thread::sleep, reqwest::blocking or std::process::Command::output in Rust. (Ruff's flake8-async rules
    check the Python form.) Not when the call is wrapped in asyncio.to_thread, run_in_executor or
    spawn_blocking, and not file reads, which are usually short and too common at startup to flag."
  interview_only: false
  example:
    before: |
      class RatesPanel:
          fn on_refresh_clicked():
              rates = http.get(RATES_URL).json()   # freezes the window while it waits
              self.table.show(rates)

          fn start_auto_refresh():
              spawn_thread(fn():
                  loop:
                      self.table.show(http.get(RATES_URL).json())   # widget touched off the UI thread
                      sleep(60))
    after: |-
      class RatesPanel:
          fn on_refresh_clicked():
              self.spinner.show()
              background.run(fetch_rates, on_done=self.rates_arrived)

          fn start_auto_refresh():
              ui_timer.every(60, self.on_refresh_clicked)   # timer fires on the UI thread

          fn rates_arrived(rates: Rates):          # called on the UI thread
              self.spinner.hide()
              self.table.show(rates)

      fn fetch_rates() -> Rates:                     # runs on a worker; touches no widgets
          return http.get(RATES_URL).json()
    note: Slow work runs on a worker and only the result crosses back, so the window stays responsive and only the
      UI thread ever writes to widgets.
  sources:
    - cite: Android Developers, Processes and threads overview, threads (the single-thread model)
      url: https://developer.android.com/guide/components/processes-and-threads
      how: read
    - cite: Oracle, The Java Tutorials, Concurrency in Swing, The Event Dispatch Thread
      url: https://docs.oracle.com/javase/tutorial/uiswing/concurrency/dispatch.html
      how: read
    - cite: Doug Lea, Concurrent Programming in Java, 2nd ed. (1999), 2.3.2 Confinement Within Threads
      url: https://gee.cs.oswego.edu/dl/cpj/s2.3.html
      how: recalled
    - cite: Brian Goetz et al., Java Concurrency in Practice (2006), 3.3 Thread confinement and 9 GUI applications
      url: https://jcip.net/
      how: recalled
    - cite: Microsoft Learn, WPF Threading Model (Dispatcher)
      url: https://learn.microsoft.com/en-us/dotnet/desktop/wpf/advanced/threading-model
      how: recalled
    - cite: MDN, Using Web Workers
      url: https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Using_web_workers
      how: recalled
    - cite: Graham Hamilton, Multithreaded toolkits, A failed dream? (2004)
      url: null
      how: recalled
