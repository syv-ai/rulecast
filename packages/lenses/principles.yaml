- id: tell-dont-ask
  name: Tell, Don't Ask
  family: principle
  group: design
  says: Rather than asking an object for its data and deciding for it, tell the object what you want and let it
    decide using its own data. It puts behaviour next to the data it uses.
  names: From Alec Sharp's Smalltalk by Example (1997), which contrasts procedural code that fetches data and
    decides with object-oriented code that tells objects what to do. Andy Hunt and Dave Thomas (the Pragmatic
    Programmers) spread the name in their IEEE Software column The Art of Enbugging (2003), citing Sharp.
    Fowler's bliki entry is the usual reference, and he frames it as a step toward co-locating data and
    behaviour.
  applies_to:
    kinds: []
    languages: []
  contested: true
  looks_like:
    - Callers that read several getters from one object, decide something, then call setters on it.
    - The same conditional on an object's fields repeated in several callers.
    - Classes that are only getters and setters, with the rules that concern them living elsewhere.
    - After the change, methods named for intentions (lend_to, raise_alarm_if_needed) instead of getters.
  forces:
    - A rule about an object's state is copied into each caller that needs it.
    - Callers break when an object's fields change, because they reach into them to decide.
    - A method uses another object's data more than its own (Feature Envy).
  overuse:
    - Removing every getter, so code that needs to display, serialise or report data has to go through awkward
      callbacks; Fowler calls such people getter eradicators.
    - Pushing unrelated behaviour into an entity because it holds the data, which grows a Large Class.
    - Pulling presentation, persistence or policy concerns into domain objects, against layering.
  remedy: null
  counter: >
    Fowler doesn't use the principle himself; he prefers to think in terms of keeping data and behaviour that
    change together in one place, and has seen code made worse by telling where a plain query would be
    simpler. Querying is the right shape for read models, reports, views and serialisation, and for
    transformation objects whose job is to hand data to others. Functional and data-oriented designs separate
    data from behaviour on purpose and get testability and simplicity in return, so the principle fits
    rich-object domain models more than pipelines of plain records. Rules that span several objects belong in
    a service or policy, not in any one of them.
  in:
    python: >
      Properties hide whether a value is stored or computed, which blurs asking and telling; a dataclass with
      logic in callers is the common shape to watch.
    typescript: >
      Interfaces of plain data with logic in functions are idiomatic in much TypeScript, especially in front
      ends, and apply the opposite style on purpose. The principle fits class-based domain models.
    java: >
      JavaBean getters and setters and anemic JPA entities are the usual target; a method on the entity is the
      tell-style fix.
    csharp: >
      Auto-properties make ask-style code the default; domain-driven design in .NET pushes rules into entity
      methods with private setters.
    go: >
      Structs with exported fields and functions in the same package are idiomatic; telling is done by a
      method on the type that owns the rule, but Go doesn't push hard either way.
    rust: >
      Methods on the type that owns the data, with private fields, are the norm, so the principle tends to be
      followed by default within a module.
  related:
    - law-of-demeter
    - feature-envy
    - data-class
    - message-chains
    - command-query-separation
    - inappropriate-intimacy
  tell: null
  interview_only: false
  example:
    before: |
      fn checkout(book: Book, member: Member):
          if book.on_hold_for is not None and book.on_hold_for != member:
              raise OnHold
          if book.copies_out >= book.copies_total:
              raise NoCopies
          book.copies_out += 1
          book.loans.add(Loan(member, today() + 21 days))
    after: |
      class Book:
          fn lend_to(member: Member) -> Loan:
              if self.on_hold_for not in (None, member): raise OnHold
              if self.copies_out >= self.copies_total: raise NoCopies
              self.copies_out += 1
              loan = Loan(member, today() + 21 days)
              self.loans.add(loan)
              return loan

      fn checkout(book: Book, member: Member):
          book.lend_to(member)
    note: The lending rules move into the book that owns the copies and holds, so no caller can bump copies_out
      without checking them.
  sources:
    - cite: Martin Fowler, bliki, TellDontAsk
      url: https://martinfowler.com/bliki/TellDontAsk.html
      how: read
    - cite: Andy Hunt and Dave Thomas, The Art of Enbugging, IEEE Software (2003)
      url: https://media.pragprog.com/articles/jan_03_enbug.pdf
      how: recalled
  matters_most_for: []
- id: command-query-separation
  name: Command-Query Separation (CQS)
  family: principle
  group: design
  says: Every method should either change state (a command) or return an answer (a query), not both. Then
    queries can be called freely, in any order and as often as you like, and changes happen only where a
    command is called.
  names: Coined by Bertrand Meyer in Object-Oriented Software Construction (1988) as part of Design by Contract.
    Fowler's bliki entry prefers the word modifier for command. CQRS (Greg Young) extends the idea to separate
    read and write models at architecture scale.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Methods named get, is, has or find that also write fields, files or the database.
    - Methods that change state and return a status or the changed object, so callers sometimes ignore the
      change and sometimes depend on it.
    - Bugs where adding a log line or a debugger watch that calls a getter changes behaviour.
    - After the change, pairs such as current() and advance(), or is_valid() and touch().
  forces:
    - A query with a side effect surprised someone (a getter that lazily created a record, a check that
      extended a session).
    - Code where it isn't clear which calls are safe to repeat or reorder.
    - Tests that have to call a method twice to separate its effect from its answer.
  overuse:
    - Splitting atomic operations that must read and write together (pop, compare-and-set, get-and-increment,
      insert returning the new id), which creates races in concurrent code.
    - Banning fluent or builder APIs whose methods change the receiver and return it.
    - Treating caching or memoising inside a query as a violation, when no caller can observe it.
  remedy: null
  counter: >
    Meyer's rule meets real exceptions. A stack pop that returns the item is clearer than top then remove, and
    Fowler keeps it. In concurrent code, operations that read and modify in one step (compare-and-swap, queue
    take, an insert that returns its generated key) must not be split, or the answer is stale by the time you
    act on it. Fluent interfaces deliberately return a value from modifiers. Internal caching that no caller
    can see doesn't break the principle, since it concerns observable state. Use it to make side effects
    visible, not as a law.
  in:
    python: >
      Properties should be queries; a property that writes state is a strong surprise. list.pop and
      dict.setdefault are standard-library exceptions people rely on.
    typescript: >
      Getters (get accessors) should be pure; array methods mix both styles (sort and reverse mutate and
      return, while toSorted and toReversed are the newer pure versions).
    java: >
      Iterator.next both advances and returns, the classic violation Fowler mentions; atomic classes'
      getAndIncrement and compareAndSet are justified ones.
    csharp: >
      Property getters should be side-effect free, and the framework design guidelines say so; TryParse and
      TryGetValue return a bool and write an out parameter, an accepted idiom.
    go: >
      Methods commonly return an error from commands, which isn't a query result and doesn't break the
      principle; sync/atomic and channel receives combine read and change on purpose.
    rust: >
      The borrow checker makes the split visible: &self methods are queries and &mut self methods are
      commands, though Vec::pop and Iterator::next take &mut self and return a value by design.
  related:
    - principle-of-least-astonishment
    - fluent-interface
    - tell-dont-ask
    - functional-core-imperative-shell
    - immutability-by-default
  tell: >
    Python, TypeScript, Java and C#: a method or property getter whose name starts with get, is or has and
    whose body assigns to a field of self or this or calls a save, write or delete method. Lazy caching will
    match too, so it marks places to look rather than defects.
  interview_only: false
  example:
    before: |
      class Session:
          fn is_valid(now) -> bool:
              if now > self.expires: return false
              self.expires = now + 30 minutes      # also extends the session
              return true

      # a health check that calls is_valid keeps idle sessions alive forever
    after: |
      class Session:
          fn is_valid(now) -> bool:
              return now <= self.expires

          fn touch(now):
              self.expires = now + 30 minutes

      if session.is_valid(now): session.touch(now)
    note: Checking a session no longer extends it, so only code that means to keep the session alive does so.
  sources:
    - cite: Bertrand Meyer, Object-Oriented Software Construction (1988; 2nd ed. 1997)
      url: https://bertrandmeyer.com/OOSC2/
      how: recalled
    - cite: Martin Fowler, bliki, CommandQuerySeparation
      url: https://martinfowler.com/bliki/CommandQuerySeparation.html
      how: read
  matters_most_for:
    - library-sdk
    - plugin-host
- id: composition-over-inheritance
  name: Composition over Inheritance
  family: principle
  group: design
  says: Get reuse and variation by giving an object other objects to delegate to, rather than by subclassing.
    Inheritance ties a subclass to its parent's internals; composition lets you combine and swap parts,
    including at runtime.
  names: Stated by the Gang of Four (Gamma, Helm, Johnson, Vlissides) in Design Patterns (1994), as their second
    principle of object-oriented design. Joshua Bloch's Effective Java has it as Favor composition over
    inheritance (item 18 in the 3rd ed.). The fragile base class problem is the failure it guards against.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Deep class hierarchies, or subclasses named for combinations (CompressedEncryptedCsvExporter).
    - Subclasses that override a method only to switch off or replace parent behaviour.
    - Base classes named Base or Abstract that collect shared helpers for unrelated subclasses.
    - After the change, objects holding small collaborators passed in through the constructor (strategies,
      decorators, policies).
  forces:
    - Variation along two or more axes, which inheritance turns into one subclass per combination.
    - A subclass inherits methods it doesn't want (Refused Bequest).
    - A parent class change breaks subclasses that relied on its internals (fragile base class).
    - Behaviour needs to change at runtime or be configured per instance.
  overuse:
    - Wrapping and forwarding every method of a type to avoid a subclass that is a real is-a relation.
    - Composing tiny single-method objects for a hierarchy of two classes that will never grow.
    - Rejecting framework base classes that the framework expects you to extend.
  remedy: null
  counter: >
    Inheritance is fine for a real is-a relation with a stable parent designed for extension, for abstract
    classes that provide a template with a few hooks, and where a framework expects it (UI widgets, test base
    classes, exception hierarchies). Composition costs forwarding code and indirection, and in languages
    without delegation support that boilerplate is real. The GoF themselves used inheritance throughout their
    patterns; the principle says favour, not forbid. Bloch's advice is to design and document classes for
    inheritance or prohibit it.
  in:
    python: >
      Mixins and multiple inheritance are common in frameworks (Django class-based views), and the method
      resolution order makes deep hierarchies hard to follow. Protocols let you type a composed collaborator
      without a base class.
    typescript: >
      Classes support single inheritance only; composing objects, passing functions, and React's preference
      for composition over component inheritance are the norm.
    java: >
      Bloch's item is the standard reference. Final classes by default, interfaces with default methods, and
      delegation are the tools; extending concrete library classes such as HashSet is his classic example of
      the fragile base class.
    csharp: Many teams seal application and internal classes not designed for inheritance (analyzer CA1852
      suggests it for internal types), though the Framework Design Guidelines advise against sealing public
      library classes without a reason. Interfaces with default implementations and dependency injection make
      composition the usual shape.
    go: >
      Go has no inheritance. Struct embedding promotes the inner type's methods, which looks like inheritance
      but is composition: there is no virtual dispatch back to the outer type.
    rust: >
      Rust has no implementation inheritance. Traits with default methods and generic or boxed fields give
      reuse and variation; supertraits express is-a at the interface level only.
  related:
    - refused-bequest
    - parallel-inheritance-hierarchies
    - strategy
    - decorator
    - template-method
    - liskov-substitution-principle
  tell: null
  interview_only: false
  example:
