- id: make-illegal-states-unrepresentable
  name: Make Illegal States Unrepresentable
  family: principle
  group: design
  says: Shape your types so that combinations of data that can't happen in the domain can't be built at all.
    Usually this means a closed set of variants (a sum type or discriminated union), each carrying only the
    fields that make sense for it, instead of one record with a status flag and a pile of optional fields.
  names: The phrase is Yaron Minsky's, from his Effective ML talk and the Jane Street post Effective ML
    Revisited (2011). Scott Wlaschin's Domain Modeling Made Functional (2018) spread it beyond ML languages.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A status or kind field plus several optional or nullable fields, each meaningful for only some statuses.
    - Boolean pairs that must never both be true (is_loading and has_error).
    - Comments such as "only set when status is DONE" next to a field.
    - Runtime checks or asserts that re-establish which fields are present for a given state.
    - After the change, unions of small types and exhaustive switch or match over them.
  forces:
    - Bugs where an object was in a state the code assumed impossible (a paid order with no payment id).
    - Code that checks for null on fields that "should" be set in the current state.
    - A type that keeps gaining optional fields as new states are added.
    - Adding a new state means hunting for every if on the status field.
  overuse:
    - Encoding every business rule in types, so a rule change ripples through signatures and the types read
      like a proof.
    - Splitting a type into variants that share almost all fields and differ in nothing the code acts on.
    - Type-level tricks (phantom types, branded types, type-level numbers) where a constructor check would be
      clearer to the team.
    - Closed unions at an extension point that others must be able to extend.
  remedy: null
  counter: >
    Not every invariant is worth a type. Rules that change often, depend on data in other records or come from
    configuration belong in runtime checks, and forcing them into types makes the model rigid. Closed unions
    also fight extensibility: if plugins or other teams must add variants, an open interface is the right
    shape (the expression problem). At boundaries the data arrives untyped anyway, so the principle works
    together with parsing at the edge (parse-dont-validate). Storage and wire formats usually flatten the
    union back into nullable columns or optional fields, so the mapping code has to be written and tested.
  in:
    python: >
      Model variants as separate frozen dataclasses joined with a Union (or the | operator), with a Literal
      tag field when serialising; match statements narrow them, and typing.assert_never makes a type checker
      report a missing case. The guarantee exists only under mypy or pyright, not at runtime. Pydantic
      discriminated unions apply it at the parsing boundary.
    typescript: >
      Discriminated unions with a literal kind field are the native tool, and a switch with a never-typed
      default gives exhaustiveness checking. Optional properties plus a status string is the common shape to
      replace. Types are erased at runtime, so external data still needs parsing.
    java: >
      Since Java 17, a sealed interface with record implementations is a closed sum type, and since Java 21
      pattern-matching switch over it is checked for exhaustiveness. Before that, enums with data or the
      visitor pattern were the substitutes.
    csharp: C# 15 (.NET 11, November 2026; in preview with LangVersion preview before that) adds union types,
      declared with the union keyword over a fixed set of types, with exhaustive switch checking. Through C#
      14 the usual substitutes are an abstract record with a private constructor and nested sealed records,
      matched with switch expressions (the compiler can't prove exhaustiveness, so a discard arm is needed),
      or libraries such as OneOf.
    go: >
      Go has no sum types. The common substitute is an interface with an unexported marker method so only the
      package can implement it, plus a type switch; linters such as exhaustive and go-check-sumtype check the
      cases. Zero values mean any struct can exist half-built, so constructors and unexported fields carry
      more of the load.
    rust: >
      Enums with data and exhaustive match are the everyday tool, and Option and Result are the standard
      examples; the compiler rejects a missed variant. Newtypes and the typestate pattern push it further.
  related:
    - parse-dont-validate
    - primitive-obsession
    - temporary-field
    - switch-statements
    - state
    - data-clumps
  tell: >
    TypeScript and Python: a type or class with a string or enum field named status, state or kind alongside
    three or more optional or nullable fields. It is a hint to look, not a finding; some of these are honest
    records with independent optional data.
  interview_only: false
  example:
    before: |
      class Upload:
          status: str                 # "pending" | "uploading" | "done" | "failed"
          progress: float or None     # only while uploading
          url: str or None            # only when done
          error: str or None          # only when failed

      fn show(u: Upload):
          if u.status == "done": return link(u.url)   # url could still be None
          ...
    after: |
      Upload = Pending
             | Uploading(progress: float)
             | Done(url: str)
             | Failed(error: str)

      fn show(u: Upload):
          match u:
              Pending: return "waiting"
              Uploading(p): return bar(p)
              Done(url): return link(url)
              Failed(e): return warning(e)
    note: A finished upload without a url, or a failed one with progress, can no longer be built, and a missing
      case in show is a type error.
  sources:
    - cite: Yaron Minsky, Effective ML Revisited, Jane Street blog (2011)
      url: https://blog.janestreet.com/effective-ml-revisited/
      how: read
    - cite: Scott Wlaschin, Domain Modeling Made Functional (2018)
      url: https://pragprog.com/titles/swdddf/domain-modeling-made-functional/
      how: recalled
    - cite: Scott Wlaschin, Designing with types, F# for Fun and Profit
      url: https://fsharpforfunandprofit.com/series/designing-with-types/
      how: recalled
  matters_most_for:
    - web-frontend
    - fullstack-web
    - tui
    - compilers-tooling
    - library-sdk
    - web-api
- id: parse-dont-validate
  name: Parse, Don't Validate
  family: principle
  group: design
  says: At the edge of the system, turn raw input into a type that can only hold valid values, and pass that
    type inward. A check that returns true or false and then hands on the raw value forgets what it learned,
    so the same checks get repeated, or skipped, deeper in.
  names: Coined by Alexis King in the blog post Parse, don't validate (2019). Her post borrows shotgun parsing,
    checks scattered through processing code, from the language-theoretic security (LangSec) community. In OO
    terms, it is close to always-valid value objects.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Functions named validate_x or is_valid_x that return a bool or nothing, after which the raw string, dict
      or JSON flows on.
    - The same check (non-empty, in range, well-formed email) repeated in several layers.
    - Domain functions taking str, int or dict where a narrower type exists or could exist.
    - After the change, constructors or parse functions that return the narrower type or an error, used at
      request handlers, CLI argument parsing and config loading.
  forces:
    - Input arrives untyped at a boundary (HTTP bodies, CLI arguments, config files, environment, queue
      messages, files).
    - Deeper code defends itself with checks because it can't tell whether input was already checked.
    - Bugs where processing started, then failed halfway on a later part of the input.
    - Primitive types carrying meaning (an id, an email, a currency amount) passed around as plain strings and
      numbers.
  overuse:
    - Wrapping every string in its own type, so simple code fills with conversions and ceremony.
    - Parsing internal data that never crosses a boundary and is already well-typed.
    - Types whose invariants are weaker than their names promise, which gives false confidence.
    - Rejecting input the system could have tolerated, where being liberal about input was the right call.
  remedy: null
  counter: >
    In languages without a static type checker, or where it isn't enforced, the narrower type is only a
    convention, so the gain is smaller, though parsing at the edge still helps. Some rules can't be known at
    the boundary (uniqueness against the database, stock levels) and still need checking at the point of use.
    Many small wrapper types add friction, so introduce them for values that are passed around and misused,
    not for everything. Collecting every error for a form is a different job from failing on the first one,
    and some parsing libraries make that harder.
  in:
    python: >
      Pydantic models (as used by FastAPI) and attrs or dataclass constructors are the usual parsers at the
      boundary; NewType or small frozen classes carry the result inward. The guarantee holds only as far as a
      type checker runs.
    typescript: >
      Types are erased, so JSON.parse returns unchecked data. Schema libraries such as zod or valibot parse
      into typed values; branded types mark values that went through a parser.
    java: >
      Records with checks in the compact constructor, or value classes with private constructors and static
      factory methods; Bean Validation annotations are the validate style this principle argues against
      relying on alone.
    csharp: >
      Value objects with private constructors and a static TryParse or Create that returns a result; records
      help. Data annotations and FluentValidation validate without producing a narrower type.
    go: >
      A constructor returning (T, error) with unexported fields, so the only way to get a T is through it.
      Zero values can still bypass it, so the type's zero value should be invalid or harmless.
    rust: >
      Newtypes with TryFrom or FromStr, and serde deserialising straight into strict types, make this the
      default style; the standard library's NonZero types are an example.
  related:
    - make-illegal-states-unrepresentable
    - primitive-obsession
    - postels-law
    - functional-core-imperative-shell
  tell: >
    Python and TypeScript: a function whose name starts with validate or is_valid, returns bool or nothing,
    and takes a str, dict, any or unknown, in a module that also passes that same argument on to other calls.
    Many such functions are fine; it marks places to look.
  interview_only: false
  example:
    before: |
      fn is_valid_email(raw: str) -> bool:
          return "@" in raw and len(raw) < 255

      fn signup(raw_email: str):
          if not is_valid_email(raw_email): raise BadRequest
          create_account(raw_email)

      fn create_account(email: str):
          if "@" not in email: raise ValueError     # checked again, just in case
          ...
    after: |
      class Email:
          value: str
          fn parse(raw: str) -> Email or ParseError:
              if "@" not in raw or len(raw) >= 255: return ParseError("email")
              return Email(raw.lower())

      fn signup(raw_email: str):
          email = Email.parse(raw_email) or raise BadRequest
          create_account(email)

      fn create_account(email: Email):
          ...
    note: The check happens once at the edge and its result is a type, so create_account can't be handed an
      unchecked string.
  sources:
    - cite: Alexis King, Parse, don't validate (2019)
      url: https://lexi-lambda.github.io/blog/2019/11/05/parse-don-t-validate/
      how: read
    - cite: LangSec, The Seven Turrets of Babel (Momot, Bratus, Hallberg, Patterson, 2016), shotgun parsing
      url: https://langsec.org/
      how: recalled
  matters_most_for:
    - web-api
    - cli-devtool
    - library-sdk
    - data-pipeline
    - plugin-host
- id: functional-core-imperative-shell
  name: Functional Core, Imperative Shell
  family: principle
  group: design
  says: Put the decisions in pure functions that take values and return values, and keep a thin outer layer that
    reads input, calls the core, and carries out the effects it returns. The core is tested with plain values
    and no doubles; the shell is kept simple enough to need only a few integration tests.
  names: Named by Gary Bernhardt in the Destroy All Software screencast of that name (2012) and his talk
    Boundaries. Close relatives are hexagonal architecture (Cockburn), Eric Normand's actions, calculations
    and data (Grokking Simplicity, 2021), and the Elm architecture.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Modules of pure functions that take records and return decisions, results or lists of effects to apply.
    - An outer layer (handler, command, main loop) that loads data, calls the core and then writes, sends or
      prints.
    - Core tests with no mocks, no fixtures beyond values, and no I/O.
    - Before the change, functions that interleave reading, deciding and writing, tested through many mocks.
  forces:
    - Business rules tangled with database calls, HTTP calls and the clock, so tests need many doubles.
    - Logic that's hard to reason about because state changes happen in the middle of decisions.
    - A need to run the same rules in different settings (CLI, server, batch job, replay).
    - Event loops (TUIs, games, reducers) where an update step can be a pure function of state and event.
  overuse:
    - Building effect systems, monads or free interpreters to make the shell itself pure.
    - Forcing logic that is mostly I/O orchestration into a core that just returns instructions mirroring the
      I/O calls one for one.
    - Loading everything up front so the core can be pure, when the decisions need data fetched lazily.
  remedy: null
  counter: >
    Some logic depends on intermediate I/O: the next query depends on the last answer, or the data is too big
    to load first. Then the core has to be split into several steps, or the shell grows decisions, and the
    clean split blurs. Returning descriptions of effects instead of doing them adds a layer of indirection
    that can be harder to follow than the direct code. For small scripts and thin CRUD handlers there is
    little core to extract. Teams used to object-oriented layering may find a ports-and-adapters split, with
    doubles at the ports, a more familiar way to get similar testability.
  in:
    python: >
      Pure functions over frozen dataclasses in the core, with the FastAPI route or CLI command as the shell;
      no special library needed.
    typescript: >
      Reducers in Redux or useReducer, and the Elm-style update functions in UI code, are this pattern; for
      back ends, plain functions over readonly types called from a handler.
    java: >
      Records and static methods, or domain classes free of framework dependencies, called from Spring
      services or controllers acting as the shell.
    csharp: >
      Records and static functions in the core, with controllers, minimal API handlers or background services
      as the shell.
    go: >
      Functions over plain structs with no context.Context, no interfaces to I/O, and no goroutines in the
      core; Bubble Tea's Update function is a core of this kind, with commands returned for the runtime to
      run.
    rust: >
