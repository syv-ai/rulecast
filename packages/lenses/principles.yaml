# rulecast lens catalog: principles and practices. Distilled 2026-10-13; see docs/references.md.
# Own words throughout; sources cited per entry (how: read | recalled | developer).
- id: bounded-context
  name: Bounded Context
  family: principle
  group: architecture
  says: Draw an explicit boundary around each model, in code, data and team ownership, and keep terms consistent
    inside it, accepting that the same word (customer, product, course) means different things in different
    contexts.
  names: Eric Evans, Domain-Driven Design (2003), ch. 14, the centre of DDD's strategic design.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Top-level modules, packages, projects or services named after business areas (billing, scheduling,
      grading), each with its own model classes.
    - Two classes with the same name in different contexts, each holding only what that context needs, linked
      by an id.
    - Each context owns its tables or schema, and other contexts go through its published interface.
    - Import rules or architecture tests that stop one context reaching into another's internals.
  forces:
    - One central class (Customer, Product, Account) has grown fields and rules for every department, and
      every change risks breaking someone.
    - Teams argue about what a word means because each is right in its own area.
    - A shared database schema couples modules that should change independently.
    - Different parts of the system change at different rates or are owned by different teams.
  overuse:
    - A microservice per context, or worse per entity, in a system one team could run as a modular monolith.
    - Dozens of tiny contexts with translation layers between them for a domain that is really one model.
    - Duplicating a concept into two contexts when it means the same thing in both.
  remedy: null
  counter: >
    A bounded context is a model boundary, not a deployment unit; mapping each to a microservice is a common
    misreading that produces a distributed monolith. Evans himself warns that splitting into ever smaller
    contexts loses integration and coherence. A small app with one team and one coherent vocabulary is one
    context, and drawing internal boundaries adds translation without benefit. Boundaries are hard to get
    right early, so many practitioners start with a modular monolith and split once the boundaries have proved
    stable. Applying the tactical patterns without this strategic step is what Vernon calls DDD-Lite, the most
    common criticism of how DDD is practised.
  in:
    python: >
      One top-level package per context; import-linter contracts can forbid imports between contexts except
      through a public module.
    typescript: >
      Workspace packages or folders per context, with dependency-cruiser or eslint-plugin-boundaries rules
      enforcing what may import what.
    java: >
      Packages or Maven/Gradle modules per context. Spring Modulith treats top-level packages as application
      modules and verifies their dependencies; ArchUnit does the same in any Java codebase.
    csharp: >
      A project (assembly) per context, with internal visibility for what other contexts must not use;
      NetArchTest can check the rules.
    go: >
      A package tree per context, with internal/ directories so other contexts can't import the internals; the
      compiler enforces it.
    rust: >
      A crate per context in a workspace, with pub only on the published interface; the crate graph makes
      dependencies explicit and acyclic.
  related:
    - ubiquitous-language
    - context-map
    - anti-corruption-layer
    - core-subdomain
    - shared-database
    - distributed-monolith
    - big-ball-of-mud
    - drifting-terminology
  tell: >
    Any language: a file inside one context's directory that imports from another context's internal module
    rather than its published interface (for example billing/ importing scheduling/domain/). Needs the
    project's context directories configured, so it is a path-aware check, not a universal one.
  interview_only: false
  example:
    before: |
      class Course:                  # shared by every part of the university system
          code: str
          room: Room
          timeslots: list
          enrolment_cap: int
          grading_scheme: GradingScheme
          credits: int
          pass_mark: int
          # scheduling changes break grading tests, and the reverse
    after: |
      # scheduling/course.py
      class Course:
          course_id: CourseId
          room: Room
          timeslots: list
          enrolment_cap: int

      # grading/course.py
      class Course:
          course_id: CourseId
          grading_scheme: GradingScheme
          credits: int
          pass_mark: int
    note: Each context keeps the version of Course its own people mean, linked by id, so scheduling and grading
      change independently.
  sources:
    - cite: Eric Evans, Domain-Driven Design Reference (2015), Bounded Context and Continuous Integration
      url: https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf
      how: read
    - cite: Eric Evans, Domain-Driven Design (2003), ch. 14
      url: https://www.domainlanguage.com/ddd/
      how: recalled
    - cite: Martin Fowler, bliki, BoundedContext
      url: https://martinfowler.com/bliki/BoundedContext.html
      how: recalled
    - cite: Vaughn Vernon, Implementing Domain-Driven Design (2013), ch. 1 (DDD-Lite) and ch. 2
      url: null
      how: recalled
    - cite: Vlad Khononov, Learning Domain-Driven Design (2021), ch. 3
      url: https://www.oreilly.com/library/view/learning-domain-driven-design/9781098100124/
      how: recalled
  matters_most_for:
    - distributed
    - web-api
    - fullstack-web
    - platforms
    - event-driven
- id: ubiquitous-language
  name: Ubiquitous Language
  family: practice
  group: design
  says: Developers and domain experts share one vocabulary within a bounded context and use it everywhere, in
    talk, docs and especially code, so renaming a concept in conversation means renaming it in code too.
  names: Eric Evans, Domain-Driven Design (2003), ch. 2.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Class, method and module names that a domain expert would recognise (Batch, pitch_yeast, GravityReading)
      rather than technical stand-ins (Job, add_item, Measurement).
    - A glossary in the repository that the code follows, with one entry per term and the context it holds in.
    - Commits that rename code after the business changed how it talks about something.
    - Tests named in domain sentences.
  forces:
    - Developers translate between what the business says and what the code says, and things get lost.
    - The same concept goes by several names in the code, or one name covers several concepts (Drifting
      Terminology).
    - Bugs trace back to a misunderstanding of what a term meant.
    - New developers can't map a feature request onto the code.
  overuse:
    - One company-wide glossary forced onto every team, ignoring that terms legitimately differ between
      contexts.
    - Renaming established technical terms (cache, queue, retry) into business words they have no business
      name for.
    - Arguing over wording for code that has no domain experts and no domain beyond its own mechanics.
  remedy: null
  counter: >
    The language holds within one bounded context, not across a company; trying to make it universal is the
    commonest misreading. For tooling, libraries and infrastructure the "domain" is technical, and its
    language is the vocabulary of its users, developers, so the practice still applies but there are no
    business experts to consult. Teams working in a non-English domain face a real trade-off between keeping
    domain terms untranslated in code and keeping code in one language; both are defensible if chosen
    deliberately. Drifting Terminology is the anti-pattern this practice prevents, and coding agents produce
    it readily, so a checked-in glossary is a cheap convention that pays off.
  in: {}
  related:
    - drifting-terminology
    - bounded-context
    - domain-allergy
    - principle-of-least-astonishment
  tell: null
  interview_only: false
  example:
    before: |
      class Job:
          readings: list            # brewers call these gravity readings

      fn add_item(job: Job, kind: str, grams: int): ...    # kind == "yeast" means pitching
      fn finish_job(job: Job): ...                         # brewers say "rack to conditioning"
      fn calc_abv(m1: float, m2: float) -> float: ...
    after: |
      class Batch:
          gravity_readings: list

      fn pitch_yeast(batch: Batch, strain: YeastStrain, grams: int): ...
      fn add_hops(batch: Batch, variety: HopVariety, grams: int): ...
      fn rack_to_conditioning(batch: Batch): ...
      fn alcohol_by_volume(original: Gravity, final: Gravity) -> Percentage: ...
    note: The code now uses the brewers' own words, so a request about racking or pitching maps straight onto a
      function.
  sources:
    - cite: Eric Evans, Domain-Driven Design Reference (2015), Ubiquitous Language
      url: https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf
      how: read
    - cite: Eric Evans, Domain-Driven Design (2003), ch. 2
      url: https://www.domainlanguage.com/ddd/
      how: recalled
    - cite: Martin Fowler, bliki, UbiquitousLanguage
      url: https://martinfowler.com/bliki/UbiquitousLanguage.html
      how: recalled
    - cite: Vlad Khononov, Learning Domain-Driven Design (2021), ch. 2
      url: https://www.oreilly.com/library/view/learning-domain-driven-design/9781098100124/
      how: recalled
  matters_most_for:
    - web-api
    - fullstack-web
    - library-sdk
    - plugin-host
- id: context-map
  name: Context Map
  family: practice
  group: architecture
  says: A map of the bounded contexts in play, including outside systems, and of how each pair relates (who is
    upstream, who translates, what is shared), drawn as things are now rather than as hoped.
  names: Eric Evans, Domain-Driven Design (2003), ch. 14. The relationship patterns it uses are Evans's too
    (Shared Kernel, Customer/Supplier, Conformist, Anticorruption Layer, Open Host Service, Published
    Language, Separate Ways); Partnership and Big Ball of Mud were added in his 2015 DDD Reference.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A diagram or document in the repository naming each context, its owner and each integration with its
      relationship type.
    - Integration code whose shape matches the map (a translator where the map says anticorruption layer, a
      versioned public API where it says open host service).
    - Dependency rules or architecture tests that encode the allowed directions.
  forces:
    - Several teams or systems integrate, and changes on one side keep surprising the other.
    - Nobody can say which system is the source of truth for a concept.
    - A downstream team plans around features an upstream team never committed to.
    - A legacy system or vendor API is shaping the model of the code that uses it.
  overuse:
    - A detailed map for a single-team app with one context and a couple of third-party APIs.
    - Drawing the map as the desired future state, so it describes nothing that exists.
    - Maintaining a heavy modelling tool's output that nobody reads after the workshop.
  remedy: null
  counter: >
    Its value grows with the number of teams and systems; for one team and one codebase, a list of external
    integrations and how each is wrapped is enough. Like any architecture diagram it rots unless something
    checks it, so encode the important edges as dependency rules instead of trusting the picture. Evans's
    advice is to map the existing terrain first and change it later; a map drawn as the target state misleads.
  in: {}
  related:
    - bounded-context
    - anti-corruption-layer
    - shared-database
    - big-ball-of-mud
  tell: null
  interview_only: false
  example: null
  example_reason: A context map describes relationships between contexts and teams in a diagram or document; it
    has no shape in a single code snippet.
  sources:
    - cite: Eric Evans, Domain-Driven Design Reference (2015), Context Map and the relationship patterns
      url: https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf
      how: read
    - cite: Eric Evans, Domain-Driven Design (2003), ch. 14
      url: https://www.domainlanguage.com/ddd/
      how: recalled
    - cite: Vaughn Vernon, Implementing Domain-Driven Design (2013), ch. 3
      url: null
      how: recalled
    - cite: Vlad Khononov, Learning Domain-Driven Design (2021), ch. 4
      url: https://www.oreilly.com/library/view/learning-domain-driven-design/9781098100124/
      how: recalled
    - cite: Context Mapper, a DSL and tooling for context maps
      url: https://contextmapper.org/
      how: recalled
  matters_most_for:
    - distributed
    - platforms
