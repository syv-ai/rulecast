      url: https://bertrandmeyer.com/OOSC2/
      how: recalled
    - cite: Robert C. Martin, The Open-Closed Principle, C++ Report (1996)
      url: https://web.archive.org/web/20060822033314/http://www.objectmentor.com/resources/articles/ocp.pdf
      how: recalled
  matters_most_for:
    - plugin-host
    - library-sdk
    - compilers-tooling
- id: liskov-substitution-principle
  name: Liskov Substitution Principle (LSP)
  family: principle
  group: design
  says: Any implementation of a type must work wherever the type is expected, without callers knowing which one
    they got. A subtype may accept more and promise more, never require more or promise less, and must keep
    the type's invariants.
  names: From Barbara Liskov's keynote Data Abstraction and Hierarchy (OOPSLA 1987), made precise by Liskov and
    Jeannette Wing in A Behavioral Notion of Subtyping (1994). Robert C. Martin made it the L in SOLID.
    Bertrand Meyer's rules on preconditions and postconditions under inheritance (Design by Contract) say the
    same thing.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Overrides that throw not-implemented or not-supported errors.
    - Callers that check the concrete type (isinstance, instanceof, type switches) before using an object
      passed in as the base type.
    - Subclasses that tighten what they accept or weaken what they guarantee (stricter validation, nulls where
      the base never returned them).
    - Tests that pass for one implementation of an interface and fail for another.
  forces:
    - Several implementations of one interface or base class used interchangeably, especially by others
      (plugins, adapters, drivers).
    - Bugs that appear only with one implementation.
    - Inheritance chosen for code reuse rather than a true is-a relation (the square that extends rectangle).
  overuse:
    - Treating every type check as a violation, including ones on a closed union that is meant to be matched.
    - Splitting an interface into one tiny interface per capability so no implementation ever has to refuse
      anything, which scatters the contract across many types.
  remedy: null
  counter: >
    The principle is rarely disputed, but the standard libraries break it on purpose. Java's unmodifiable
    lists throw on add, and .NET's read-only collections throw NotSupportedException, trading substitutability
    for a smaller set of interfaces. Optional operations documented in the contract are a deliberate choice,
    not a slip, though they shift checks to runtime. In duck-typed and structurally typed code there is no
    declared subtype, but the behavioural contract still applies. Martin's SOLID phrasing is about classes;
    the principle matters as much for interface implementations and for plugins, where a contract suite is the
    practical check.
  in:
    python: >
      Overrides raising NotImplementedError in a concrete subclass are the usual sign; abstract base classes
      and Protocols declare the surface but not the behaviour, so behavioural contracts need tests.
    typescript: >
      Structural typing means any object with the right shape is a subtype, so behavioural substitutability is
      unchecked; method parameter bivariance can also let an incompatible override type-check.
    java: >
      UnsupportedOperationException from collection views is the known standard-library exception; for your
      own interfaces, a shared abstract test class run against each implementation checks it.
    csharp: >
      NotSupportedException and NotImplementedException in overrides are the signs; ReadOnlyCollection
      implementing IList is the standard-library case.
    go: >
      Interfaces are satisfied implicitly, so any type with the methods is substitutable as far as the
      compiler knows; the behavioural contract lives in doc comments and in shared test functions such as
      fstest.TestFS.
    rust: >
      No inheritance, so it applies to trait implementations; trait docs state the contract (Eq must be
      reflexive, Hash must agree with Eq) and code relies on it without checking.
  related:
    - solid
    - refused-bequest
    - composition-over-inheritance
    - contract-test
    - principle-of-least-astonishment
  tell: >
    Python, Java, C# and TypeScript: an overriding method whose whole body raises NotImplementedError,
    UnsupportedOperationException, NotSupportedException or NotImplementedException, or throws a "not
    implemented" error, in a class that is not abstract.
  interview_only: false
  example:
    before: |
      class Settings:
          fn get(key) -> str: ...
          fn set(key, value): ...

      class EnvSettings extends Settings:        # read from the environment
          fn get(key): return env[key]
          fn set(key, value): raise NotSupported

      fn apply_defaults(s: Settings):
          if s.get("region") is None: s.set("region", "eu-west")   # blows up for EnvSettings
    after: |
      interface ReadableSettings:
          fn get(key) -> str or None
      interface WritableSettings extends ReadableSettings:
          fn set(key, value)

      class EnvSettings implements ReadableSettings: ...
      class FileSettings implements WritableSettings: ...

      fn apply_defaults(s: WritableSettings): ...
    note: The read-only source no longer claims a capability it lacks, so the type checker stops it reaching code
      that writes.
  sources:
    - cite: Barbara Liskov, Data Abstraction and Hierarchy, OOPSLA 1987 keynote
      url: https://dl.acm.org/doi/10.1145/62139.62141
      how: recalled
    - cite: Barbara Liskov and Jeannette Wing, A Behavioral Notion of Subtyping, ACM TOPLAS (1994)
      url: https://dl.acm.org/doi/10.1145/197320.197383
      how: recalled
    - cite: Robert C. Martin, Agile Software Development, Principles, Patterns, and Practices (2002)
      url: https://www.oreilly.com/library/view/agile-software-development/0135974445/
      how: recalled
  matters_most_for:
    - plugin-host
    - library-sdk
    - plugins-extensions
- id: interface-segregation-principle
  name: Interface Segregation Principle (ISP)
  family: principle
  group: design
  says: >
    No client should depend on methods it doesn't use. Shape interfaces around what each caller needs, so a
    change to one capability doesn't ripple into code that never touched it, and an implementation never has
    to fake the parts it can't do.
  names: >
    Robert C. Martin (1996), from consulting work where one large job interface forced every client to
    recompile. The I in SOLID.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Implementations that stub out half an interface with empty bodies or not-supported errors.
    - Test doubles that must implement a dozen methods to test code that calls one.
    - Functions that take a whole service or client but use one method of it.
  forces:
    - Several kinds of caller using different slices of one wide type.
    - Implementations that can't support every capability (read-only stores, partial backends).
    - Mocks and fakes that are tedious to write.
  overuse:
    - One single-method interface per call site, so the contract is scattered across dozens of types nobody can
      find.
    - Interfaces for types that have exactly one implementation and one caller.
  remedy: null
  counter: >
    In structurally typed and duck-typed languages a caller can depend on a narrow shape without anyone
    declaring it, so the principle costs nothing and needs no ceremony. In nominal languages, splitting
    interfaces adds names and wiring; a wide interface that every caller really uses whole is fine. The
    principle is about callers' needs, not interface size.
  in:
    python: >
      typing.Protocol lets the consumer declare just the methods it calls; prefer that to a wide abstract base
      class.
    typescript: >
      Structural types mean a parameter type can list only what the function uses, often with Pick from a
      larger type.
    java: >
      Role interfaces implemented together by one class are the usual answer; default methods can hide a wide
      interface's cost but not its coupling.
    csharp: >
      As in Java; IReadOnlyList and IReadOnlyDictionary are the standard library's own read-only slices.
    go: >
      Define the interface where it is used, with the one or two methods needed (io.Reader, io.Writer); the
      standard library is built this way.
  related:
    - solid
    - interface-bloat
    - liskov-substitution-principle
    - refused-bequest
    - mock-everything
  tell: null
  interview_only: false
  example:
    before: |
      interface Storage:
          fn read(key) -> bytes
          fn write(key, data)
          fn delete(key)
          fn list(prefix) -> [str]

      fn render_page(store: Storage, key):      # only ever reads
          return template(store.read(key))
    after: |
      interface Reader:
          fn read(key) -> bytes

      fn render_page(store: Reader, key):
          return template(store.read(key))
    note: >
      render_page can now be given a read-only cache or a two-line fake, and changes to write or delete
      never reach it.
  sources:
    - cite: Robert C. Martin, The Interface Segregation Principle, C++ Report (1996)
      url: https://web.archive.org/web/20060822033314/http://www.objectmentor.com/resources/articles/isp.pdf
      how: recalled
    - cite: Robert C. Martin, Agile Software Development, Principles, Patterns, and Practices (2002)
      url: https://www.oreilly.com/library/view/agile-software-development/0135974445/
      how: recalled
  matters_most_for:
    - library-sdk
    - plugin-host
- id: dependency-inversion-principle
  name: Dependency Inversion Principle (DIP)
  family: principle
  group: design
  says: >
    High-level policy should not depend on low-level details; both should depend on abstractions, and the
    abstraction belongs to the policy side. The business code says what it needs (a way to store an order),
    and the database code implements that.
  names: >
    Robert C. Martin, The Dependency Inversion Principle (1996). The D in SOLID. Not the same as dependency
    injection, which is one way to supply the implementation.
  applies_to:
    kinds: []
    languages: []
  contested: true
  looks_like:
    - Domain or service code that imports a database driver, HTTP client or SDK directly.
    - Interfaces defined next to their one implementation in the infrastructure layer, so the domain still
      imports the infrastructure package.
    - Tests of business rules that need a real database or network.
  forces:
    - Business rules that must outlive a framework, database or vendor.
    - Several implementations of one need (production, test, another vendor).
    - Slow or flaky tests caused by infrastructure in the middle of business logic.
  overuse:
    - An interface in front of every class, including ones with no second implementation and no test that
      needs one.
    - Abstractions over the standard library or the language runtime.
  remedy: null
  counter: >
    Every inverted dependency adds an interface and a place to wire it, and with one implementation and fakes
    available that cost often buys nothing. Many projects never swap their database, and modern test tooling
    can run real infrastructure cheaply. Apply it at the boundaries that matter (the domain against storage,
    messaging and vendors), not between every pair of classes.
  in:
    python: >
      A Protocol owned by the domain module, implemented in an adapters module, is enough; a DI framework is
      rarely needed.
    typescript: >
      Constructor or function parameters typed with an interface from the domain folder; watch the import
      direction rather than the presence of interfaces.
    java: >
      Spring wires implementations easily, which hides whether the interface lives on the right side; check
      which package owns it.
    csharp: >
      As in Java with the built-in container; an interface in the Infrastructure project used by Domain is the
      inversion done backwards.
    go: >
      Consumer-defined interfaces give this by default: the package that needs a store declares the
      interface, and the database package never knows.
  related:
    - solid
    - dependency-rule
    - ports-and-adapters
    - dependency-injection
    - infrastructure-ignorance
  tell: null
  interview_only: false
  example:
    before: |
      # orders/service.py
      import psycopg

      fn place_order(cart):
          order = price(cart)
          with psycopg.connect(DSN) as db:
              db.execute("insert into orders ...", order)
          return order
    after: |
      # orders/service.py
      interface OrderStore:
          fn add(order)

      fn place_order(cart, store: OrderStore):
          order = price(cart)
          store.add(order)
          return order

      # adapters/postgres.py implements OrderStore
    note: >
      The orders module no longer imports the driver; the Postgres code depends on the interface the orders
      module owns.
  sources:
    - cite: Robert C. Martin, The Dependency Inversion Principle, C++ Report (1996)
      url: https://web.archive.org/web/20060822033314/http://www.objectmentor.com/resources/articles/dip.pdf
      how: recalled
    - cite: Robert C. Martin, Agile Software Development, Principles, Patterns, and Practices (2002)
      url: https://www.oreilly.com/library/view/agile-software-development/0135974445/
      how: recalled
  matters_most_for:
    - web-api
    - fullstack-web
    - library-sdk
- id: tenant-isolation
  name: Tenant isolation
  family: principle
  group: security
  says: >
    In a system that serves several customers from shared code and storage, every query, cache key, file path,
    queue message and background job carries the tenant it belongs to, and the tenant comes from the verified
    identity, so one tenant's data can't reach another by any path.
  names: >
    No single coiner; "multi-tenancy" and "tenant isolation" are the established SaaS terms. The classic split
    into separate databases, separate schemas and shared tables with a tenant column is from Frederick Chong,
    Gianpaolo Carraro and Roger Wolter, "Multi-Tenant Data Architecture" (Microsoft, 2006). AWS's SaaS Lens
    names the silo, pool and bridge models; Azure's Architecture Center has a guide to multitenant
    architectures and the Noisy Neighbor antipattern. OWASP's Multi-Tenant Application Security Cheat Sheet
    covers it as a security concern. Per-user ownership checks are the narrower Broken Object Level
    Authorization.
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - web-api
    - fullstack-web
    - platforms
    - serverless
    - databases-storage
  looks_like:
    - A tenant (organisation, workspace, account, group) id column on most tables, and one place that adds it
      to every query, such as a scoped repository, an ORM global filter or database row-level security.
    - Tenant context set once per request from the authenticated identity, not read from a body field or
      header the client can change.
    - Cache keys, object storage prefixes and search index names that start with the tenant id.
    - Queue messages and scheduled jobs that carry the tenant id and rebuild the scoped context in the worker.
    - A named, greppable way to read across tenants (an unscoped or admin factory) used in few places.
    - A test suite that runs the same cross-tenant denial cases against each resource.
  forces:
    - More than one customer's data sits in the same database, bucket, cache or index.
    - Requests run through shared workers, connection pools or async tasks, where context can leak between
      them.
    - Work happens outside a request (jobs, webhooks, exports, emails) where the request's scoping no longer
      applies.
    - Customers or regulators expect a contractual promise that their data is separate.
  overuse:
    - Database or deployment per tenant for a product with a few hundred small tenants, which multiplies
      migrations and operations for isolation nobody asked for.
    - A tenant column and filter on truly global data (country lists, plan definitions), which makes shared
      data look private and forces copies.
    - Tenant checks hand-written in every handler on top of a data-layer filter that already enforces it, so
      the copies drift.
  remedy: null
  counter: >
    A single-tenant deployment (one customer per install, or a self-hosted tool) has no tenant boundary to
    defend, and adding one is cost without benefit. Separate databases or accounts per tenant give the
    strongest isolation and make per-row filtering moot, at the price of operations and cross-tenant
    reporting; the shared-table model is cheaper but makes one forgotten filter a breach, which is why OWASP
    and the cloud guides push enforcement down into the data layer (row-level security, global filters) rather
    than trusting each query. Isolation also has a performance side (noisy neighbours, per-tenant quotas) that
    security-led scoping alone doesn't cover.
  in:
    python: >
      SQLAlchemy's do_orm_execute event with with_loader_criteria adds a tenant filter to every ORM select,
      but not to raw text() SQL. Django has no built-in; a default manager filter is skipped by raw SQL, and
      schema-per-tenant on PostgreSQL is a common library-based route. Keep the tenant in a contextvars
      variable rather than a thread-local or module global so async tasks don't share it.
    typescript: >
      AsyncLocalStorage carries the tenant through a request; a Prisma client extension can add the tenant to
      every where clause. With PostgreSQL row-level security, set the tenant with set_config inside each
      transaction, since pooled connections otherwise keep the previous request's setting.
    java: >
      Hibernate 6 supports discriminator multitenancy with @TenantId, plus schema- and database-per-tenant
      through a connection provider. A ThreadLocal tenant holder doesn't follow work onto @Async or executor
      threads unless a TaskDecorator copies it.
    csharp: >
      EF Core global query filters (HasQueryFilter) scope every LINQ query to the tenant, and
      IgnoreQueryFilters() is the visible opt-out to review. SQL that bypasses the entity sets
      (Database.SqlQuery, ExecuteSql, or Dapper on the same connection) is not filtered.
    go: >
      No framework layer; pass the tenant id explicitly to store methods or in context.Context, and make the
      store refuse a call without one, so an unscoped query is not the easy path.
  related:
    - broken-object-level-authorization
    - defense-in-depth
    - secure-by-default
    - least-privilege
    - global-state
    - generic-repository
    - contract-test
  tell: null
  interview_only: false
  example:
    before: |
      fn upcoming_appointments(day: Date) -> list[Appointment]:
          key = "appointments:" + day.iso()
          cached = cache.get(key)
          if cached: return cached
          rows = db.query("SELECT * FROM appointments WHERE day = ?", [day])
          cache.set(key, rows)
          return rows

      fn send_reminders_job(appointment_ids: list[str]):
          for id in appointment_ids:
              notify(db.get("appointments", id))
    after: |
      fn upcoming_appointments(ctx: RequestContext, day: Date) -> list[Appointment]:
          key = "clinic:" + ctx.clinic_id + ":appointments:" + day.iso()
          cached = cache.get(key)
          if cached: return cached
          rows = tenant_db(ctx.clinic_id).query("SELECT * FROM appointments WHERE day = ?", [day])
          cache.set(key, rows)
          return rows

      fn send_reminders_job(clinic_id: str, appointment_ids: list[str]):
          db = tenant_db(clinic_id)      # every query is filtered by clinic
          for id in appointment_ids:
              notify(db.get("appointments", id))
    note: The clinic travels with the query, the cache key and the job, so neither a shared cache entry nor a
      queued id can hand one clinic's appointments to another.
  sources:
    - cite: OWASP Cheat Sheet Series, Multi-Tenant Application Security (CC BY-SA 4.0)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Multi_Tenant_Security_Cheat_Sheet.html
      how: read
    - cite: Frederick Chong, Gianpaolo Carraro and Roger Wolter, Multi-Tenant Data Architecture (Microsoft, 2006)
      url: null
      how: recalled
    - cite: AWS Well-Architected SaaS Lens, silo, pool and bridge isolation models
      url: https://docs.aws.amazon.com/wellarchitected/latest/saas-lens/saas-lens.html
      how: recalled
    - cite: Azure Architecture Center, Architect multitenant solutions on Azure
      url: https://learn.microsoft.com/en-us/azure/architecture/guide/multitenant/overview
