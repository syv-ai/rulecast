# rulecast lens catalog: methodologies. How a project's conventions are worked out. With the developer, the agent
# picks a primary methodology, which frames the project's surfaces and structure, and usually a secondary one for
# internal code. Rewritten after the 2026-10-13 field test (docs/evidence/2026-10-13-lens-field-test.md), where the
# first four were too coarse: nobody chose DDD-led or Refactoring to Patterns alone, three agents stretched "domain
# pattern language" to mean a framework's idiom, and two needed a contract-led framing that didn't exist.
#
# Before any methodology: state what the project already enforces (linter and formatter config, type-checker
# strictness, CI checks, and the suppressions in the code). Those are conventions already; the interview confirms
# them rather than rediscovering them.
- id: refactoring-to-patterns
  name: Refactoring to Patterns
  frames: >
    Never choose a pattern up front. Write the plain code, refactor away duplication and mixed responsibilities, and let a pattern in where its forces appear. Conventions read "when you see X, refactor toward Y".
  fits: >
    Most internal code. Evolving products, small teams, code without a strong framework idiom. The usual secondary methodology.
  signals: [no dominant framework, mixed styles across modules, patterns used inconsistently]
  asks:
    - Which duplications have already caused a bug or a missed update?
    - Where do changes keep landing in the same place for unrelated reasons?
  lenses_first: [dry, shotgun-surgery, divergent-change, speculative-generality, yagni, switch-statements]
  pairs_with: [quality-attributes, contract-led, framework-idiom]
  sources: [{ cite: "Kerievsky, Refactoring to Patterns (2004)", how: recalled }]
- id: framework-idiom
  name: Framework idiom
  frames: >
    The framework's documented idiom is the pattern language (Spring MVC, Django, Rails, ASP.NET Core, FastAPI's dependencies and routers, Bubble Tea's Elm Architecture, React's components and hooks). Each place the code departs from the idiom is a decision to record, either a convention to restore the idiom or a stated exception.
  fits: >
    Projects built on a framework with a strong, well-documented idiom. Replaces the earlier "domain pattern language", which named UI and distributed idioms but not frameworks.
  signals: [a framework owns the entry points, the code mostly follows its tutorial structure, departures cluster in a few modules]
  asks:
    - Which framework conventions do you follow on purpose, and which have you left?
    - Where the code is inconsistent with itself (some routes use the repository layer, some don't), which way is right?
    - Where have you built your own version of something the framework already provides?
  lenses_first: [front-controller, fat-controller, active-record, repository, service-layer, data-transfer-object]
  stances_first: [kept-for-what-it-does, reasons-not-precedent]
  pairs_with: [refactoring-to-patterns, exemplar, migration-in-progress]
  sources: [{ cite: "rulecast field test, 2026-10-13", how: developer }]
- id: quality-attributes
  name: Led by quality attributes
  frames: >
    Start from the non-functional requirements that matter most (latency budgets, resource limits, consistency, availability, security and tenant isolation, operability, determinism), and let them set the constraints and patterns. Conventions protect the attributes.
  fits: >
    Systems whose hardest problems are technical, not domain: tooling with time budgets, infrastructure, data pipelines, embedded, high-throughput services, and multi-tenant or security-sensitive services where one leak outweighs any feature.
  signals: [measured budgets or SLOs in docs or tests, performance or determinism tests, fail-open or fail-closed handling, a tenant or organisation id threaded through queries, a threat model or security review in the docs]
  asks:
    - Which one or two qualities would you trade others for?
    - Which of them is measured today, and where?
    - What must never leak between users or tenants, and what enforces that today: the code, the database, or review?
    - Could the code hit the number you measure while the quality itself gets worse?
  lenses_first: [premature-optimization, amdahls-law, fail-open-vs-fail-closed, fallacies-of-distributed-computing, cap-theorem, secure-by-default, least-privilege, defense-in-depth, tenant-isolation]
  stances_first: [numbers-are-signals, start-from-failure]
  pairs_with: [refactoring-to-patterns, contract-led]
  sources: [{ cite: "Bass, Clements & Kazman, Software Architecture in Practice (quality attribute scenarios)", how: recalled }, { cite: "rulecast field test, round three, 2026-10-13", how: developer }]
- id: contract-led
  name: Contract-led
  frames: >
    List every surface outsiders depend on (the public API, a plugin or wire protocol, CLI output and exit codes, config schema, file formats, error text) and make conventions strict and reviewed there. Compatibility is the leading quality. Internal code follows a secondary methodology.
  fits: >
    Libraries and SDKs, plugin hosts, CLIs that scripts call, anything with a published API or protocol.
  signals: [a public API or exported types, a plugin or extension interface, a changelog with breaking-change entries, snapshot tests of output]
  asks:
    - Which of these surfaces do you promise to keep stable, and which are internal even if visible?
    - How do you deprecate, and how long do you keep the old form?
  lenses_first: [hyrums-law, breaking-change-surface, semantic-versioning-discipline, deprecation-policy, tolerant-reader, postels-law, golden-master-test, contract-test]
  pairs_with: [refactoring-to-patterns, quality-attributes, decision-led]
  sources: [{ cite: "rulecast field test, 2026-10-13", how: developer }]
- id: ddd-led
  name: DDD-led
  frames: >
    Split the domain into core, supporting and generic subdomains. Rigour and rich modelling go where the business is complex and differentiating (the core); plain CRUD, transaction scripts and bought-in solutions are right elsewhere. Conventions differ by subdomain.
  fits: >
    Business software with complex, changing rules and a domain worth modelling.
  signals: [business rules spread across services or helpers, the same concept named differently in different places, a domain expert in the team]
  asks:
    - Which part of the system is what makes the business different?
    - Where are the rules that change most often, and who decides them?
    - Do the boundaries you'd draw between subdomains match who owns the code today?
  lenses_first: [core-subdomain, bounded-context, ubiquitous-language, aggregate, value-object, anemic-domain-model, drifting-terminology]
  stances_first: [ownership-before-boundaries]
  pairs_with: [refactoring-to-patterns, framework-idiom]
  sources: [{ cite: "Evans, Domain-Driven Design Reference (2015)", url: "https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf", how: read }]
- id: exemplar
  name: Exemplar code
  frames: >
    The code is copied by others, such as a template, a reference application or a teaching sample. Conventions optimise for the reader who copies: consistency over local cleverness, the canonical layer shown even where YAGNI says skip it, and every pattern used everywhere or nowhere. Resolve the code's inconsistencies with itself before forks inherit them.
  fits: >
    Starter templates, reference architectures, samples, internal golden paths. Usually a modifier on framework idiom or DDD-led.
  signals: [README presents it as a template or reference, many forks, the same concern done two ways]
  asks:
    - Who copies this, and what should they copy?
    - Where it does one thing two ways, which is the one to teach?
    - Which patterns are here because the people copying this will need them, and which only because templates usually have them?
  lenses_first: [principle-of-least-astonishment, drifting-terminology, dogma-over-pragma, cargo-cult-programming]
  stances_first: [reasons-not-precedent]
  pairs_with: [framework-idiom, ddd-led]
  sources: [{ cite: "rulecast field test, 2026-10-13", how: developer }]
- id: decision-led
  name: Decision-led
  frames: >
    The project has already written down its decisions, as architecture decision records, a numbered spec or design notes, and each one argues its options and what it gave up. Start from those: every recorded decision that the code can break is a candidate convention, and its own rejected options are the counter-view. The interview checks which decisions still hold, which were superseded, and where the code has drifted from them.
  fits: >
    Projects with a maintained decision log or spec. Usually primary for the parts the decisions cover, with another methodology for code they don't reach.
  signals: [a docs/adr, docs/decisions or numbered spec folder, decisions marked accepted or superseded, code comments that cite a decision number]
  asks:
    - Which recorded decisions still hold, and which were quietly abandoned?
    - Where the code disagrees with a decision, is the decision or the code wrong?
    - Which recorded decisions rest mainly on what another project did, rather than on this project's own needs?
  lenses_first: [dogma-over-pragma, lehmans-laws]
  stances_first: [check-the-draft-against-the-code, ask-the-history-first, reasons-not-precedent]
  pairs_with: [contract-led, quality-attributes, migration-in-progress]
  sources:
    - { cite: "Michael Nygard, Documenting Architecture Decisions (2011)", url: "https://www.cognitect.com/blog/2011/11/15/documenting-architecture-decisions", how: recalled }
    - { cite: "rulecast field test, round three, 2026-10-13", how: developer }
- id: migration-in-progress
  name: Migration in progress
  frames: >
    The project is halfway through a move from one architecture, framework or style to another, often one written down as the house architecture. Two kinds of code coexist, and both are "how it's done here". Conventions say which side is the target, that new code goes there, how the old side may still be touched, and when the old way gets deleted. Never infer the convention from whichever side has more code.
  fits: >
    Codebases mid-rewrite, mid-upgrade or mid-restructure: a new layer beside an old one, two state libraries, two API versions, legacy and new folders. A modifier on whichever methodology fits the target.
  signals: [legacy, old, v1 or deprecated folders beside new ones, the same concern done two ways split by age in git history, a migration plan or house-architecture document, compatibility shims]
  asks:
    - Which side is the target, and is the move still active or stalled?
    - May the old side get new features, only fixes, or nothing?
    - What has to be true before the old way is deleted?
    - Is the old side kept because it still earns its place, or because of what it cost to build?
  lenses_first: [strangler-fig, anti-corruption-layer, deprecation-policy, lava-flow, drifting-terminology]
  stances_first: [kept-for-what-it-does, frozen-code-gets-its-own-rule]
  pairs_with: [framework-idiom, decision-led, refactoring-to-patterns]
  sources:
    - { cite: "Martin Fowler, StranglerFigApplication (bliki)", url: "https://martinfowler.com/bliki/StranglerFigApplication.html", how: recalled }
    - { cite: "Danilo Sato, ParallelChange (bliki)", url: "https://martinfowler.com/bliki/ParallelChange.html", how: recalled }
    - { cite: "rulecast field test, round three, 2026-10-13", how: developer }
