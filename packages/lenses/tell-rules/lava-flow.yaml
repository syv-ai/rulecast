# Tell for the lens `lava-flow`. Verdict: keep. 13 of 13 sampled hits real (13 hits in all).
# Detectors: ast-grep, regex; each rule's description says why.
# Measured on a 12-repository corpus, 2026-10-14. Evidence: ../tells-tested.yaml and
# docs/evidence/2026-10-13-tells-on-a-corpus.md.
exclude: (^|/)(node_modules|vendor|third_party|dist|build|playground_editor|syntax-tests|benchmarks|testdata|fixtures|snapshots)/|\.min\.(js|css)$|\.d\.ts$|(^|/)front-end/js/highlight\.js$
repos:
  - repo: local
    rules:
      - id: lens/lava-flow-py
        name: Commented-out code block
        files: \.py$
        exclude: (^|/)([Gg]enerated|[Mm]igrations|alembic)/|\.(gen|generated)\.\w+$|\.Designer\.cs$
        severity: warning
        detect:
          ast-grep:
            language: python
            utils:
              code-comment:
                kind: comment
                regex: "^# ?(?:(?:if|elif|while|for|with|def|class)\\s[^\\n]*:\\s*$|(?:else|try|finally):\\s*$|except\\b[^\\n]*:\\s*$|(?:return|raise|yield|await|assert|del)\\s+[\\w.\\[\\]()\"\\']+|(?:from\\s+[\\w.]+\\s+)?import\\s+\\w[\\w., ]*$|print\\(|pass\\s*$|continue\\s*$|break\\s*$|[\\w.]+(?:\\[[^\\]\\n]+\\])*(?:,\\s*\\w+)*\\s*(?:=|\\+=|-=)\\s*\\S|[\\w.]+: [\\w.\\[\\]|]+(?: = \\S[^\\n]*)?$|[\\w.]+\\([^\\n]*\\)\\s*$)"
              code-cont:
                kind: comment
                regex: "^#\\s+(?:(?:if|elif|while|for|with|def|class)\\s[^\\n]*:\\s*$|(?:else|try|finally):\\s*$|except\\b[^\\n]*:\\s*$|(?:return|raise|yield|await|assert|del)\\s+[\\w.\\[\\]()\"\\']+|(?:from\\s+[\\w.]+\\s+)?import\\s+\\w[\\w., ]*$|print\\(|pass\\s*$|continue\\s*$|break\\s*$|[\\w.]+(?:\\[[^\\]\\n]+\\])*(?:,\\s*\\w+)*\\s*(?:=|\\+=|-=)\\s*\\S|[\\w.]+: [\\w.\\[\\]|]+(?: = \\S[^\\n]*)?$|[\\w.]+\\([^\\n]*\\)\\s*$)"
              intro-comment:
                kind: comment
                regex: ^#.*(?::\s*$|[Ee]xample|[Uu]ncomment)
            rule:
              matches: code-comment
              precedes:
                matches: code-cont
              not:
                follows:
                  any:
                    - matches: code-cont
                    - matches: intro-comment
        message: "{{file}}:{{line}} starts a block of commented-out code. Delete it; version control keeps the history."
        description: "First run used linter ruff ERA001 (the lint rule for commented-out code): 40 hits, 16 real (40%); it flags single lines and comment-drawn data shapes, codegen markers and opt-in template lines. Revised once to ast-grep, which can express the tell: the first of two or more adjacent statement-shaped # comments, not after an intro ending in ':' or mentioning example/uncomment."
        examples:
          good:
            - path: app/tax.py
              code: |
                def tax_for(invoice):
                    # rates come from the country table
                    # and are cached per request
                    return tax_v3(invoice)
            - path: app/db.py
              code: |
                def init_db(session):
                    # Uncomment to create tables without Alembic:
                    # from sqlmodel import SQLModel
                    # SQLModel.metadata.create_all(engine)
                    pass
          bad:
            - path: app/tax.py
              code: |
                def tax_for(invoice):
                    # rate = lookup_rate_from_api(invoice.country)
                    # return invoice.net * rate
                    return tax_v3(invoice)
            - path: app/run.py
              code: |
                def main():
                    # import pdb
                    # pdb.set_trace()
                    run()
      - id: lens/lava-flow-ts
        name: Commented-out code block
        files: \.(ts|tsx|mts|cts)$
        exclude: (^|/)([Gg]enerated|[Mm]igrations|alembic)/|\.(gen|generated)\.\w+$|\.Designer\.cs$
        severity: warning
        detect:
          ast-grep:
            language: tsx
            utils:
              code-comment:
                kind: comment
                regex: ^// ?(?:[A-Za-z_$}\[][^\n]*[;{}]\s*$|(?:if|for|while|switch|return|const|let|var|import|export|await|throw|try|catch|else|new)\b[^\n]*[(){};=]|[\w.$\[\]]+(?:,\s*\w+)*\s*(?:=|\+=|-=)\s*\S|[\w.$]+\([^\n]*\)\s*;?\s*$)
              intro-comment:
                kind: comment
                regex: ^//.*(?::\s*$|[Ee]xample|[Uu]ncomment)
            rule:
              matches: code-comment
              precedes:
                matches: code-comment
              not:
                follows:
                  any:
                    - matches: code-comment
                    - matches: intro-comment
        message: "{{file}}:{{line}} starts a block of commented-out code. Delete it; version control keeps the history."
        description: "no oxlint or core eslint rule finds commented-out code; ast-grep on comment nodes: the first of two or more adjacent statement-shaped // comments, not after an intro comment ending in ':' or mentioning example/uncomment. Adjacency is sibling order, so a blank line between comments does not break a block."
        examples:
          good:
            - path: src/tax.ts
              code: |
                // rates come from the country table
                // and are cached per request
                export function taxFor(invoice) { return taxV3(invoice); }
            - path: src/tax.ts
              code: |
                // For example:
                // const t = taxFor(invoice);
                // console.log(t);
                export function taxFor(invoice) { return taxV3(invoice); }
          bad:
            - path: src/tax.ts
              code: |
                export function taxFor(invoice) {
                  // const rate = lookupRate(invoice.country);
                  // return invoice.net * rate;
                  return taxV3(invoice);
                }
            - path: src/run.ts
              code: |
                function main() {
                  // debugger();
                  // if (x) { reset(); }
                  run();
                }
