        description: "no oxlint or core eslint rule finds commented-out code; ast-grep on comment nodes: the first of two or more adjacent statement-shaped // comments, not after an intro comment ending in ':' or mentioning example/uncomment. Adjacency is sibling order, so a blank line between comments does not break a block."
