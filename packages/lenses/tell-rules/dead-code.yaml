      - id: lens/dead-code-cs
        name: Unreachable code or literal-false branch
        files: \.cs$
        exclude: (^|/)tests?/|\.Tests?/|Tests?\.cs$|(^|/)([Gg]enerated|[Mm]igrations|alembic)/|\.(gen|generated)\.\w+$|\.Designer\.cs$
