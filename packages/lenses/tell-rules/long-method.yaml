# Tell for the lens `long-method`. Verdict: keep. 11 of 15 sampled hits real (45 hits in all).
# Detectors: ast-grep; each rule's description says why.
# Measured on a 12-repository corpus, 2026-10-14. Evidence: ../tells-tested.yaml and
# docs/evidence/2026-10-13-tells-on-a-corpus.md.
exclude: (^|/)(vendor|node_modules|dist|syntax-tests|benchmarks|fixtures|testdata|__snapshots__|playground_editor)/|/front-end/js/highlight\.js$|\.min\.js$|\.d\.ts$
max_matches_per_rule: 100000
repos:
  - repo: local
    rules:
      - id: lens/long-method-py
        name: long-method (Python)
        files: \.py$
        exclude: (^|/)alembic/versions/|(^|/)migrations/\d{4}_[^/]*\.py$|(^|/)(tests?|testing)/|(^|/)test_[^/]*\.py$|_test\.py$|(^|/)conftest\.py$
        scope: container
        severity: warning
        detect:
          ast-grep:
            language: python
            rule:
              kind: function_definition
              regex: ^(?:[^\n]*\n){60}
        message: "{{file}}:{{line}} starts a function over 60 lines long. Split it by meaning, one well-named helper per phase, not by line count."
        examples:
          good:
            - path: app/services/g0.py
              code: |
                def import_statement(path, account):
                    parsed = parse_rows(read_csv(path))
                    new = without_known(parsed, account.transaction_keys())
                    account.add_all(new)
                    return len(new)
