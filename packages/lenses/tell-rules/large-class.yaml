      - id: lens/large-class-cs
        name: large-class (C#)
        files: \.cs$
        exclude: (^|/)tests?/|Tests?\.cs$|\.Tests?/|(^|/)Migrations/|\.Designer\.cs$|\.g\.cs$|\.g\.i\.cs$|(^|/)Generated/
        scope: container
        severity: warning
        detect:
          regex:
            pattern: ^(?<ind>[ \t]*)(?:(?:public|private|protected|internal|static|sealed|abstract|partial|file)[ \t]+)*(?:class|record|struct)[ \t]+\w+[^;{]*(?:\{|\n\k<ind>\{)[ \t]*\n(?:(?:\k<ind>[ \t][^\n]*)?\n){500}
            flags: m
        message: "{{file}}:{{line}} declares a class over 500 lines long. Find the groups of members that change for different reasons and extract each into its own class."
        examples:
          good:
            - path: src/App/G0.cs
              code: |
