# Tell for the lens `large-class`. Verdict: keep. 5 of 5 sampled hits real (5 hits in all).
# Detectors: ast-grep, regex; each rule's description says why.
# Measured on a 12-repository corpus, 2026-10-14. Evidence: ../tells-tested.yaml and
# docs/evidence/2026-10-13-tells-on-a-corpus.md.
exclude: (^|/)(vendor|node_modules|dist|syntax-tests|benchmarks|fixtures|testdata|__snapshots__|playground_editor)/|/front-end/js/highlight\.js$|\.min\.js$|\.d\.ts$
max_matches_per_rule: 100000
repos:
  - repo: local
    rules:
      - id: lens/large-class-py
        name: large-class (Python)
        files: \.py$
        exclude: (^|/)alembic/versions/|(^|/)migrations/\d{4}_[^/]*\.py$|(^|/)(tests?|testing)/|(^|/)test_[^/]*\.py$|_test\.py$|(^|/)conftest\.py$|_pb2\.py$|(^|/)generated/
        scope: container
        severity: warning
        detect:
          ast-grep:
            language: python
            rule:
              kind: class_definition
              regex: ^(?:[^\n]*\n){500}
        message: "{{file}}:{{line}} starts a class over 500 lines long. Find the groups of methods that change for different reasons and extract each into its own class."
        examples:
          good:
            - path: app/services/g0.py
