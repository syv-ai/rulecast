# Tell for the lens `hard-coded-secrets`. Verdict: keep. 1 of 1 sampled hits real (1 hit in all, outside test fixtures; 26
# with them). Detectors: linter (gitleaks); the rule's description says why.
# Measured on a 12-repository corpus, 2026-10-14. Evidence: ../tells-tested.yaml and
# docs/evidence/2026-10-13-tells-on-a-corpus.md.
exclude: (^|/)(vendor|node_modules|syntax-tests|benchmarks|fixtures|testdata|snapshots)/|\.min\.js$|\.d\.ts$
repos:
  - repo: local
    rules:
      - id: lens/hard-coded-secrets-gitleaks
        name: Hard-coded secrets (gitleaks)
        files: .*
        detect:
          linter:
            tool: gitleaks
        message: "{{file}}:{{line}} {{ruleId}}: {{message}}"
        exclude: (^|/)(tests?|testing|__tests__|spec|fixtures|testdata)/|(^|/)test_[^/]*$|_test\.[a-z]+$|\.(test|spec)\.[a-z]+$
        description: "gitleaks, through the linter detector: an established, entropy-aware secrets scanner. The regex and ast-grep rules it replaces had 0 of 1 hits real."
