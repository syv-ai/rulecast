# Tell for the lens `copy-and-paste-programming`. Verdict: keep. 34 of 37 sampled hits real (37 hits in all).
# Detectors: regex; each rule's description says why.
# Measured on a 12-repository corpus, 2026-10-14. Evidence: ../tells-tested.yaml and
# docs/evidence/2026-10-13-tells-on-a-corpus.md.
exclude: (^|/)(node_modules|vendor|third_party|dist|build|playground_editor|syntax-tests|benchmarks|testdata|fixtures|snapshots)/|\.min\.(js|css)$|\.d\.ts$|(^|/)front-end/js/highlight\.js$
repos:
  - repo: local
    rules:
      - id: lens/copy-and-paste-programming-py
        name: Pasted block repeated in one file
        files: \.py$
        exclude: (^|/)(tests?|testing)/|(^|/)(test_[^/]*|[^/]*_test|conftest)\.py$|(^|/)([Gg]enerated|[Mm]igrations|alembic)/|\.(gen|generated)\.\w+$|\.Designer\.cs$
        severity: warning
        detect:
          regex:
            pattern: ^(?<!(?:DO NOT EDIT|[Aa]uto-?generated|[Aa]utomatically generated|@generated|Code generated|GENERATED FILE)[\s\S]*)(?=[ \t]*(?!(?:async[ \t]+)?def[ \t]|function[ \t]|func[ \t]|fn[ \t]|pub[ \t]|export[ \t]|public[ \t]|private[ \t]|protected[ \t]|internal[ \t]|static[ \t]|@|#|//|/\*|\*|\)|\]|\}|<|/>)\S[^\n]{8,}[^,(\[{\s][ \t]*\n(?:[^\n]*\n){0,3}[ \t]*(?!(?:async[ \t]+)?def[ \t]|function[ \t]|func[ \t]|fn[ \t]|pub[ \t]|export[ \t]|public[ \t]|private[ \t]|protected[ \t]|internal[ \t]|static[ \t]|@|#|//|/\*|\*|\)|\]|\}|<|/>)\S[^\n]{8,}[^,(\[{\s][ \t]*\n|[^\n]*\n[ \t]*(?!(?:async[ \t]+)?def[ \t]|function[ \t]|func[ \t]|fn[ \t]|pub[ \t]|export[ \t]|public[ \t]|private[ \t]|protected[ \t]|internal[ \t]|static[ \t]|@|#|//|/\*|\*|\)|\]|\}|<|/>)\S[^\n]{8,}[^,(\[{\s][ \t]*\n(?:[^\n]*\n){0,2}[ \t]*(?!(?:async[ \t]+)?def[ \t]|function[ \t]|func[ \t]|fn[ \t]|pub[ \t]|export[ \t]|public[ \t]|private[ \t]|protected[ \t]|internal[ \t]|static[ \t]|@|#|//|/\*|\*|\)|\]|\}|<|/>)\S[^\n]{8,}[^,(\[{\s][ \t]*\n|[^\n]*\n[^\n]*\n[ \t]*(?!(?:async[ \t]+)?def[ \t]|function[ \t]|func[ \t]|fn[ \t]|pub[ \t]|export[ \t]|public[ \t]|private[ \t]|protected[ \t]|internal[ \t]|static[ \t]|@|#|//|/\*|\*|\)|\]|\}|<|/>)\S[^\n]{8,}[^,(\[{\s][ \t]*\n(?:[^\n]*\n)?[ \t]*(?!(?:async[ \t]+)?def[ \t]|function[ \t]|func[ \t]|fn[ \t]|pub[ \t]|export[ \t]|public[ \t]|private[ \t]|protected[ \t]|internal[ \t]|static[ \t]|@|#|//|/\*|\*|\)|\]|\}|<|/>)\S[^\n]{8,}[^,(\[{\s][ \t]*\n|[^\n]*\n[^\n]*\n[^\n]*\n[ \t]*(?!(?:async[ \t]+)?def[ \t]|function[ \t]|func[ \t]|fn[ \t]|pub[ \t]|export[ \t]|public[ \t]|private[ \t]|protected[ \t]|internal[ \t]|static[ \t]|@|#|//|/\*|\*|\)|\]|\}|<|/>)\S[^\n]{8,}[^,(\[{\s][ \t]*\n[ \t]*(?!(?:async[ \t]+)?def[ \t]|function[ \t]|func[ \t]|fn[ \t]|pub[ \t]|export[ \t]|public[ \t]|private[ \t]|protected[ \t]|internal[ \t]|static[ \t]|@|#|//|/\*|\*|\)|\]|\}|<|/>)\S[^\n]{8,}[^,(\[{\s][ \t]*\n)(?<blk>(?:[ \t]*\S[^\n]{9,}\n){5})[\s\S]*?^\k<blk>
            flags: m
        message: "{{file}}:{{line}} starts a block of five or more lines repeated later in this file. Extract the shared logic and call it from both places."
        description: "regex: duplication is textual and no installed linter detects it (jscpd/PMD CPD not installed). Five identical lines of 10+ chars repeated in the file; at least two of the five must be statement-shaped: in brace languages a line ending in ; or { that is not a signature, closing line or type member; in Python and Go a line not ending in , ( [ and not a def/func/decorator/comment line, which drops parameter lists, signatures and declarative literals. Generated headers and paths, migrations and tests are left out."
        examples:
          good:
            - path: app/x.py
              code: |
                def a(x):
                    y = x + 1
                    return y
            - path: app/x.py
              code: |
                def get_one(
                    session: Session,
                    user_id: int,
                    limit: int = 100,
                    offset: int = 0,
                    order: str = "asc",
                ):
                    return session.get(user_id)

                def get_two(
                    session: Session,
                    user_id: int,
                    limit: int = 100,
                    offset: int = 0,
                    order: str = "asc",
                ):
                    return session.find(user_id)
          bad:
            - path: app/x.py
              code: |
                def room(b):
                    net = b.nights * b.rate
                    vat = net * 0.25 if b.country == "DK" else net * 0.2
                    total = net + vat
                    log.info("total %s", total)
                    return round(total, 2)

                def extras(b):
                    net = b.nights * b.rate
                    vat = net * 0.25 if b.country == "DK" else net * 0.2
                    total = net + vat
                    log.info("total %s", total)
                    return round(total, 2)
            - path: app/x.py
              code: |
                def room2(b):
                    net = b.nights * b.rate
                    vat = net * 0.25 if b.country == "DK" else net * 0.2
                    total = net + vat
                    log.info("total %s", total)
                    return round(total, 2)

                def extras(b):
                    net = b.nights * b.rate
                    vat = net * 0.25 if b.country == "DK" else net * 0.2
                    total = net + vat
                    log.info("total %s", total)
                    return round(total, 2)
