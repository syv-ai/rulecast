- id: tests-by-what-escaped
  stance: >
    Ask about the bugs that got past the tests, not about coverage. Where recent bugs escaped, and whether
    tests fail when the code is broken, decides which test conventions matter. If the team writes few tests,
    find out why (no time, code that is hard to test, a painful setup) before proposing a rule.
  ask: When a bug last reached users, was there a test that should have caught it, and why didn't it?
  but: >
    No suite catches everything; some bugs only show under real load, data or users, and that's what
    monitoring and staged rollouts are for. Prototypes, spikes and one-off scripts often don't earn tests at
    all.
  grounded_in:
    - Production Bugs
    - Buggy Tests
    - Developers Not Writing Tests
  lenses:
    - assertion-free-test
    - obscure-test
    - conditional-test-logic
    - frequent-debugging
    - manual-intervention
    - slow-tests
    - erratic-test
    - hard-to-test-code
  method: false
  sources:
    - cite: Meszaros, xUnit Test Patterns, Production Bugs
      url: http://xunitpatterns.com/Production%20Bugs.html
      how: read
    - cite: Meszaros, xUnit Test Patterns, Buggy Tests
      url: http://xunitpatterns.com/Buggy%20Tests.html
      how: read
    - cite: Meszaros, xUnit Test Patterns, Developers Not Writing Tests
      url: http://xunitpatterns.com/Developers%20Not%20Writing%20Tests.html
      how: read
- id: tests-by-what-they-cost
  stance: >
    Ask which tests break when nothing they cover changed. A suite that needs fixing after every small change
    points to over-mocking, tests tied to implementation detail, and copied setup, and the conventions worth
    proposing are the ones that cut that cost.
  ask: Which tests do you end up fixing when you change something they shouldn't care about?
  but: >
    Some test churn is the honest cost of changing behaviour, and a suite that never needs touching may not
    check much. Weigh the upkeep against the bugs the tests catch before proposing to loosen or delete them.
  grounded_in:
    - High Test Maintenance Cost
  lenses:
    - fake-over-mock
    - mock-everything
    - fragile-test
    - obscure-test
    - test-code-duplication
    - test-data-builder
  method: false
  sources:
