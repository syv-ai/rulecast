- id: numbers-are-signals
  stance: >
    When a convention would be enforced through a number (coverage, complexity, line or file length, a lint
    count), ask what the number stands for and how code could meet it without meeting the goal. An agent
    working in a loop will satisfy the letter of a rule, so name the cheap way to pass it before it becomes
    one.
  ask: If a coverage floor is the rule, what would stop tests that run the code without checking anything?
  but: >
    A rough number is still better than none for something that matters, and some targets are hard to game and
    close to the goal, such as a latency budget measured in a test. Don't let the risk of gaming become a
    reason to measure nothing.
  grounded_in:
    - Goodhart's law
    - Gilb's law
    - Cobra effect
  lenses:
    - dogma-over-pragma
    - assertion-free-test
    - testing-pyramid
  method: false
  sources:
