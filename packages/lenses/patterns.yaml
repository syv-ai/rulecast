- id: composite
  name: Composite
  family: pattern
  group: structural
  says: Leaves and containers share one interface, so code can treat a whole tree the same way it treats a
    single item.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A base type with both leaf classes and container classes, where containers hold a list of children of
      the base type.
    - Container methods that loop over children and combine their results through the shared interface.
  forces:
    - The domain is genuinely a tree (nested UI elements, file systems, expression trees, orders containing
      boxes of items).
    - Client code checks whether something is a single item or a group before acting on it, in several places.
    - Operations such as totals, rendering or validation have to recurse through arbitrary nesting.
  overuse:
    - Forcing a flat list or a fixed two-level structure into a tree hierarchy.
    - A shared interface so general that leaves must implement child-management methods that make no sense for
      them.
  remedy: null
  counter: >
    Only worth it when the model really is a tree. A uniform interface over very different classes can become
    vague, and putting add or remove methods on leaves trades type safety for uniformity (the GoF book itself
    discusses this transparency versus safety trade-off). Plain nested data with a recursive function is often
    simpler.
  in:
    python: >
      Often nested lists or dicts plus one recursive function do the job without classes. When classes are
      used, containers commonly implement __iter__ so ordinary loops and comprehensions traverse children.
      Structural pattern matching can handle leaf and container cases in one function.
    typescript: "Common in TypeScript for UI component trees and graph-like data. Trees are often modelled as
      plain data with a recursive type or a discriminated union (leaf vs. group) walked by recursive
      functions, rather than as a class hierarchy with shared methods. Spotting it: A tree of objects sharing
      one interface or base class, where container nodes pass calls down to their children through that
      interface."
    java: "Common for UI hierarchies and tree or graph structures. Swing's Container/Component and JSF's
      UIComponent children are standard examples. Modern Java can model the node types as a sealed interface
      with records, and code can walk them with pattern-matching switch rather than putting every operation on
      the node classes. Spotting it: Classes in one hierarchy where a container type holds a collection of the
      base type and delegates operations to its children through the shared interface."
    csharp: "Shows up in C# mainly in UI control trees (WinForms Controls, WPF visual and logical trees) and graph
      or tree-processing code such as Roslyn syntax trees and expression trees. LINQ over a recursive child
      collection often removes the need for elaborate traversal methods on every node. Spotting it: Classes
      sharing a base class or interface where container nodes hold a collection of children of that same type
      and implement operations by looping over the children and calling the same method."
    go: "Natural in Go. One interface is satisfied by both leaf and container structs, and the container keeps a
      slice of that interface and recurses. The AST in go/ast, where statement and expression nodes hold
      slices of other nodes, is the standard-library example. Without inheritance there is no shared base for
      child management, so the add and remove methods usually live only on the container type. Spotting it: A
      struct with a slice of the same interface it implements, whose methods loop over the children and call
      the same method on each."
    rust: "Two shapes. One is a trait implemented by leaf and container, where the container holds `Vec<Box<dyn
      Component>>`. The other, usually more idiomatic when the node kinds are fixed, is a recursive enum
      (`enum Node { Leaf(..), Branch(Vec<Node>) }`) with operations written as `match`. Trees that need parent
      links or sharing run into ownership and turn to `Rc`/`Weak` or arena indices, so most code keeps trees
      strictly owned top-down. Spotting it: A struct holding `Vec<Box<dyn SameTrait>>` that implements that
      trait by iterating over its children, or a recursive enum with a variant containing `Vec<Self>` or
      `Box<Self>`."
    cpp: "Common in C++ for UI widget trees, scene graphs and graph-processing code. Parents typically own
      children through a vector of unique_ptr, and any back pointer to a parent is a plain non-owning pointer,
      avoiding shared_ptr cycles. Where the set of node kinds is closed, a std::variant tree is an alternative
      to the class hierarchy. Spotting it: Node classes sharing one abstract base, with a container node that
      holds a collection of base pointers and forwards operations to each child."
  related:
    - decorator
    - iterator
    - visitor
    - builder
    - flyweight
    - chain-of-responsibility
    - prototype
