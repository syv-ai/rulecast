      how: recalled
  example:
    before: |
      class ProductSearch:
          fn init(text, category=None, min_price=None, max_price=None,
                  in_stock_only=False, sort="relevance", page=1,
                  page_size=20, facets=None, highlight=False): ...

      # callers pass positional flags nobody can read, and nothing
      # rejects min_price > max_price until the search engine does
      q = ProductSearch("kettle", None, 20, 10, True, "price", 1, 50, None, True)
    after: |
      class ProductSearchBuilder:
          fn init(text):
              self.text = text
              self.filters = {}
          fn price_between(lo, hi) -> ProductSearchBuilder:
              if lo > hi: raise InvalidQuery("price range is reversed")
              self.filters["price"] = (lo, hi)
              return self                    # returning the builder lets calls chain
          fn in_stock() -> ProductSearchBuilder: ...
          fn sort_by(field) -> ProductSearchBuilder: ...
          fn build() -> ProductSearch: ...   # final checks, then an immutable query

      q = ProductSearchBuilder("kettle").price_between(10, 20).in_stock().sort_by("price").build()
    note: Each option gets a named, validated step, and the query only exists once it is complete; with keyword
      arguments and no validation, a plain constructor would do.
  matters_most_for:
    - library-sdk
    - compilers-tooling
- id: factory-method
  name: Factory Method
  family: pattern
  group: creational
  says: A base class calls an overridable creation method, so subclasses decide which concrete class gets built.
    Also called a virtual constructor.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A method that creates and returns an object, declared to return an interface or base class while
      subclasses return concrete types.
    - A framework base class that calls a create hook which users override to supply their own component.
  forces:
    - Code that otherwise stays the same has to create different concrete types depending on the subclass or
      context.
    - A library or framework must let users substitute their own component class.
    - Construction is scattered across the code with type switches, and adding a type means editing every site.
    - Creation needs control, such as reusing pooled or cached instances, without callers knowing.
  overuse:
    - A creator subclass per product where only one product exists.
    - A static create method that only calls the constructor and adds nothing.
    - Inheritance hierarchies introduced only to swap which class is instantiated, where a parameter would do.
  remedy: null
  counter: >
    It ties the choice of product to inheritance, so each new product often means a new creator subclass.
    Passing the class or a factory function as a parameter, or injecting the dependency, usually gives the
    same flexibility with less coupling. Not to be confused with a simple factory function or a named
    alternative constructor, which are useful but are not this pattern.
  in:
    python: >
      Because classes and functions are first-class, callers can pass the class or a callable to use, and no
      subclass is needed. Classmethod alternative constructors (from_dict, from_file) are idiomatic, but they
      are named constructors rather than the GoF pattern. The subclass hook form still appears in frameworks,
      for example a class attribute or overridable method naming which class to instantiate.
    typescript: "The subclass-overrides-a-creator form is uncommon in TypeScript; passing a creator function or a
      constructor type (`new () => T`) as a parameter usually replaces it. Static `create` or `from` functions
      on a class are common too, but they are named constructors, not this pattern. Spotting it: a base-class
      method that subclasses override to choose which concrete class gets made, declared to return an
      interface or abstract type."
    java: "The GoF form, an overridable creation hook on a base class, appears mostly in frameworks. In
      application code a Supplier or constructor reference passed in usually replaces it. Java is also full of
      static factory methods (Calendar.getInstance, NumberFormat.getInstance, Charset.forName, EnumSet.of,
      List.of). They are useful and can return cached instances or hidden subtypes, but they are named
      constructors, not this pattern; Bloch makes the same distinction. Spotting it: A protected or abstract
      createX method that a base class calls and subclasses override, declared to return an interface or
      abstract type."
    csharp: "The GoF form is a protected virtual or abstract CreateX method on a base class that subclasses
      override. In application code a Func<T> delegate or an injected factory interface usually replaces it,
      especially with a DI container. Static Create, From and Parse methods are common in .NET, but they are
      named constructors, not this pattern. Spotting it: a protected virtual or abstract creation method that
      a base class calls and subclasses override, returning an interface or abstract type."
    go: "Go has no inheritance, so there is no subclass to override a creation method. What Go does instead is the
      simple factory, a New... function that returns an interface value or an error. The idiom is to return
      the concrete type and let callers depend on their own small interfaces. Return an interface only when
      the concrete type should stay hidden, as crypto/hash constructors do. Spotting it: Package-level
      functions named New or NewX, especially ones that switch on a kind argument and return an interface plus
      an error."
    rust: "Without inheritance, the \"creator\" is a trait with a required constructor-like method, sometimes next
      to default methods that call it. The return type is either `Box<dyn Product>` (runtime choice) or an
      associated type bounded by the product trait (static dispatch). Plain associated functions such as
      `new`, `from_*`, and `Default`, `From` or `FromStr` impls cover most of what other languages use factory
      methods for. A free function or an enum match is often enough. Spotting it: A trait method that returns
      `Box<dyn Trait>`, `impl Trait`, or `Self::Assoc`, used by the trait's own default methods. Also look for
      associated functions like `from_config` that choose a concrete type."
    cpp: "Used often in C++ where code must stay extensible. The virtual creation method should return
      std::unique_ptr<Base>, never a raw owning pointer. Where subclassing exists only to pick a type, a
      template parameter, a std::function factory, or a registry map from key to creator function is the
      lighter idiom. Spotting it: A virtual (often pure virtual) method that constructs a concrete class with
      make_unique or new but declares an abstract base pointer as its return type."
  related:
    - abstract-factory
    - template-method
    - prototype
    - builder
  tell: null
  interview_only: false
  sources:
    - cite: Refactoring.Guru, Factory Method
      url: https://refactoring.guru/design-patterns/factory-method
      how: read
    - cite: Refactoring.Guru, Factory Method in Python
      url: https://refactoring.guru/design-patterns/factory-method/python/example
      how: read
    - cite: Peter Norvig, Design Patterns in Dynamic Languages (1996)
      url: https://norvig.com/design-patterns/
      how: recalled
    - cite: Refactoring.Guru, Factory Method in TypeScript
      url: https://refactoring.guru/design-patterns/factory-method/typescript/example
      how: read
    - cite: Established TypeScript practice (creator functions, constructor types)
      url: null
      how: recalled
    - cite: Refactoring.Guru, Factory Method in Java
      url: https://refactoring.guru/design-patterns/factory-method/java/example
      how: read
    - cite: Effective Java (Bloch), item on static factory methods instead of constructors
      url: null
      how: recalled
    - cite: Refactoring.Guru, Factory Method in C#
      url: https://refactoring.guru/design-patterns/factory-method/csharp/example
      how: read
