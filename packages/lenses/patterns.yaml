- id: iterator
  name: Iterator
  family: pattern
  group: behavioral
  says: Walk the elements of a collection without exposing how it stores them, with each walk keeping its own
    position; also called Cursor.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Classes with next / has_next methods or language iteration hooks over a custom data structure
    - Traversal code (depth-first, breadth-first) moved out of the collection into its own type or function
    - Client code that loops over a collection without touching its internals
  forces:
    - A custom structure (tree, graph, paged API, file of records) needs looping over and callers are reaching
      into its internals to do it
    - The same structure needs more than one traversal order
    - The same traversal code is repeated in several places
    - Data is too big or too slow to load at once and should be produced lazily
  overuse:
    - A hand-written iterator class over a plain list or dict the language already iterates
    - Iterator interfaces and factories for collections that only ever have one traversal
    - Wrapping a built-in collection just to give it an iterator it already had
  remedy: null
  counter: >
    Every mainstream language now builds iteration in, so writing the pattern by hand is rarely needed; reach
    for the language's protocol or a generator. For simple collections it is pure overhead, and for some
    specialised structures direct indexed access is faster. Iterators that hold position over a collection
    that is being modified are a classic source of bugs.
  in:
    python: >
      Built into the language: __iter__ and __next__, and generators make most custom iterator classes
      unnecessary. Write a generator function (yield) for a custom traversal and itertools for combinations. A
      separate iterator class is rarely warranted. The source notes Python developers meet it constantly
      through the iteration protocol in libraries.
    typescript: "Common, and built into the language through the iteration protocol (`Symbol.iterator`,
      `Iterable<T>`). Generator functions (`function*`) are the idiomatic way to write one, and `for...of`,
      spread and destructuring consume it. Async iterators cover streams. Hand-written iterator classes with
      `hasNext` methods are rarely needed. Spotting it: Navigation methods such as `next` or `current`, an
      implementation of `[Symbol.iterator]`, or a generator function; callers never touch the underlying
      collection."
    java: "Built in and ubiquitous: Iterable/Iterator power the enhanced for loop, and Enumeration is its legacy
      predecessor. Writing a custom iterator is rarely needed; implement Iterable, or expose a Stream, or a
      Spliterator for parallel-friendly traversal. Modifying a collection while iterating it (except through
      Iterator.remove) throws ConcurrentModificationException. Spotting it: A class implementing Iterator with
      hasNext/next, often as an inner class returned from an iterator() method of an Iterable."
    csharp: "Built into the language. IEnumerable<T> and IEnumerator<T> are the iterator interfaces, foreach
      consumes them, and `yield return` lets the compiler generate the iterator, so hand-written iterator
      classes are rarely needed. IAsyncEnumerable<T> with await foreach covers async streams, and LINQ
      composes iterators lazily. Spotting it: Methods returning IEnumerable<T> or IAsyncEnumerable<T> with
      yield return in the body, or classes implementing IEnumerator<T> with MoveNext and Current."
    go: "For years, Go's iterator was a for-range over slices, maps and channels, plus cursor-style types that
      advance with a bool-returning method and expose the current item and an Err method (bufio.Scanner's
      Scan/Text/Err, sql.Rows' Next/Scan/Err). Since Go 1.23, range-over-func with iter.Seq and iter.Seq2 is
      the standard form, and a hand-written iterator with hasNext and getNext looks dated. Iterating over a
      channel costs a goroutine and needs care to avoid leaks. Spotting it: Functions returning iter.Seq or
      iter.Seq2, or a type with a Next() or Scan() bool method plus an accessor and an Err method."
    rust: "Part of the language: implement `std::iter::Iterator` (one `next` returning `Option<Item>`) to get
      every adapter for free, and implement `IntoIterator` so the collection works in `for` loops. Never
      define your own iterator interface. Borrowing iterators carry a lifetime tying them to the collection.
      Usually you don't even write a struct, because you return `impl Iterator<Item = ..>` built from existing
      adapters or `std::iter::from_fn`. Spotting it: `impl Iterator for X` with `type Item`,
      `iter()`/`iter_mut()`/`into_iter()` methods, or functions returning `impl Iterator`."
    cpp: "Built into the language and the standard library: every container exposes iterators, algorithms are
      written against iterator categories, and range-for works on anything with begin and end. A custom
      collection should provide standard-conforming iterators (or satisfy C++20 range concepts) rather than
      its own next/hasNext interface. Iterator invalidation after container mutation is the main hazard.
      Spotting it: A type with operator++, operator* and comparison operators, or a class exposing begin() and
      end(); or, non-idiomatically, next and has-next methods."
  related:
    - composite
    - visitor
    - factory-method
    - memento
  tell: >
    In Python, a class defining both __iter__ and __next__ that just steps an index over an internal list; a
    generator function would replace it.
  interview_only: false
  sources:
