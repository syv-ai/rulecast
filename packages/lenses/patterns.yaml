- id: domain-model
  name: Domain Model
  family: pattern
  group: design
  says: >
    Model the business as objects that carry both their data and the rules about it, so invariants live with
    the state they protect instead of in the procedures that use it.
  names: >
    Named in Fowler's PoEAA (2002). Evans's Domain-Driven Design (2003) built a whole approach on it
    (entities, value objects, aggregates). Sometimes called a rich domain model, in contrast to the anemic
    one.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Entities with methods named for business actions (claim.approve, order.cancel) that check and change
      their own state.
    - Few public setters; state changes go through methods that enforce rules.
    - Domain classes with no imports from the web framework or database driver.
  forces:
    - The same rules or invariants are checked in several procedures and have started to drift.
    - Business rules interact (a claim's status, limits and history all affect what can happen next).
    - Domain experts and code disagree on terms, and the logic is the product's core value.
  overuse:
    - A rich model for a CRUD screen or a generic subdomain where there are no rules to enforce.
    - Entities that reach into repositories or services to do their work, mixing persistence back in.
    - DDD tactical ceremony (aggregates, factories, domain events) around data that only gets stored and shown.
  remedy: null
  counter: >
    Fowler notes a domain model costs more to build and needs a mapping layer to the database, so it pays off
    only when the logic is complex. Functional programmers (Wlaschin, Domain Modeling Made Functional) get the
    same benefit with immutable types and pure functions over them instead of mutable objects with methods, so
    "data and behaviour together" is one way to keep rules in one place, not the only one. Many web apps are
    mostly CRUD and are better served by a transaction script.
  in:
    java: >
      JPA entities can be rich, but JPA's need for a no-argument constructor and mutable fields pushes toward
      setters; keep those package-private or protected and expose business methods.
    csharp: >
      EF Core supports private setters, backing fields and owned types, so entities can enforce invariants
      while still being mapped.
    python: >
      Django models are Active Records, so rich behaviour goes on the model. Cosmic Python shows the separate
      domain-model style with SQLAlchemy classical mapping.
    typescript: >
      Classes with private fields work; many TS codebases prefer plain types plus functions in a module, which
      gives the same cohesion without classes.
    go: >
      Methods on structs with unexported fields and a constructor function that validates; Go culture leans
      simple, so rich models are less common outside DDD-style services.
    rust: >
      A natural fit: private fields, constructors that validate, methods that consume self to model state
      transitions, and enums that make invalid states unrepresentable.
