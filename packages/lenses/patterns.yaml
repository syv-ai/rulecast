- id: layered-architecture
  name: Layered Architecture
  family: pattern
  group: architecture
  says: >
    Split the application into horizontal layers, usually presentation, business (service), persistence and
    database, where each layer only calls the one below it.
  names: >
    Also called n-tier architecture. Described as the Layers pattern by Buschmann et al. in Pattern-Oriented
    Software Architecture vol. 1 (1996), with roots in Dijkstra's THE system (1968). Mark Richards and Neal
    Ford, Fundamentals of Software Architecture (2020), treat it as the default style and name the sinkhole
    anti-pattern (layers that only pass requests through). A closed layer must be passed through; an open
    layer can be skipped.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Top-level folders or packages named controllers, services, repositories, models (or web, application,
      domain, infrastructure).
    - Each controller calling a matching service that calls a matching repository.
    - Classic MVC-shaped projects packaged by layer (controllers/, services/, repositories/), where one
      feature is spread over every layer.
  forces:
    - A team needs an obvious, widely understood structure to start with.
    - UI, rules and data access are tangled in the same functions.
    - Specialist skills map onto layers (frontend, backend, DBA).
    - The application is mostly forms over data with modest rules.
  overuse:
    - Service methods that only call the repository with the same arguments (the architecture sinkhole).
    - Mandatory layers for a small tool or script.
    - Organising a large system only by layer, so every feature change touches every folder (shotgun surgery
      across layers).
    - Forbidding layer skipping even for read-only queries that gain nothing from the service layer.
  remedy: null
  counter: >
    Layering by technical concern is easy to start and hard to scale: changes are usually by feature, so
    feature work cuts across all layers, and the domain tends to end up anaemic in the service layer. Many
    people now prefer vertical slices or packaging by feature (Jimmy Bogard's vertical slice architecture,
    Simon Brown's package by component) with layers inside each slice. Classic layering also lets the business
    layer depend on persistence, which the dependency rule inverts. Richards and Ford rate it low on
    deployability and scalability and suggest it mainly for small, simple or budget-bound applications, or as
    a starting point.
  in:
    java: >
      The default shape of Spring Boot apps (@Controller, @Service, @Repository stereotypes). ArchUnit has
      built-in layered-architecture checks.
    csharp: >
      Common as separate projects per layer (Web, Business, DataAccess). Newer templates tend toward clean
      architecture projects instead, which invert the persistence dependency.
    python: >
      Django's apps cut by feature with models, views and forms inside each, which is closer to vertical
      slices than to global layers. FastAPI projects often adopt routers, services and repositories folders by
      convention, not by framework requirement.
    go: >
      Packaging by layer (`controllers`, `models`) is widely considered unidiomatic; the Go community prefers
      packages named for what they provide, which pushes toward feature packages.
  related:
    - dependency-rule
    - ports-and-adapters
    - shotgun-surgery
    - big-ball-of-mud
  tell: null
  interview_only: false
  sources:
    - cite: Buschmann, Meunier, Rohnert, Sommerlad, Stal, Pattern-Oriented Software Architecture vol. 1 (1996),
        Layers
      url: null
      how: recalled
    - cite: Mark Richards and Neal Ford, Fundamentals of Software Architecture (2020), Layered Architecture Style
      url: null
      how: recalled
  example:
    before: |
      fn checkout_book(request):
          member = db.query("select * from members where id = ?", request.member_id)
          if member.fines > 10:
              return render("error.html", msg="Pay your fines first")
          db.execute("insert into loans (book_id, member_id) values (?, ?)",
                     request.book_id, member.id)
          return render("loan_ok.html")
    after: |
      # presentation
      fn checkout_book(request):
          try: lending.checkout(request.member_id, request.book_id)
          except FinesOutstanding: return render("error.html", msg="Pay your fines first")
          return render("loan_ok.html")

      # business
      class LendingService:
          fn checkout(member_id, book_id):
              member = members.get(member_id)
              if member.fines > 10: raise FinesOutstanding()
              loans.add(Loan(book_id, member.id))
      # persistence
      class MemberRepository: ...
      class LoanRepository: ...
    note: The rendering, the lending rule and the SQL each sit in their own layer, and each layer only calls down.
  matters_most_for:
    - web-api
    - fullstack-web
    - desktop
- id: cqrs
  name: CQRS (Command Query Responsibility Segregation)
  family: pattern
  group: architecture
  says: >
    Use one model to change data (commands) and a separate model to read it (queries), so each can be shaped,
    stored and scaled for its own job.
  names: >
    Named by Greg Young around 2010, building on Bertrand Meyer's Command-Query Separation (Object-Oriented
    Software Construction, 1988), which applies the same split to single methods. Udi Dahan wrote widely on it
    at the same time. Fowler's bliki entry (2011) is the usual short reference.
  applies_to:
    kinds: []
    languages: []
  contested: true
  looks_like:
    - Command and query classes or handlers in separate folders (Commands/, Queries/), often dispatched
      through a mediator.
    - Read models or projections (denormalised tables, documents, materialised views) updated from events
      written by the command side.
    - Query handlers that bypass the domain model and select straight into view DTOs.
  forces:
    - The shapes needed for screens and reports differ sharply from the shape needed to enforce rules on
      writes.
    - Reads vastly outnumber writes, or need a different store (search index, document cache).
    - The domain model is bloated with getters, lazy loads and joins that exist only for display.
    - Collaborative domains where many users act on the same data and intent-level commands reduce conflicts.
  overuse:
    - Separate read and write databases, a bus and eventual consistency for a CRUD app.
    - Applying it across the whole system instead of the one bounded context that needs it.
    - A mediator library and a command/handler pair for every trivial operation, adding ceremony with one
      store underneath.
    - Assuming CQRS requires event sourcing; it doesn't.
  remedy: null
  counter: >
    Fowler warns that most systems fit CRUD and that CQRS is a significant mental leap which, in most cases he
    saw, made the project harder. Separate stores bring eventual consistency, so users can act on stale data,
    and messaging brings duplicates and retries. If the only need is heavy reporting, a reporting database or
    read replica may be enough. The light form, separate query objects that select straight into DTOs over the
    same database, gets much of the benefit at little cost and is often what people actually need.
  in:
    csharp: Very common in .NET via MediatR with IRequest handlers. From 13.0, MediatR is dual-licensed (RPL-1.5
      or a paid commercial licence, with a free tier for small companies); 12.x stays Apache 2.0. The mediator
      is optional, and it is criticised as needless indirection when handlers have only one caller.
    java: >
      Axon Framework provides CQRS with event sourcing; in plain Spring the light form is separate query
      repositories or projections returning DTOs.
    python: >
      Usually the light form: separate query functions returning plain dicts or Pydantic models, with SQL
      written for the screen, next to a richer write model.
    typescript: >
      NestJS ships a @nestjs/cqrs module with command, query and event buses; outside Nest, separate query
      functions are the norm.
  related:
    - event-sourcing
    - outbox
    - saga
    - yagni
  tell: null
  interview_only: false
  sources:
    - cite: Martin Fowler, CQRS (bliki, 2011)
      url: https://martinfowler.com/bliki/CQRS.html
      how: read
    - cite: Azure Architecture Center, CQRS pattern
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/cqrs
      how: read
    - cite: Greg Young, CQRS Documents (2010)
      url: null
      how: recalled
  example:
    before: |
      class Shipment:
          fn mark_delivered(at): ...                 # rule-heavy writes
          fn dashboard_row() -> dict:                # display concerns on the same model
              return {"carrier": self.carrier.name,
                      "region": self.route.region.name,
                      "late_days": self.lateness(),
                      "customer": self.order.customer.name}

      rows = [s.dashboard_row() for s in repo.all_open()]   # loads every graph to build a table
    after: |
      # command side: the model enforces rules
      fn handle(cmd: MarkDelivered):
          shipment = repo.get(cmd.shipment_id)
          shipment.mark_delivered(cmd.at)
          repo.save(shipment)

      # query side: a flat read model shaped for the screen
      fn open_shipments_dashboard() -> list[ShipmentRow]:
          return db.query("select carrier, region, late_days, customer from shipment_dashboard
                           where status = 'open'")
    note: Writes go through the rich model; the dashboard reads a table built for it, kept up to date by a
      projection or a view.
  matters_most_for:
    - event-driven
    - distributed
    - web-api
- id: event-sourcing
  name: Event Sourcing
  family: pattern
  group: architecture
  says: >
    Store every change as an immutable event in an append-only log and derive current state by replaying the
    events, instead of overwriting the current state in place.
  names: >
    Described by Martin Fowler (eaaDev, 2005) and championed by Greg Young from around 2007 alongside CQRS.
    The idea is much older: accounting ledgers and database write-ahead logs work this way. Rebuilding state
    from events is called rehydration; read models derived from events are projections.
  applies_to:
    kinds: []
    languages: []
  contested: true
  looks_like:
    - Event classes named in the past tense (SeatsReserved, OrderCancelled) and an event store or events table
      keyed by stream id and version.
    - An aggregate with an apply or when method per event type, rebuilt by folding over its stream.
    - Projections that subscribe to events to build read tables, plus snapshot tables.
    - Upcasters or versioned event types for old event shapes.
  forces:
    - Audit and history are core requirements (ledgers, payments, compliance), not afterthoughts.
    - The business needs to ask what the state was at a past time, or why it changed.
    - New read models must be built later from history that would otherwise be lost.
    - Many concurrent writers on the same entity, where appends with optimistic concurrency beat row locks.
  overuse:
    - Event sourcing a whole system, including reference data, settings and user profiles that nobody will
      ever replay.
    - Events that record state ("quantity set to 42") rather than intent, which gives a change log with the
      costs of event sourcing and none of the meaning.
    - Using a message broker such as Kafka as the event store without per-stream reads or concurrency control.
    - Choosing it for a prototype or MVP with a short expected life.
  remedy: null
  counter: >
    Both Fowler and Microsoft's guidance stress that it is costly to adopt and costly to leave, and that most
    systems, and most parts of any system, are better served by storing current state. Schema evolution of
    events is permanent work, projections are eventually consistent, replays must not resend side effects to
    external systems, and an immutable log fights with deletion rights such as GDPR's right to be forgotten
    (handled by keeping personal data outside events or by crypto-shredding). Teams new to event-driven
    systems often struggle with it. An audit table next to normal state often meets the real need.
  in:
    csharp: >
      Mature libraries exist (Marten on PostgreSQL, EventStoreDB's client, Eventuous). Records make immutable
      event types cheap to declare.
    java: >
      Axon Framework is the common full stack; sealed interfaces and records (Java 17+) suit event hierarchies
      and exhaustive handling.
    typescript: >
      Discriminated unions model the event set well, and a reducer over the stream is the natural shape of
      rehydration.
    rust: >
      Enums model the event set and match makes apply exhaustive; serde with tagged enums handles storage,
      with versioning done by explicit variants or upcasting.
    python: >
      Fewer mature frameworks (eventsourcing is the main one); hand-rolled stores over PostgreSQL are common.
      Dataclasses with frozen=True suit event types.
  related:
    - cqrs
    - outbox
    - saga
    - memento
  tell: null
  interview_only: false
  sources:
    - cite: Martin Fowler, Event Sourcing (2005)
      url: https://martinfowler.com/eaaDev/EventSourcing.html
      how: read
    - cite: Azure Architecture Center, Event Sourcing pattern
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/event-sourcing
      how: read
    - cite: Greg Young, talks and CQRS Documents (2010)
      url: null
      how: recalled
  example:
    before: |
      class BinStock:
          fn receive(qty):
              self.quantity = self.quantity + qty
              db.update("bins", self.id, quantity=self.quantity)
          fn pick(qty):
              self.quantity = self.quantity - qty
              db.update("bins", self.id, quantity=self.quantity)
      # "why is bin 7 short by 3 since Tuesday?" has no answer
    after: |
      class BinStock:
          fn receive(qty): self.record(StockReceived(self.id, qty))
          fn pick(qty):
              if qty > self.quantity: raise NotEnoughStock()
              self.record(StockPicked(self.id, qty))

          fn apply(event):
              if event is StockReceived: self.quantity = self.quantity + event.qty
              if event is StockPicked: self.quantity = self.quantity - event.qty

      fn load(bin_id) -> BinStock:
          bin = BinStock(bin_id)
          for event in store.read_stream(bin_id): bin.apply(event)
          return bin
    note: The events are the record; current quantity is derived from them, so history and past states come for
      free.
  matters_most_for:
    - event-driven
    - distributed
    - databases-storage
- id: pipes-and-filters
  name: Pipes and Filters
  family: pattern
  group: architecture
  says: >
    Break processing into a chain of independent steps (filters), each taking input and producing output,
    joined by pipes that carry data from one to the next and hold no logic of their own.
  names: >
    The Unix pipeline, proposed by Doug McIlroy and built into Unix in 1973, is the original. Named as an
    architectural style by Mary Shaw and David Garlan (Software Architecture, 1996) and as a pattern in
    Buschmann et al., POSA vol. 1 (1996). Also called a pipeline architecture (Richards and Ford). Hohpe and
    Woolf's Enterprise Integration Patterns (2003) use it as the base messaging style.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A list of stage functions or objects with the same input/output type applied in order.
    - Stream or iterator chains (shell pipes, generators, Rx operators, Rust iterator adapters).
    - Queues between workers, each worker reading one queue and writing the next.
    - ETL or build pipelines defined as an ordered set of steps in configuration.
  forces:
    - A long function does several sequential transformations that are hard to test or reuse separately.
    - Steps need to be reordered, added or removed per input source or customer.
    - Some steps are much more expensive than others and need to scale or run in parallel on their own.
    - The data can be processed as a stream, so later steps can start before earlier ones finish.
  overuse:
    - A pipeline framework for three steps that will never change order.
    - Distributing each filter as its own service with queues between, for work that fits in one process.
    - Filters that secretly share state or depend on each other's order, so the pipeline only looks composable.
    - Forcing request/response work into a pipeline when the caller needs the answer now.
  remedy: null
  counter: >
    Pipelines suit independent, ordered transformations; they fit poorly when steps must share a lot of
    context, run in one transaction, or answer a synchronous request. Distributed pipelines bring duplicate
    messages and partial failures, so each filter must be idempotent and the pipe must not lose data. A common
    schema between filters keeps them reorderable but can push every filter to carry fields it doesn't use.
    Error handling is the weak point: decide early whether a failing filter stops the pipeline, skips the item
    or sends it to a dead-letter queue.
  in:
    python: >
      Generator functions chained together give lazy, streaming pipelines in a few lines; a list of callables
      folded over the input is the simple form.
    typescript: |
      Array method chains are eager; Node streams and async iterators give streaming with backpressure.
    java: >
      java.util.stream is the in-process form; Spring Integration and Apache Camel provide message-based pipes
      and filters.
    csharp: >
      LINQ chains for in-process work; System.Threading.Channels or TPL Dataflow for concurrent pipelines with
      bounded buffers.
    go: >
      The goroutine-per-stage, channel-per-pipe pattern is idiomatic and described in the Go blog's "Pipelines
      and cancellation"; pass a context for cancellation and close channels downstream.
    rust: >
      Iterator adapters are zero-cost in-process pipes; for concurrent stages, channels (std::sync::mpsc,
      crossbeam, tokio::mpsc) between threads or tasks.
  related:
    - chain-of-responsibility
    - decorator
    - functional-decomposition
  tell: null
  interview_only: false
  sources:
    - cite: Azure Architecture Center, Pipes and Filters pattern
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/pipes-and-filters
      how: read
    - cite: Mary Shaw and David Garlan, Software Architecture, Perspectives on an Emerging Discipline (1996)
      url: null
      how: recalled
    - cite: Buschmann et al., Pattern-Oriented Software Architecture vol. 1 (1996), Pipes and Filters
      url: null
      how: recalled
  example:
    before: |
      fn ingest(lines):
          for line in lines:
              record = parse_log_line(line)
              if record is None: continue
              record.ip = mask_last_octet(record.ip)
              record.country = geo_lookup(record.ip)
              warehouse.write(record)
      # a second source that skips geo lookup means copying the whole loop
    after: |
      fn parse(lines):   for l in lines: r = parse_log_line(l); if r: yield r
      fn redact(records): for r in records: r.ip = mask_last_octet(r.ip); yield r
      fn enrich(records): for r in records: r.country = geo_lookup(r.ip); yield r

      fn run(source, filters, sink):
          stream = source
          for f in filters: stream = f(stream)
          for r in stream: sink.write(r)

      run(web_logs, [parse, redact, enrich], warehouse)
      run(vpn_logs, [parse, redact], warehouse)
    note: Each step is a filter over a stream; pipelines for new sources are assembled rather than copied.
  matters_most_for:
    - data-pipeline
    - cli-devtool
    - compilers-tooling
    - ml-training
    - event-driven
- id: microkernel
  name: Microkernel (plugin architecture)
  family: pattern
  group: architecture
  says: >
    Keep a small core that provides the minimal shared machinery, and put features in plugins that the core
    discovers and calls through a stable, versioned contract.
  names: >
    Named as the Microkernel pattern in Buschmann et al., POSA vol. 1 (1996), borrowing the term from
    operating-system microkernels such as Mach. Richards and Ford (Fundamentals of Software Architecture,
    2020) call it the microkernel or plugin architecture style. Eclipse, VS Code, browsers, webpack and pytest
    are well-known examples. Not the same as an OS microkernel, though the idea is shared.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A plugin interface or trait plus a registry, entry-point table or manifest format through which plugins
      are found.
    - Features living in separate packages that the core never imports by name.
    - A published plugin API module, separately versioned from the core, with compatibility notes.
    - Lifecycle hooks (activate, deactivate, on_event) and a host that isolates plugin failures.
  forces:
    - Third parties, or other teams, must add features without changing the core.
    - The product has many optional features that customers mix differently.
    - New formats, providers or languages keep being added to a switch statement in the core.
    - The core must stay stable while features change at their own pace.
  overuse:
    - A plugin system with one plugin, written by the same team, in the same repo, released together.
    - Making every internal module a plugin, so control flow is only visible at runtime.
    - A contract so broad (plugins get the whole app object) that every core change breaks plugins.
  remedy: null
  counter: >
    A plugin contract is a public API: once others build on it, Hyrum's law applies and every observable
    behaviour becomes something you can't change cheaply, so publish the smallest contract that works and
    version it. When all extensions are in-house and ship together, a plain interface and a compile-time list
    are simpler and easier to follow than discovery and dynamic loading. Dynamic loading also brings security
    (running untrusted code), isolation and dependency conflicts between plugins. Plugins that need to talk to
    each other push the design toward a bus and away from a small core.
  in:
    python: >
      Discovery usually goes through packaging entry points (importlib.metadata.entry_points), as pytest and
      many CLIs do; pluggy is pytest's hook library. A plugin's dependencies share one environment with the
      host, so version conflicts are the main pain.
    typescript: >
      Usually plugins are npm packages loaded by name from config (ESLint, Vite, webpack); the contract is a
      published types package. VS Code adds process isolation via its extension host.
    java: >
      java.util.ServiceLoader with META-INF/services, or OSGi for full module lifecycles and isolation; class
      loader conflicts are the classic problem.
    csharp: >
      AssemblyLoadContext supports loading and unloading plugin assemblies; MEF (System.Composition) is an
      older discovery option. Share only a small contracts assembly between host and plugins.
    go: >
      The standard plugin package is fragile (same toolchain and dependency versions, limited platforms), so
      Go hosts usually compile plugins in via a registry populated from init functions, or run them as
      separate processes over RPC, as HashiCorp's go-plugin does.
    rust: >
      There is no stable Rust ABI, so dynamic plugins either go through a C ABI (abi_stable, libloading),
      WebAssembly (wasmtime, Extism) or a separate process. Compile-time plugins via traits and feature flags
      are far simpler when the set is known.
  related:
    - ports-and-adapters
    - hyrums-law
    - strategy
    - switch-statements
  tell: null
  interview_only: false
  sources:
    - cite: Buschmann et al., Pattern-Oriented Software Architecture vol. 1 (1996), Microkernel
      url: null
      how: recalled
    - cite: Mark Richards and Neal Ford, Fundamentals of Software Architecture (2020), Microkernel Architecture
        Style
      url: null
      how: recalled
  example:
    before: |
      fn import_file(path):
          if path.ends_with(".csv"): rows = parse_csv(read(path))
          elif path.ends_with(".xlsx"): rows = parse_xlsx(read(path))
          elif path.ends_with(".ofx"): rows = parse_ofx(read(path))
          else: raise Unsupported(path)
          ledger.add_all(rows)
      # every new bank format is an edit to the core
    after: |
      interface Importer:                 # the published contract
          api_version = 1
          fn handles(path) -> bool
          fn parse(data: Bytes) -> list[Transaction]

      class Core:
          fn init(): self.importers = discover_plugins("ledger.importers")
          fn import_file(path):
              importer = first(i for i in self.importers if i.handles(path))
              if importer is None: raise Unsupported(path)
              ledger.add_all(importer.parse(read(path)))
    note: Formats become plugins found at startup; the core only knows the contract, so new formats ship without
      touching it.
  matters_most_for:
    - plugin-host
    - plugins-extensions
    - desktop
    - cli-devtool
    - compilers-tooling
- id: tolerant-reader
  name: Tolerant Reader
  family: pattern
  group: architecture
  says: >
    When consuming another service's data, read only the fields you need, assume as little about the structure
    as you can, and ignore what you don't recognise, so the provider can add things without breaking you.
  names: >
    Described by Martin Fowler (bliki, 2011), who credits Robert Daigneau's Service Design Patterns (2011) for
    the full write-up. It applies the "liberal in what you accept" half of Postel's law to service consumers.
    Pairs with consumer-driven contracts (Ian Robinson) and with a conservative, or magnanimous, writer.
  applies_to:
    kinds: []
    languages: []
  contested: true
  looks_like:
    - Deserialisers configured to ignore unknown fields.
    - One reader or DTO per external payload that picks out the needed fields, with defaults for optional ones.
    - Path lookups that don't depend on the full nesting of a document.
    - Consumer contract tests that the provider runs in its build.
    - One type marked deny_unknown_fields or .strict() that is both a user-edited config and part of a payload
      to plugins or other versions
  forces:
    - A consumer breaks whenever the provider adds a field or reorders a document.
    - Client classes are generated from the provider's full schema and regenerated on every change.
    - Many consumers of one API evolve on different schedules.
    - Event or message payloads outlive the code that wrote them.
  overuse:
    - Guessing at malformed or missing required data instead of failing, so bad input flows on silently.
    - Accepting fields under several spellings or types "to be safe", which providers then rely on.
    - Ignoring unknown fields in security-sensitive input, where an unexpected field may be an attack or a
      mistake worth rejecting.
  remedy: null
  counter: >
    Tolerance is for structure you don't use, not for values you do. Required fields should still be checked,
    and wrong types should still fail, at the edge (parse, don't validate). Critics of Postel's law, notably
    Martin Thomson and David Schinazi in RFC 9413, argue that liberal acceptance entrenches broken senders and
    lets ambiguity spread; a tolerant reader without contract tests can hide a provider's real breaking change
    until production. For your own inputs, such as config files, rejecting unknown keys catches typos and is
    usually better. Strictness belongs to the read, not the type. When one type is both a user's config file
    and part of a payload sent to plugins or other versions, rejecting unknown fields on the type makes every
    reader strict, so an old plugin fails on a field it doesn't need. Check strictly in the loader for the
    user's file, and let the type and its other readers stay tolerant.
  in:
    python: >
      Pydantic models ignore extra fields by default (extra="ignore"); extra="forbid" is the strict opposite.
      Read only the fields the model declares.
    typescript: >
      Runtime validators decide this, not types: zod objects strip unknown keys by default, and .strict()
      rejects them. A bare type assertion on JSON checks nothing at all.
    java: Jackson 2 fails on unknown properties by default; set FAIL_ON_UNKNOWN_PROPERTIES to false or annotate
      @JsonIgnoreProperties(ignoreUnknown = true). Jackson 3 flipped that default, so unknown properties are
      ignored unless you turn the check back on. Spring Boot's auto-configured mapper ignores them in both.
    csharp: >
      System.Text.Json ignores unknown members by default; .NET 8 added JsonUnmappedMemberHandling.Disallow
      for strictness.
    go: >
      encoding/json ignores unknown fields by default; Decoder.DisallowUnknownFields turns on strictness.
      Missing fields silently become zero values, so check required ones explicitly.
    rust: "serde ignores unknown fields unless the type has #[serde(deny_unknown_fields)]; use #[serde(default)]
      or Option for fields that may be absent. deny_unknown_fields applies wherever the type is deserialized;
      to be strict for one reader only, use a separate wrapper type or a check in that loader."
  related:
    - postels-law
    - hyrums-law
    - adapter
  tell: null
  interview_only: false
  sources:
    - cite: Martin Fowler, Tolerant Reader (bliki, 2011)
      url: https://martinfowler.com/bliki/TolerantReader.html
      how: read
    - cite: Robert Daigneau, Service Design Patterns (2011), Tolerant Reader
      url: null
      how: recalled
    - cite: Martin Thomson and David Schinazi, RFC 9413, Maintaining Robust Protocols (2023)
      url: https://www.rfc-editor.org/rfc/rfc9413
      how: recalled
  example:
    before: |
      class StationReading:          # generated from the provider's full schema
          station_id: str
          temp_c: float
          humidity: float
          pressure_hpa: float
          firmware: str
          location: Location         # nested, all fields required

      reading = strict_decode(StationReading, payload)   # fails on any new or renamed field
    after: |
      fn read_station(payload: dict) -> Reading:
          return Reading(
              station_id = require(payload, "station_id"),
              temp_c = require_number(payload, "temp_c"),
              humidity = payload.get("humidity", None),     # optional for us
          )
      # unknown fields are ignored; the provider can add sensors freely
    note: The consumer depends only on the three fields it uses, still fails on the ones it truly needs, and keeps
      the reading code in one place.
  matters_most_for:
    - distributed
    - event-driven
    - web-api
    - library-sdk
- id: strangler-fig
  name: Strangler Fig
  family: pattern
  group: architecture
  says: >
    Replace a legacy system piece by piece: put a routing layer in front of it, move one capability at a time
    into the new system, shift traffic over, and retire the old one when nothing routes to it.
  names: >
    Named by Martin Fowler, first as "Strangler Application" (2004), later retitled "Strangler Fig
    Application" to restore the botanical image he saw in Queensland in 2001. Often shortened to strangler
    pattern. Fowler credits Cartwright, Horn and Lewis for its four activities in later writing; Sam Newman's
    Monolith to Microservices (2019) is the standard book treatment.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A proxy, gateway or routing table that sends some paths or features to the new system and the rest to
      the old one.
    - Feature flags or percentage rollouts choosing between legacy and new implementations of one capability.
    - An anti-corruption layer translating between the new model and the legacy one during coexistence.
    - Change data capture or sync jobs keeping old and new data stores aligned for a while.
  forces:
    - A large system must be modernised but can't be frozen for a rewrite.
    - The business can't afford a big-bang cutover risk.
    - Some capabilities are worth migrating early and others may never be worth it.
    - Requests can be intercepted at a boundary (HTTP, messages, a module interface).
  overuse:
    - Strangling a small system that could be replaced in one go.
    - A migration with no end date, leaving two systems and a facade running indefinitely.
    - Copying every legacy behaviour faithfully, including the parts nobody wants.
  remedy: null
  counter: >
    It needs interceptable seams, and legacy systems rarely have clean ones, so finding them is most of the
    work. Running two systems costs money and attention; without a plan to finish, the strangler becomes one
    more layer on the mess. Data is the hard part: shared databases between old and new often survive long
    after the code has moved. Microsoft's guidance notes it fits poorly when requests can't be intercepted,
    when you can't change the legacy code, or when the old system must be gone quickly. Fowler adds that
    without organisational change, Conway's law will rebuild the old structure in the new system.
  in: {}
  related:
    - big-ball-of-mud
    - shared-database
    - facade
    - second-system-effect
  tell: null
  interview_only: false
  sources:
    - cite: Martin Fowler, Strangler Fig Application (bliki, 2004, since revised)
      url: https://martinfowler.com/bliki/StranglerFigApplication.html
      how: read
    - cite: Azure Architecture Center, Strangler Fig pattern
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/strangler-fig
      how: read
    - cite: Sam Newman, Monolith to Microservices (2019)
      url: null
      how: recalled
  example:
    before: |
      # all permit traffic goes to the legacy app
      route("/permits/*") -> legacy_permits_app

      # plan: rewrite the whole permit system, switch over in one release
    after: |
      fn route(request):
          if request.path.starts_with("/permits/apply") and flags.on("new_apply", request.user):
              return new_permits_service.handle(request)
          if request.path.starts_with("/permits/status"):
              return new_permits_service.handle(request)      # fully migrated
          return legacy_permits_app.handle(request)           # everything not yet moved

      # each capability moves behind the router; legacy is deleted when nothing reaches it
    note: A routing facade decides per capability which system answers, so migration happens in small, reversible
      steps.
  matters_most_for:
    - web-api
    - fullstack-web
    - distributed
    - platforms
- id: circuit-breaker
  name: Circuit Breaker
  family: pattern
  group: architecture
  says: >
    Wrap calls to a remote dependency in an object that counts failures and, past a threshold, fails calls
    immediately for a while instead of waiting on a service that is down, then lets a trial call through to
    see whether it has recovered.
  names: >
    Named and popularised by Michael Nygard in Release It! (2007), after electrical circuit breakers. Fowler's
    bliki entry (2014) is the common short reference. Netflix Hystrix (now in maintenance) made it mainstream;
    resilience4j, Polly and service meshes (Envoy, Istio) carry it now. States are closed, open and half-open.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A wrapper around an HTTP or RPC client with failure thresholds, an open-state timeout and a fallback.
    - Resilience library configuration (resilience4j, Polly, opossum, gobreaker) or a service-mesh outlier
      detection policy.
    - Fallback paths that return cached or default data when the breaker is open.
    - Metrics or alerts on breaker state changes.
  forces:
    - A slow or failing dependency ties up threads, connections or memory and drags down unrelated requests
      (cascading failure).
    - Retries are hammering a service that is already struggling to recover.
    - A degraded answer (cached, default, queued for later) is better than waiting for a timeout.
    - Many instances call the same dependency, so failures multiply.
  overuse:
    - Breakers around in-process or local calls, where they add overhead and nothing else.
    - A breaker standing in for proper error handling in business logic.
    - One breaker for a whole multi-tenant or sharded dependency, so one bad shard blocks all of them.
    - Application-level breakers duplicating what the service mesh or load balancer already does.
  remedy: null
  counter: >
    A breaker is only as good as its thresholds, timeouts and fallback. With long timeouts, threads still pile
    up before it trips; with tripping too eager, it flaps and causes outages of its own. Not every error
    should count (a 404 or a validation error isn't the dependency failing). In message-driven systems,
    retries with backoff and a dead-letter queue often do the job without a breaker, and Microsoft's guidance
    says to skip it where the platform already isolates failures. It complements retry rather than replacing
    it, and retry logic must stop when the breaker says the fault isn't transient.
  in:
    java: |
      resilience4j is the standard (Hystrix is in maintenance mode); Spring Cloud Circuit Breaker wraps it.
    csharp: >
      Polly provides circuit breakers, and Microsoft.Extensions.Http.Resilience builds Polly pipelines into
      HttpClient in .NET 8 and later.
    typescript: |
      opossum is the common Node library; in browsers the need is rarer, since the user is the retry loop.
    python: >
      Libraries exist (pybreaker, purgatory for asyncio) but are less standard than in Java or .NET; many
      Python services lean on the mesh or gateway instead.
    go: >
      sony/gobreaker is the common library; breakers usually wrap an http.RoundTripper so all calls through a
      client are covered.
    rust: >
      Less standardised; tower's middleware ecosystem and crates such as failsafe provide breakers, often
      layered on a tower Service.
  related:
    - proxy
    - fallacies-of-distributed-computing
    - state
    - murphys-law
  tell: null
  interview_only: false
  sources:
    - cite: Michael Nygard, Release It! (2007; 2nd ed. 2018), Circuit Breaker
      url: null
      how: recalled
    - cite: Martin Fowler, CircuitBreaker (bliki, 2014)
      url: https://martinfowler.com/bliki/CircuitBreaker.html
      how: read
    - cite: Azure Architecture Center, Circuit Breaker pattern
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/circuit-breaker
      how: read
  example:
    before: |
      fn address_for(order) -> Coordinates:
          for attempt in range(3):
              try: return geocoder.lookup(order.address, timeout=10s)
              except Timeout: continue
          raise GeocodingFailed()
      # when the geocoder is down, every order waits 30s and holds a worker
    after: |
      breaker = CircuitBreaker(failure_threshold=5, window=60s, open_for=30s)

      fn address_for(order) -> Coordinates:
          if breaker.is_open():
              return cached_coordinates(order.postcode)       # fail fast with a fallback
          try:
              coords = geocoder.lookup(order.address, timeout=2s)
              breaker.record_success()
              return coords
          except Timeout:
              breaker.record_failure()                        # trips to open past the threshold
              return cached_coordinates(order.postcode)
    note: After repeated failures, calls stop going to the geocoder for a while and return a fallback at once; a
      later trial call decides whether to close the breaker.
  matters_most_for:
    - distributed
    - web-api
    - serverless
    - platforms
- id: outbox
  name: Transactional Outbox
  family: pattern
  group: architecture
  says: >
    To change your database and publish a message reliably, write the message to an outbox table in the same
    local transaction as the change, and let a separate relay read the outbox and publish it to the broker.
  names: >
    Catalogued by Chris Richardson on microservices.io and in Microservices Patterns (2018), with transaction
    log tailing (change data capture) and polling publisher as its two relay styles. Also called the outbox
    pattern. Its mirror on the receiving side is the idempotent consumer, sometimes with an inbox table.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - An outbox or outgoing_messages table written inside the same transaction as the business change.
    - A relay worker or CDC connector (Debezium) that reads the outbox and publishes to Kafka, RabbitMQ or a
      cloud queue, then marks rows sent.
    - Consumers that record processed message ids to discard duplicates.
  forces:
    - Code commits to the database and then publishes to a broker, so a crash between the two loses the event,
      or publishes first and announces a change that was rolled back.
    - Two-phase commit across the database and broker isn't available or isn't wanted.
    - Downstream services, read models or sagas depend on every state change being announced, in order.
  overuse:
    - An outbox for a fire-and-forget notification where losing an occasional message is fine.
    - An outbox in a single-process app with no broker, where an in-process event after commit, or a database
      job table, would do.
    - Using it but leaving consumers non-idempotent, so the duplicates it can produce cause harm.
  remedy: null
  counter: >
    The outbox gives at-least-once delivery, not exactly-once: a relay that crashes after publishing but
    before marking the row will publish again, so consumers must be idempotent, which brokers usually require
    anyway. The relay is another moving part to run, monitor and scale, and polling adds latency. Ordering is
    only preserved per outbox and per partition key. If the event store is the source of truth (event
    sourcing), it already plays this role. Its value is that each service keeps its own database instead of
    sharing one, so it is part of the cost of avoiding a shared database.
  in:
    java: >
      Debezium's outbox event router is the common CDC-based relay; Spring Modulith and Axon also ship outbox
      support.
    csharp: >
      MassTransit and NServiceBus provide transactional outboxes on top of EF Core or SQL Server; Wolverine
      does the same.
    python: >
      Usually hand-rolled: an SQLAlchemy model for the outbox written in the same session, plus a worker that
      polls with SELECT ... FOR UPDATE SKIP LOCKED.
    go: >
      Hand-rolled or via libraries such as Watermill's forwarder; pass the same *sql.Tx to the business write
      and the outbox insert.
  related:
    - shared-database
    - saga
    - event-sourcing
    - cqrs
    - fallacies-of-distributed-computing
  tell: >
    Python, TypeScript, Java, C#, Go: inside one function, a database commit or save immediately followed (or
    preceded) by a publish or send to a message broker client (kafka, rabbitmq, sns, sqs, pubsub) with no
    outbox write. Only meaningful where the repo has adopted the outbox as its convention.
  interview_only: false
  sources:
    - cite: Chris Richardson, microservices.io, Pattern - Transactional outbox
      url: https://microservices.io/patterns/data/transactional-outbox.html
      how: read
    - cite: Chris Richardson, Microservices Patterns (2018), ch. 3
      url: null
      how: recalled
  example:
    before: |
      fn register_member(form):
          tx = db.begin()
          member = members.insert(tx, form)
          tx.commit()
          broker.publish("member.registered", {"id": member.id})
          # crash here or broker down: the member exists but nobody hears about it
    after: |
      fn register_member(form):
          tx = db.begin()
          member = members.insert(tx, form)
          outbox.insert(tx, topic="member.registered", payload={"id": member.id})
          tx.commit()                      # both rows or neither

      fn relay_loop():                     # separate worker
          for msg in outbox.unsent(limit=100):
              broker.publish(msg.topic, msg.payload)
              outbox.mark_sent(msg.id)     # a crash before this republishes; consumers dedupe
    note: The event is saved atomically with the change, and publishing becomes a retryable background job.
  matters_most_for:
    - distributed
    - event-driven
    - web-api
- id: saga
  name: Saga
  family: pattern
  group: architecture
  says: >
    Run a business transaction that spans several services as a sequence of local transactions, each
    triggering the next, and undo the completed steps with compensating actions if a later step fails.
  names: >
    Named by Hector Garcia-Molina and Kenneth Salem, "Sagas" (SIGMOD 1987), for long-lived transactions in a
    single database. Applied to microservices by Chris Richardson (microservices.io, Microservices Patterns,
    2018) and others. Comes in two styles: choreography (services react to each other's events) and
    orchestration (a coordinator tells each service what to do). Also related to process managers (Hohpe and
    Woolf) and durable workflow engines (Temporal, AWS Step Functions).
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - An orchestrator or process manager class with an explicit state per step and a compensation for each.
    - Pairs of actions such as reserve/release, charge/refund, book/cancel across services.
    - Saga state tables, or workflow definitions in Temporal, Step Functions or Camunda.
    - Events chaining services (OrderCreated, CreditReserved, CreditLimitExceeded) with no central coordinator.
  forces:
    - One business operation must change data owned by several services, each with its own database.
    - A distributed transaction (two-phase commit) is unavailable, too slow or too coupling.
    - Steps can take long (human approval, external providers), so locks can't be held.
  overuse:
    - Splitting a single operation across services that could share one database transaction, then needing a
      saga to stitch it back together (a sign the service boundary is wrong).
    - Choreographed sagas across many services, where nobody can see the whole flow.
    - Compensations that can't really undo (sent emails, shipped goods) treated as if they could.
  remedy: null
  counter: >
    Sagas give up isolation: other transactions see intermediate states, so lost updates and dirty reads are
    possible unless you add countermeasures (semantic locks, commutative updates, rereading values, putting
    risky steps after the pivot). Compensations must be designed, tested and can themselves fail, and every
    step must be idempotent because messages get redelivered. Debugging is hard as the number of services
    grows. Often the better fix is to redraw service boundaries so the transaction is local, or to keep the
    operation in a modular monolith. Choose orchestration once the flow has more than a few steps;
    choreography hides the process.
  in:
    java: >
      Axon, Eventuate Tram Sagas and Camunda are common; Temporal's Java SDK runs sagas as durable workflow
      code.
    csharp: >
      MassTransit state machines and NServiceBus sagas persist saga state; Durable Functions and Temporal's
      .NET SDK do workflow-style orchestration.
    go: >
      Temporal (written in Go) is the usual choice for orchestration; otherwise hand-rolled state machines
      over the outbox.
    typescript: >
      Temporal's TypeScript SDK or AWS Step Functions for orchestration; NestJS CQRS has a saga concept that
      is an event-stream reactor, not a compensating transaction, which confuses the name.
    python: >
      Temporal's Python SDK or Celery chains with explicit compensation; Celery alone gives no saga state or
      compensation.
  related:
    - outbox
    - event-sourcing
    - shared-database
    - distributed-monolith
    - command
  tell: null
  interview_only: false
  sources:
    - cite: Hector Garcia-Molina and Kenneth Salem, Sagas, SIGMOD 1987
      url: https://dl.acm.org/doi/10.1145/38713.38742
      how: recalled
    - cite: Chris Richardson, microservices.io, Pattern - Saga
      url: https://microservices.io/patterns/data/saga.html
      how: read
    - cite: Azure Architecture Center, Saga design pattern
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/saga
      how: read
  example:
    before: |
      fn rent_equipment(request):
          inventory_service.reserve(request.item_id, request.dates)
          payments_service.charge_deposit(request.customer_id, request.deposit)
          delivery_service.schedule(request.address, request.dates)
          # if scheduling fails, the item stays reserved and the deposit stays charged
    after: |
      class RentalSaga:                                    # orchestrator
          fn run(request):
              done = []
              try:
                  inventory_service.reserve(request.item_id, request.dates)
                  done.append(fn: inventory_service.release(request.item_id, request.dates))
                  payments_service.charge_deposit(request.customer_id, request.deposit)
                  done.append(fn: payments_service.refund_deposit(request.customer_id))
                  delivery_service.schedule(request.address, request.dates)
              except StepFailed:
                  for undo in reversed(done): undo()       # compensate in reverse order
                  raise RentalFailed()
      # each call is a local transaction in its own service; state is persisted between steps
    note: Each step is paired with a compensation, and a failure undoes the steps already done in reverse order
      instead of leaving partial changes.
  matters_most_for:
    - distributed
    - event-driven
    - serverless
- id: test-double-taxonomy
  name: Test Double taxonomy (dummy, stub, spy, mock, fake)
  family: pattern
  group: testing
  says: A test double is any stand-in for a real collaborator in a test, and it comes in five kinds that do
    different jobs. A dummy only fills a parameter. A stub hands back canned answers. A spy records how it was
    called. A mock checks the calls it gets against expectations. A fake is a working but simplified version,
    such as an in-memory store.
  names: Named by Gerard Meszaros in xUnit Test Patterns (2007), with Test Double as the umbrella term (after a
    stunt double). Fowler's bliki entry TestDouble and his article Mocks Aren't Stubs spread the vocabulary.
    In everyday speech, and in most libraries, "mock" is used for all five.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Every stand-in in a test suite called a mock, whatever it does, so reviewers can't tell a canned answer
      from a checked expectation.
    - Tests that set up a return value on a double and also verify the double was called, mixing stub and mock
      roles on one object.
    - Hand-written in-memory classes (InMemoryRepo, FakeClock) next to library-made mocks, with no shared
      naming for when to use which.
    - Doubles concentrated at the boundaries of the code (HTTP client, clock, queue, payment provider).
  forces:
    - The code under test talks to something slow, nondeterministic or with side effects (network, clock,
      randomness, email, payments).
    - A team argues about "too many mocks" without words to say which doubles are the problem.
    - Tests need to show an interaction happened (a message sent, an event published) where no return value or
      state shows it.
    - A collaborator is needed only to satisfy a signature.
  overuse:
    - Doubling collaborators that are cheap and deterministic, such as value objects, plain data and pure
      functions, which is mock-everything.
    - Reaching for mocks (expectation checking) where a stub would do, so tests pin call order and arguments
      that don't matter.
    - Policing the vocabulary in review when the test is already clear.
  remedy: null
  counter: >
    Using doubles at real boundaries is good practice: the network, the clock, other services, payment
    providers and anything slow or with side effects should be doubled in unit tests. The taxonomy is a tool
    for choosing the weakest double that does the job (dummy, then stub, then fake or spy, then mock), not an
    argument against doubles. The classical (Detroit) school, Beck's and Fowler's, prefers real objects and
    doubles only the awkward; the London (mockist) school of Freeman and Pryce mocks roles on purpose to drive
    interface design. Both are defensible. Libraries blur the lines: a Mockito or unittest.mock object is a
    stub, spy and mock at once depending on how it's used, so the names describe roles in a test rather than
    classes.
  in:
    python: >
      unittest.mock's Mock and MagicMock serve as stub, spy or mock depending on use; create_autospec or spec=
      keeps the double's surface matched to the real class. pytest's monkeypatch and pytest-mock patch at
      module level. Fakes are usually small hand-written classes.
    typescript: >
      jest.fn and vi.fn create spies that can also stub; sinon separates stubs, spies and mocks explicitly.
      For HTTP boundaries, msw intercepts requests rather than mocking the client. Structural typing makes a
      hand-written object literal an easy fake or stub.
    java: >
      Mockito is the default, and its mocks verify after the fact, so in Meszaros's terms they are mostly
      stubs and spies. WireMock doubles HTTP services, and Testcontainers replaces fakes with real databases
      or brokers in containers.
    csharp: >
      Moq, NSubstitute and FakeItEasy are the common libraries; NSubstitute and FakeItEasy lean towards
      stub-and-spy usage. EF Core's in-memory provider is a fake that Microsoft itself discourages for testing
      query behaviour; SQLite in-memory or Testcontainers are the usual alternatives.
    go: >
      Idiomatic Go favours hand-written fakes and stubs against small consumer-defined interfaces; httptest
      gives a real server for HTTP boundaries. gomock (now maintained as go.uber.org/mock) and testify/mock
      exist but are used less than in Java or C#.
    rust: >
      Doubles need a trait seam, or generics, at the boundary. mockall generates mocks from traits; many
      projects hand-write fakes instead. wiremock and httpmock double HTTP services.
  related:
    - mock-everything
    - fake-over-mock
    - fragile-test
    - hard-to-test-code
    - contract-test
  tell: null
  interview_only: false
  example:
    before: |
      test "reset sends a link":
          clock = Mock()
          clock.now.returns(t0)
          mailer = Mock()
          audit = Mock()
          service = PasswordReset(clock, mailer, audit)
          service.request("ana@example.com")
          verify(clock.now).called_once()
          verify(mailer.send).called_once()
          verify(audit.record).called_once()
    after: |-
      test "reset sends a link":
          clock = StubClock(now=t0)           # stub: canned answer, never verified
          mailer = SpyMailer()                # spy: records what was sent
          audit = StubAudit()                 # stub: accepts record() and does nothing
          service = PasswordReset(clock, mailer, audit)
          service.request("ana@example.com")
          assert mailer.sent[0].to == "ana@example.com"
          assert mailer.sent[0].link_expires == t0 + 1h
    note: Each double does one job, the clock is no longer verified for being asked the time, and the test checks
      the email that went out rather than that a method ran.
  sources:
    - cite: Gerard Meszaros, xUnit Test Patterns (2007), Test Double and its variations
      url: http://xunitpatterns.com/Test%20Double.html
      how: recalled
    - cite: Martin Fowler, bliki, TestDouble
      url: https://martinfowler.com/bliki/TestDouble.html
      how: read
    - cite: Martin Fowler, Mocks Aren't Stubs
      url: https://martinfowler.com/articles/mocksArentStubs.html
      how: recalled
    - cite: Steve Freeman and Nat Pryce, Growing Object-Oriented Software, Guided by Tests (2009)
      url: http://www.growing-object-oriented-software.com/
      how: recalled
  matters_most_for:
    - web-api
    - fullstack-web
    - distributed
    - event-driven
- id: golden-master-test
  name: Golden Master Test (approval, snapshot or golden-file test)
  family: pattern
  group: testing
  says: Capture the whole output of the code once, have a person check and approve it, store it, and fail the
    test whenever later output differs. It is the right tool when the output itself is the contract, as with
    renderers, formatters, compilers, CLI text and serialisers.
  names: Michael Feathers described characterization tests in Working Effectively with Legacy Code (2004), the
    legacy-code use of the idea. Llewellyn Falco named and built Approval Tests. Jest popularised the name
    snapshot testing in 2016. Go and compiler projects say golden files.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A testdata, __snapshots__, goldens or approved directory of expected outputs next to the tests.
    - Tests that render or serialise something and compare the whole result with one call.
    - An update flag or command (-update, --snapshot-update, UPDATE_GOLDENS=1, cargo insta review).
    - Diffs to stored outputs appearing in the same commits as behaviour changes.
  forces:
    - The output is large and structured (text, markup, ASTs, reports), and asserting on pieces of it misses
      regressions in the rest.
    - The output is what users or other programs consume, so any change to it is a change to the contract.
    - Legacy code with unknown behaviour that must be pinned before refactoring.
    - Many hand-written asserts on substrings that keep being added after each bug.
  overuse:
    - Snapshotting objects whose exact output nobody cares about, so every refactor rewrites dozens of
      snapshots and they get updated without reading.
    - Snapshots with timestamps, random ids or ordering noise, which make them fail for no reason or force
      scrubbing logic.
    - Huge snapshots where a reviewer can't see what the diff means.
    - Using a snapshot where one plain assertion states the intent better.
  remedy: null
  counter: "A golden test says what the output is, not why, so a reviewer can't tell from the test which parts
    matter. The main risk is approval without reading: when updating is one command, people run it to make the
    build green, and the test then pins whatever the code does, bugs included. Keep the update a reviewed
    step, keep outputs small and deterministic, and pair goldens with a few targeted asserts for the rules
    that matter most. Where the output is not the contract, as with an internal object's repr or a component
    tree under heavy development, snapshots become the Fragile Test smell. Justin Searls has argued that
    snapshot tests mostly get updated without being read, and Kent C. Dodds that snapshots beyond a few dozen
    lines become a maintenance burden and should be small and focused."
  in:
    python: >
      syrupy and pytest-snapshot for pytest, and approvaltests for Python. A hand-rolled golden file with an
      environment variable to rewrite it is also common.
    typescript: >
      toMatchSnapshot and toMatchInlineSnapshot in Jest and Vitest; inline snapshots keep the expected value
      in the test, which reviews better for small outputs. Update with -u.
    java: |
      ApprovalTests.Java and Selfie; otherwise files under src/test/resources compared by hand.
    csharp: >
      Verify (by Simon Cropp) is the common choice, with scrubbers for dates and guids; ApprovalTests.Net is
      the older option.
    go: >
      Golden files under testdata/ with an -update flag defined in the test is the house style, used across
      the Go toolchain itself; libraries such as goldie wrap it.
    rust: >
      insta, with cargo insta review for approving changes interactively; expect-test for inline expectations,
      used by rust-analyzer.
  related:
    - fragile-test
    - obscure-test
    - erratic-test
    - property-based-test
  tell: null
  interview_only: false
  example:
    before: |
      test "receipt text":
          out = render_receipt(sample_order)
          assert "Total: 42.00" in out
          assert "Coffee x2" in out
          assert "VAT" in out
          # the layout, alignment and every other line can regress unnoticed
    after: |
      test "receipt text":
          out = render_receipt(sample_order)
          expected = read_file("goldens/receipt_basic.txt")
          if env("UPDATE_GOLDENS"):
              write_file("goldens/receipt_basic.txt", out)
          assert out == expected
          # changes show up as a diff to receipt_basic.txt in review
    note: The receipt's text is what customers see, so the whole of it is pinned and every change to it is a
      reviewed diff.
  sources:
    - cite: Michael Feathers, Working Effectively with Legacy Code (2004), characterization tests
      url: https://www.oreilly.com/library/view/working-effectively-with/0131177052/
      how: recalled
    - cite: Approval Tests
      url: https://approvaltests.com/
      how: read
    - cite: Jest documentation, Snapshot Testing
      url: https://jestjs.io/docs/snapshot-testing
      how: recalled
    - cite: Kent C. Dodds, Effective Snapshot Testing
      url: https://kentcdodds.com/blog/effective-snapshot-testing
      how: recalled
  matters_most_for:
    - compilers-tooling
    - cli-devtool
    - tui
    - library-sdk
- id: test-data-builder
  name: Test Data Builder
  family: pattern
  group: testing
  says: Build the objects a test needs through a builder that fills every field with a safe default, so each
    test sets only the fields that matter to it and reads as what makes the case special.
  names: Named by Nat Pryce (2007) as an alternative to the Object Mother, and covered in Freeman and Pryce's
    Growing Object-Oriented Software. Object Mother was named at ThoughtWorks (Schuh and Punke). Meszaros's
    nearby patterns are Creation Method and Parameterized Creation Method.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Builders or factory functions in test helpers (a_customer(), OrderBuilder, make_user(**overrides)).
    - Tests that name one or two fields when creating a domain object, with everything else defaulted.
    - Factory libraries in the test dependencies (factory_boy, Fishery, AutoFixture, Bogus).
  forces:
    - Domain objects with many required fields, so each test repeats a long constructor call.
    - A new required field breaks dozens of tests that don't care about it.
    - Tests where the one value that matters is lost among ten that don't (Obscure Test).
    - An Object Mother with a growing list of named variants (expired_customer, vip_customer_with_two_orders).
  overuse:
    - A builder for a type with two fields, where the constructor is already clear.
    - Defaults that hide something the test depends on, so the reader can't see why it passes.
    - Builders that grow their own logic and need their own tests.
    - Random default values (fake names, random dates) that make tests erratic.
  remedy: null
  counter: >
    Defaults move information out of the test, and a test that silently relies on a default is harder to read
    than one that spells out its data. State in the test every value the assertion depends on, even when it
    matches the default. For small types a constructor call or a named factory function is clearer than a
    builder class. Languages with named and default arguments get most of the benefit from a plain function
    with keyword overrides, without the builder ceremony. Some argue the need for elaborate builders is itself
    a sign the domain objects have too many required fields.
  in:
    python: >
      Usually a function with keyword overrides (make_order(status="paid")) or dataclasses.replace on a
      default instance; factory_boy for ORM models.
    typescript: >
      A function taking a Partial of the type and spreading it over defaults is the common shape; Fishery and
      similar libraries add sequences and associations.
    java: >
      Builder classes with withX methods are the classic form, and Lombok's @Builder(toBuilder = true) can
      generate them; Instancio fills objects automatically.
    csharp: >
      Builder classes, or a default record copied with the with expression; AutoFixture and Bogus generate
      data, though random values need care.
    go: >
      A constructor function in a _test.go file returning a default struct that the test then modifies, or
      functional options.
    rust: >
      Default plus struct update syntax (Order { status: Paid, ..test_order() }) covers most cases; derive
      builders exist but are rarely needed in tests.
  related:
    - obscure-test
    - test-code-duplication
    - builder
    - fluent-interface
    - fragile-test
  tell: null
  interview_only: false
  example:
    before: |
      test "expired policy can't be renewed online":
          policy = Policy("P-1", holder, "home", 250.00, "EUR",
                          date(2020, 1, 1), date(2021, 1, 1),
                          "monthly", false, [])
          assert not policy.can_renew_online(today=date(2024, 5, 1))
      # which of these ten values makes the case?
    after: |-
      fn a_policy() -> PolicyBuilder:
          return PolicyBuilder(holder=a_holder(), kind="home", premium=250.00,
                               starts=date(2024, 1, 1), ends=date(2025, 1, 1), ...)

      test "expired policy can't be renewed online":
          policy = a_policy().ending(date(2024, 4, 30)).build()
          assert not policy.can_renew_online(today=date(2024, 5, 1))
    note: The test names only the end date it depends on, and a new required field changes the builder rather than
      every test.
  sources:
    - cite: Nat Pryce, Test Data Builders, an alternative to the Object Mother pattern (2007)
      url: http://www.natpryce.com/articles/000714.html
      how: recalled
    - cite: Steve Freeman and Nat Pryce, Growing Object-Oriented Software, Guided by Tests (2009), ch. 22
      url: http://www.growing-object-oriented-software.com/
      how: recalled
    - cite: Martin Fowler, bliki, ObjectMother
      url: https://martinfowler.com/bliki/ObjectMother.html
      how: recalled
    - cite: Gerard Meszaros, xUnit Test Patterns (2007), Creation Method
      url: http://xunitpatterns.com/Creation%20Method.html
      how: recalled
  matters_most_for:
    - web-api
    - fullstack-web
- id: fluent-interface
  name: Fluent Interface
  family: pattern
  group: design
  says: An API designed to read like a sentence in the problem's language, usually by chaining calls that each
    return an object to continue from. Method chaining is the common mechanism, but the aim is readable call
    sites, not chaining itself.
  names: Named by Martin Fowler and Eric Evans after a workshop in 2005, in Fowler's bliki entry
    FluentInterface. Fowler later covered it as an internal DSL technique in Domain-Specific Languages (2010).
    Related to, but not the same as, the Builder pattern.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Methods that return this, self or a new stage object, used in long chains.
    - Query builders, assertion libraries, HTTP clients and configuration APIs (where(), expect().toBe(),
      services.AddX().AddY()).
    - Staged builder interfaces where each step returns a type that offers only the valid next steps.
  forces:
    - Call sites that set many options through a series of setters and temporary variables, hard to read as
      one statement.
    - A domain with a natural phrasing (queries, schedules, assertions, routing rules) used by many callers.
    - A library whose call sites are read far more than its source.
  overuse:
    - Chains for objects with two or three settings, where a constructor with named arguments is clearer.
    - Mutating chains on shared objects, so a half-built chain kept in a variable changes when another branch
      continues it.
    - Long chains that are hard to debug, step through or read in a stack trace.
    - Method names that make sense only inside the chain (with, and, then), which read badly anywhere else.
  remedy: null
  counter: >
    Fowler says fluency costs more effort to design and build than plain setters and constructors, and that
    fluent methods break command-query separation by returning values from modifiers. Individual methods read
    poorly on their own in docs and completions. Chains hide intermediate state from debuggers, and a mutating
    chain that returns the same object can surprise callers who keep a reference. In languages with named and
    default arguments, a single call with keyword arguments often reads just as well. Keep fluent interfaces
    for libraries used widely enough to repay the design effort.
  in:
    python: >
      Less common, since keyword arguments cover most configuration; seen in query builders (SQLAlchemy's
      select().where()), pandas method chains and some assertion libraries.
    typescript: >
      Common in query builders, test assertions (expect().toEqual()) and schema libraries (zod); generics can
      type staged chains so invalid next steps don't compile.
    java: >
      Widespread: Stream API, builders, AssertJ, jOOQ and Spring's configuration DSLs. Lombok's @Builder
      generates the chained builder shape.
    csharp: >
      LINQ method syntax, FluentAssertions, Entity Framework's model builder and the AddX extension methods on
      service collections all use it; extension methods let a library add fluent steps to types it doesn't
      own.
    go: >
      Uncommon and often seen as unidiomatic, because methods returning the receiver can't also return an
      error cleanly; functional options and config structs are preferred.
    rust: >
      Builder chains are idiomatic (std::process::Command, reqwest), either by value (self) or by &mut self;
      iterator adapters are a fluent interface over lazy sequences.
  related:
    - builder
    - command-query-separation
    - message-chains
    - law-of-demeter
    - test-data-builder
  tell: null
  interview_only: false
  example:
    before: |
      search = JobSearch()
      search.set_role("backend engineer")
      search.set_city("Oslo")
      search.set_remote_allowed(true)
      search.set_max_age_days(7)
      search.set_sort("newest")
      results = board.run(search)
    after: |
      results = board.jobs()
          .for_role("backend engineer")
          .in_city("Oslo")
          .remote_ok()
          .posted_within(days=7)
          .newest_first()
          .run()
    note: The query reads as one statement in the job board's own terms; each step returns the search so far.
  sources:
    - cite: Martin Fowler, bliki, FluentInterface (2005)
      url: https://martinfowler.com/bliki/FluentInterface.html
      how: read
    - cite: Martin Fowler, Domain-Specific Languages (2010), Method Chaining
      url: https://martinfowler.com/books/dsl.html
      how: recalled
  matters_most_for:
    - library-sdk
- id: model-view-update
  name: Model-View-Update (The Elm Architecture)
  family: pattern
  group: architecture
  says: >
    A UI is one model value, an update function that takes a message and the model and returns the new model
    plus any commands (effects for the runtime to run), and a view function that renders the model. All change
    goes through update, and all effects go out as commands.
  names: >
    Evan Czaplicki's Elm, described in the Elm guide as "The Elm Architecture" (TEA); the guide says the
    pattern emerged from early Elm programs rather than being designed up front. Model-View-Update (MVU) is
    the language-neutral name. Redux credits Elm as an influence, and its reducers are the update half.
    Descendants include Elmish and Fabulous (F#), Bubble Tea (Go), Iced (Rust), and The Composable
    Architecture (Swift). Related to Flux's unidirectional data flow.
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - tui
    - web-frontend
    - desktop
    - mobile
  looks_like:
    - A message type (a sum type, a union of tagged objects, or a set of message structs) listing every event
      the UI reacts to.
    - An update or reducer with one switch or match on the message, returning a new model and a command or
      list of effects.
    - A view function that reads the model and returns a description of the screen, with no state changes in
      it.
    - Effects (HTTP, timers, file reads) wrapped as commands whose results come back as messages.
    - Parent models that hold child models and route messages down to the child's update.
  forces:
    - UI state is mutated from many handlers and callbacks, and it is hard to tell how it got into a given
      state.
    - Handlers mix I/O, state changes and rendering, so the UI can only be tested by driving it.
    - Async results arrive in any order and race with user input.
    - You want replay, undo, time-travel debugging, or tests that feed messages and check the model.
  overuse:
    - Routing every keystroke of a small form or a one-screen tool through messages and commands when local
      widget state would be simpler.
    - Deep trees of nested models, each with its own message type and forwarding boilerplate, built to imitate
      reusable components.
    - Putting ephemeral view state (hover, scroll position, focus) into the global model when the toolkit
      already manages it.
    - Doing I/O inside update "just this once", which keeps the boilerplate and loses the guarantees.
  remedy: null
  counter: >
    MVU costs boilerplate: every interaction needs a message, a branch in update and often a command, and
    nested components need message wrapping and routing. The Elm community itself warns against modelling
    everything as reusable stateful components. Frameworks built on local reactive state (React hooks, signals
    in Solid or Vue, Textual's reactive attributes) argue that colocated state is easier to follow for most
    screens, and two-way-binding MVVM toolkits (WPF, SwiftUI's bindings) take the opposite route. Re-running
    the view on every message can be costly without memoisation or diffing. Games often use an
    entity-component system or a fixed-step loop instead. The long switch on the message in update is the
    idiom here, not the switch-statements smell.
  in:
    python: >
      No mainstream Python UI framework is MVU; Textual uses widget-local reactive attributes and message
      handlers. A hand-written loop over a dataclass model and a match on message classes works for small
      TUIs.
    typescript: >
      Redux reducers and React's useReducer are the update half, with views as components reading the store.
      Redux Toolkit lets reducers look mutating because Immer produces the new state. Effects go through
      thunks, sagas or listener middleware rather than Elm-style commands.
    csharp: >
      Mostly met in F# (Elmish, Fabulous). For C#, MVVM with data binding is the norm in WPF and MAUI; MVU
      experiments exist but aren't mainstream.
    go: >
      Bubble Tea is MVU: a model with Init, Update(msg) returning (Model, Cmd) and View. Keep I/O out of
      Update and View; run it in a tea.Cmd returning a message. Models are usually passed by value, and parent
      models forward messages to child models' Update.
    rust: >
      Iced is MVU: update(&mut self, Message) returns a Task for effects, and view(&self) builds elements.
      Ratatui apps often hand-write the same loop; Ratatui's docs describe The Elm Architecture as one option.
      A Message enum and exhaustive match fit Rust well.
  related:
    - functional-core-imperative-shell
    - state
    - observer
    - command
    - immutability-by-default
    - make-illegal-states-unrepresentable
    - ui-thread-confinement
    - event-sourcing
    - switch-statements
  tell: null
  interview_only: false
  example:
    before: |
      class SearchScreen:
          query: str
          results: list
          fn on_key(key):
              self.query += key
              self.results = api.search(self.query)     # I/O in the handler
              self.redraw()
          fn on_clear():
              self.query = ""
              self.results = []
              self.redraw()
    after: |-
      class Model: query: str; results: list
      # Msg = KeyPressed(key) | Cleared | ResultsArrived(for_query, items)

      fn update(msg, m: Model) -> (Model, Cmd):
          match msg:
              KeyPressed(k): q = m.query + k; return (Model(q, m.results), search_cmd(q))
              Cleared: return (Model("", []), no_cmd)
              ResultsArrived(q, items):
                  if q != m.query: return (m, no_cmd)      # stale answer, ignore
                  return (Model(m.query, items), no_cmd)

      fn view(m: Model) -> Screen:
          return column(input_box(m.query), result_list(m.results))
    note: State changes only in update, which is pure and testable with plain messages; the search runs as a
      command whose answer comes back as a message.
  sources:
    - cite: Evan Czaplicki et al., An Introduction to Elm, The Elm Architecture
      url: https://guide.elm-lang.org/architecture/
      how: read
    - cite: An Introduction to Elm, Commands and Subscriptions
      url: https://guide.elm-lang.org/effects/
      how: recalled
    - cite: Redux documentation, Prior Art (Elm)
      url: https://redux.js.org/understanding/history-and-design/prior-art
      how: recalled
    - cite: Bubble Tea README and tutorials (Go)
      url: https://github.com/charmbracelet/bubbletea
      how: recalled
    - cite: Iced documentation, architecture (Rust)
      url: https://docs.rs/iced/latest/iced/
      how: recalled
