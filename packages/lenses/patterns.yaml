      url: https://refactoring.guru/design-patterns/abstract-factory
      how: read
    - cite: Refactoring.Guru, Abstract Factory in Python
      url: https://refactoring.guru/design-patterns/abstract-factory/python/example
      how: read
    - cite: Peter Norvig, Design Patterns in Dynamic Languages (1996)
