- id: active-record
  name: Active Record
  family: pattern
  group: design
  says: >
    Let each object wrap one database row and carry both its persistence (save, find, delete) and its domain
    logic, so the class and the table are the same shape.
  names: >
    Named in Fowler's PoEAA (2002). Ruby on Rails named its ORM after it (2004), and Django's ORM, Laravel's
    Eloquent and Sequelize follow the same pattern.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Model classes inheriting from an ORM base class, with save(), delete() and class-level finders.
    - Business methods on the same model class that calls save on itself.
    - Fields on the class that match the table's columns one to one.
  forces:
    - The domain objects map closely to tables.
    - Logic is moderate and mostly about one record at a time.
    - The framework is built around it (Rails, Django, Laravel), and fighting it costs more than it saves.
  overuse:
    - Complex rules spread across callbacks (before_save, signals) that fire in surprising orders.
    - Models that grow into god objects mixing validation, persistence, formatting and integrations.
    - Unit tests that need a database because every object is bound to one.
  remedy: null
  counter: >
    Active Record couples domain objects to the schema and the database, which hurts when the object model and
    tables diverge or logic gets complex; that is when Fowler points to Data Mapper. Its critics (Robert
    Martin among them) say it mixes persistence and domain concerns. Its defenders, notably the Rails
    community, answer that for most web apps the coupling is the point, because it removes a whole mapping
    layer. Pick by how far the domain will drift from the tables.
  in:
    python: >
      Django models are Active Records; fat models with manager methods are the Django idiom. SQLAlchemy's ORM
      is a Data Mapper even with declarative classes, though it can be used in an Active-Record style.
    typescript: >
      TypeORM supports both styles (BaseEntity for Active Record, repositories for Data Mapper). Sequelize and
      Objection lean Active Record. Prisma is neither; its models are plain data returned by a client.
    java: >
      Rare in the Spring and JPA world, which is Data Mapper; ActiveJDBC and Panache's PanacheEntity in
      Quarkus bring the style to Java.
    csharp: |
      Uncommon; EF Core is a Data Mapper. Some micro-ORMs and older frameworks (Castle ActiveRecord) used it.
    go: >
      Uncommon and often seen as unidiomatic; GORM gives a partial version, but most Go code keeps structs
      plain and queries separate.
    rust: >
      Not the usual style; Diesel and sqlx keep structs as plain data and queries as separate functions.
      SeaORM offers an ActiveModel type that borrows the name.
  related:
    - data-mapper
    - domain-model
    - table-data-gateway
    - god-object
    - large-class
    - repository
  tell: null
  interview_only: false
  sources:
    - cite: Martin Fowler, Patterns of Enterprise Application Architecture, Active Record (catalog summary)
      url: https://martinfowler.com/eaaCatalog/activeRecord.html
      how: read
    - cite: Ruby on Rails Guides, Active Record Basics
      url: https://guides.rubyonrails.org/active_record_basics.html
      how: recalled
  example:
    before: |
      fn redeem_coupon(db, code, order_id):
          row = db.query_one("SELECT * FROM coupons WHERE code = ?", code)
          if row.uses >= row.max_uses: raise Exhausted()
          db.execute("UPDATE coupons SET uses = uses + 1 WHERE code = ?", code)
          db.execute("INSERT INTO redemptions VALUES (?, ?)", code, order_id)

      # every caller that touches coupons writes its own SQL and its own exhaustion check
    after: |
      class Coupon extends Record:          # table: coupons
          code: str
          uses: int
          max_uses: int

          fn redeem(order_id):
              if self.uses >= self.max_uses: raise Exhausted()
              self.uses += 1
              self.save()
              Redemption.create(code=self.code, order_id=order_id)

      Coupon.find_by(code=code).redeem(order_id)
    note: The row, its persistence and its rule sit in one class, which works while coupons and the table stay the
      same shape.
  matters_most_for:
    - fullstack-web
    - web-api
- id: data-mapper
  name: Data Mapper
  family: pattern
  group: design
  says: >
    Move data between domain objects and the database with a separate mapping layer, so the domain objects
    know nothing about tables and the schema can differ from the object model.
  names: >
    Named in Fowler's PoEAA (2002). Hibernate and JPA, EF Core, SQLAlchemy's ORM and Doctrine are Data
    Mappers; most people meet it as "the ORM" without the name.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Domain classes with no base class from the ORM and no save methods.
    - Mapping configuration in separate files or classes (EF configurations, SQLAlchemy registry, ORM XML or
      annotations kept to the infrastructure layer).
    - Hand-written mappers with to_domain and from_domain functions between row structs and domain types.
  forces:
    - The object model and the schema have diverged (value objects spread over columns, inheritance, legacy
      tables).
    - Domain logic needs to be tested without a database.
    - A rich domain model must not depend on the persistence technology.
  overuse:
    - Hand-written mappers for objects that are identical to their rows, doubling every change.
    - A separate domain type and persistence type for each table in a CRUD app.
  remedy: null
  counter: >
    The independence costs a mapping layer, and hand-written mappers are tedious and drift. When the domain
    mirrors the tables, Active Record or plain queries into structs is simpler. Full ORMs that implement this
    pattern are also where Ted Neward's "Vietnam of computer science" critique of object-relational mapping
    lands: the mismatch never fully goes away, so expect to drop to SQL for reports and bulk work.
  in:
    java: >
      JPA and Hibernate are Data Mappers, but annotations on entity classes put mapping metadata on the domain
      object; purists use orm.xml or separate persistence entities.
    csharp: >
      EF Core with IEntityTypeConfiguration classes keeps mapping out of entities; Dapper is a thin mapper
      from rows to objects with SQL you write.
    python: >
      SQLAlchemy is a Data Mapper; its imperative (classical) mapping lets domain classes stay plain, as
      Cosmic Python shows.
    typescript: >
      TypeORM in repository mode and MikroORM are Data Mappers. With Prisma, a hand-written mapper from Prisma
      types to domain types is the common way to keep the domain independent.
    go: >
      Usually explicit: sqlc or database/sql scans into row structs, and a small function converts to domain
      types when they differ.
    rust: >
      sqlx's FromRow and Diesel's Queryable map rows to structs; separate domain types with From or TryFrom
      conversions are the idiom when they differ.
  related:
    - active-record
    - repository
    - unit-of-work
    - identity-map
    - domain-model
    - law-of-leaky-abstractions
  tell: null
  interview_only: false
  sources:
    - cite: Martin Fowler, Patterns of Enterprise Application Architecture, Data Mapper (catalog summary)
      url: https://martinfowler.com/eaaCatalog/dataMapper.html
      how: read
    - cite: Ted Neward, The Vietnam of Computer Science (2006)
      url: https://www.odbms.org/wp-content/uploads/2013/11/031.01-Neward-The-Vietnam-of-Computer-Science-June-2006.pdf
      how: recalled
  example:
    before: |
      class Patient extends Record:          # table: patients
          first_name: str
          last_name: str
          dob_text: str                       # legacy column, "DD/MM/YYYY"
          fn age() -> int: return years_since(parse_date(self.dob_text))
          fn admit(ward): ... self.save()

      # domain code parses legacy column formats and can't be tested without a database
    after: |
      class Patient:                          # plain domain object
          name: PersonName
          birth_date: Date
          fn age() -> int: return years_since(self.birth_date)

      class PatientMapper:
          fn to_domain(row) -> Patient:
              return Patient(PersonName(row.first_name, row.last_name), parse_date(row.dob_text))
          fn to_row(p: Patient) -> PatientRow: ...
    note: The schema's quirks stay in the mapper, and the domain object is plain and testable on its own.
  matters_most_for:
    - web-api
    - databases-storage
- id: unit-of-work
  name: Unit of Work
  family: pattern
  group: design
  says: >
    Track every object a business operation loads, creates or changes, then write all the changes out together
    in one commit, so the operation succeeds or fails as a whole.
  names: >
    Named in Fowler's PoEAA (2002). Implemented as Hibernate's Session and JPA's EntityManager, EF Core's
    DbContext, SQLAlchemy's Session.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A session or context object opened per request or per use case, with a single commit at the end.
    - Domain code that changes objects and never calls save on each one.
    - Context managers or middleware that commit on success and roll back on error.
  forces:
    - One operation changes several objects or tables that must stay consistent.
    - Code saves each object as it goes, so a failure halfway leaves partial writes.
    - Writes are chatty, and batching them would cut round trips.
  overuse:
    - Wrapping an ORM session that already is a unit of work in a custom one with the same methods.
    - Units of work that span user think-time or long jobs, holding locks or stale state.
  remedy: null
  counter: >
    Change tracking is implicit magic: objects mutated anywhere get written at commit, which surprises people
    and makes it easy to persist something by accident. Without an ORM, a plain database transaction around
    the operation gives the same all-or-nothing behaviour more visibly. Writing your own unit of work is
    rarely worth it when the ORM has one.
  in:
    python: >
      SQLAlchemy's Session is the unit of work; Cosmic Python wraps it in an explicit UoW context manager to
      keep the service layer storage-agnostic. Django uses transaction.atomic around explicit saves instead.
    java: >
      The JPA persistence context, with Spring's @Transactional marking the boundary; dirty checking flushes
      changed entities at commit.
    csharp: >
      DbContext tracks changes and SaveChanges commits them; one DbContext per request is the ASP.NET Core
      default lifetime.
    typescript: >
      TypeORM's EntityManager inside a transaction and MikroORM's EntityManager (an explicit unit of work with
      identity map) fit; Prisma has no change tracking, so $transaction groups explicit writes instead.
    go: >
      No change tracking; the idiom is a *sql.Tx passed to every write in the operation, committed once, often
      through a helper that takes a function and handles rollback.
    rust: >
      A sqlx Transaction or Diesel's conn.transaction closure; dropping a sqlx transaction without commit
      rolls it back, which gives all-or-nothing by construction.
  related:
    - identity-map
    - repository
    - data-mapper
    - service-layer
  tell: null
  interview_only: false
  sources:
    - cite: Martin Fowler, Patterns of Enterprise Application Architecture, Unit of Work (catalog summary)
      url: https://martinfowler.com/eaaCatalog/unitOfWork.html
      how: read
    - cite: Harry Percival and Bob Gregory, Architecture Patterns with Python (Cosmic Python), ch. 6
      url: https://www.cosmicpython.com/book/chapter_06_uow.html
      how: recalled
  example:
    before: |
      fn transfer_stock(sku, qty, from_wh, to_wh):
          src = warehouses.get(from_wh)
          src.remove(sku, qty)
          warehouses.save(src)
          dst = warehouses.get(to_wh)
          dst.add(sku, qty)               # raises: destination full
          warehouses.save(dst)
          # stock has left the source and arrived nowhere
    after: |
      fn transfer_stock(uow, sku, qty, from_wh, to_wh):
          with uow:
              src = uow.warehouses.get(from_wh)
              dst = uow.warehouses.get(to_wh)
              src.remove(sku, qty)
              dst.add(sku, qty)
              uow.commit()                # both changes, or neither
    note: The changes are collected and written once, so a failure partway rolls back the whole transfer.
  matters_most_for:
    - web-api
    - databases-storage
- id: table-data-gateway
  name: Table Data Gateway
  family: pattern
  group: design
  says: >
    Put all the SQL for one table behind one object with plain methods (find, insert, update by id), and hand
    back plain data, so the rest of the code never builds queries. Row Data Gateway is the per-row variant.
  names: >
    Table Data Gateway and Row Data Gateway are both named in Fowler's PoEAA (2002), as specialisations of his
    Gateway pattern. The usual modern names are DAO (Data Access Object, from Sun's Core J2EE Patterns) or a
    store or queries module. Row Data Gateway is one object per row with no domain logic; add the logic and it
    becomes Active Record.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A class or module per table (ShipmentsTable, shipment_store, ShipmentDao) whose methods each run one
      query and return records.
    - Generated query code (sqlc, jOOQ DAOs) used directly by services.
    - No business rules in the gateway; it returns rows, structs or record sets.
  forces:
    - SQL strings are scattered through handlers and services.
    - The logic is a transaction script and needs a clean place to put data access.
    - You want hand-written or generated SQL rather than an ORM.
  overuse:
    - Gateways per table forced into a domain where operations span several tables, so services stitch joins
      together in memory (and fall into N+1).
    - Adding business rules to the gateway, turning it into a muddled Active Record.
  remedy: null
  counter: >
    It is table-shaped, so operations that span tables either need gateway methods that break the one-table
    rule or end up joining in application code. With a real domain model, a repository that returns domain
    objects fits better. For simple services, though, a gateway over hand-written SQL is often clearer than an
    ORM.
  in:
    go: >
      The common Go shape: a store struct over *sql.DB with one method per query, or code generated by sqlc
      from SQL files.
    rust: >
      Modules of functions running sqlx query_as! macros against a pool, returning row structs; the
      compile-time checked queries make this an attractive default.
    java: >
      DAOs with JdbcTemplate or jOOQ; jOOQ generates both per-table DAOs and record classes (a Row Data
      Gateway).
    csharp: |
      Dapper-based classes per table are the usual form outside EF Core.
    python: A module of functions over SQLAlchemy Core or raw SQL. A crud module of query functions over SQLModel
      in a FastAPI app is close to this shape.
    typescript: >
      Kysely or Drizzle query modules per table; with Prisma, the generated client already is a per-model
      gateway.
  related:
    - active-record
    - repository
    - transaction-script
    - data-mapper
    - n-plus-one-queries
  tell: null
  interview_only: false
  sources:
    - cite: Martin Fowler, Patterns of Enterprise Application Architecture, Table Data Gateway (catalog summary)
      url: https://martinfowler.com/eaaCatalog/tableDataGateway.html
      how: read
    - cite: Martin Fowler, Patterns of Enterprise Application Architecture, Row Data Gateway (catalog summary)
      url: https://martinfowler.com/eaaCatalog/rowDataGateway.html
      how: read
    - cite: Sun Microsystems, Core J2EE Patterns, Data Access Object
      url: https://www.oracle.com/java/technologies/dataaccessobject.html
      how: recalled
  example:
    before: |
      fn track_page(db, tracking_no):
          s = db.query_one("SELECT * FROM shipments WHERE tracking_no = ?", tracking_no)
          ...
      fn mark_delivered(db, tracking_no, at):
          db.execute("UPDATE shipments SET status = 'delivered', delivered_at = ? "
                     + "WHERE tracking_no = ?", at, tracking_no)
      fn late_report(db):
          return db.query("SELECT * FROM shipments WHERE eta < now() AND status != 'delivered'")
    after: |
      class ShipmentsTable:
          fn init(db): ...
          fn by_tracking_no(no: str) -> ShipmentRow: ...
          fn late() -> list[ShipmentRow]: ...
          fn set_delivered(no: str, at: Time): ...

      fn track_page(shipments, tracking_no): s = shipments.by_tracking_no(tracking_no) ...
      fn mark_delivered(shipments, tracking_no, at): shipments.set_delivered(tracking_no, at)
      fn late_report(shipments): return shipments.late()
    note: The SQL for the table has one home, and callers work with plain rows through named methods.
