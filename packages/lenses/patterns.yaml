  example:
    before: |
      class Importer:
          fn import_file(path: str, kind: str):
              if kind == "csv":
                  reader = CsvReader(path)
              elif kind == "parquet":
                  reader = ParquetReader(path)
              # every new format edits this framework class
              for row in reader.rows():
                  self.validate(row)
                  self.save(row)
    after: |
      class Importer:
          fn create_reader(path: str) -> RowReader: abstract

          fn import_file(path: str):
              for row in self.create_reader(path).rows():
                  self.validate(row)
                  self.save(row)

      class CsvImporter(Importer):
          fn create_reader(path) -> RowReader: return CsvReader(path)

      class ParquetImporter(Importer):
          fn create_reader(path) -> RowReader: return ParquetReader(path)
    note: The import loop stays in the base class and each subclass decides which reader gets built; passing the
      reader class in as a parameter is often the lighter alternative.
  matters_most_for:
    - library-sdk
    - plugins-extensions
- id: prototype
  name: Prototype
  family: pattern
  group: creational
  says: Make new objects by copying a configured existing one, with the object itself doing the copying, so the
    caller needn't know its class. Also called clone.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Classes with a clone or copy method from a shared interface.
    - A registry of preconfigured objects that are copied on demand instead of being built from scratch.
  forces:
    - Code must duplicate objects it only knows through an interface, such as objects handed over by other
      code.
    - Many subclasses exist only to differ in how they are initialized; preset instances could replace them.
    - Setting up an object is expensive or complicated, and many near-identical copies are needed.
  overuse:
    - A hand-written clone method on every class when nothing ever copies objects polymorphically.
    - Cloning used to dodge writing a clear constructor.
  remedy: null
  counter: >
    Copying is subtle: shallow versus deep copies, shared mutable state, circular references and resources
    such as open files or connections all need deliberate handling. Immutable objects mostly remove the need,
    since they can be shared instead of copied. In Java, Cloneable is widely regarded as broken (Joshua Bloch,
    Effective Java), and copy constructors or factories are preferred.
  in:
    python: >
      The standard copy module (copy and deepcopy, customizable with __copy__ and __deepcopy__) is the
      built-in form, so a custom clone method is rarely needed. For dataclasses, dataclasses.replace makes a
      modified copy. Because classes are values, a "prototype registry" is often just a dict of classes or
      partial functions.
    typescript: "Copying needs no library: spread or Object.assign for shallow copies of plain objects, and
      `structuredClone` for deep copies of plain data. Don't confuse the pattern with JavaScript's prototype
      chain: `Object.create(obj)` makes an object that delegates to obj, not a copy of it. A hand-written
      `clone` method is mainly worth it for class instances, since spread and `structuredClone` drop methods
      and the class identity. Spotting it: A class that exposes a `clone` or `copy` method returning a new
      instance of itself."
    java: "Built into the language through Cloneable and Object.clone, but that mechanism is widely regarded as
      broken: clone makes a shallow copy, bypasses constructors, and works badly with final fields. Idiomatic
      Java uses a copy constructor or a static copy factory instead, and immutable objects and records often
      make copying unnecessary. Spotting it: A class implementing Cloneable and overriding clone, or a copy()
      method or copy constructor that takes an instance of its own type."
    csharp: "The base library has ICloneable for this, but its Clone returns object and doesn't say whether the
      copy is deep or shallow, so .NET design guidance advises against exposing it in public APIs.
      Object.MemberwiseClone gives a cheap shallow copy to build on. Records make the pattern largely built
      in: a `with` expression copies the record and changes chosen members, which covers most prototype use
      for immutable data. Spotting it: Methods named Clone, Copy or DeepCopy, often implementing ICloneable or
      calling MemberwiseClone; for records, `with` expressions deriving new instances from existing ones."
    go: "Rarely named, since assigning a struct value already makes a shallow copy. The pattern matters when a
      struct holds slices, maps or pointers that the copy would otherwise share. Then a Clone method does the
      deep copy, and the standard library has such methods, for example on http.Request and tls.Config. The
      slices.Clone and maps.Clone helpers cover the simple cases. Spotting it: A Clone or Copy method that
      returns the same type or an interface, often copying slices and maps field by field."
    rust: "The language has it built in: the `Clone` trait, usually derived, is the Prototype interface, and a
      hand-written prototype hierarchy is almost never justified. `Clone` is not object-safe, so cloning
      through a `Box<dyn Trait>` needs a helper method that returns a boxed clone, or the `dyn-clone` crate. A
      cheap shared copy is `Rc`/`Arc` cloning, which shares the data instead of duplicating it. Spotting it:
      `#[derive(Clone)]` with `.clone()` calls on a template value. For trait objects, look for a `clone_box`
      method or `dyn_clone`."
    cpp: "C++ copy constructors copy concrete types well, but cannot copy through a base-class pointer, which is
      the gap Prototype fills: a virtual clone returning unique_ptr<Base>. Copying a polymorphic object by
      value slices it, so the Core Guidelines advise suppressing public copy in polymorphic bases and offering
      a virtual clone instead. CRTP is a common way to avoid writing the same clone body in every subclass.
      Spotting it: A virtual clone (or copy) member returning a smart pointer to the base class, usually
      implemented by calling the derived type's copy constructor."
  related:
    - factory-method
    - abstract-factory
    - composite
    - decorator
    - memento
    - command
  tell: >
    In Python, a hand-written clone method that copies fields one by one where copy.copy, copy.deepcopy or
    dataclasses.replace would do.
