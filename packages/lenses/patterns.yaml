    - fullstack-web
    - event-driven
- id: transaction-script
  name: Transaction Script
  family: pattern
  group: design
  says: >
    Organise business logic as one procedure per request or use case, which reads its data, applies the rules
    and writes the result, top to bottom.
  names: >
    Named in Fowler's PoEAA (2002) as the simplest of his three domain logic patterns (with Table Module and
    Domain Model). It is the shape most handler-plus-SQL code already has.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - One function per operation (approve_expense, close_month) that queries, checks and updates in sequence.
    - Data passed around as rows, dicts or plain records with no behaviour.
    - Shared helper functions extracted once two scripts repeat a step.
  forces:
    - The rules per operation are short and don't interact much.
    - The domain is CRUD or a generic subdomain (settings, audit logs, imports).
    - The team wants code a newcomer can follow in one read.
  overuse:
    - Keeping it after the rules grow, so the same checks are copied into many scripts that drift apart.
    - Scripts that call each other in long chains, recreating a domain model badly.
  remedy: null
  counter: >
    Fowler's own point is that transaction scripts degrade as logic grows: duplication between scripts
    increases and rules that belong to one concept scatter, at which point a domain model is cheaper. The
    switch point is when the same invariants show up in several scripts. Until then, this is the right
    default, and it is not an anti-pattern.
  in:
    python: >
      The default shape in FastAPI and Flask apps: a route or crud function doing the whole operation over
      SQLAlchemy or Pydantic models.
    go: >
      Idiomatic Go services often look like this, with handlers or service methods over structs and
      database/sql or sqlc queries, and that is usually fine.
  related:
    - domain-model
    - service-layer
    - anemic-domain-model
    - table-data-gateway
    - duplicate-code
    - shotgun-surgery
    - kiss
  tell: null
  interview_only: false
  sources:
    - cite: Martin Fowler, Patterns of Enterprise Application Architecture, Transaction Script (catalog summary)
      url: https://martinfowler.com/eaaCatalog/transactionScript.html
      how: read
    - cite: Martin Fowler, PoEAA ch. 2, Organizing Domain Logic
      url: https://martinfowler.com/books/eaa.html
      how: recalled
  example:
    before: |
      class ExpenseApproval:
          fn init(policy_engine, rule_registry, approval_chain_factory): ...
          fn approve(expense_id, approver):
              chain = self.approval_chain_factory.for_expense(expense_id)
              chain.handle(ApprovalRequest(expense_id, approver))
      # three rules in total, spread over seven classes
    after: |
      fn approve_expense(db, expense_id, approver):
          e = db.get_expense(expense_id)
          if e.status != "submitted": raise Invalid("not submitted")
          if e.amount > approver.limit: raise Forbidden("over approval limit")
          if e.submitter == approver.id: raise Forbidden("cannot approve own expense")
          db.update_expense(expense_id, status="approved", approved_by=approver.id)
    note: For a few independent rules, one readable procedure per operation beats an object structure with nothing
      to coordinate.
