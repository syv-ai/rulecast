      url: https://refactoring.guru/design-patterns/builder/java/example
      how: read
    - cite: Effective Java (Bloch), item on builders for many constructor parameters; Lombok @Builder
      url: null
      how: recalled
    - cite: Refactoring.Guru, Builder in C#
      url: https://refactoring.guru/design-patterns/builder/csharp/example
      how: read
    - cite: C# object initializers, init accessors, records, and ASP.NET Core host builders
      url: null
