  looks_like:
    - subscribe / unsubscribe or add_listener / remove_listener methods keeping a collection of subscribers
    - A notify loop that calls the same method on every subscriber
    - Signals, events or hooks that other modules register handlers on
  forces:
    - A change in one object must update others, and the set of those others isn't known up front or changes
      at runtime
    - The publisher keeps getting edited to call each new dependent directly
    - Something should be watched only for a while or under certain conditions
    - Client code needs to attach its own reactions to a component it doesn't own
  overuse:
    - An event system between two objects where a direct call would be clearer
    - Business steps that must happen in order chained through events, so the real flow is invisible
    - Every internal change broadcast as an event that nothing, or exactly one thing, listens to
  remedy: null
  counter: >
    Control flow goes implicit: you can't see from the publisher what will happen when it fires. Subscribers
    run in no guaranteed order, updates can cascade or loop, and forgotten subscriptions leak memory (the
    lapsed listener problem). Exceptions in one subscriber can stop the rest. Reactive-programming advocates
    argue raw callbacks compose poorly and prefer streams or signals. When there is one known dependent, call
    it.
  in:
    python: >
      Usually a list of callables rather than observer classes; Django signals, blinker and framework hooks
      are the common forms. Holding subscribers with weakref avoids keeping dead objects alive. The source
      points to GUI components as the common Python use.
    typescript: "Common in TypeScript, especially in GUI code. It is everywhere in the platform: DOM
      `addEventListener`, Node's `EventEmitter`, `EventTarget`, and RxJS observables, so hand-rolling one is
      rarely needed. Pass listeners as functions rather than objects with an `update` method, and return an
      unsubscribe function to avoid leaks. Spotting it: Subscribe or `on` methods that add listeners to a
      list, and a notify step that calls each listener."
    java: "Very common, mainly as EventListener interfaces across Swing, servlet session listeners and JSF phase
      listeners. java.util.Observer/Observable exist but are deprecated since Java 9 and rarely used. Modern
      code uses PropertyChangeSupport, framework events (Spring @EventListener), or reactive streams (Flow,
      Reactor, RxJava). Listener lists hold strong references, so forgotten unsubscribes leak memory. Spotting
      it: An addXListener/subscribe method that stores listener objects in a list, and a fire or notify method
      that loops over the list calling each one."
    csharp: "Built into the language through events and delegates, so a hand-rolled subscriber list is rarely
      needed. The base library also ships IObservable<T>/IObserver<T> (the basis of Rx.NET) and
      INotifyPropertyChanged for data binding. Watch for event handlers that are never unsubscribed, a classic
      C# memory leak because the publisher keeps subscribers alive. Spotting it: `event` declarations with +=
      and -= subscriptions, EventHandler<T> delegates, INotifyPropertyChanged, or IObservable<T> Subscribe
      calls."
    go: "The subscriber-interface form works but is often replaced by callbacks, a slice of func values registered
      with an On or Subscribe method, or by channels: each subscriber gets a channel and the subject sends to
      all of them. Channels bring their own problems: a slow subscriber blocks the sender unless sends are
      buffered or dropped, and unsubscribing has to close channels carefully. context cancellation is a
      built-in one-shot notification. Spotting it: A slice or map of listener interfaces or funcs with
      register and unregister methods, or a fan-out loop sending one event to many channels."
    rust: "Observers holding references back to the subject run straight into ownership rules, so Rust versions
      store callbacks rather than objects. That means `fn` pointers, `Box<dyn Fn(..)>` closures, or channels
      (`mpsc`, tokio `broadcast`/`watch`) where subscribers own a receiver. Unsubscribing needs an ID or
      handle returned at subscription, since closures can't be compared. `Weak` references avoid `Rc` cycles
      when observers must be objects. Spotting it: A `HashMap<Event, Vec<Callback>>` with `subscribe`/`notify`
      methods, a `Vec<Box<dyn Fn>>` listener list, or a sender/receiver pair handed out to subscribers."
    cpp: "Common in C++, above all in GUI toolkits. Lifetime is the C++-specific hazard: a subject holding raw
      pointers to observers that have been destroyed will crash, so observers must unsubscribe in their
      destructor, or the subject holds weak_ptr, or a signal library manages connections (Qt signals and
      slots, Boost.Signals2). A vector of std::function is the lightweight form when lifetimes are simple.
      Spotting it: A subject with attach and detach (subscribe) methods that add to a list of observer
      pointers or callbacks, and a notify method that calls each one."
  related:
    - mediator
    - chain-of-responsibility
    - command
  tell: >
    A class with subscribe / attach and unsubscribe / detach methods that add to and remove from a list, plus
    a method looping over that list calling update or notify on each item.
  interview_only: false
  sources:
