- id: identity-map
  name: Identity Map
  family: pattern
  group: design
  says: >
    Keep a map of every object loaded in the current operation, keyed by id, so loading the same record twice
    returns the same object instead of two copies that can disagree.
  names: >
    Named in Fowler's PoEAA (2002). Built into Hibernate and JPA's persistence context, EF Core's change
    tracker, SQLAlchemy's Session and MikroORM; rarely written by hand.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A per-session or per-request cache of loaded entities keyed by type and id.
    - Repository get methods that check the map before querying.
    - Hand-written loaders with a request-scoped dictionary (DataLoader in GraphQL servers has a similar
      per-request cache).
  forces:
    - Two parts of one operation load the same record, change their copies, and the last write silently wins.
    - The same row is fetched repeatedly within one request.
    - Object graphs with cycles need one instance per row to link correctly.
  overuse:
    - A long-lived or global map that becomes a stale cache shared across requests.
    - Hand-rolling one where the ORM already provides it.
  remedy: null
  counter: >
    It only guarantees one copy per session, not per process or database, so it is not a cache and not a
    concurrency control; you still need optimistic locking across requests. Long sessions make the map grow
    and serve stale data. Code without an ORM, working with immutable values passed explicitly, usually has no
    need for it.
  in:
    python: >
      SQLAlchemy's Session keeps an identity map (session.get checks it first). Django has none, so two
      queries return two separate model instances.
    csharp: |
      EF Core's change tracker is one; AsNoTracking turns it off for read-only queries, which is faster.
    java: |
      The JPA persistence context guarantees one entity instance per id within a transaction.
    typescript: >
      MikroORM has one per request context; TypeORM and Prisma do not, so separate loads give separate objects.
  related:
    - unit-of-work
    - data-mapper
    - repository
    - global-state
  tell: null
  interview_only: false
  sources:
    - cite: Martin Fowler, Patterns of Enterprise Application Architecture, Identity Map (catalog summary)
      url: https://martinfowler.com/eaaCatalog/identityMap.html
      how: read
  example:
    before: |
      fn book_seats(event_id, seat_a, seat_b):
          ev1 = events.load(event_id)
          ev1.reserve(seat_a)
          ev2 = events.load(event_id)       # a second, separate copy of the same event
          ev2.reserve(seat_b)
          events.save(ev1)
          events.save(ev2)                  # overwrites seat_a's reservation
    after: |
      class EventLoader:
          loaded: map[EventId, Event]
          fn load(id) -> Event:
              if id not in self.loaded: self.loaded[id] = self.db.fetch_event(id)
              return self.loaded[id]

      fn book_seats(events: EventLoader, event_id, seat_a, seat_b):
          events.load(event_id).reserve(seat_a)
          events.load(event_id).reserve(seat_b)   # same object, both seats kept
    note: Within one operation each record has a single in-memory object, so changes can't overwrite each other.
  matters_most_for:
    - databases-storage
- id: data-transfer-object
  name: Data Transfer Object
  family: pattern
  group: architecture
  says: >
    Carry data across a boundary (a network call, an API, a queue) in a plain object shaped for that boundary,
    separate from the domain objects behind it.
  names: >
    Named in Fowler's PoEAA (2002) for cutting the number of remote calls; Sun's Core J2EE Patterns called it
    Transfer Object (earlier Value Object, a clash with the DDD term). Today the name is used more broadly for
    request and response models at API edges (Pydantic schemas, record DTOs, view models).
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Request and response types (CreateOrderRequest, OrderDto, OrderOut) separate from entities.
    - Mapping functions or libraries (MapStruct, AutoMapper, model_validate) between DTOs and domain objects.
    - Serialisation annotations on DTOs and none on domain types.
  forces:
    - Entities are serialised straight to JSON, exposing internal fields or leaking lazy-loaded relations.
    - The API contract must stay stable while the domain or schema changes.
    - A client needs data from several objects in one call.
  overuse:
    - DTOs between layers inside one process, with mapping code copying the same fields at every layer.
    - A DTO per entity mirroring it field for field, so every new column is edited in three places.
    - Mapping libraries hiding the mapping so mistakes only show at runtime.
  remedy: null
  counter: >
    Fowler's own LocalDTO note (2004) says DTOs inside one process are usually harmful: they add mapping cost
    for no remote call saved. He allows them where the presentation's shape differs a lot from the domain. Use
    them at real boundaries, the public API, messages and other services, and pass domain objects within the
    process. Coupling the API to entities is the opposite failure, so the question is where the boundary is.
  in:
    python: >
      Pydantic models are the standard DTOs in FastAPI (separate Create, Update and Public schemas is the
      template's style); Django REST Framework serializers play the same role.
    java: >
      Records make DTOs cheap; MapStruct generates mappers at compile time. Returning JPA entities from
      controllers is a known source of lazy-loading and leakage bugs.
    csharp: Records with hand-written mapping, or a mapper such as Mapperly (source-generated) or AutoMapper;
      since 15.0 (2025) AutoMapper is dual-licensed, RPL-1.5 or commercial, with a free community licence for
      small organisations, which has pushed many teams to hand-written or generated mapping. Minimal APIs and
      controllers commonly use request and response records. AutoMapper's own author advises against using it
      for complex mappings.
    typescript: >
      Often just types or interfaces, with runtime validation by zod or class-validator at the edge; NestJS
      uses DTO classes with decorators.
    go: >
      Separate structs with JSON tags for the API, converted from domain or row structs; keeping json tags off
      domain types is the usual line.
    rust: >
      Separate structs deriving Serialize and Deserialize, with From impls to and from domain types; serde
      attributes stay on the DTOs.
  related:
    - data-class
    - data-mapper
    - facade
    - over-engineering
    - shotgun-surgery
  tell: null
  interview_only: false
  sources:
    - cite: Martin Fowler, Patterns of Enterprise Application Architecture, Data Transfer Object (catalog summary)
      url: https://martinfowler.com/eaaCatalog/dataTransferObject.html
      how: read
    - cite: Martin Fowler, LocalDTO (bliki, 2004)
