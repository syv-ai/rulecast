- id: visitor
  name: Visitor
  family: pattern
  group: behavioral
  says: Keep operations in separate visitor objects that walk a structure of mixed element types, so new
    operations don't touch the element classes (double dispatch).
  applies_to:
    kinds: []
    languages: []
  contested: true
  looks_like:
    - visit_<Type> methods on visitor classes and accept(visitor) methods on element classes
    - A tree of node types (syntax tree, document model, scene graph) with several operations run over it
    - Export, render or analysis logic living in visitor classes rather than in the nodes
  forces:
    - A stable set of element types in a tree or graph needs a growing number of operations over it
    - Unrelated logic (export, pretty-printing, validation) is piling up in core data classes
    - An operation applies to only some of the element types in a hierarchy
    - An operation needs to accumulate state while it walks the structure
  overuse:
    - A visitor over a structure with one or two element types
    - A visitor where the element types change often, so every new type means editing every visitor
    - Double dispatch in a language with pattern matching or type-based dispatch built in
  remedy: null
  counter: >
    It trades one axis of change for another (the expression problem): adding operations is easy, adding
    element types means changing every visitor. Use it only when the types are stable and operations grow.
    Visitors can't reach the elements' private state. In languages with sum types and pattern matching (Rust,
    Scala, modern Java, Python match) a function with a match usually replaces it. The source itself says it
    is rarely used because it is complex and fits narrow cases.
  in:
    python: >
      Often a method lookup by type name (getattr for visit_ + class name), as in the standard library's
      ast.NodeVisitor, or functools.singledispatch, or a match statement over node classes, rather than accept
      methods on every element.
    typescript: "Uncommon, since it is complex and fits few problems. In TypeScript, a discriminated union plus an
      exhaustive `switch`, or a handler map keyed by the discriminant, does what double dispatch does, and the
      compiler flags missing cases. AST tooling is where the visitor idea survives, but in callback form
      rather than `accept` methods: the TypeScript compiler API walks nodes with
      `ts.forEachChild`/`ts.visitEachChild` and a switch on `node.kind`, and Babel's visitors are handler maps
      keyed by node type."
    java: "Uncommon because it is complex and narrow, but present in the JDK: the javax.lang.model element, type
      and annotation-value visitors for annotation processors, and FileVisitor/SimpleFileVisitor for
      Files.walkFileTree. Java uses accept/visit for double dispatch because it has only single dispatch.
      Since Java 21, sealed hierarchies with exhaustive pattern-matching switch replace most new visitors.
      Spotting it: An interface with one visit method overload per element type, and element classes with an
      accept(visitor) method that calls back visitor.visit(this)."
    csharp: "Uncommon in C# because it is complex and fits a narrow set of problems. Where it does appear is over
      syntax and expression trees: Roslyn's CSharpSyntaxVisitor and System.Linq.Expressions.ExpressionVisitor.
      Pattern matching with switch expressions over a closed type hierarchy often replaces it, and `dynamic`
      dispatch is sometimes used as a shortcut for double dispatch at a runtime cost. Spotting it: An
      Accept(visitor) method on each element type calling back a type-specific Visit method, or classes
      deriving from a framework visitor base and overriding VisitX methods."
    go: "Go has no method overloading, so a visitor interface needs one distinctly named method per element type.
      Many Go programs skip the double dispatch and use a type switch over the element interface, which is
      shorter but loses the compile-time check for unhandled types. Tree walkers such as ast.Walk and
      ast.Inspect take a visitor function or a single Visit method instead. Spotting it: An interface with
      VisitX methods for each element and Accept methods on the elements, or a function with a large type
      switch over an interface's concrete types."
    rust: "serde is the flagship case: a `Visitor` trait with an associated `Value` type and many default methods
      that return errors, driven by a `Deserializer`, all through generics with static dispatch. `syn::visit`
      and compiler AST walkers are others. For your own closed set of types, a `match` over an enum usually
      replaces Visitor, because adding an operation is just a new function. Visitor is worth it mainly when a
      library must let outside code define operations over its data model. Spotting it: A trait with many
      `visit_*` methods (often with defaults) and an associated output type, plus
      `accept`/`walk_*`/`deserialize_*` functions that call them for each node."
    cpp: "Not widely used, since its complexity limits where it fits. Classic Visitor exists in C++ to get double
      dispatch, which the language lacks. Since C++17, a std::variant over the element types plus std::visit
      with an overloaded set of lambdas covers most cases with far less code, at the cost of a closed set of
      types. Spotting it: Element classes with an accept method taking a visitor, which calls back the
      visitor's overload for that element type; or std::visit applied to a variant with an overload set. The
      page gives no identification note."
  related:
    - composite
    - iterator
    - command
  tell: >
    Element classes that each define accept(self, visitor) whose body only calls a matching
    visitor.visit_<Name> method.
  interview_only: false
  sources:
