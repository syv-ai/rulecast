  example:
    before: |
      class JobQueue:
          fn retry_delay(job: Job) -> Seconds:
              if self.config.backoff == "fixed":
                  return 30
              elif self.config.backoff == "exponential":
                  return min(2 ** job.attempts, 3600)
              elif self.config.backoff == "jittered":
                  return random(0, min(2 ** job.attempts, 3600))
              ... # a fourth policy is requested for the email queue
    after: |
      interface Backoff:
          fn delay(attempts: int) -> Seconds

      class Fixed implements Backoff:
          fn delay(attempts): return 30
      class Exponential implements Backoff:
          fn delay(attempts): return min(2 ** attempts, 3600)
      class Jittered implements Backoff:
          fn delay(attempts): return random(0, Exponential().delay(attempts))
      class Linear implements Backoff:    # the email queue's new policy; JobQueue is untouched
          fn delay(attempts): return min(60 * attempts, 3600)

      class JobQueue:
          fn retry_delay(job): return self.backoff.delay(job.attempts)
      email_queue = JobQueue(backoff=Linear())
    note: Each backoff policy sits behind one interface and the queue is handed the one it uses; with first-class
      functions, passing a delay function is the same move.
  matters_most_for:
    - library-sdk
    - scientific
    - ml-training
- id: template-method
  name: Template Method
  family: pattern
  group: behavioral
  says: A base class fixes the steps of an algorithm and subclasses fill in or override individual steps without
    changing the order.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A base class method that calls a sequence of other methods, some abstract and some empty hooks
    - Subclasses that override only a step or two and never the main method
    - Framework base classes (views, test cases, commands) that users subclass to fill in steps
  forces:
    - Several classes run nearly the same algorithm and differ in a few steps, and fixes have to be made in
      each copy
    - Callers should be able to customise parts of a workflow but not its overall order
    - Client code type-checks to decide which near-duplicate class to call
  overuse:
    - A base class with one subclass, created in case others appear
    - A long skeleton with many hook methods, so understanding one subclass means reading the whole hierarchy
    - Inheritance used only to share a few helper steps that could be plain functions
  remedy: null
  counter: >
    It relies on inheritance, and the usual cautions apply: favour composition over inheritance (GoF's own
    advice), and beware the fragile base class problem where changes to the skeleton break subclasses. The
    fixed skeleton limits some callers, a subclass that suppresses a default step can break Liskov
    substitution, and many steps make it hard to maintain. Strategy or passing functions for the varying steps
    is often the cleaner alternative.
  in:
    python: >
      Usually an abc.ABC with abstractmethod steps and no-op hook methods. Passing the varying steps as
      functions often removes the need for subclassing. The source notes Python frameworks use it so users can
      extend standard behaviour by subclassing.
    typescript: "Common in TypeScript frameworks that let users extend built-in behaviour by subclassing;
      `abstract` classes and methods make the required steps explicit. Outside frameworks, composition is
      usually preferred: a function that runs the fixed skeleton and takes the varying steps as callbacks or
      hooks in an options object. Spotting it: A base-class method that calls several other methods, some
      abstract and some empty hooks that subclasses may override."
    java: "Common in Java frameworks and the JDK: the concrete methods of InputStream/Reader and the
      AbstractList/AbstractMap skeletons build on a few abstract ones, and HttpServlet's doGet/doPost hooks
      default to 405. Spring's JdbcTemplate and RestTemplate get the same effect with callbacks rather than
      inheritance. With lambdas, passing the varying steps as functions is often preferred over subclassing;
      marking the template method final keeps subclasses from overriding the skeleton. Spotting it: An
      abstract base class with a (often final) public method that calls protected abstract or empty hook
      methods that subclasses override."
    csharp: "Common in C# frameworks, which expose protected virtual or abstract hooks for users to override;
      ASP.NET Core's BackgroundService with ExecuteAsync and EF Core's DbContext with OnModelCreating and
      OnConfiguring are everyday examples. Making the template method itself non-virtual keeps the algorithm's
      order fixed. Outside frameworks, passing delegates or injecting a strategy is often preferred over
      inheritance. Spotting it: A base class method that calls a sequence of protected abstract or virtual
      methods, some with empty default bodies, that subclasses override."
    go: "Awkward in Go. Embedding a base struct does not give it virtual dispatch, so the embedded type's skeleton
      method can't call the outer type's overrides. The workaround is to keep the fixed algorithm in a
      function or struct that takes the varying steps as an interface or as function values. This makes it a
      strategy with a fixed outline. Copying the inheritance shape through embedding is a common mistake for
      newcomers. Spotting it: A function or method that runs a fixed sequence of calls on an interface or on
      func fields, with concrete types supplying only the steps."
    rust: "No abstract base classes. The template is a provided (default) method on a trait that calls the trait's
      required methods and default hook methods. Rust can't stop implementors from overriding the template
      method, but one defined in an `impl dyn Trait` block, a free function, or a sealed helper can't be
      overridden. Taking the steps as closures or a strategy trait is often the simpler choice. Spotting it: A
      trait with one default method that calls several other trait methods in order, some of them required and
      some with empty default bodies."
    cpp: "Common in C++ frameworks that are extended by subclassing. C++ has an established form, the non-virtual
      interface idiom: a public non-virtual method fixes the skeleton and calls private or protected virtual
      hooks. CRTP gives a static version with no virtual calls. Calling a virtual hook from a constructor or
      destructor does not reach the subclass, so the skeleton must not run there. Spotting it: A base class
      with a public non-virtual method that calls several virtual steps, some pure virtual and some with empty
      defaults; or a CRTP base calling static_cast<Derived*>(this) steps."
  related:
    - strategy
    - factory-method
  tell: >
    A base class method that calls several self methods in sequence where some of those are marked abstract
    and others have empty bodies.
