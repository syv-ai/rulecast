      how: read
    - cite: Sun Microsystems, Core J2EE Patterns, Transfer Object
      url: https://www.oracle.com/java/technologies/transfer-object.html
      how: recalled
  example:
    before: |
      fn get_station(req) -> json:
          station = stations.get(req.id)
          return to_json(station)
          # sends api_key, internal calibration offsets and every reading ever taken;
          # renaming a field on Station breaks the mobile app
    after: |
      class StationResponse:
          id: str
          name: str
          latest_temp_c: float
          updated_at: Time

      fn get_station(req) -> json:
          s = stations.get(req.id)
          return to_json(StationResponse(s.id, s.name, s.latest().temp_c, s.latest().at))
    note: The API gets its own shape, so internal fields stay hidden and the domain can change without breaking
      clients.
