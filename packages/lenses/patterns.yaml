- id: dependency-injection
  name: Dependency Injection
  family: pattern
  group: design
  says: >
    Hand an object the collaborators it needs (usually through its constructor) instead of letting it create
    or look them up, and wire the whole graph in one place at startup, the composition root.
  names: >
    The term was settled in Fowler's article "Inversion of Control Containers and the Dependency Injection
    pattern" (2004), chosen with the PicoContainer and Spring community to replace the vaguer Inversion of
    Control. Mark Seemann's Dependency Injection in .NET (2011) named the composition root and the Service
    Locator anti-pattern. Containers (Spring, ASP.NET Core's service collection, Guice) are one way to do the
    wiring; doing it by hand is called pure DI.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Constructors or factory functions that take clock, repository, client and config as parameters.
    - One main or startup module that builds the real implementations and passes them down.
    - Tests that construct the object under test with fakes, without patching globals.
  forces:
    - Code calls now(), opens connections or reads environment variables deep inside, so it can't be tested
      without the real thing.
    - Singletons or module-level clients are reached from everywhere.
    - Different environments (tests, CLI, production) need different implementations.
  overuse:
    - Injecting things that never vary (pure functions, value objects, the standard library).
    - An interface for every class only so it can be injected and mocked.
    - Containers with auto-wiring and scanning where a ten-line main would do, so nobody can see what gets
      built.
    - Service Locator dressed up as DI, with a container passed around and queried.
  remedy: null
  counter: DI is about where wiring happens, not about containers. Containers add magic, runtime wiring errors
    and lifetime bugs (a scoped service captured by a singleton). Fowler himself wrote in 2004 that a Service
    Locator is roughly equivalent for application classes, with a slight edge for being more straightforward,
    and that it is just as easy to stub in tests; DI wins for classes reused across applications. Seemann
    later argued the opposite, calling Service Locator an anti-pattern because it hides dependencies. Long
    constructor lists are a sign the class does too much, not a reason to switch to setter injection. Small
    programs can pass arguments without any of the vocabulary.
  in:
    java: >
      Spring is container-first; constructor injection (with final fields and no @Autowired on fields) is the
      Spring team's own recommendation.
    csharp: >
      ASP.NET Core has the container built in (IServiceCollection); register with the right lifetime
      (transient, scoped, singleton) and inject through constructors or minimal API parameters.
    python: >
      Mostly plain arguments; FastAPI's Depends is a request-scoped injection system for handlers. Libraries
      like dependency-injector exist but are uncommon; module-level clients patched in tests are the common
      shortcut and the thing DI replaces.
    typescript: >
      NestJS and Angular have containers; elsewhere a createApp(deps) factory or plain parameters is the norm.
      Module mocking (jest.mock) is the shortcut DI replaces.
    go: >
      Pure DI is idiomatic: main builds the dependencies and passes them to constructors (NewServer(store,
      logger)), with consumer-defined interfaces. Wire and fx exist for very large graphs.
    rust: >
      Passing values or trait objects (Arc<dyn Trait>) or generics into constructors; axum's State and actix's
      Data carry shared dependencies to handlers. No mainstream container.
  related:
    - singleton
    - global-state
    - hard-to-test-code
    - mock-everything
    - abstract-factory
    - strategy
    - solid
  tell: null
  interview_only: false
  sources:
    - cite: Martin Fowler, Inversion of Control Containers and the Dependency Injection pattern (2004)
      url: https://martinfowler.com/articles/injection.html
      how: read
    - cite: Mark Seemann, Dependency Injection in .NET (2011), Composition Root
      url: https://blog.ploeh.dk/2011/07/28/CompositionRoot/
      how: recalled
    - cite: Mark Seemann, Service Locator is an Anti-Pattern (2010)
      url: https://blog.ploeh.dk/2010/02/03/ServiceLocatorisanAnti-Pattern/
      how: recalled
  example:
    before: |
      class ReportScheduler:
          fn run_due():
              now = system_clock_now()
              for r in Database.instance().due_reports(now):
                  pdf = render(r)
                  SmtpMailer(env("SMTP_HOST")).send(r.recipients, pdf)

      # the test needs a real database, a real SMTP server and a frozen system clock
    after: |
      class ReportScheduler:
          fn init(reports: ReportStore, mailer: Mailer, clock: Clock): ...
          fn run_due():
              for r in self.reports.due(self.clock.now()):
                  self.mailer.send(r.recipients, render(r))

      fn main():                                 # composition root
          db = connect(env("DB_URL"))
          scheduler = ReportScheduler(PgReportStore(db), SmtpMailer(env("SMTP_HOST")), SystemClock())
    note: The scheduler states what it needs, main builds the real ones, and a test passes fakes without any
      container.
  matters_most_for:
    - web-api
    - cli-devtool
    - library-sdk
    - plugin-host
- id: front-controller
  name: Front Controller
  family: pattern
  group: architecture
  says: >
    Route every request through one handler that runs the shared steps (auth, logging, error handling) and
    then dispatches to the specific handler; in today's frameworks this is the router plus its middleware
    pipeline.
  names: >
    Named in Sun's Core J2EE Patterns and in Fowler's PoEAA (2002), as the alternative to Page Controller (one
    handler per page). Spring's DispatcherServlet, the ASP.NET Core middleware pipeline, Express and Koa
    middleware, Django and ASGI middleware, Go's http.Handler wrapping and Rust's tower layers are all forms
    of it.
  applies_to:
    kinds:
      - web-api
      - fullstack-web
      - web-frontend
    languages: []
  contested: false
  looks_like:
    - One app or router object where routes are registered and middleware is added in order.
    - Middleware or filter classes for auth, request ids, logging, CORS and error mapping.
    - Handlers with no copy of those concerns.
  forces:
    - Every handler starts with the same auth check, logging or error handling, and some forget it.
    - Cross-cutting behaviour must change in one place (a new header, a new tracing system).
  overuse:
    - Business logic in middleware (pricing rules, per-route special cases with if path == ...).
    - Long pipelines whose order matters in ways nobody wrote down.
    - Middleware that stuffs many loosely typed values into a request context, which handlers then read
      without the compiler's help.
  remedy: null
  counter: >
    Every web framework already gives you one, so the decision is rarely whether to build it but what belongs
    in it. Keep middleware to concerns that really apply to all or most routes; route-specific rules belong
    with the route (a dependency, a guard or a per-route filter). Order-dependent pipelines are a common
    source of bugs, such as auth running after a handler that already read the body.
  in:
    java: >
      Spring's DispatcherServlet is the front controller; servlet filters and HandlerInterceptors carry the
      shared steps, Spring Security being a filter chain.
    csharp: >
      The ASP.NET Core middleware pipeline built in Program.cs; order of UseAuthentication, UseAuthorization
      and endpoint mapping matters. Endpoint filters handle per-route concerns.
    python: >
      ASGI or WSGI middleware in FastAPI and Django; FastAPI's dependencies are the better home for per-route
      concerns like loading the current user.
    typescript: Express, Koa, Fastify hooks and NestJS guards and interceptors; Next.js has a single proxy file
      (called middleware before Next.js 16) in front of routes.
    go: >
      An http.ServeMux or router with handlers wrapped by func(http.Handler) http.Handler middleware; values
      passed through context.Context should be few and typed by unexported keys.
    rust: >
      axum and tower Layers, or actix middleware, wrap the router; extractors handle per-route concerns in a
      typed way.
  related:
    - chain-of-responsibility
    - decorator
    - command
    - fat-controller
    - mediator
  tell: null
  interview_only: false
  sources:
    - cite: Martin Fowler, Patterns of Enterprise Application Architecture, Front Controller (catalog summary)
      url: https://martinfowler.com/eaaCatalog/frontController.html
      how: read
    - cite: Sun Microsystems, Core J2EE Patterns, Front Controller
      url: https://www.oracle.com/java/technologies/front-controller.html
      how: recalled
    - cite: Microsoft, ASP.NET Core Middleware
      url: https://learn.microsoft.com/en-us/aspnet/core/fundamentals/middleware/
      how: recalled
  example:
    before: |
      fn list_recipes(req):
          user = verify_token(req.header("Authorization"))
          if not user: return 401
          log_request(req, user)
          try: return ok(recipes.list_for(user))
          except err: return error_response(err)

      fn save_recipe(req):
          log_request(req, None)              # this one forgot the auth check
          try: return ok(recipes.save(parse(req.body)))
          except err: return error_response(err)
    after: |
      app = Router()
      app.use(request_logging)
      app.use(error_mapping)
      app.use(require_auth)                   # sets req.user or returns 401

      app.get("/recipes", fn(req): ok(recipes.list_for(req.user)))
      app.post("/recipes", fn(req): ok(recipes.save(req.user, parse(req.body))))
    note: The shared steps run once in front of every route, so no handler can forget them.
  matters_most_for:
    - web-api
    - fullstack-web
- id: entity
  name: Entity
  family: pattern
  group: design
  says: A domain object defined by a lasting identity rather than by its attributes, so it stays the same thing
    while its data changes, and two with the same data can still be different things.
  names: Also called Reference Object. Eric Evans, Domain-Driven Design (2003), ch. 5, as one of the model's
    building blocks.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A class with an id field whose equality and hashing use only that id.
    - Methods that change state over a lifecycle (activate, suspend, close) rather than setters for every
      field.
    - Lookups and merges done by id, never by comparing names or other attributes.
    - An identity that is assigned once (by the system, a sequence or an outside authority) and never changes.
  forces:
    - The domain experts talk about one thing that persists through changes, such as an employee whose name,
      grade and address all change.
    - Two records with identical attributes must still be told apart, or one record must be matched across
      systems and representations.
    - Mistaken identity would corrupt data, such as merging two people because they share a name.
    - The object has a lifecycle with rules about which state changes are allowed.
  overuse:
    - Giving an id to everything, including things that are only descriptions (an address, a date range, an
      amount), which is what value objects are for.
    - Treating every database row with a surrogate key as an entity in the model, even when nothing tracks it
      over time.
    - Entities that are bags of getters and setters with the rules held in services, which is Fowler's anemic
      domain model.
  remedy: null
  counter: >
    In CRUD code an ORM row with a primary key is enough, and calling it an entity adds vocabulary without
    adding design. The pattern earns its keep where identity rules are subtle: matching across systems,
    merges, a lifecycle with rules. Functional designers often model an entity as an id plus a series of
    immutable state snapshots rather than a mutable object, which keeps the identity idea but drops the
    mutation. Equality by id is debated in ORM-heavy code, because a new object has no id until it is saved.
    Using the entity pattern without the strategic side of DDD is what Vaughn Vernon calls DDD-Lite: the
    building blocks without the bounded contexts that make them pay.
  in:
    python: >
      A plain @dataclass compares every field, so two snapshots of the same entity compare unequal. Use
      eq=False and define __eq__ and __hash__ on the id, or keep entities as ordinary classes. Pydantic and
      SQLAlchemy models have their own equality rules; check them before relying on ==.
    typescript: >
      Objects compare by reference with ===, so identity checks are written as a.id === b.id or an equals
      method. A branded id type (string plus a brand) keeps a CustomerId from being passed where an OrderId is
      expected, since structural typing alone would allow it.
    java: >
      A JPA @Entity's equals and hashCode are the classic trap. A generated id is null before persist, so
      equality on it alone breaks collections; the usual advice is a natural business key or an id check that
      handles null. Records cannot be JPA entities.
    csharp: EF Core entities are classes with a key; records are a poor fit because their value equality fights
      identity. A shared base class with Id-based Equals is common in DDD-style .NET code.
    go: >
      Entities are usually pointer types with an ID field, compared by ID rather than with == on the struct,
      since == on structs compares every field.
    rust: >
      Derive PartialEq only if equality really means same id; often implement it by hand on the id, or don't
      implement it and compare ids explicitly. A newtype id (struct OrderId(Uuid)) keeps ids of different
      entities apart.
  related:
    - value-object
    - aggregate
    - data-class
    - primitive-obsession
  tell: null
  interview_only: false
  example:
    before: |
      class Employee:
          name: str
          birth_date: Date
          grade: str

      fn find_existing(staff: list, incoming: Employee) -> Employee:
          for e in staff:
              if e.name == incoming.name and e.birth_date == incoming.birth_date:
                  return e      # two different people can match
          return null
    after: |
      class Employee:
          id: EmployeeId        # assigned once by HR, never reused
          name: str
          birth_date: Date
          grade: str

          fn equals(other) -> bool: return self.id == other.id
          fn promote(new_grade: str): ...

      fn find_existing(staff: list, incoming_id: EmployeeId) -> Employee:
          return staff.first(e -> e.id == incoming_id)
    note: Identity becomes explicit and attributes may change freely, so matching never confuses two people who
      share a name and birthday.
  sources:
    - cite: Eric Evans, Domain-Driven Design Reference (2015), Entities
      url: https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf
      how: read
    - cite: Eric Evans, Domain-Driven Design (2003), ch. 5
      url: https://www.domainlanguage.com/ddd/
      how: recalled
    - cite: Vaughn Vernon, Implementing Domain-Driven Design (2013), ch. 1 (DDD-Lite) and ch. 5
      url: null
      how: recalled
    - cite: Martin Fowler, bliki, AnemicDomainModel
      url: https://martinfowler.com/bliki/AnemicDomainModel.html
      how: recalled
  matters_most_for:
    - web-api
    - fullstack-web
    - databases-storage
- id: value-object
  name: Value Object
  family: pattern
  group: design
  says: A small immutable object defined only by its attributes, with no identity, that carries the meaning and
    rules of a domain value such as an amount with its currency, a date range or a dose with its unit.
  names: Also called Value type. Eric Evans, Domain-Driven Design (2003), ch. 5. Fowler's earlier enterprise
    writing and his bliki entry ValueObject describe the same idea; the name was in use in the Java world
    before, there sometimes meaning a transfer object, which is a different thing. Early J2EE literature used
    "Value Object" for what is now called a Data Transfer Object; that meaning is obsolete.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Small immutable types (Money, Percentage, EmailAddress, DateRange, Quantity) with value-based equality.
    - Validation in the constructor or factory, so an invalid value can't exist.
    - Operations that return a new value instead of changing the old one (add, convert, overlaps).
    - Entities whose fields are these types rather than raw strings and numbers.
  forces:
    - The same raw string or number travels with an implied unit, currency or format, and bugs come from
      mixing them.
    - Validation and formatting of one kind of value are repeated in several places.
    - Two values that look equal must be equal, and nobody cares which instance is which.
    - Shared mutable objects get changed by one holder and surprise another.
  overuse:
    - Wrapping every primitive in its own class, including ones that carry no rules (a free-text note).
    - Value objects so fine-grained that simple code becomes a chain of conversions.
    - Value objects that are mutable or carry an id, which makes them entities in disguise.
  remedy: null
  counter: >
    Wrapping costs something. In hot loops or bulk data work, millions of small objects can cost allocation
    and memory in languages without real value types, and columnar or array code is often better with plain
    numbers and a documented unit. Mapping them to a database can be awkward with some ORMs. Not every string
    needs a type; wrap the ones that have rules, units or a format, and leave free text alone. This is the
    usual cure for Primitive Obsession, so overdoing it is the overcorrection of that smell.
  in:
    python: >
      A @dataclass(frozen=True) gives immutability and value equality and hashing; validate in __post_init__.
      NamedTuple works for very small ones. Freezing is shallow, so a list field can still be changed; use a
      tuple.
    typescript: >
      There are no nominal types, so type Email = string adds no safety. Use a class with a private
      constructor and a static create, or a branded type. Objects compare by reference, so give value objects
      an equals method. readonly is compile-time only; Object.freeze if it matters at runtime.
    java: >
      Records (Java 16 and later) are the natural fit: final fields, value-based equals and hashCode,
      validation in the compact constructor. Hibernate 6.2 and later can map records as @Embeddable. They are
      still heap objects until Project Valhalla's value classes land.
    csharp: >
      record and readonly record struct give value equality for free. EF Core maps them as owned types or,
      from EF Core 8, complex types. Older DDD-style .NET code uses a ValueObject base class with
      GetEqualityComponents; records make that mostly unnecessary.
    go: >
      Structs whose fields are all comparable already compare by value with ==, and passing by value avoids
      shared mutation. Go can't enforce immutability, so keep fields unexported and construct through a NewX
      function that returns an error for invalid input.
    rust: >
      A newtype or small struct with private fields, derived Clone, PartialEq, Eq and Hash, and a constructor
      returning Result. Copy for small ones. The compiler then keeps a Meters from being passed as Seconds.
  related:
    - primitive-obsession
    - entity
    - data-clumps
    - over-engineering
  tell: null
  interview_only: false
  example:
    before: |
      fn total_dose(doses: list) -> float:
          total = 0.0
          for d in doses:
              total += d.amount          # d.unit may be "mg" or "mcg"
          return total

      fn record_dose(patient, amount: float, unit: str):
          if amount <= 0: raise Invalid
          if unit not in ["mg", "mcg"]: raise Invalid
          patient.doses.append(...)
    after: |
      class Dose:                        # immutable, equal by value
          amount: Decimal
          unit: Unit

          fn create(amount, unit) -> Dose:
              if amount <= 0: raise Invalid
              return Dose(amount, unit)

          fn plus(other: Dose) -> Dose:
              return Dose(self.amount + other.in_unit(self.unit).amount, self.unit)

      fn total_dose(doses: list) -> Dose: return doses.reduce(Dose.plus)
    note: The unit travels with the amount and validation lives in one place, so adding milligrams to micrograms
      can no longer happen silently.
  sources:
    - cite: Eric Evans, Domain-Driven Design Reference (2015), Value Objects
      url: https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf
      how: read
    - cite: Eric Evans, Domain-Driven Design (2003), ch. 5
      url: https://www.domainlanguage.com/ddd/
      how: recalled
    - cite: Martin Fowler, bliki, ValueObject
      url: https://martinfowler.com/bliki/ValueObject.html
      how: recalled
    - cite: Vaughn Vernon, Implementing Domain-Driven Design (2013), ch. 6
      url: null
      how: recalled
  matters_most_for:
