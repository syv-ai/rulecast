  example:
    before: |
      class CardReader:
          fn init(): self.port = open_serial("/dev/ttyUSB0")   # exclusive device

      fn take_payment(amount):
          reader = CardReader()       # second open fails while checkout holds the port
          reader.charge(amount)

      fn refund(amount):
          reader = CardReader()
          reader.refund(amount)
    after: |
      class CardReader:
          _instance: CardReader = None

          private fn init(): self.port = open_serial("/dev/ttyUSB0")   # only instance() may construct

          fn instance() -> CardReader:      # class-level accessor
              if CardReader._instance is None:
                  CardReader._instance = CardReader()   # opened lazily, once
              return CardReader._instance

      fn take_payment(amount):
          CardReader.instance().charge(amount)

      fn refund(amount):
          CardReader.instance().refund(amount)
    note: There is one physical device, so one instance is enforced; creating it once at startup and passing it in
      gives the same guarantee without the hidden global.
  matters_most_for:
    - mobile
    - games
    - embedded
    - desktop
    - serverless
- id: adapter
  name: Adapter
  family: pattern
  group: structural
  says: Wrap an object so it offers the interface the caller expects, translating calls and data on the way.
    Also called a wrapper.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A class that takes an object of a different interface in its constructor and implements the interface
      your code expects.
    - Methods that convert arguments or data formats and then forward to the wrapped object.
    - One adapter per third-party service behind a shared internal interface.
  forces:
    - You need to use legacy or third-party code whose interface doesn't match yours, and you can't or
      shouldn't change it.
    - Conversion code for an external API is leaking into business logic at several call sites.
    - Several vendors or backends must sit behind one internal interface.
  overuse:
    - An adapter around code you own and could simply change.
    - An adapter whose methods pass every call through unchanged, adding a layer that translates nothing.
    - Wrapping a library "in case we switch" when no second implementation is planned.
  remedy: null
  counter: >
    If you control the code on both sides, change one of them instead of adding a translation layer.
    Speculative adapters around stable libraries add indirection and tend to leak the wrapped API anyway.
    Still, isolating a volatile external dependency behind a thin boundary is broadly recommended (ports and
    adapters).
  in:
    python: >
      With duck typing there's no interface to formally implement; the adapter only has to provide the methods
      the caller uses. Often a plain function that converts data, or a small wrapper class, is enough. A
      typing.Protocol can document the expected shape. Forwarding everything through __getattr__ while
      overriding a few methods is common but hides the adapted surface.
    typescript: "Common in TypeScript, especially for bridging legacy code or third-party SDKs to the shape the
      app expects. Structural typing means the adapter rarely needs a class: a function that maps one object
      shape to another, or an object literal implementing the target interface, is the usual form. Spotting
      it: A class or function takes an object of a different interface, and its methods convert arguments and
      forward them to that wrapped object."
    java: "Common, especially where newer code meets legacy APIs. The JDK has many examples: Arrays.asList,
      Collections.list and enumeration, InputStreamReader and OutputStreamWriter (bytes to characters), and
      JAXB's XmlAdapter. Because Java has no structural typing, an adapter class is the usual way to make a
      type satisfy an interface it wasn't written for. When the target is a functional interface, a lambda or
      method reference is often the whole adapter. Spotting it: A class implementing one interface whose
      constructor takes an object of a different type and whose methods translate arguments and forward to
      it."
    csharp: "Common in C#, especially around legacy code and third-party SDKs that need to fit an interface the
      application owns. Extension methods often cover the small cases, adding the expected method shape
      without a wrapper class, but they can't make a type implement an interface, so a real adapter class is
      still needed when the consumer depends on one. Spotting it: A class implementing one interface whose
      constructor takes an object of an unrelated type, and whose methods translate arguments and forward to
      that wrapped object."
    go: "Common and lightweight. Because interfaces are satisfied implicitly, an adapter is just a small struct
      holding the foreign value with the methods the consumer's interface asks for, and the adapted type never
      has to know. For single-method interfaces a named function type with a method does the job, as
      http.HandlerFunc turns a plain function into a Handler. Spotting it: A struct wrapping one field of
      another type whose methods only translate and forward, or a func type with a method that calls itself."
    rust: "A wrapper struct that owns the adaptee and implements the target trait. The orphan rule makes this the
      standard newtype idiom: you can't implement a foreign trait for a foreign type, so you wrap it.
      Conversion traits (`From`, `Into`, `AsRef`) cover the simpler case, where the data needs to change shape
      and the interface doesn't. Spotting it: A tuple or single-field struct around another crate's type with
      an `impl TheirTrait for Wrapper` that forwards to the inner value. Also look for `From` impls between
      equivalent types."
    cpp: "Frequent in C++, especially for wrapping legacy or C APIs so newer code can use them. C++ supports both
      object adapters (holding the adaptee) and class adapters (inheriting the target publicly and the adaptee
      privately), the latter possible because of multiple inheritance. Wrapping a C handle in an RAII class
      with a unique_ptr custom deleter is a very common small adapter. The standard library's stack, queue and
      priority_queue are container adapters. Spotting it: A class constructed from, or privately inheriting,
      an object of an unrelated type, whose methods translate arguments and forward to it."
  related:
    - bridge
    - decorator
    - proxy
    - facade
  tell: null
  interview_only: false
  sources:
