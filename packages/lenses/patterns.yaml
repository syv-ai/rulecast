# rulecast lens catalog: patterns. Distilled 2026-10-13; see docs/references.md.
# Own words throughout; sources cited per entry (how: read | recalled).
- id: abstract-factory
  name: Abstract Factory
  family: pattern
  group: creational
  says: One factory object creates a whole family of related objects, so the caller gets parts that fit together
    without naming their concrete classes. Sometimes called a kit.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A factory interface with one create method per product type, plus one concrete factory per variant or
      platform.
    - Client code receives a factory and builds every related part through it.
    - A method that returns a factory, which is then used to make sub-components.
  forces:
    - Several kinds of objects have to be used together and must come from the same variant (same theme, same
      backend, same platform).
    - Code keeps checking the same setting to decide which concrete class to build, at several construction
      sites.
    - New variants are expected, and each one brings a full set of matching parts.
  overuse:
    - A factory hierarchy with a single concrete factory and no second variant in sight.
    - A factory for one product type, which is just an indirection around a constructor.
    - Parallel interface and class trees that grow with every new product, even though nothing ever mixes
      variants by mistake.
  remedy: null
  counter: >
    Skip it until a second family actually exists. It adds an interface per product plus a class per variant,
    and adding a new product type means touching every factory, so it is rigid along that axis. With one
    variant, plain constructors or a single function are clearer. Dependency injection containers and passing
    callables often cover the same need with less ceremony.
  in:
    python: >
      Classes are first-class values, so a "factory" is often just a module, a dict that maps a variant to
      classes, or a namespace object holding callables. Duck typing removes the need for an abstract factory
      base class. Frameworks still use the shape so users can plug in their own component classes. Norvig's
      point that many GoF creational patterns become trivial or invisible in dynamic languages applies
      directly here.
    typescript: 'Common in TypeScript libraries and frameworks that let users swap whole families of components.
      Because typing is structural, the "factory" is often just an object literal or a function returning an
      object that satisfies an interface, not a class hierarchy. A plain record of creator functions, passed
      in or provided through dependency injection, usually does the job. Spotting it: A method or function
      returns an object whose own methods create related products, all typed against shared interfaces rather
      than concrete classes.'
    java: "Common in Java, mostly in the JDK and frameworks as a pluggable provider entry point: a static lookup
      returns a factory object (often found via ServiceLoader or a system property) that makes a family of
      related components, as in the javax.xml parser, transformer and XPath factories. In application code, a
      dependency-injection container usually does this job, and a single interface bound per environment is
      often enough. Spotting it: A static newInstance-style method that returns a factory, whose methods then
      create the actual sub-components; implementations are often selected through ServiceLoader or
      configuration."
    csharp: "Common in C#, mostly inside frameworks that let you swap a whole family of components. ADO.NET's
      DbProviderFactory, which hands out matching connections, commands and parameters for one database
      provider, is the textbook standard-library case. In application code the DI container usually does this
      job: you register the family's implementations once and inject interfaces, so a hand-written factory
      interface is only worth it when the family is picked at runtime. Spotting it: A method or injected
      service that returns a factory interface, which is then asked for several related products
      (CreateConnection, CreateCommand and so on) that are meant to be used together."
    go: "Uncommon in Go. A family of products becomes a small interface whose methods return other interfaces, and
      a plain constructor function picks the concrete factory by name or config. Shared product fields usually
      sit in an embedded base struct instead of a base class. Most Go code passes the concrete dependencies in
      through the constructor and takes the interfaces where they are used, which makes a separate factory
      type unnecessary. Spotting it: An interface whose methods all return other interfaces, with one struct
      per variant implementing it, and a function that switches on a string or enum to return one of them."
    rust: "A factory trait whose methods return the products. Two versions: an associated type per product with
      the factory taken as `impl Trait` (static dispatch, no allocation), or methods returning `Box<dyn
      Product>` with the factory passed as `&dyn Factory` when the family is only known at runtime. Libraries
      usually take the generic form so the caller can choose, and binaries can use boxing. If the set of
      families is closed, an enum matched in one place is often simpler. Spotting it: A trait whose methods
      all build values of other traits, through associated types or boxed trait objects, with one implementing
      struct per family. Often picked by a cfg flag or a config value in main."
    cpp: "Common in C++ frameworks and libraries that let users plug in their own families of components.
      Factories return std::unique_ptr to an abstract base so ownership is explicit. When the product family
      is fixed at compile time, a policy or traits template parameter does the same job with no virtual
      dispatch and is often the more idiomatic choice. Spotting it: A method that returns a factory object
      (usually by pointer to an abstract class), whose own methods each return a unique_ptr to a different
      abstract product."
  related:
    - factory-method
    - builder
    - prototype
    - bridge
    - facade
    - singleton
  tell: null
  interview_only: false
  sources:
