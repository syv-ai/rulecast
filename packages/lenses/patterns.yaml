  example:
    before: |
      fn assign_courier(order: Order):
          resp = mapvendor.lookup_address(order.street + ", " + order.city)
          point = LatLng(resp["lat_e6"] / 1e6, resp["lng_e6"] / 1e6)
          ...

      fn validate_signup(form: Form):
          resp = mapvendor.lookup_address(form.address)
          if resp["status"] != "OK": raise BadAddress()
          home = LatLng(resp["lat_e6"] / 1e6, resp["lng_e6"] / 1e6)
          ...
    after: |
      interface Geocoder:
          fn locate(address: str) -> LatLng

      class MapVendorGeocoder(Geocoder):
          fn init(client: MapVendorClient): self.client = client
          fn locate(address: str) -> LatLng:
              resp = self.client.lookup_address(address)
              if resp["status"] != "OK": raise BadAddress()
              return LatLng(resp["lat_e6"] / 1e6, resp["lng_e6"] / 1e6)

      fn assign_courier(order: Order, geo: Geocoder):
          point = geo.locate(order.street + ", " + order.city)
    note: The vendor's call shape and units are translated in one wrapper, and business code depends only on the
      internal Geocoder interface.
  matters_most_for:
    - library-sdk
    - plugins-extensions
    - web-api
    - data-pipeline
- id: bridge
  name: Bridge
  family: pattern
  group: structural
  says: Split a class that varies along two independent axes into two hierarchies, the abstraction and its
    implementation, linked by composition.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A high-level class that holds a reference to an implementation object and delegates platform work to it.
    - Two separate class trees, one for the kinds of thing and one for the platforms or backends, rather than
      one tree of every combination.
  forces:
    - Subclasses multiply as the product of two dimensions (shape times renderer, report times output format).
    - One class contains several variants of a feature, such as support for different database engines or
      vendors.
    - The implementation must be swappable at runtime, or chosen by configuration.
  overuse:
    - Splitting a cohesive class into abstraction and implementation when only one implementation exists.
    - Designing two hierarchies up front for a second dimension of variation that is only imagined.
  remedy: null
  counter: >
    It pays off only when both dimensions really vary. Otherwise it is an extra layer of delegation that makes
    the code harder to follow. It is one instance of the general advice to favour composition over
    inheritance; in practice many codebases just call it injecting a strategy or a backend, and the name
    matters less than the shape.
  in:
    python: >
      Passing the implementation object (or a callable) into the constructor is the whole pattern; no abstract
      base classes are required, though a Protocol can describe the implementation side. Common in code that
      targets several databases, operating systems or cloud providers.
    typescript: "Useful for cross-platform code and for supporting several providers of the same service
      (databases, cloud platforms, payment providers). In TypeScript the implementation side is usually an
      interface injected through the constructor, and the abstraction side often stays a single class rather
      than its own hierarchy. Spotting it: A controlling class holds a reference to an interface with several
      platform- or provider-specific implementations and delegates to it."
    java: "Appears where one abstraction must work over several platforms, database vendors or service providers.
      JDBC is the textbook Java case: application code talks to the java.sql interfaces, and a vendor driver
      supplies the implementation. SLF4J over a logging backend is another. Inside a single application, a
      plain interface injected by constructor usually covers it. Spotting it: An abstraction class holding a
      field of an interface type with several platform-specific implementations, where both sides form their
      own hierarchies and vary independently."
    csharp: "Useful in C# for cross-platform code, multiple database servers, or several providers of one kind of
      service such as cloud storage. In practice it is usually expressed as an abstraction class that takes an
      injected interface for its implementation side, so DI does most of the wiring; the logging and
      configuration abstractions in Microsoft.Extensions, with pluggable providers behind them, are well-known
      examples. Spotting it: A high-level class holding a reference to an implementation interface, with
      several platform- or provider-specific implementations of that interface that vary independently of the
      high-level class's own subclasses."
    go: "Comes almost for free, since Go composes with interface-typed fields rather than subclassing. A struct
      that holds an interface for its implementation side is already a bridge, and it is seldom named as one.
      database/sql in front of driver.Driver is the textbook standard-library case. Spotting it: A public type
      that holds an interface field for a pluggable backend, often filled from a registry such as
      sql.Register."
    rust: "The implementation side is a trait, and abstractions are structs generic over it (`Remote<D: Device>`).
      That gives compile-time pairing with no boxing, or a `Box<dyn Device>` field when the pairing is chosen
      at runtime. Default methods on the abstraction trait can carry the shared logic, so there is no base
      class. In Rust this is ordinary generic design and is rarely called Bridge. Spotting it: Structs with a
      type parameter bounded by a trait, or a `Box<dyn Trait>` field, where a second trait or hierarchy
      delegates to that field."
    cpp: "Fits cross-platform C++ code, multiple database backends, or several providers of one service. C++'s
      best-known bridge is the pimpl idiom: a class holds a unique_ptr to a forward-declared implementation,
      which hides private details from the header, keeps the ABI stable and cuts rebuild times. When the
      implementation is chosen at compile time, a template parameter is a cheaper bridge. Spotting it: A class
      whose header holds only a pointer (often unique_ptr) to a forward-declared or abstract implementation
      type, with methods that forward to it."
  related:
    - adapter
    - strategy
    - state
    - abstract-factory
    - builder
