- id: domain-service
  name: Domain Service
  family: pattern
  group: design
  says: A stateless operation named in the domain's language, for a significant piece of domain logic that
    doesn't naturally belong to any one entity or value object, typically because it involves several of them.
  names: Also called Service (DDD). Eric Evans, Domain-Driven Design (2003), ch. 5, which separates domain
    services from application services and infrastructure services.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A stateless class or module function named after a domain activity (TutorMatching, PriceCalculation,
      ExchangeRateConversion), taking and returning domain objects.
    - It lives in the domain layer and imports no database, HTTP or framework code.
    - It is distinct from the application service that loads aggregates, calls it and saves the result.
  forces:
    - A rule needs two or more aggregates or entities, and putting it on one of them would make that one reach
      into the other.
    - Domain experts name the activity as a thing in its own right ("matching", "allocation", "pricing").
    - An entity is growing methods that are really about a different concept.
  overuse:
    - Moving all behaviour out of entities into services, leaving entities as data holders, which is Fowler's
      anemic domain model.
    - A service per entity (CustomerService, OrderService) that wraps getters and setters, named after a noun
      rather than an activity.
    - Calling the application layer's orchestration code a domain service, so transactions and I/O leak into
      the domain.
  remedy: null
  counter: >
    Martin Fowler's anemic domain model critique is the warning: services are where behaviour drifts when
    nobody asks which object owns it, and a domain full of services is procedural code with extra layers. Put
    logic on the entity or value object first, and reach for a service only when no object owns it. In code
    that isn't object-oriented, such as Go or functional TypeScript, a plain function in the domain package is
    the same thing and needs no class or interface. In CRUD apps the distinction from application services is
    usually not worth drawing.
  in:
    go: >
      A package-level function in the domain package is usually enough; no struct or interface unless it has
      dependencies that need swapping.
    rust: >
      A free function in the domain module, taking references to the aggregates involved, is the idiomatic
      form.
    java: >
      Spring's @Service stereotype is used for application services too, so the annotation says nothing about
      which kind it is. Keep domain services free of @Transactional and repositories.
    csharp: >
      Same trap as Java: a class named XService registered in DI is often an application service. A domain
      service takes domain objects and returns results, with no DbContext.
  related:
    - entity
    - aggregate
    - business-logic-in-helpers
    - feature-envy
    - data-class
  tell: null
  interview_only: false
  example:
    before: |
      class Student:
          availability: list
          subjects: list

          fn find_tutor(tutors: list) -> Tutor:
              for t in tutors:
                  if t.rate_band <= self.budget_band and t._calendar.free_at(self.availability) \
                     and self.subjects[0] in t._qualifications:
                      return t
              return null
    after: |
      class TutorMatching:                    # domain service, stateless
          fn best_match(student: Student, tutors: list) -> Match:
              candidates = tutors.filter(t -> t.teaches(student.main_subject())
                                         and t.free_during(student.availability)
                                         and t.affordable_for(student))
              return Match.rank(student, candidates).first()

      # application service
      fn request_tutor(student_id):
          match = tutor_matching.best_match(students.get(student_id), tutors.available())
          matches.save(match)
    note: Matching involves both sides, so it gets its own name instead of living on Student and reaching into the
      tutor's internals; each side still answers questions about itself.
  sources:
    - cite: Eric Evans, Domain-Driven Design Reference (2015), Services
      url: https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf
      how: read
    - cite: Eric Evans, Domain-Driven Design (2003), ch. 5
      url: https://www.domainlanguage.com/ddd/
      how: recalled
    - cite: Martin Fowler, bliki, AnemicDomainModel
      url: https://martinfowler.com/bliki/AnemicDomainModel.html
      how: recalled
    - cite: Vaughn Vernon, Implementing Domain-Driven Design (2013), ch. 7
      url: null
      how: recalled
  matters_most_for:
    - web-api
    - fullstack-web
- id: domain-event
  name: Domain Event
  family: pattern
  group: design
  says: An immutable record, named in the past tense, of something that happened in the domain that experts care
    about (ClaimApproved, PaymentFailed), raised by the model so other parts can react without the source
    knowing them.
  names: Not in Evans's 2003 book; Evans added it to his DDD Reference (2015) as a new pattern, after the CQRS
    and event sourcing work of Greg Young and Udi Dahan. Fowler described it on his site around 2005.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Small immutable classes named in the past tense, carrying the ids involved and the time it happened.
    - Aggregates that record events during a command, which are dispatched after the transaction commits.
    - Handlers subscribed to an event type, each doing one side effect (notify, update a read model, start a
      process).
    - An outbox table or similar so events published to other services aren't lost if the process dies.
  forces:
    - One state change triggers several side effects, and the method doing the change keeps growing calls to
      email, billing and analytics.
    - Another bounded context or service must react, and calling it directly couples the two.
    - The business wants to know why state changed, not just what it is now.
    - Updates across aggregates must happen after the first one commits (eventual consistency).
  overuse:
    - An event for every setter, so the flow of a simple feature is scattered across handlers nobody can
      follow.
    - Events used as disguised commands ("SendEmailRequested") where a direct call would be clearer.
    - Publishing internal domain events straight to other services, so their shape becomes a public contract.
  remedy: null
  counter: >
    Events trade a visible call for an invisible one. Fowler's write-up on event-driven styles warns that
    event notification makes the overall flow hard to see and debug, and that is the main cost. A single side
    effect is clearer as a direct call. Dispatching before the commit risks reacting to something that then
    rolls back; dispatching after needs an outbox or similar to avoid losing events. Keep domain events inside
    a context, and translate them into separate integration events, a published language, for other contexts,
    so internal refactoring doesn't break consumers. Domain events are not event sourcing; you can use one
    without the other.
  in:
    python: >
      No standard mechanism; a list of pending events on the aggregate, drained by the unit of work after
      commit, is the common shape (as in Percival and Gregory's Architecture Patterns with Python). Frozen
      dataclasses suit the events.
    typescript: >
      A discriminated union of event types gives exhaustive handling. Node's EventEmitter is synchronous and
      in-process; it's not a reliable bus for events other services depend on.
    java: >
      Spring Data's AbstractAggregateRoot (or @DomainEvents) publishes registered events when the repository
      saves, and @TransactionalEventListener can run handlers after commit. Records suit the events.
    csharp: A common shape is a DomainEvents list on a base entity, dispatched from an overridden SaveChanges or
      an EF Core SaveChanges interceptor, through MediatR notifications (dual-licensed since 13.0) or a small
      hand-written dispatcher. Decide whether handlers run inside or after the transaction; both are seen.
    go: >
      Commands often return the events they produced as a slice, and the caller publishes them; channels are a
      poor fit for events that must survive a crash.
    rust: >
      An enum of events returned from command methods (Result<Vec<Event>, Error>) is idiomatic and keeps the
      model free of a bus.
  related:
    - observer
    - aggregate
    - bounded-context
    - anti-corruption-layer
    - mediator
  tell: null
  interview_only: false
  example:
    before: |
      class WarrantyClaim:
          fn approve(adjuster):
              self.status = APPROVED
              mailer.send(self.customer_email, "Your claim was approved")
              ledger.reserve(self.payout)
              analytics.track("claim_approved", self.id)
              # every new reaction edits this method
    after: |
      class ClaimApproved:                  # immutable, past tense
          claim_id: ClaimId
          payout: Money
          approved_by: AdjusterId
          occurred_at: Timestamp

      class WarrantyClaim:
          fn approve(adjuster):
              self.status = APPROVED
              self.record(ClaimApproved(self.id, self.payout, adjuster.id, now()))

      # after commit, the unit of work dispatches recorded events
      on ClaimApproved: notify_customer, reserve_payout, track_approval
    note: The claim states what happened and stops; each reaction subscribes on its own, and a new one is added
      without touching the claim.
  sources:
    - cite: Eric Evans, Domain-Driven Design Reference (2015), Domain Events
      url: https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf
      how: read
    - cite: Martin Fowler, What do you mean by "Event-Driven"? (2017)
      url: https://martinfowler.com/articles/201701-event-driven.html
      how: recalled
    - cite: Martin Fowler, Domain Event (2005)
      url: https://martinfowler.com/eaaDev/DomainEvent.html
      how: recalled
    - cite: Vaughn Vernon, Implementing Domain-Driven Design (2013), ch. 8
      url: null
      how: recalled
    - cite: Vlad Khononov, Learning Domain-Driven Design (2021), ch. 6 and 15
      url: https://www.oreilly.com/library/view/learning-domain-driven-design/9781098100124/
      how: recalled
  matters_most_for:
