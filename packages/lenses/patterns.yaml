  example:
    before: |
      class LogEntry:
          fn init(ts, message, host, service, region, build, env):
              self.ts = ts
              self.message = message
              self.host = host          # these five fields repeat, identical,
              self.service = service    # across millions of loaded lines;
              self.region = region      # profiling shows they dominate the heap
              self.build = build
              self.env = env
    after: |
      class LogSource:                  # immutable, shared
          fn init(host, service, region, build, env): ...

      class LogSources:
          fn init(): self.pool = {}
          fn get(host, service, region, build, env) -> LogSource:
              key = (host, service, region, build, env)
              if key not in self.pool: self.pool[key] = LogSource(host, service, region, build, env)
              return self.pool[key]

      class LogEntry:
          fn init(ts, message, source: LogSource): ...
    note: The repeated source fields become one shared immutable object per distinct source, and each entry keeps
      only its own timestamp and message; worth it only because profiling showed the cost.
  matters_most_for:
    - games
    - embedded
    - compilers-tooling
- id: proxy
  name: Proxy
  family: pattern
  group: structural
  says: A stand-in with the same interface as the real object, which controls access to it (lazily creating it,
    checking permissions, caching, logging, or reaching it over a network). Also called a surrogate.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A class implementing the same interface as a service and holding a reference to it, doing work before or
      after forwarding each call.
    - Variants named for their job - lazy or virtual, protection, remote, caching, logging, smart reference.
    - Objects that create their real target only on first use.
  forces:
    - A heavyweight object is needed only sometimes and should be created lazily, without every caller
      handling that.
    - Access must be checked, logged, cached or counted uniformly, and you can't or shouldn't change the
      service class.
    - The real object lives elsewhere (another process or machine) but callers should use it like a local one.
  overuse:
    - A proxy that forwards every call without adding any control.
    - Remote proxies that hide network latency and failure so well that callers treat remote calls as cheap
      and reliable.
    - Layers of proxies where a single cache or permission check at the call site would be clearer.
  remedy: null
  counter: >
    Transparency is the risk: a proxy that looks local can hide latency, partial failure and changed
    semantics, which is the core of the critique of transparent remote objects (Waldo et al., A Note on
    Distributed Computing). It also adds a layer and can delay responses. Use it when the control it adds is
    real and uniform.
  in:
    python: >
      Rare in everyday code. When used, it's often a class that forwards unknown attributes with __getattr__,
      a lazy property such as functools.cached_property, or library-provided proxies (weakref.proxy, ORM
      lazy-loaded relations, RPC client stubs). For caching or access checks on functions, a function
      decorator is usually simpler.
    typescript: "Not especially common in TypeScript apps, but useful when behaviour must be added in front of an
      existing object without changing its callers. The built-in `Proxy` object intercepts property access
      generically, and reactivity systems (Vue, MobX) and mocking libraries rely on it. Typing a built-in
      `Proxy` precisely is hard, so hand-written wrapper classes stay the norm for typed, single-purpose
      proxies. Spotting it: A class implementing the same interface as a service object, forwarding every
      method to it; or use of the built-in `Proxy` with a handler."
    java: "Rarely written by hand in application code, but pervasive underneath it: java.lang.reflect.Proxy
      dynamic proxies, RMI stubs, and container-injected EJB, CDI and JPA references are all proxies. Spring
      and Hibernate generate them (JDK or CGLIB/ByteBuddy subclasses) for transactions, lazy loading and
      security. That causes known pitfalls: self-invocation bypasses the proxy, and final classes or methods
      can't be proxied by subclassing. Spotting it: A class implementing the same interface as a service, or
      subclassing it, whose methods forward to the real object after checks, caching or lazy initialisation;
      or an InvocationHandler."
    csharp: "Not frequent in hand-written C#, but used when behaviour such as caching, lazy loading, access checks
      or logging must be added without touching the client. Much C# proxying is generated rather than written:
      EF Core lazy-loading proxies, Castle DynamicProxy behind mocking libraries like Moq, DispatchProxy, and
      generated gRPC or WCF client stubs. Lazy<T> covers simple virtual-proxy needs. Spotting it: A class
      implementing the same interface as a service it holds and forwarding every call to it, sometimes created
      lazily; or a subclass of the service overriding virtual members."
    go: "Built the same way as a decorator: a struct that satisfies the service's interface and holds the real
      service. Implicit interfaces mean callers can't tell the difference. Common uses are caching, rate
      limiting, lazy connection and RPC client stubs. httputil.ReverseProxy and http.RoundTripper wrappers are
      the standard-library forms. Generated gRPC clients are remote proxies. Spotting it: A struct
      implementing the same interface as a field it holds, adding access control, caching or lazy setup before
      forwarding."
    rust: "The proxy is a struct that owns the real subject and implements the same trait, adding checks, caching
      or rate limits before it forwards. Methods take `&mut self` when the proxy keeps counters, and need a
      `Mutex` or atomics when it is shared. Smart pointers are Rust's built-in proxies. `Deref` makes `Box`,
      `Rc`, `MutexGuard` and `Ref` act like the inner value, but implementing `Deref` just to proxy a
      non-pointer type is considered an anti-pattern. Spotting it: A struct wrapping a concrete service and
      implementing the service's trait with a guard before delegating, or a custom `Deref`/`DerefMut` impl on
      a handle type."
    cpp: "Rarely named in C++ code, though the language is full of proxy-like types: smart pointers stand in for
      the pointee by overloading operator-> and operator*, and vector<bool>::reference stands in for a single
      bit. Hand-written proxies usually do lazy loading or access checks. Spotting it: A class with the same
      interface as a service object that forwards every call to it, or a type overloading operator-> or
      operator* to stand in for another object."
  related:
    - decorator
    - adapter
    - facade
    - flyweight
