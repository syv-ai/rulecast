    - distributed
    - web-api
- id: specification
  name: Specification
  family: pattern
  group: design
  says: A business rule packaged as an object with one question, "is this candidate satisfied?", so the rule has
    a name, can be combined with and, or and not, and can be reused for validation, selection and building.
  names: Also called Specification pattern. Eric Evans and Martin Fowler, the paper Specifications (1997), then
    Evans's Domain-Driven Design (2003), ch. 9 and 10. The 2015 DDD Reference mentions it only in passing,
    under Declarative Design.
  applies_to:
    kinds: []
    languages: []
  contested: true
  looks_like:
    - Small classes or functions named after a rule (OverdueInvoice, EligibleForPromotion) with an
      is_satisfied_by method.
    - and, or, not combinators that build bigger rules from small ones.
    - A repository method that takes a specification instead of a dozen find_by variants.
  forces:
    - The same business rule is written out in a query, a validation and an if-statement, and the copies drift.
    - Rules are combined in many ways, and each combination becomes its own method.
    - Domain experts name the rule ("eligible", "at risk") and it deserves a name in code.
  overuse:
    - A specification class for a one-off condition used in one place.
    - A generic repository plus specification framework used as a query builder, which hides the database
      without adding domain meaning.
    - Deep trees of composite specifications that are harder to read than the boolean they replace.
  remedy: null
  counter: "Genuinely contested in practice. As an in-memory predicate it is cheap and clear. As a query it
    leaks: turning an object tree into SQL needs an expression-tree library or a parallel query version of
    each rule, and the pair can drift. Even its advocates, such as Vladimir Khorikov, warn against the generic
    forms (a specification that only wraps a caller's lambda, or repositories returning IQueryable), and many
    teams prefer named query methods on the repository or plain query objects. In languages with first-class
    functions a named predicate function gives most of the benefit with no class hierarchy. Reach for it when
    one rule must serve validation and selection, or when rules are combined at run time."
  in:
    csharp: Ardalis.Specification is widely used and builds EF Core queries from specification objects.
      Expression<Func<T,bool>> lets one rule run both in memory and as SQL, which is the C# answer to the
      leak.
    java: >
      Spring Data JPA's Specification<T> is a query-building interface over the Criteria API; it composes with
      and and or, but it is a query tool rather than Evans's in-memory rule object.
    python: >
      A named predicate function, or a small class with __and__ and __or__, is the common form. SQLAlchemy
      expressions can serve as the query side.
    typescript: >
      A typed predicate function ((x: T) => boolean) composed with helper functions is usually enough; a class
      hierarchy is rare.
    go: >
      A func(T) bool type with And and Or helpers covers the in-memory case; query building stays with the
      repository.
    rust: |
      Closures or a trait with is_satisfied_by and combinator structs; closures are the common choice.
  related:
    - strategy
    - composite
    - duplicate-code
    - over-engineering
  tell: null
  interview_only: false
  example:
    before: |
      fn eligible_staff_query():
          return "SELECT * FROM staff WHERE tenure_months >= 18 AND last_review >= 'meets' AND NOT on_notice"

      fn can_nominate(employee) -> bool:
          return employee.tenure_months >= 18 and employee.last_review >= MEETS

      fn badge(employee) -> str:
          if employee.tenure_months >= 12 and employee.last_review >= MEETS and not employee.on_notice:
              return "eligible"            # third copy, already drifted to 12 months
    after: |
      class EligibleForPromotion(Specification):
          fn is_satisfied_by(e: Employee) -> bool:
              return e.tenure_months >= 18 and e.last_review >= MEETS

      eligible = EligibleForPromotion().and_(OnNotice().not_())

      fn can_nominate(employee) -> bool: return eligible.is_satisfied_by(employee)
      fn badge(employee) -> str: return "eligible" if eligible.is_satisfied_by(employee) else ""
      fn eligible_staff(): return staff_repository.matching(eligible)
    note: The rule has one name and one definition, combined explicitly, and the repository translates it for the
      query, so the three uses can't drift apart.
  sources:
    - cite: Eric Evans and Martin Fowler, Specifications (1997)
      url: https://martinfowler.com/apsupp/spec.pdf
      how: recalled
    - cite: Eric Evans, Domain-Driven Design (2003), ch. 9 and 10
      url: https://www.domainlanguage.com/ddd/
      how: recalled
    - cite: Eric Evans, Domain-Driven Design Reference (2015), Declarative Design (passing mention only)
      url: https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf
      how: read
    - cite: "Vladimir Khorikov, Specification pattern: C# implementation (2016)"
      url: https://enterprisecraftsmanship.com/posts/specification-pattern-c-implementation/
      how: read
  matters_most_for:
    - web-api
    - fullstack-web
- id: factory-ddd
  name: Factory (DDD)
  family: pattern
  group: design
  says: An object or method whose job is to create a whole aggregate, or a complex value object, in a valid
    state in one step, so callers don't assemble its parts and can't produce a half-built one. Not the GoF
    patterns abstract-factory or factory-method, which are about choosing which class to instantiate.
  names: Also called Factory (Evans), Aggregate factory. Eric Evans, Domain-Driven Design (2003), ch. 6,
    alongside Aggregates and Repositories. The GoF's Abstract Factory and Factory Method (1994) are separate
    catalog entries.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A create or new method on the aggregate root, a standalone factory class, or a method on another
      aggregate (project.start_task()), returning a complete aggregate.
    - All invariants checked at creation, so the constructor of parts is not public to callers.
    - A separate reconstitution path used by the repository to rebuild an aggregate from storage without
      re-running creation rules or raising creation events.
  forces:
    - Creating an aggregate takes several steps (root, children, defaults, ownership), and callers copy those
      steps and sometimes skip one.
    - Invariants must hold from the first moment, such as every workspace having an owner.
    - Callers would otherwise need to know the internal classes of the aggregate.
    - Rebuilding from the database must not re-validate or re-announce creation.
  overuse:
    - A WidgetFactory class whose only method calls the constructor.
    - Factories for objects with two fields and no invariants.
    - A factory class hierarchy mirroring the aggregate hierarchy when one function would do.
  remedy: null
  counter: >
    A constructor is a factory; most objects need nothing more. A separate factory pays only when assembly is
    complex, crosses objects, or must hide internal classes. In languages with named constructors or
    module-level functions, a static create method or a NewX function is the idiomatic factory, and a Factory
    class is ceremony. It also overlaps Builder for complex value objects; Evans himself suggests a builder
    can assemble the parts.
  in:
    python: |
      A classmethod (Workspace.create(...)) is the usual form; a standalone factory class is rarely needed.
    typescript: >
      A static create method with a private constructor, returning the aggregate or a result type for
      validation failures.
    java: >
      A static factory method on the root with a package-private constructor; Bloch's static factory advice
      applies. Note that JPA needs a no-arg constructor, which can be protected to keep callers out.
    csharp: >
      A static Create method with a private constructor; EF Core can use the private constructor for
      reconstitution.
    go: >
      A NewX function returning (X, error) is the factory; reconstitution often gets its own function so it
      skips creation checks.
    rust: >
      An associated function (new or a domain-named one) returning Result<Self, Error>; private fields stop
      anyone building the struct literally from outside the module.
  related:
    - abstract-factory
    - factory-method
    - builder
    - aggregate
    - value-object
  tell: null
  interview_only: false
  example:
    before: |
      # in three different handlers
      ws = Workspace(name)
      board = Board("Main")
      for col in ["To do", "Doing", "Done"]: board.columns.append(Column(col))
      ws.boards.append(board)
      ws.members.append(Membership(user_id, ADMIN))     # one handler forgot this line
      workspaces.save(ws)
    after: |
      class Workspace:
          fn create(name: str, owner: UserId, template: Template) -> Workspace:
              ws = Workspace(name)
              ws.members.append(Membership(owner, ADMIN))
              ws.boards.append(Board.from_template(template))
              return ws

          fn reconstitute(row) -> Workspace: ...      # used by the repository, no checks re-run

      # handlers
      workspaces.save(Workspace.create(name, user_id, DEFAULT_TEMPLATE))
    note: Creation of the whole aggregate has one home that guarantees an owner and a board, unlike a GoF factory,
      which is about choosing a concrete class.
  sources:
    - cite: Eric Evans, Domain-Driven Design Reference (2015), Factories
      url: https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf
      how: read
    - cite: Eric Evans, Domain-Driven Design (2003), ch. 6
      url: https://www.domainlanguage.com/ddd/
      how: recalled
    - cite: Vaughn Vernon, Implementing Domain-Driven Design (2013), ch. 11
      url: null
      how: recalled
  matters_most_for:
    - web-api
    - fullstack-web
- id: anti-corruption-layer
  name: Anti-Corruption Layer
  family: pattern
  group: architecture
  says: A translating layer the downstream side owns, between its model and an external or legacy system, so the
    other system's concepts, codes and quirks don't leak into its own model.
  names: Also called Anticorruption Layer (Evans's spelling), ACL. Eric Evans, Domain-Driven Design (2003), ch.
    14, as one of the context-mapping relationships. Also in Microsoft's Azure Cloud Design Patterns.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A module per external system (adapters/legacy_leasing, integrations/payments) that alone imports its SDK
      or generated client.
    - Translator functions that turn the other system's records and status codes into domain objects, and back.
    - Domain code that never sees the vendor's types, field names or error codes.
    - Tests of the translator against recorded responses from the other system.
  forces:
    - A legacy system or vendor API has a weak or alien model (cryptic codes, overloaded fields), and its
      names are spreading through the code.
    - The integration matters, but the other side won't change for you.
    - You expect to replace the other system and want the change contained.
  overuse:
    - A translation layer in front of a well-designed upstream whose model you could simply adopt
      (conformist), duplicating every type for nothing.
    - Translating into a "domain model" that is a field-for-field copy of the external one.
    - Layers of mappers between internal modules of one context.
  remedy: null
  counter: >
    Translation costs code and upkeep, and every new field needs mapping. When the upstream model is good and
    stable, conforming to it (Evans's Conformist) is cheaper and gives you a shared language with the other
    team. When many clients integrate with you, an open host service with a published language is better than
    each client building its own layer. Use the layer where the other model would distort yours, typically
    legacy systems and broad vendor APIs.
  in:
    python: >
      A package per external system whose public functions return your own dataclasses; import-linter can
      forbid importing the vendor SDK anywhere else.
    typescript: >
      Generated clients (OpenAPI, GraphQL codegen) are the usual leak; keep their types inside the adapter
      module and export only domain types.
    java: >
      Generated SOAP or OpenAPI classes belong in the adapter package only; ArchUnit can check that the domain
      package never imports them.
    csharp: |
      Keep generated clients and their DTOs in an infrastructure project the domain project doesn't reference.
    go: >
      An adapter package that alone imports the vendor's module, returning your own structs; keep the vendor's
      types out of exported signatures.
    rust: >
      From and TryFrom impls between the external crate's types and yours, kept in one module, are the
      idiomatic translator.
  related:
    - adapter
    - facade
    - bounded-context
    - context-map
    - big-ball-of-mud
    - infrastructure-ignorance
  tell: >
    Any language: an import of an external system's SDK or generated client in a file under the domain or core
    directory, rather than in its adapter module (for example import stripe in domain/billing.py). Path-aware:
    needs the project's domain directories and the list of vendor packages configured.
  interview_only: false
  example:
    before: |
      fn renew(lease_no: str):
          rec = legacy_pms.fetch("LSE", lease_no)
          if rec["STAT_CD"] == 3 and rec["FLG_2"] != "Y":      # 3 = active, FLG_2 = under notice
              rec["END_DT"] = add_months(rec["END_DT"], 12)
              legacy_pms.update("LSE", rec)
    after: |
      # leasing/legacy_translator.py, the only code that knows the legacy model
      class LegacyLeaseTranslator:
          fn to_lease(rec) -> Lease:
              status = ACTIVE if rec["STAT_CD"] == 3 else INACTIVE
              return Lease(LeaseNumber(rec["LSE_NO"]), status, under_notice=rec["FLG_2"] == "Y",
                           ends_on=rec["END_DT"])
          fn to_record(lease: Lease) -> dict: ...

      # leasing/renewal.py
      fn renew(lease_no: LeaseNumber):
          lease = leases.get(lease_no)                         # repository uses the translator
          lease.renew_for(months=12)
          leases.save(lease)
    note: The legacy codes stay inside one translator, so the renewal rule reads in the business's terms and
      replacing the old system touches one module.
  sources:
    - cite: Eric Evans, Domain-Driven Design Reference (2015), Anticorruption Layer, Conformist, Open-host Service
      url: https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf
      how: read
    - cite: Eric Evans, Domain-Driven Design (2003), ch. 14
      url: https://www.domainlanguage.com/ddd/
      how: recalled
    - cite: Microsoft, Azure Architecture Center, Anti-corruption Layer pattern
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/anti-corruption-layer
      how: recalled
    - cite: Vlad Khononov, Learning Domain-Driven Design (2021), ch. 4 and 9
      url: https://www.oreilly.com/library/view/learning-domain-driven-design/9781098100124/
      how: recalled
  matters_most_for:
    - web-api
    - distributed
    - platforms
    - fullstack-web
- id: ports-and-adapters
  name: Ports and Adapters
  family: pattern
  group: architecture
  says: >
    Keep the application core free of technology. It talks to the outside world only through ports, which are
    interfaces it defines, and each database, UI, queue or test harness plugs in through an adapter that
    translates to that port.
  names: >
    Named by Alistair Cockburn in his article "Hexagonal Architecture" (dated 2005). Also called hexagonal
    architecture; the hexagon is only there to leave room in the drawing. Cockburn calls the two sides primary
    (driving) and secondary (driven). Jeffrey Palermo's Onion Architecture (2008) and Robert C. Martin's Clean
    Architecture (2012) are close variants that add named inner rings (domain model, use cases) around the
    same inside/outside split.
  applies_to:
    kinds: []
    languages: []
  contested: true
  looks_like:
    - A core or domain package that defines interfaces such as a repository, a notifier or a clock, and an
      infrastructure or adapters package that implements them.
    - The same port with two implementations, usually a real one and an in-memory one used by tests.
    - HTTP handlers, CLI commands and queue consumers that all call the same application service rather than
      each holding logic.
    - A composition root (main, a DI module, Program.cs) that wires adapters to ports in one place.
  forces:
    - Business rules are tangled with framework, SQL or SDK calls, so they can't be tested without the real
      database or service.
    - The same use case must be driven from more than one place (HTTP, CLI, a queue, a scheduled job, tests).
    - An external dependency is volatile, slow or expensive to run in tests (a payment provider, a third-party
      API, hardware).
    - The domain logic is rich enough that keeping it readable apart from plumbing pays off.
  overuse:
    - A port and an adapter for every dependency, including stable ones like the standard library or a logging
      facade.
    - Ports that mirror the vendor's API one to one, so the adapter translates nothing and the core still
      thinks in the vendor's terms.
    - A CRUD service with no real rules split into domain, application and infrastructure projects, so every
      field change edits five files.
    - Mapping between identical DTO, domain and persistence types at every boundary.
  remedy: null
  counter: >
    The cost is indirection and mapping code, and it only pays off when there is real logic in the core and
    real variation or test pain at the edges. Many thin services are better as a transaction script straight
    against the framework. Critics such as DHH have long argued that wrapping the ORM or the framework you
    have committed to gives you a second, worse API for no gain. The test benefit also shrinks where real
    dependencies are cheap to run in tests (SQLite, testcontainers). Ports should be shaped by what the core
    needs, not by the technology behind them; a port that leaks SQL or HTTP concepts gives the cost without
    the benefit.
  in:
    python: >
      Ports are usually typing.Protocol classes or abstract base classes in the core package; adapters are
      plain classes elsewhere. Without a DI container, wiring is done by hand in a composition function or
      FastAPI's Depends. import-linter can enforce that the core never imports adapters.
    typescript: >
      Structural typing means an adapter satisfies a port without naming it, and a port can be a type alias
      for a function. Enforce the direction with dependency-cruiser or eslint-plugin-boundaries; nothing in
      the language stops a core file importing an adapter.
    java: >
      Ports are interfaces in the domain or application package, adapters are Spring or Jakarta beans, and the
      container does the wiring. The danger is framework annotations (JPA @Entity, @Transactional) creeping
      into the core; ArchUnit or JPMS modules can enforce the split.
    csharp: Commonly done as separate projects (Core or ApplicationCore, Infrastructure, Web). The compiler then
      enforces the dependency rule only if the core project references nothing outward, including shared DTO
      projects, so check its project references. Wiring goes through Microsoft.Extensions.DependencyInjection
      in Program.cs.
    go: >
      Interfaces are satisfied implicitly, so Go's idiom is for the consumer to declare the small interface it
      needs, next to the code that uses it, rather than the provider exporting one. That is a port by default.
      Wiring is explicit in main; DI containers are rare.
    rust: >
      Ports are traits. Choose generics for zero-cost static dispatch or `dyn Trait` for runtime choice and
      smaller compile times. Splitting a workspace into a core crate and adapter crates makes Cargo enforce
      the direction, since dependency cycles between crates are impossible.
  related:
    - dependency-rule
    - layered-architecture
    - adapter
    - solid
    - microkernel
  tell: null
  interview_only: false
  sources:
    - cite: Alistair Cockburn, Hexagonal Architecture (Ports and Adapters), 2005
      url: https://alistair.cockburn.us/hexagonal-architecture/
      how: read
    - cite: Robert C. Martin, The Clean Architecture (blog, 2012)
      url: https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
      how: read
    - cite: Jeffrey Palermo, The Onion Architecture, part 1 (2008)
      url: https://jeffreypalermo.com/2008/07/the-onion-architecture-part-1/
      how: recalled
  example:
    before: |
      class PayslipService:
          fn issue(employee_id):
              emp = sql.query("select * from employees where id = ?", employee_id)
              payslip = compute_payslip(emp)
              smtp = SmtpClient("mail.internal", 25)
              smtp.send(emp.email, render_pdf(payslip))
      # testing issue() needs a real database and a mail server
    after: |
      interface Employees:            # ports, owned by the core
          fn get(id) -> Employee
      interface PayslipSender:
          fn send(employee: Employee, payslip: Payslip)

      class PayslipService:
          fn init(employees: Employees, sender: PayslipSender): ...
          fn issue(employee_id):
              emp = self.employees.get(employee_id)
              self.sender.send(emp, compute_payslip(emp))

      class SqlEmployees implements Employees: ...      # adapters, outside the core
      class SmtpPayslipSender implements PayslipSender: ...
    note: The core names what it needs in its own terms; SQL and SMTP become swappable adapters, and tests plug in
      in-memory ones.
  matters_most_for:
