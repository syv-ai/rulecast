- id: non-exhaustive-types
  name: Non-Exhaustive Types
  family: practice
  group: api
  says: When a public enum, struct or interface is likely to grow, mark it so outside code can't depend on
    knowing every case or field, so you can add a variant, field or method later without a breaking release.
  names: "Also called #[non_exhaustive], Sealed traits, Open enums. Rust's #[non_exhaustive] came from RFC 2008
    (stabilized in Rust 1.40). The Rust API Guidelines name the related patterns C-SEALED (sealed traits) and
    C-STRUCT-PRIVATE (private fields). Protobuf's and Google AIP's guidance on unknown enum values is the
    wire-format version."
  applies_to:
    kinds: []
    languages: []
  contested: true
  looks_like:
    - A public error or event enum that gained a variant in a minor release and broke downstream matches.
    - Public structs with all-public fields that callers build with literals.
    - A public interface or trait that outsiders implement, which can't gain a method.
    - Client code with a default or wildcard arm on a match over a library's enum, written for forward
      compatibility.
    - Response enums documented as "may gain values" with an UNSPECIFIED or unknown case.
  forces:
    - The type is in a published library, plugin API or wire format, and users upgrade on their own schedule.
    - The set is known to grow, such as error kinds, event types, platform names or config options.
    - An interface exists to be called by outsiders, not implemented by them.
  overuse:
    - Marking every type non-exhaustive, so users lose the compiler's help in exactly the places where seeing
      every case matters to them.
    - Marking closed sets (Ordering, a boolean-like toggle, days of the week) as open.
    - Sealing traits that users have a real reason to implement, such as for test doubles.
  remedy: null
  counter: >
    Exhaustiveness is a feature for the user: a new variant failing their build tells them to handle it.
    Libraries like serde-style data types and many application-internal enums are better left exhaustive, with
    a major release when a variant is added. Inside one codebase, exhaustive matching is what you want. The
    trade-off is who learns about a new case, and when: the compiler at upgrade time, or a wildcard arm at run
    time.
  axes:
    signs:
      change_cost: ++
      reliability: "-"
    why:
      change_cost: A variant, field or method can be added in a minor release without breaking downstream matches or
        literals.
      reliability: Users lose the compiler's help, so a new case lands silently in a wildcard arm at run time
        instead of failing their build.
    flips: On closed sets, or types used only inside one codebase, it just throws away exhaustiveness checking.
      Many libraries are better off exhaustive, with a major release per new variant.
  in:
    rust: >
      #[non_exhaustive] on an enum forces downstream matches to have a wildcard arm; on a struct it stops
      outside literals and exhaustive destructuring. It has no effect inside the defining crate. Seal a trait
      with a private supertrait to add methods freely.
    java: "Adding an enum constant is binary compatible. A switch expression with no default stops compiling for
      clients that recompile, and one compiled earlier throws on the new value at run time: MatchException
      from Java 21, IncompatibleClassChangeError before that. A classic switch statement just skips the new
      value silently. Sealed interfaces (Java 17) do the opposite: they close the set so switches can be
      exhaustive, which makes adding a permitted type a breaking change."
    csharp: >
      Enums are open by nature (any underlying integer is a valid value), so callers should always handle the
      unknown case; switch expressions warn on non-exhaustive matches. Adding a member to a public interface
      breaks implementers unless it has a default implementation (C# 8+).
    typescript: >
      Adding a member to an exported union breaks consumers who check exhaustiveness with never. Document
      unions as open, or include an unknown or string fallback member for values from the wire.
    go: >
      No enums: iota constants are open by nature and switches aren't checked (the exhaustive linter adds it).
      Seal an interface with an unexported method so only your package can implement it; adding methods to an
      exported interface others implement is a break.
    python: >
      Enum and match have no built-in exhaustiveness check; type checkers do it with assert_never. Values from
      outside can be anything, so code that parses them should handle unknown values.
  related:
    - breaking-change-surface
    - semantic-versioning-discipline
    - hyrums-law
    - postels-law
  tell: null
  interview_only: false
  example:
    before: |
      # published library
      enum PaymentFailure:
          CARD_DECLINED
          INSUFFICIENT_FUNDS

      # a user's code
      match failure:
          CARD_DECLINED: retry_with_other_card()
          INSUFFICIENT_FUNDS: notify_customer()
      # adding EXPIRED_CARD in a minor release breaks this build
    after: |
      # published library
      enum PaymentFailure:           # marked non-exhaustive: may gain cases in minor releases
          CARD_DECLINED
          INSUFFICIENT_FUNDS

      # a user's code
      match failure:
          CARD_DECLINED: retry_with_other_card()
          INSUFFICIENT_FUNDS: notify_customer()
          other: show_generic_failure(other)
    note: The enum declares it can grow, so callers are made to handle unknown cases and adding EXPIRED_CARD is no
      longer a breaking change.
  sources:
    - cite: Rust RFC 2008, non_exhaustive
      url: https://rust-lang.github.io/rfcs/2008-non-exhaustive.html
      how: recalled
    - cite: Rust API Guidelines, Future proofing (C-SEALED, C-STRUCT-PRIVATE)
      url: https://rust-lang.github.io/api-guidelines/future-proofing.html
      how: read
    - cite: Google AIP-126, Enumerations
      url: https://google.aip.dev/126
      how: recalled
  matters_most_for:
    - library-sdk
    - plugin-host
    - web-api
    - platforms
- id: contract-test
  name: Contract Test
  family: practice
  group: testing
  says: A test suite that pins what one side of an interface promises the other, and runs against every party
    that claims to keep the promise. One form is consumer-driven contracts, where the consumers of a service
    write down what they rely on and the provider runs those checks. Another is a contract suite that a host
    or library ships so every plugin, adapter or backend can prove it behaves as the host expects.
  names: Consumer-driven contracts were described by Ian Robinson in an article on Fowler's site (2006).
    Fowler's bliki ContractTest covers tests that check a test double still matches the real service. Pact is
    the best-known tool. In Java the shipped-suite form is called a TCK (Technology Compatibility Kit); others
    call it a conformance suite, specification tests or an abstract test case.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - An exported test function or abstract test class that takes a factory for "the thing under test" and
      runs the same cases against each implementation.
    - Pact files or similar contract artefacts checked into a consumer repo and verified in the provider's
      pipeline.
    - A testing subpackage in a library meant for downstream use (testlib, fstest, a specification-tests
      package).
    - Fakes or test doubles that are run through the same suite as the real implementation.
  forces:
    - Several implementations of one interface (storage backends, adapters, plugins, drivers) that must be
      interchangeable.
    - Third parties write implementations of your extension surface, and you can't read or run their code.
    - Separate teams or services deploy on their own schedule, and end-to-end tests across them are slow and
      flaky.
    - Hand-written fakes that may drift from the real thing.
  overuse:
    - A contract suite for an interface with one implementation and no outside implementers.
    - Contracts that pin exact data, wording or field order, so they break on harmless provider changes;
      contracts should check shape and the behaviour consumers rely on.
    - Consumer-driven contracts between modules deployed together, where an ordinary integration test is
      simpler.
    - Treating contract tests as a replacement for any end-to-end check of the deployed system.
  remedy: null
  counter: >
    Contract tests cost upkeep on both sides and a broker or shared artefact to coordinate them, which only
    pays off when parties change independently. For a few services owned by one team, a handful of integration
    tests is usually cheaper. Consumer-driven contracts can also hand consumers too much say: a provider with
    many consumers may prefer to publish its own schema and versioning policy (OpenAPI, protobuf with
    breaking-change checks) and let consumers adapt. A shipped suite only covers what its authors thought to
    test, so passing it is necessary, not sufficient, and it becomes part of your public API that plugin
    authors depend on (Hyrum's law applies to the suite too).
  axes:
    signs:
      reliability: ++
      change_cost: +
      delivery: "-"
    why:
      reliability: Every plugin, adapter, backend or fake is proven to behave as callers expect, so they really are
        interchangeable and fakes don't drift.
      change_cost: Separately deployed parties can change independently without slow, flaky end-to-end suites.
      delivery: The suite, and any broker or shared artefact, has to be written and kept up on both sides.
    flips: For one implementation, or a few services owned by one team, a handful of integration tests is cheaper.
      Contracts that pin exact data or wording break on harmless changes and turn change_cost "-".
  in:
    python: >
      Usually a base test class or a parametrised pytest fixture over implementations; a library can ship it
      as an importable module or pytest plugin. Pact has a Python implementation.
    typescript: >
      Commonly an exported function that registers describe/it blocks for a factory, so plugin authors call it
      from their own Jest or Vitest suite. Pact JS is the main consumer-driven tool.
    java: >
      Abstract JUnit test classes with a factory method, or JUnit 5 @TestTemplate and interface default test
      methods. TCKs for Jakarta EE specs are the formal version; Guava's testlib collection testers are a
      library example. Spring Cloud Contract and Pact JVM cover services.
    csharp: >
      Abstract xUnit or NUnit base classes; Microsoft ships specification test packages, such as the ones for
      dependency injection containers, that third-party containers run. PactNet covers services.
    go: >
      The standard library sets the example: testing/fstest.TestFS checks any fs.FS, and testing/iotest helps
      check readers. A package exports a function taking *testing.T and a constructor.
    rust: >
      Usually a function or macro, often in a separate test-support crate or behind a feature flag, that runs
      the suite against any type implementing the trait. Pact has a Rust implementation.
  related:
    - test-double-taxonomy
    - fake-over-mock
    - liskov-substitution-principle
    - hyrums-law
    - postels-law
    - testing-pyramid
  tell: null
  interview_only: false
  example:
    before: |
      # each backend has its own ad hoc tests
      test "s3 store keeps blobs":
          store = S3Store(test_bucket)
          store.put("a", b"1")
          assert store.get("a") == b"1"

      test "disk store lists keys":
          store = DiskStore(tmp_dir)
          ...
      # nobody checks that a missing key behaves the same in both
    after: |
      # shipped by the host, imported by every backend's tests
      fn blob_store_contract(make_store):
          test "round trips":
              s = make_store(); s.put("a", b"1"); assert s.get("a") == b"1"
          test "missing key is NotFound":
              s = make_store(); assert raises(NotFound, s.get, "nope")
          test "list is sorted":
              ...

      blob_store_contract(fn: S3Store(test_bucket))
      blob_store_contract(fn: DiskStore(tmp_dir()))
      blob_store_contract(fn: InMemoryStore())
    note: One suite says what a blob store must do, and every implementation, the in-memory fake included, has to
      pass it.
  sources:
    - cite: Martin Fowler, bliki, ContractTest
      url: https://martinfowler.com/bliki/ContractTest.html
      how: read
    - cite: Ian Robinson, Consumer-Driven Contracts, a Service Evolution Pattern (2006)
      url: https://martinfowler.com/articles/consumerDrivenContracts.html
      how: read
    - cite: Pact documentation
      url: https://docs.pact.io/
      how: recalled
    - cite: Go standard library, testing/fstest
      url: https://pkg.go.dev/testing/fstest
      how: recalled
  matters_most_for:
    - plugin-host
    - library-sdk
    - distributed
    - event-driven
    - web-api
    - databases-storage
- id: property-based-test
  name: Property-Based Test
  family: practice
  group: testing
  says: Instead of a few hand-picked examples, state a rule that must hold for every input (the output is
    sorted, decoding undoes encoding, the parts add up to the total), let a library generate many inputs, and
    when one fails, let it shrink that input to the smallest case that still fails.
  names: Introduced by Koen Claessen and John Hughes with QuickCheck for Haskell (2000). Also called generative
    testing. Closely related to fuzzing, which leans on coverage guidance and crashes rather than stated
    properties.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Tests that take generated arguments (given, forAll, proptest!, fc.assert) rather than literals.
    - Round-trip tests (parse after print, decode after encode) over generated values.
    - A test comparing a fast implementation against a slow obvious one on random input (a test oracle).
    - Stored regression seeds or failing-example databases next to the tests.
  forces:
    - Pure functions with a large input space, such as parsers, serialisers, encoders, numeric code, data
      structures.
    - A rule that is easy to state but has many edge cases (empty, unicode, overflow, duplicates).
    - Pairs of operations that should undo each other, or a simple reference implementation to compare against.
    - Bugs keep turning up for inputs nobody thought to write as examples.
  overuse:
    - Properties that restate the implementation, so they pass by construction.
    - Properties so weak (no exception thrown, output not empty) they catch little, used instead of examples.
    - Generators so complex they need their own tests, for code with a small input space.
    - Slow suites from high iteration counts run on every commit.
  remedy: null
  counter: >
    Good properties are hard to find for code that is mostly glue, I/O or business rules with many special
    cases; examples are clearer there and act as documentation. A failing property with a random seed can also
    be hard to reproduce unless the library records it. Most practitioners, Hughes included, mix the two:
    examples for the cases that explain the code, properties for the rules. Generated input is only as good as
    its generators, so a property can pass on millions of cases that all avoid the bug.
  axes:
    signs:
      reliability: ++
      delivery: "-"
    why:
      reliability: Generated and shrunk inputs find edge cases (empty, unicode, overflow, duplicates) nobody would
        write as examples.
      delivery: Finding good properties and writing generators takes more thought than writing examples.
    flips: For glue, I/O or business rules full of special cases, properties are weak or restate the
      implementation, and examples are clearer. High iteration counts on every commit slow the suite.
  in:
    python: >
      Hypothesis is the standard, with strong shrinking and a local database of failing examples; it plugs
      into pytest, and its stateful testing drives sequences of operations.
    typescript: |
      fast-check is the main library and works with Jest and Vitest.
    java: |
      jqwik for JUnit 5; junit-quickcheck is older.
    csharp: |
      FsCheck (usable from C#) and CsCheck.
    go: >
      Native fuzzing (go test -fuzz, since Go 1.18) covers much of the same ground with coverage guidance;
      rapid and gopter give QuickCheck-style properties. testing/quick is frozen.
    rust: >
      proptest is the common choice with good shrinking; quickcheck is the older port. cargo-fuzz and bolero
      cover fuzzing.
  related:
    - golden-master-test
    - test-data-builder
    - parse-dont-validate
  tell: null
  interview_only: false
  example:
    before: |
      test "split 100 three ways":
          assert split_cents(100, 3) == [34, 33, 33]
      test "split 10 two ways":
          assert split_cents(10, 2) == [5, 5]
      # nothing checks 0, 1 cent, negative refunds or 7-way splits
    after: |
      property "split keeps every cent":
          for_all total in ints(-10000, 10000), ways in ints(1, 50):
              parts = split_cents(total, ways)
              assert len(parts) == ways
              assert sum(parts) == total
              assert max(parts) - min(parts) <= 1
      # a failure shrinks to the smallest total and ways that break it
    note: Three rules replace two examples and cover inputs no one would think to write down, such as negative
      totals.
  sources:
    - cite: Koen Claessen and John Hughes, QuickCheck, a Lightweight Tool for Random Testing of Haskell Programs
        (ICFP 2000)
      url: https://dl.acm.org/doi/10.1145/351240.351266
      how: recalled
    - cite: Hypothesis documentation
      url: https://hypothesis.readthedocs.io/en/latest/
      how: read
    - cite: John Hughes, How to Specify It! (2019)
      url: https://research.chalmers.se/en/publication/517894
      how: recalled
  matters_most_for:
    - compilers-tooling
    - library-sdk
    - databases-storage
    - scientific
    - data-pipeline
- id: fake-over-mock
  name: Prefer Fakes over Mocks
  family: practice
  group: testing
  says: For a stateful collaborator you own, such as a repository, cache or queue, write one small in-memory
    fake that behaves like the real thing and use it across tests, instead of configuring a mock with expected
    calls in each test. Tests then check the resulting state rather than the calls made.
  names: The ordering of real implementation first, then fake, then stub or mock comes from Google's testing
    practice, written up in Software Engineering at Google (Winters, Manshreck and Wright, 2020), ch. 13. The
    terms fake and mock are Meszaros's. The order real implementation, then fake, then mock is set out by
    Andrew Trenk and Dillon Bly in Software Engineering at Google, ch. 13.
  applies_to:
    kinds: []
    languages: []
  contested: true
  looks_like:
    - In-memory implementations of repository or gateway interfaces in a test-support package.
    - Tests that call the code, then read back from the fake to assert what was stored.
    - The fake run through the same contract suite as the production implementation.
    - Before adopting it, every test stubs repo.get and verifies repo.save with slightly different setups.
  forces:
    - A collaborator with state that several calls depend on, so mocks have to script a sequence of answers.
    - Many tests mocking the same interface in slightly different ways, which all break when it changes.
    - Tests that pin call order and arguments the behaviour doesn't care about (Fragile Test).
    - The real thing (a database, a broker) is too slow or awkward for unit tests.
  overuse:
    - Fakes for third-party services whose real behaviour you don't know well, so the fake encodes guesses.
    - Fakes that grow into a second implementation with their own bugs, never checked against the real one.
    - A fake where a one-line stub would do because the test needs a single canned answer.
    - Fakes of things cheap enough to use for real, such as SQLite or a container started once per run.
  remedy: null
  counter: >
    The London (mockist) school holds that interaction tests with mocks are a design tool: they make you
    define roles and protocols between objects, and a fake hides that conversation. Freeman and Pryce would
    mock the role and test the real implementation's contract separately. A fake is code that has to be
    maintained and can drift; it is only trustworthy when it passes the same contract suite as the real
    implementation, ideally maintained by whoever owns the real one, as Google recommends. Where the
    interaction is the behaviour (an email sent, an event published, a charge made) a spy or mock states it
    more directly than inspecting a fake. And for a database, a real instance in a container often beats both.
  axes:
    signs:
      change_cost: ++
      delivery: "-"
    why:
      change_cost: Tests check resulting state rather than call order, so they don't all break when the
        collaborator's interface or the call sequence changes.
      delivery: The fake is real code that has to be written, maintained and ideally run through the same contract
        suite as the real implementation.
    flips: A fake of a third-party service you don't understand encodes guesses, and one never checked against the
      real thing drifts, so reliability turns "-". Where the interaction is the behaviour (an email sent), a
      spy says it more directly.
  in:
    python: >
      A small class with a dict inside, implementing the same Protocol as the real repository; Protocols keep
      the fake honest under a type checker. For SQL, an in-memory SQLite database may differ from production
      Postgres in ways that matter.
    typescript: >
      A class or object literal implementing the repository interface over a Map. Structural typing means the
      fake checks against the interface without inheriting anything.
    java: >
      Hand-written in-memory implementations of the repository interface; for Spring Data, Testcontainers with
      the real database is the common alternative to faking JPA behaviour.
    csharp: >
      In-memory implementations of the repository interface. Microsoft advises against the EF Core in-memory
      provider as a fake for the database, because it doesn't behave like a relational one.
    go: >
      Fakes are the idiomatic default: a struct with a map and a mutex implementing a small interface, often
      exported from a package's own testing helpers.
    rust: >
      A struct holding a HashMap (behind a RefCell or Mutex as needed) implementing the trait; usually
      preferred to mockall for stateful collaborators.
  related:
    - mock-everything
    - test-double-taxonomy
    - contract-test
    - fragile-test
  tell: null
  interview_only: false
  example:
