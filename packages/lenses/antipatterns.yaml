- id: anemic-domain-model
  name: Anemic Domain Model
  family: anti-pattern
  group: design
  says: >
    Domain classes that look like a model (named after business nouns, related to each other) but hold only
    data, while all the rules live in service classes that read and set their fields. It has the cost of a
    domain model without its benefit.
  names: >
    Named by Martin Fowler in his bliki (2003), who had discussed it with Eric Evans. Its opposite is a rich
    domain model. Data Class is the code-scale smell for a single class.
  applies_to:
    kinds: []
    languages: []
  contested: true
  looks_like:
    - Entity classes with only fields, getters and setters, and service classes named after them (Order and
      OrderService) holding every rule.
    - Services that read several fields of an entity, decide, then set its status (Feature Envy repeated).
    - The same validation of an entity's state copied across services.
    - An ORM and a mapping layer in place, yet no behaviour on the mapped objects.
  forces:
    - Frameworks and tutorials present entities as ORM-mapped data holders and services as where code goes.
    - Layered architecture read as "entities hold data, services hold logic".
    - JavaBeans conventions and serialisers that want public setters and no-arg constructors.
    - Generated entities (from a schema or ORM scaffolding) that nobody adds methods to.
  remedy: >
    If the rules are complex and repeated, move them onto the objects they are about (Move Method), replace
    setters with intention-revealing methods that enforce invariants, and leave the services to coordinate
    loading, transactions and calls. If the logic is simple, drop the pretence instead: call it a transaction
    script over plain records and skip the domain-model machinery.
  overuse:
    - Pushing every operation onto entities, including persistence, emails and calls to other services, so
      entities grow into god objects that need the whole system to construct.
    - Forcing rich objects onto CRUD and generic subdomains with no invariants worth protecting.
  counter: >
    For CRUD and generic subdomains, a transaction script over plain data is fine, and Fowler's own PoEAA says
    a domain model is only worth it when the logic is complex. Functional styles (Wlaschin, the "data-oriented
    programming" school) deliberately separate immutable data from the functions that act on it and get
    cohesion through modules and types instead; that is not this anti-pattern when the rules for one concept
    live in one place. Plain data is also right at boundaries (DTOs, events, read models in CQRS). The problem
    is specifically rules about one concept scattered across services while the classes pretend to be a model.
  in:
    java: Common in Spring with JPA entities generated with Lombok getters and setters and logic in @Service
      classes. Where there is no service layer and the rules sit in controllers, the problem is
      fat-controller, not anemia.
    csharp: The alternative is private setters and behaviour methods on entities, which EF Core supports as well
      as it supports plain property bags.
    python: >
      In Django, keeping logic in model methods and managers is idiomatic, so a thin-model, services-heavy
      Django app is the anemic form; SQLModel classes used as both table and schema tend toward it too.
    typescript: >
      Plain types with functions in one module per concept is a legitimate functional style, not anemia;
      anemia is TypeORM entity classes with logic scattered across several services.
    go: >
      Plain structs with logic in service methods is mainstream Go and usually fine; it becomes the
      anti-pattern only when one concept's rules are spread across several services.
    rust: >
      Structs with pub fields and logic elsewhere is the same risk; private fields and methods or modules that
      own the type are the idiom.
  related:
    - domain-model
    - transaction-script
    - service-layer
    - data-class
    - feature-envy
    - business-logic-in-helpers
    - god-object
  tell: null
  agent_prone: true
  interview_only: false
  sources:
    - cite: Martin Fowler, AnemicDomainModel (bliki, 2003)
      url: https://martinfowler.com/bliki/AnemicDomainModel.html
      how: read
    - cite: Martin Fowler, PoEAA ch. 2, Organizing Domain Logic
      url: https://martinfowler.com/books/eaa.html
      how: recalled
    - cite: Scott Wlaschin, Domain Modeling Made Functional (2018)
      url: https://pragprog.com/titles/swdddf/domain-modeling-made-functional/
      how: recalled
  example:
    before: |
      class GiftCard:
          balance: Money
          status: str
          expires_at: Date

      class RedemptionService:
          fn redeem(card, amount):
              if card.status != "active" or today() > card.expires_at: raise Unusable()
              if amount > card.balance: raise Insufficient()
              card.balance = card.balance - amount

      class RefundService:
          fn refund_to_card(card, amount):
              card.balance = card.balance + amount     # forgot the expiry check
    after: |
      class GiftCard:
          fn redeem(amount: Money):
              self.require_usable()
              if amount > self.balance: raise Insufficient()
              self.balance -= amount

          fn credit(amount: Money):
              self.require_usable()
              self.balance += amount

      class RedemptionService:
          fn redeem(card_id, amount): with uow: uow.cards.get(card_id).redeem(amount); uow.commit()
    note: The card's rules move onto the card, so every service gets them for free and the service only
      coordinates.
  matters_most_for:
    - web-api
    - fullstack-web
- id: fat-controller
  name: Fat Controller
  family: anti-pattern
  group: architecture
  says: >
    Route handlers or controllers that hold the business logic themselves (validation rules, calculations,
    queries, side effects) instead of parsing the request, calling the application and shaping the response.
  names: >
    The opposite of the Rails-era advice "skinny controller, fat model" (Jamis Buck, 2006). Also called
    Massive View Controller in iOS, where the same thing happens to UIViewController.
  applies_to:
    kinds:
      - web-api
      - fullstack-web
      - mobile
    languages: []
  contested: false
  looks_like:
    - Handler functions of fifty lines or more that query the database, apply rules and send emails.
    - Controllers importing the ORM session, payment clients and mailers directly.
    - The same rule appearing in an HTTP handler and again in a CLI command or background job.
    - Business logic tested only through HTTP test clients because it can't be called any other way.
  forces:
    - Framework tutorials and scaffolding put everything in the handler.
    - It is the fastest place to add one more check under a deadline.
    - Fear of over-engineering, so no service layer or domain model is ever introduced, even as logic grows.
    - Coding agents asked to add a feature to an endpoint put it in the endpoint.
  remedy: >
    Extract the use case into a function or service (Extract Function, then Move Function into a service layer
    or onto the domain object), leaving the handler to parse input, call one operation and map the result or
    error to a response.
  overuse:
    - A service for every handler whose method only forwards the call (Middle Man), or a service, an interface
      and a mapper for a two-line read.
    - Banning all logic from handlers, including request-specific concerns that belong there (status codes,
      headers, content negotiation).
  counter: >
    For CRUD endpoints and small apps, a handler that reads, writes and returns is the simplest correct code,
    and querying from handlers is fine at that size. The smell is business rules that will be needed
    elsewhere, or handlers too long to read, not the mere presence of a database call. Moving logic into the
    model can also overshoot into fat models; the aim is logic with a home that isn't tied to HTTP.
  in:
    python: >
      In FastAPI, path operation functions that use the session directly are the template style; move rules
      out when a second entry point or a second rule appears. In Django, the idiom is fat models or a services
      module, not views.
    java: >
      In Spring, @Controller methods with repository calls are fine for CRUD; business rules go in @Service
      classes or entities.
    csharp: ASP.NET Core controllers or minimal API lambdas; application services or handler classes are the
      common move out. MediatR is the familiar handler library. Since 13.0 (2025) MediatR is dual-licensed,
      RPL-1.5 or commercial, with a free community licence for small organisations; 12.x stays Apache 2.0.
      Plain handler classes registered in DI do the same job without it.
    typescript: |
      Express route callbacks are where it grows; NestJS pushes logic into providers by structure.
    go: >
      http.HandlerFunc bodies that do everything are common in small services; extract a service struct when
      logic grows.
    rust: >
      axum or actix handler functions; keep them to extractors in, a call to a function or service, and a
      response out.
  related:
    - service-layer
    - front-controller
    - god-object
    - long-method
    - large-class
    - duplicate-code
    - transaction-script
  tell: null
  agent_prone: true
  interview_only: false
  sources:
    - cite: Jamis Buck, Skinny Controller, Fat Model (2006)
      url: http://weblog.jamisbuck.org/2006/10/18/skinny-controller-fat-model
      how: recalled
    - cite: Martin Fowler, Patterns of Enterprise Application Architecture, Service Layer (catalog summary)
      url: https://martinfowler.com/eaaCatalog/serviceLayer.html
      how: read
  example:
    before: |
      fn post_registration(req):
          body = parse(req.body)
          event = db.query_one("SELECT * FROM events WHERE id = ?", body.event_id)
          taken = db.query_one("SELECT count(*) FROM registrations WHERE event_id = ?", event.id)
          if taken >= event.capacity: return 409
          price = event.price * (0.8 if body.member else 1.0)
          if today() < event.early_bird_until: price = price - 10
          db.execute("INSERT INTO registrations ...", event.id, body.email, price)
          mailer.send(body.email, "You're in", ...)
          return 201
      # the box office CLI reimplements the pricing, slightly differently
    after: |
      fn register(event_id, email, member: bool) -> Registration:
          event = events.get(event_id)
          reg = event.register(email, member, today())   # capacity and pricing rules live here
          registrations.add(reg)
          mailer.send(email, "You're in", ...)
          return reg

      fn post_registration(req):
          body = parse(req.body)
          try: return created(register(body.event_id, body.email, body.member))
          except EventFull: return 409
    note: The handler only translates HTTP, and the rules can be called from the CLI or a test without a request.
  matters_most_for:
    - web-api
    - fullstack-web
- id: generic-repository
  name: Generic Repository
  family: anti-pattern
  group: design
  says: >
    A single Repository<T> with get, get_all, add, update and delete that sits over an ORM which already
    offers all of that, so it adds a layer without adding meaning and often hides the ORM's useful features.
  names: Debated mostly in .NET. Critics include Oren Eini (Ayende), "Repository is the new Singleton" (2009),
    and later Jimmy Bogard, who favours query objects over repositories. It is defended in a form with
    specifications by Steve Smith (Ardalis). No single coiner.
  contested: true
  looks_like:
    - An IRepository<T> or BaseRepository<T> interface with CRUD methods and one EF, JPA or TypeORM
      implementation.
    - Services that call get_all() and filter in memory, or that need a new method on the base for every query
      shape.
    - get_all returning IQueryable or a query builder, so the ORM leaks through anyway.
  forces:
    - Tutorials and templates present it as the standard clean-architecture layer.
    - Wanting to swap the database later, or to mock data access in unit tests.
    - DRY applied to the five CRUD methods every repository would otherwise repeat.
  remedy: >
    Use the ORM directly in the application layer for simple cases, or write specific repositories with
    intention-revealing methods (one per aggregate), or use query objects or specifications for reads. Test
    against a real or in-memory database rather than mocking the repository.
  overuse:
    - Spreading ORM calls through controllers and views with no seam at all, so query logic is duplicated and
      domain code depends on the ORM everywhere.
    - Refusing any repository, even where a real domain model or a second store would benefit.
  counter: >
    Contested. Its defenders (Steve Smith, Ardalis) pair a generic base with the Specification pattern, which
    keeps query logic named and reusable and keeps EF out of the domain; teams that value that separation find
    it worth it. A generic base under specific repository interfaces is also reasonable, since it only shares
    implementation. The anti-pattern is the generic interface used as the whole abstraction, over an ORM that
    already is a repository and unit of work.
  in:
    csharp: >
      The main battleground. DbSet is already a repository and DbContext a unit of work; Microsoft's guidance
      treats a custom layer as optional. Returning IQueryable from a repository defeats its purpose.
    java: >
      Spring Data's CrudRepository is a generic repository supplied by the framework, which is fine; writing
      your own GenericDao<T> over JPA on top of it is the redundant form.
    typescript: >
      Hand-written BaseRepository<T> over TypeORM or Prisma, often from NestJS templates, duplicates what the
      ORM already offers.
    python: Less common; a generic CRUDBase over SQLAlchemy is the same shape.
    go: >
      Generics made Repository[T any] possible, but Go favours small consumer-defined interfaces, so the
      pattern is rare and usually discouraged.
  related:
    - repository
    - unit-of-work
    - misapplied-genericity
    - speculative-generality
    - middle-man
    - over-engineering
    - mock-everything
  tell: null
  agent_prone: true
  interview_only: false
  sources:
    - cite: Oren Eini (Ayende Rahien), Repository is the new Singleton (2009)
      url: https://ayende.com/blog/3955/repository-is-the-new-singleton
      how: recalled
    - cite: Steve Smith (Ardalis), Ardalis.Specification
      url: https://github.com/ardalis/Specification
      how: recalled
    - cite: Microsoft, Design the infrastructure persistence layer (.NET microservices guide)
      url: https://learn.microsoft.com/en-us/dotnet/architecture/microservices/microservice-ddd-cqrs-patterns/infrastructure-persistence-layer-design
      how: recalled
  example:
    before: |
      interface Repository<T>:
          fn get(id) -> T
          fn all() -> list[T]
          fn add(item: T)
          fn update(item: T)
          fn delete(item: T)

      fn open_courses_for(student):
          courses = course_repo.all()                    # loads every course
          return filter(courses, fn(c): c.is_open and c.level <= student.level)
    after: |
      interface CourseCatalog:
          fn open_for_level(level: int) -> list[Course]

      class OrmCourseCatalog implements CourseCatalog:
          fn open_for_level(level):
              return self.orm.courses.where(is_open=true, level_lte=level).list()

      fn open_courses_for(student): return catalog.open_for_level(student.level)
    note: The interface names the question the domain asks, and the filter runs in the database instead of in
      memory.
  matters_most_for:
    - web-api
    - fullstack-web
- id: inner-platform-effect
  name: Inner-Platform Effect
  family: anti-pattern
  group: design
  says: >
    A system made so configurable that it becomes a poor copy of the platform it runs on: a homemade database
    inside a database, a scripting language in JSON, a rules engine that only programmers can drive.
  names: >
    Named by Alex Papadimoulis on The Daily WTF (2006), whose example was a "data structure modeler" storing
    tables, fields and types as rows. Related to the entity-attribute-value (EAV) anti-pattern in databases,
    Greenspun's tenth rule, and "softcoding" (also coined on The Daily WTF).
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Tables named entity, attribute, field_definition or value that describe other tables.
    - Configuration files with if, then, loop or expression keys interpreted at runtime.
    - A visual workflow or rules editor that end users never use and developers edit through raw JSON.
    - Business logic stored in the database as strings and evaluated.
    - A homemade permission, query or template language with its own parser.
  forces:
    - A wish to let non-programmers change behaviour without a release.
    - Fear of hard-coding, misread as "everything must be configurable".
    - Slow release cycles, which make configuration look faster than code.
    - Requirements stated as "the customer must be able to define their own fields and rules".
  overuse:
    - Refusing any configuration, so every threshold, label or feature toggle needs a code change and deploy.
    - Rejecting a real, well-scoped need for user-defined fields or rules that a mature engine or the
      database's JSON column handles well.
  remedy: Put the logic back in the host language and the host database, and shorten the release path so
    changing code is as cheap as changing configuration. Where users truly need extensibility, embed an
    existing language or engine (Lua, CEL, a JSON column, a mature rules engine) instead of inventing one.
  counter: >
    Some products really are platforms: CRMs with custom objects, low-code tools and form builders sell
    exactly this configurability, and it is designed, tested and documented as a product. Domain-specific
    languages are legitimate when the users are domain experts and the language is kept small. The
    anti-pattern is drifting into a general-purpose platform by accident, without the tooling (debugging,
    versioning, tests) the real platform already has.
  in: {}
  related:
    - over-engineering
    - speculative-generality
    - second-system-effect
    - reinventing-the-wheel
    - misapplied-genericity
    - zawinskis-law
  tell: null
  interview_only: false
  agent_prone: false
  sources:
    - cite: Alex Papadimoulis, The Inner-Platform Effect, The Daily WTF (2006)
      url: https://thedailywtf.com/articles/The_Inner-Platform_Effect
      how: read
    - cite: Bill Karwin, SQL Antipatterns (2010), Entity-Attribute-Value
      url: null
      how: recalled
  example:
    before: |
      # discount_rules.json, edited by developers only
      [{"if": {"and": [{"field": "cart.total", "op": ">", "value": 100},
                       {"field": "customer.tier", "op": "==", "value": "gold"}]},
        "then": {"set": "discount", "expr": "cart.total * 0.1"}}]

      fn apply_rules(cart, customer):
          for rule in load_json("discount_rules.json"):
              if evaluate(rule["if"], {"cart": cart, "customer": customer}):  # homemade interpreter
                  execute(rule["then"], ...)
    after: |
      fn discount(cart, customer) -> Money:
          if cart.total > 100 and customer.tier == GOLD:
              return cart.total * GOLD_DISCOUNT_RATE
          return 0
      # GOLD_DISCOUNT_RATE stays in config; the logic is code, with tests and a debugger
    note: The rule language rebuilt conditionals and arithmetic badly; plain code is shorter and tooling works on
      it, while only the true parameter stays configurable.
  matters_most_for:
    - platforms
    - fullstack-web
    - plugin-host
- id: broken-object-level-authorization
  name: Broken Object Level Authorization (IDOR)
  family: anti-pattern
  group: security
  says: >
    A handler loads or changes a record by an id the client sent, and checks that the caller is logged in but
    never that this caller may see or touch that particular record.
  names: Named Insecure Direct Object Reference (IDOR) in the OWASP Top 10 2007 (A4); renamed Broken Object
    Level Authorization (BOLA) in the OWASP API Security Top 10 2019 (API1), kept as API1:2023. In the main
    Top 10 it was folded into Broken Access Control in 2017 (A5:2017), which has been A01 since 2021. MITRE's
    CWE-639, Authorization Bypass Through User-Controlled Key.
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - web-api
    - fullstack-web
    - mobile
    - platforms
  looks_like:
    - A route such as GET /invoices/{id} whose handler calls a find-by-primary-key and returns the result,
      with no mention of the current user or tenant.
    - Update and delete endpoints that take an id and act on it after only an "is authenticated" attribute or
      middleware.
    - Repository methods that take only an id (get_by_id, FindAsync(id), findById) and are the only lookups
      the handlers use.
    - Ownership checked in the list endpoint (filtered by user) but not in the detail, update or delete
      endpoints beside it.
    - Child records reached through a parent id in the path (/orders/{orderId}/items/{itemId}) where the item
      is loaded by its own id without checking it belongs to that order and that order to the caller.
    - No test that logs in as one user and tries to read another user's record.
  forces:
    - Authentication feels like authorization. An [Authorize] attribute or a login dependency on the route
      looks like the job is done.
    - Scaffolding and CRUD generators produce find-by-id handlers, and the ownership rule is a business fact
      the generator can't know.
    - The list view was written first and filtered by user; the detail view was added later by copying the
      lookup, not the filter.
    - Random ids (UUIDs) give a false sense that nobody can guess them.
    - Each endpoint is written alone, so the check has no single home and is easy to forget on the next one.
  overuse:
    - Hand-written ownership checks repeated in every handler, which drift; a policy or a scoped query helper
      is the fix, not more copies.
    - Treating every record as private, including catalogue data that is meant to be public.
    - Returning 403 for records that exist but belong to someone else, which tells an attacker which ids are
      real; where existence itself is sensitive, answer 404 for both.
    - Encrypting or obfuscating ids in place of a check.
  remedy: >
    Resolve the record through the caller: scope the query to the current user or tenant (find by id and owner
    id, or start from the user's own collection) so a foreign id simply isn't found. Where the rule is richer
    than ownership, call one authorization policy with the user, the action and the loaded record. Give the
    check one home (a policy, a scoped repository, a tenant filter on the data layer) and add a test per
    endpoint that crosses users.
  counter: >
    Public resources (a product catalogue, published posts) need no per-object check, and adding one there is
    noise. Internal tools behind a trusted network with a single role may reasonably skip it, though the trust
    assumption should be written down. Unguessable ids lower the risk but OWASP is clear they are a second
    layer, not the check. The fix is a design choice about where the rule lives, not a check pasted into each
    handler.
  in:
    python: >
      Django: get_object_or_404(Invoice, pk=pk, owner=request.user), or override get_queryset in DRF views so
      detail routes inherit the user filter. FastAPI has no built-in; a dependency that loads the record and
      checks ownership keeps it out of each handler. SQLAlchemy session.get(Model, id) is the unscoped form.
    typescript: >
      Prisma findUnique({ where: { id } }) is the unscoped form; findFirst({ where: { id, ownerId } }) scopes
      it. Express and Next.js route handlers have no authorization layer of their own, so the check lives
      wherever the team puts it, and Next.js server actions are public endpoints that need it too.
    java: >
      Spring Security's URL rules and @PreAuthorize("isAuthenticated()") don't cover ownership. Use derived
      queries such as findByIdAndOwnerId, @PostAuthorize on the loaded object, or a PermissionEvaluator.
    csharp: >
      [Authorize] checks identity, not the record. ASP.NET Core's resource-based authorization
      (IAuthorizationService.AuthorizeAsync with the loaded entity and a policy) is the built-in move; EF Core
      global query filters scope every query to a tenant. DbSet.FindAsync(id) is the unscoped form.
    go: >
      No framework layer to lean on; pass the caller's id into the store method (GetInvoice(ctx, userID, id))
      so an unscoped lookup is not the easy path.
  related:
    - mass-assignment
    - trusting-client-input
    - least-privilege
    - defense-in-depth
    - shotgun-surgery
  tell: null
  agent_prone: true
  interview_only: false
  example:
    before: |
      route GET "/payslips/{id}" requires login
      fn get_payslip(id: str, user: User) -> Payslip:
          payslip = payslips.find_by_id(id)
          if payslip is None:
              return not_found()
          return payslip
    after: |
      route GET "/payslips/{id}" requires login
      fn get_payslip(id: str, user: User) -> Payslip:
          payslip = payslips.find_for_employee(id, employee_id=user.employee_id)
          if payslip is None:
              return not_found()   # someone else's payslip looks the same as a missing one
          return payslip
    note: The lookup is scoped to the caller, so a valid id that belongs to someone else is simply not found.
  sources:
    - cite: OWASP API Security Top 10 2023, API1:2023 Broken Object Level Authorization (CC BY-SA 4.0)
      url: https://api-security.owasp.org/editions/2023/en/0xa1-broken-object-level-authorization/
      how: read
    - cite: OWASP Top 10 2025, A01:2025 Broken Access Control (CC BY 3.0)
      url: https://top10.owasp.org/2025/A01_2025-Broken_Access_Control/
      how: read
    - cite: OWASP Cheat Sheet Series, Insecure Direct Object Reference Prevention (CC BY-SA 4.0)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.html
      how: read
    - cite: OWASP Top 10 2007, A4 Insecure Direct Object Reference (origin of the IDOR name)
      url: https://owasp.org/www-project-top-ten/
      how: recalled
    - cite: MITRE CWE-639, Authorization Bypass Through User-Controlled Key
      url: https://cwe.mitre.org/data/definitions/639.html
      how: recalled
- id: hard-coded-secrets
  name: Hard-coded secrets
  family: anti-pattern
  group: security
  says: >
    Passwords, API keys, tokens or private keys are written into source code, checked-in config or build
    files, where everyone with the repository, the image or the bundle can read them.
  names: >
    MITRE's CWE-798, Use of Hard-coded Credentials, with CWE-259 (hard-coded password) and CWE-321 (hard-coded
    cryptographic key). Mapped to A07:2025 Authentication Failures and A04:2025 Cryptographic Failures in the
    OWASP Top 10 2025; A02:2025 Security Misconfiguration also warns against static keys in code and
    pipelines. Often just called leaked or committed secrets.
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - iac
    - serverless
    - data-pipeline
    - ml-training
    - web-api
  looks_like:
    - String literals in source that match a provider's key format (AKIA..., ghp_..., sk_live_..., xoxb-..., a
      PEM private key block).
    - Variables named password, secret, api_key or token assigned a literal that isn't a placeholder.
    - Connection strings with a user and password inside, in code or in checked-in appsettings.json,
      application.properties or docker-compose files.
    - Secrets in Dockerfile ENV or ARG, CI workflow files, Terraform variables with defaults, or notebooks.
    - A .env file committed, or no .env entry in .gitignore.
    - Frontend environment variables with a public prefix (NEXT_PUBLIC_, VITE_) that hold a server-side key.
    - A commit that removes a key without a note that it was rotated.
  forces:
    - It makes the example run. Quick starts, tutorials and generated snippets put the key inline so the first
      run works.
    - Local development needs a value, and a literal is the shortest path to one.
    - The repository is private, so it feels safe; then it is forked, open-sourced, cloned to a laptop or read
      by a CI log.
    - Setting up a secret manager is a project of its own and keeps getting deferred.
    - Deleting the line feels like a fix, though git history still holds the value.
  overuse:
    - Treating every string as a possible secret, so the scanner flags test fixtures and public identifiers
      and people learn to ignore it.
    - Moving secrets into environment variables and calling it done, though env vars leak into child
      processes, crash dumps and debug pages.
    - A full secret-management platform for a single-developer tool with one token, where an untracked local
      config file is enough.
  remedy: >
    Read secrets at runtime from the environment or a secret manager, injected by the platform, and keep only
    the name of the secret in code. Commit an example config with placeholders. Run a secret scanner in a
    pre-commit hook and in CI. When one leaks, revoke and replace it first; removing it from history comes
    second and doesn't undo the leak. Prefer short-lived credentials (workload identity, OIDC to the cloud) so
    there is no long-lived secret to leak.
  counter: >
    Not every credential-shaped string is a secret. Publishable keys (Stripe's pk_, a Firebase web config, an
    OAuth client id for a public client) are meant to ship to browsers, and test fixtures with fake keys are
    fine when clearly fake. Default credentials for a local throwaway database in a docker-compose file meant
    only for development are common and acceptable if the same values can never reach production. The real
    line is whether the value grants access to something that matters.
  in:
    typescript: >
      Anything in a NEXT_PUBLIC_ or VITE_ variable is inlined into the client bundle and is public.
      Server-only keys must stay in variables without those prefixes and only be read in server code.
    java: >
      Spring's checked-in application.properties or application.yml often carries spring.datasource.password;
      use a placeholder such as ${DB_PASSWORD} and supply it from the environment or Spring Cloud Config or
      Vault.
    csharp: >
      appsettings.json connection strings are the usual leak. Use dotnet user-secrets in development and Azure
      Key Vault or environment variables in deployment; the configuration system layers them over appsettings
      without code changes.
    python: >
      Settings modules (Django settings.py SECRET_KEY, a FastAPI config.py) and notebooks are the usual
      places. pydantic-settings reads from the environment and SecretStr keeps the value out of reprs.
  related:
    - magic-number
    - sensitive-data-in-logs
    - least-privilege
    - secure-by-default
  tell: "Any file outside test fixtures: what gitleaks reports, that is a known credential format (cloud, VCS,
    payment and chat tokens, private keys) or a high-entropy string assigned to a key-like name."
  agent_prone: true
  interview_only: false
  example:
    before: |
      class SmsGateway:
          fn __init__():
              self.client = HttpClient(
                  base_url="https://api.sms-provider.example",
                  api_key="sk_live_4f9a2c...e81",
              )

          fn send(number: str, text: str):
              self.client.post("/messages", {"to": number, "body": text})
    after: |
      class SmsGateway:
          fn __init__(api_key: Secret):
              self.client = HttpClient(
                  base_url="https://api.sms-provider.example",
                  api_key=api_key.reveal(),
              )
          ...

      # composition root
      gateway = SmsGateway(api_key=secrets.get("SMS_API_KEY"))
    note: The code names the secret and the runtime supplies it, so the key never enters the repository, and
      rotating it is a deploy, not a commit.
  sources:
    - cite: OWASP Cheat Sheet Series, Secrets Management (CC BY-SA 4.0)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
      how: read
    - cite: OWASP Top 10 2025, A07:2025 Authentication Failures, CWE-798 (CC BY 3.0)
      url: https://top10.owasp.org/2025/A07_2025-Authentication_Failures/
      how: read
    - cite: OWASP Top 10 2025, A02:2025 Security Misconfiguration (CC BY 3.0)
      url: https://top10.owasp.org/2025/A02_2025-Security_Misconfiguration/
      how: read
    - cite: MITRE CWE-798, Use of Hard-coded Credentials
      url: https://cwe.mitre.org/data/definitions/798.html
      how: recalled
- id: injection
  name: Injection (SQL, command, template)
  family: anti-pattern
  group: security
  says: >
    A query, shell command or template is built by pasting input into a string, so the interpreter can read
    part of the input as code instead of data.
  names: >
    SQL injection was first described publicly by Jeff Forristal (as rain.forest.puppy) in Phrack issue 54,
    1998. OWASP has ranked Injection in every Top 10 since 2003; it is A05:2025, which also covers OS command,
    NoSQL, ORM, LDAP and expression-language injection. MITRE's CWE-89 (SQL), CWE-78 (OS command) and CWE-1336
    (server-side template injection). Cross-site scripting is the same flaw in an HTML context, and prompt
    injection is a cousin with no reliable fix of this kind.
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - web-api
    - fullstack-web
    - data-pipeline
    - cli-devtool
    - databases-storage
  looks_like:
    - SQL built with string concatenation, interpolation or format calls that include a variable, passed to
      execute, query or a raw-SQL method.
    - An ORM's raw escape hatch fed an interpolated string (Django raw or extra, SQLAlchemy text, EF Core
      FromSqlRaw, Prisma $queryRawUnsafe, gorm Raw or Where with Sprintf).
    - Sort columns, table names or filter operators taken from the request and put into SQL unchecked.
    - Shell commands built as one string and run through a shell (shell=True, exec, system, sh -c).
    - A template engine given a template string that contains user input, rather than the input as data.
    - A hand-written escape function for quotes.
  forces:
    - String building is the most direct way to write a dynamic query, and it works on every test input.
    - Parts of a query can't be bound as parameters (identifiers, ORDER BY, IN lists of variable length), so
      people reach for formatting and then keep doing it for values too.
    - A shell one-liner is shorter than finding the library call or splitting arguments.
    - The input "comes from our own frontend", so it feels trusted.
    - Logging or debugging code wants the final SQL as one string.
  overuse:
    - Banning all raw SQL and forcing complex reports through an ORM that produces worse queries; raw SQL with
      bound parameters is safe.
    - Blocking quote characters or keywords in input, which breaks names like O'Brien and doesn't make the
      query safe.
    - Escaping values by hand on top of parameterized queries.
  remedy: >
    Keep code and data apart. Use bound parameters for every value (placeholders, the ORM's query builder, a
    tagged template that parameterizes). For identifiers and sort orders, map the input onto a fixed
    allow-list in code. Call programs with an argument list and no shell, or use a library function instead of
    the program. Pass user content to templates as variables, never as the template. Run the database account
    with least privilege so a miss does less harm.
  counter: >
    Interpolating constants or values the code itself chose (a column picked from a fixed map, a table name
    from configuration) is safe, and many fine dynamic query builders do exactly that. Admin-only scripts and
    migrations that never see outside input can format SQL freely, though habits travel. Query builders and
    ORMs are not a guarantee either: OWASP notes ORM search parameters and parameterized stored procedures
    that build dynamic SQL inside are both injectable.
  in:
    python: >
      DB-API placeholders (%s or ? depending on driver) passed as the second argument to execute; an f-string
      or % formatting inside execute is the flaw. SQLAlchemy text() needs bindparams; Django's ORM filters are
      safe but raw(), extra() and RawSQL with formatting are not. subprocess with a list and no shell=True is
      safe. Jinja2's Template(user_string) or Flask's render_template_string with user content is template
      injection.
    typescript: >
      node-postgres and mysql2 take a values array; a template literal into query() is the flaw. Prisma's
      $queryRaw tagged template parameterizes, $queryRawUnsafe does not. Knex raw takes bindings. Use
      child_process.execFile or spawn with an argument array rather than exec with a built string.
    java: >
      PreparedStatement and JdbcTemplate with ? placeholders, JPA named parameters, and Spring Data derived
      queries are safe; Statement.execute or createQuery with + concatenation is JPQL or SQL injection. Use
      ProcessBuilder with separate arguments. Thymeleaf expression preprocessing (__${...}__) on user input is
      template injection.
    csharp: >
      SqlCommand with Parameters.Add, Dapper's anonymous parameter object, and EF Core's FromSql or
      FromSqlInterpolated (which turn an interpolated string into parameters) are safe. FromSqlRaw or
      ExecuteSqlRaw with an interpolated or concatenated string is the flaw. Use ProcessStartInfo.ArgumentList
      rather than one Arguments string.
    go: >
      database/sql placeholders (? or $1) with args to Query or Exec; fmt.Sprintf into the SQL is the flaw,
      and gorm's Where, Order and Raw are only safe with placeholders. exec.Command with separate args doesn't
      use a shell; exec.Command("sh", "-c", built) does. html/template escapes by context, text/template does
      not.
    rust: >
      sqlx's query with .bind() and its compile-checked query! macros, and diesel's query builder, are safe;
      sql_query or query with format! is the flaw. std::process::Command takes arguments separately and runs
      no shell unless you call one.
  related:
    - validate-at-the-boundary
    - trusting-client-input
    - least-privilege
    - defense-in-depth
  tell: null
  agent_prone: true
  interview_only: false
  example:
    before: |
      fn stock_report(warehouse: str, sort: str) -> list[Row]:
          sql = "SELECT sku, qty FROM stock WHERE warehouse = '" + warehouse + "'"
          sql = sql + " ORDER BY " + sort
          return db.query(sql)

      fn archive_report(name: str):
          shell("tar czf /archive/" + name + ".tgz /reports/" + name)
    after: |
      SORTABLE = {"sku": "sku", "quantity": "qty"}

      fn stock_report(warehouse: str, sort: str) -> list[Row]:
          column = SORTABLE.get(sort) or raise BadRequest("unknown sort")
          sql = "SELECT sku, qty FROM stock WHERE warehouse = ? ORDER BY " + column
          return db.query(sql, [warehouse])

      fn archive_report(name: str):
          run(["tar", "czf", "/archive/" + name + ".tgz", "/reports/" + name])
    note: The value travels as a bound parameter, the column comes from a fixed map, and the command is an
      argument list with no shell, so no input can change what runs.
  sources:
    - cite: OWASP Top 10 2025, A05:2025 Injection (CC BY 3.0)
      url: https://top10.owasp.org/2025/A05_2025-Injection/
      how: read
    - cite: OWASP Cheat Sheet Series, SQL Injection Prevention (CC BY-SA 4.0)
      url: https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
      how: read
    - cite: OWASP Cheat Sheet Series, OS Command Injection Defense (CC BY-SA 4.0)
      url: https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
      how: read
    - cite: Jeff Forristal (rain.forest.puppy), NT Web Technology Vulnerabilities, Phrack 54 (1998)
      url: http://phrack.org/issues/54/8.html
      how: recalled
    - cite: MITRE CWE-89, CWE-78 and CWE-1336
      url: https://cwe.mitre.org/data/definitions/89.html
      how: recalled
- id: mass-assignment
  name: Mass assignment
  family: anti-pattern
  group: security
  says: >
    The request body is bound straight onto a domain or database model, so a client can set fields it was
    never meant to touch (role, owner, price, balance) just by adding them to the request.
  names: >
    The Ruby on Rails name, made famous when Egor Homakov used it on GitHub in 2012. Called autobinding in
    Spring MVC and ASP.NET MVC, over-posting in Microsoft's docs, and object injection in PHP. MITRE's
    CWE-915. OWASP's API Security Top 10 2023 merges it with excessive data exposure as API3:2023 Broken
    Object Property Level Authorization.
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - web-api
    - fullstack-web
    - mobile
  looks_like:
    - An ORM entity used as the request type of a create or update endpoint.
    - The whole body spread into a model constructor or an update call (Model(**body), new User(req.body),
      data req.body, Object.assign(entity, body)).
    - A loop that copies every key of the body onto the record with setattr or by index.
    - Serializers or forms that declare all fields (fields = "__all__") with no read-only list.
    - A block-list of protected fields (setDisallowedFields, $guarded, json ignore on one field) instead of a
      list of allowed ones.
    - The same model class used for the request, the database row and the response.
  forces:
    - One class for request, row and response is less code, and frameworks bind to anything with matching
      field names.
    - Generators and tutorials bind entities directly, because a demo has nothing to protect.
    - Writing a DTO per endpoint feels like duplication (and DRY gets misread as "never repeat a field list").
    - Sensitive fields are added to the model later, after the endpoint was written, and bind silently.
  overuse:
    - A separate DTO and mapper per endpoint even where the input is genuinely all user-editable, which adds
      boilerplate without protecting anything.
    - Mapping libraries configured to copy everything from the DTO to the entity, which reintroduces the
      problem one step later.
    - Treating an allow-list as an authorization check; it limits which fields can be written, not who may
      write this record.
  remedy: >
    Bind input to a request type that holds only the fields this caller may set, then copy them onto the
    entity explicitly. Where a separate type is too heavy, use the framework's allow-list (strong parameters,
    Bind with an include list, setAllowedFields, $fillable) rather than a block-list. Reject or ignore unknown
    fields on purpose, and set server-owned fields (owner, role, price) in code.
  counter: >
    For internal admin tools where every field is editable by the only role that can reach the endpoint,
    binding the model is fine and simpler. Pydantic or zod request schemas that already list only editable
    fields are the DTO, so spreading them into the model is safe; the flaw is binding to the type that also
    holds server-owned fields. Allow-lists still need maintaining; OWASP and CWE-915 both prefer them, but a
    stale allow-list fails the other way, silently dropping a new field.
  in:
    python: >
      FastAPI with separate Pydantic models for create, update and read (and model_config extra="forbid")
      avoids it; Model(**payload) where payload is a dict from request.json() does not. Django ModelForm and
      DRF ModelSerializer with fields = "__all__" bind everything; list fields and set read_only_fields.
    typescript: "Prisma create or update with data: req.body, Mongoose new Model(req.body), TypeORM merge or save
      with the body spread in, and Object.assign(entity, body) are the forms. Parse the body at the boundary
      with a runtime schema that lists only editable fields (a zod object strips unknown keys by default;
      .strict() rejects them), or copy named fields into data. A TypeScript type annotation on req.body checks
      nothing at runtime."
    java: Spring MVC binds @ModelAttribute and @RequestBody onto JPA @Entity classes readily. @InitBinder with
      setDisallowedFields is a block-list, which Spring itself calls fragile, and it doesn't cover nested
      paths; setAllowedFields or a record DTO is the allow-list form.
    csharp: >
      ASP.NET Core model binding onto an EF Core entity is over-posting. Use input models or records, or in
      MVC [Bind("Name,Email")] and TryUpdateModelAsync with an include list. AutoMapper profiles that map
      every member back onto the entity reintroduce it.
    go: >
      json.Unmarshal into the stored struct sets any exported field present in the body; decode into a
      separate input struct, or tag server-owned fields json:"-", and consider Decoder.DisallowUnknownFields.
    rust: >
      serde Deserialize on the stored struct binds every field; use a separate input struct, with
      #[serde(deny_unknown_fields)] if unknown keys should be an error.
  related:
    - broken-object-level-authorization
    - trusting-client-input
    - validate-at-the-boundary
    - data-class
  tell: "Python and TypeScript only. A model constructor, create or update call given the raw request body
    itself: Model(**request.json()), Model(**await request.json()), Model(**request.data / request.form /
    request.POST), setattr in a loop over request.<attr>.items(), new Model(req.body), Object.assign(x,
    req.body), data: req.body, ...req.body, data: await request.json(), and fields = \"__all__\" in a Django
    form or DRF serializer. Spreading a variable named data, payload or body doesn't count on the name alone."
  agent_prone: true
  interview_only: false
  example:
    before: |
      class Account:            # also the database row
          id: str
          display_name: str
          plan: str             # "free" | "pro"
          credit_balance: int

      route PATCH "/account"
      fn update_account(body: Account, user: User):
          account = accounts.get(user.account_id)
          copy_all_fields(from=body, to=account)
          accounts.save(account)
    after: |
      class AccountUpdate:      # only what a customer may change
          display_name: str

      route PATCH "/account"
      fn update_account(body: AccountUpdate, user: User):
          account = accounts.get(user.account_id)
          account.display_name = body.display_name
          accounts.save(account)
    note: The request type holds only the editable field, so sending plan or credit_balance has no effect.
  sources:
    - cite: OWASP Cheat Sheet Series, Mass Assignment (CC BY-SA 4.0)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html
      how: read
    - cite: OWASP API Security Top 10 2023, API3:2023 Broken Object Property Level Authorization (CC BY-SA 4.0)
      url: https://api-security.owasp.org/editions/2023/en/0xa3-broken-object-property-level-authorization/
      how: read
    - cite: MITRE CWE-915, Improperly Controlled Modification of Dynamically-Determined Object Attributes
      url: https://cwe.mitre.org/data/definitions/915.html
      how: recalled
    - cite: GitHub's 2012 public-key mass assignment incident (Egor Homakov)
      url: null
      how: recalled
- id: sensitive-data-in-logs
  name: Sensitive data in logs
  family: anti-pattern
  group: security
  says: >
    Passwords, tokens, session ids, keys, payment data or personal data are written to logs, traces or error
    reports, which are kept longer and read by more people and systems than the data was ever meant for.
  names: >
    MITRE's CWE-532, Insertion of Sensitive Information into Log File. Named in A09:2025 Security Logging and
    Alerting Failures in the OWASP Top 10 2025, with the OWASP Logging Cheat Sheet's list of data to exclude.
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - web-api
    - distributed
    - serverless
    - data-pipeline
  looks_like:
    - A log call with the whole request, its headers, its body or a full user or payment object as an argument.
    - Debug logging of outgoing HTTP calls that includes the Authorization header or the query string with an
      api key.
    - Exception handlers that log the payload that failed to parse.
    - Structured logging that serializes an entity whose generated string form includes every field (password
      hash, email, tokens).
    - HTTP access logs or tracing middleware recording full URLs that carry tokens (password reset links,
      magic links).
    - No redaction setting in the logger configuration.
  forces:
    - When something breaks, logging everything is the fastest way to see what happened.
    - Generated toString, Debug or repr output includes every field, so logging an object logs its secrets.
    - Logs feel internal, though they flow to third-party log services, support staff and backups.
    - Request logging middleware is switched on with its most verbose setting in development and never dialled
      back.
  overuse:
    - Logging so little that incidents can't be investigated; OWASP's same category faults missing logs of
      logins and access-control failures.
    - Hashing or masking ids that are needed to correlate events, such as an order id, which isn't sensitive.
    - Redaction rules so broad that every field named key or id is masked.
  remedy: >
    Log events, not objects: pick the fields worth logging and name them. Give secret-bearing types a string
    form that redacts (a Secret wrapper, an excluded field, a custom formatter), and set the logger's
    redaction list for headers and fields such as authorization, cookie, password and token. Mask or hash
    identifiers that are personal but needed for correlation. Encode log values so input can't forge log
    lines.
  counter: >
    Local development logs on a developer's own machine can be verbose. Audit logs exist to record who did
    what, and must keep the user's identity; the rule is about secrets and data beyond what the purpose needs,
    not about never logging a user. Under GDPR and similar laws, what counts as sensitive depends on the data
    and the jurisdiction, so the exclusion list is a team decision rather than a fixed rule.
  in:
    python: >
      Logging request.headers or a Pydantic model logs everything; Pydantic's SecretStr prints as asterisks.
      structlog processors or a logging.Filter can redact keys centrally.
    typescript: >
      pino's redact option and winston formats can drop paths such as req.headers.authorization; logging the
      Express req object directly includes headers and cookies.
    java: >
      Lombok @ToString and @Data, and record toString, include every field; exclude secrets with
      @ToString.Exclude or a custom toString. Logback and Log4j2 can mask by pattern, but naming fields is
      more reliable.
    csharp: >
      Records' generated ToString prints all public properties, and Serilog's {@Object} destructures
      everything. ASP.NET Core's HTTP logging middleware logs headers and bodies only when configured to, and
      redacts headers not on its allowed list; keep that list short.
    go: fmt's %v and %+v print every struct field, exported or not, so a config or request struct logs its
      secrets. Implement String() (fmt.Stringer) or slog's LogValuer on types that carry secrets so they log
      redacted.
    rust: >
      #[derive(Debug)] prints every field, so {:?} on a config or request logs its secrets. The secrecy
      crate's SecretString redacts in Debug; otherwise write Debug by hand for those types.
  related:
    - hard-coded-secrets
    - defense-in-depth
    - least-privilege
  tell: "Python, TypeScript, Java, C#, Go and Rust. A logging or print call where, outside the text of plain
    string literals, an argument or an interpolation/placeholder ({...}, ${...}, {@...}) names: a password,
    passwd, secret, api_key, authorization, cookie, card_number or cvv; a qualified token
    (access/refresh/auth/bearer/session/csrf/api/id/jwt token, or jwt); or the whole request, its headers or
    its body (request, req, req.headers, request.body, r.Header, but not request.url or request.method). A
    bare 'token' name doesn't count, and neither does a name that ends in dir, path, file, name, url, length,
    count, header or field (secrets_dir names a place, not a secret)."
  agent_prone: true
  interview_only: false
  example:
    before: |
      route POST "/webhooks/payments"
      fn on_payment_event(request: Request):
          log.info("payment webhook received", request.headers, request.body)
          event = parse_event(request.body)
          ...
    after: |
      route POST "/webhooks/payments"
      fn on_payment_event(request: Request):
          event = parse_event(request.body)
          log.info("payment webhook received",
                   event_id=event.id, type=event.type, order_id=event.order_id)
          ...
    note: The log records which event arrived and for which order, not the signature header or the card details in
      the body.
  sources:
    - cite: OWASP Cheat Sheet Series, Logging, data to exclude (CC BY-SA 4.0)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
      how: read
    - cite: OWASP Top 10 2025, A09:2025 Security Logging and Alerting Failures (CC BY 3.0)
      url: https://top10.owasp.org/2025/A09_2025-Security_Logging_and_Alerting_Failures/
      how: read
    - cite: MITRE CWE-532, Insertion of Sensitive Information into Log File
      url: https://cwe.mitre.org/data/definitions/532.html
      how: recalled
- id: user-enumeration
  name: User enumeration
  family: anti-pattern
  group: security
  says: >
    Login, sign-up or password-reset flows answer differently for unknown and known accounts, in the message,
    the status code or the time taken, so anyone can find out which emails or usernames have accounts.
  names: >
    Also called account enumeration. MITRE's CWE-204 (Observable Response Discrepancy) and CWE-208 (Observable
    Timing Discrepancy). Covered under A07:2025 Authentication Failures in the OWASP Top 10 2025 and the OWASP
    Authentication Cheat Sheet's section on error messages.
  applies_to:
    kinds: []
    languages: []
  contested: true
  matters_most_for:
    - web-api
    - fullstack-web
    - mobile
  looks_like:
    - Distinct error strings in one auth handler, such as "user not found" and "incorrect password".
    - A login that returns early when the user lookup fails, before hashing the password.
    - A password reset that says "no account with that email" or returns 404 for unknown addresses.
    - A sign-up form that reports "email already registered" immediately.
    - Different HTTP status codes for unknown user, wrong password and locked account.
    - An "is this username available" endpoint with no rate limit.
  forces:
    - Specific error messages are kinder to users, and UX reviews ask for them.
    - The early return when the user isn't found is the natural shape of the code, and nobody measures the
      time difference.
    - Support costs rise when people can't tell which email they signed up with.
    - Sign-up must say something when the email is taken, and the obvious thing reveals it.
  overuse:
    - Vague errors on flows where the account's existence is public anyway (usernames shown on profiles, a
      work directory), which hurts users and protects nothing.
    - Sleeping a random time on failure, which adds latency without hiding the difference.
    - Hiding enumeration on login while the sign-up form and the public API still answer the question.
  remedy: >
    Give one message and one status for every login failure, and make reset and sign-up answer the same way
    whatever the email (send the email that says what happened instead of saying it on screen). Run the same
    work for unknown users, including a password hash against a dummy value, so timing matches. Rate-limit
    these endpoints, since enumeration needs many tries.
  counter: >
    This is contested. Many products (including some large ones) decide that telling users whether an account
    exists is worth the leak, because it cuts support load and the existence of an account is low-value or
    already public. OWASP itself frames it as a trade-off with usability that depends on how critical the
    system is. Rate limiting and alerting cover much of the risk. It matters most where knowing someone has an
    account is itself sensitive (health, dating, finance) or feeds credential stuffing.
  in:
    python: >
      Django's ModelBackend runs the password hasher once when the user doesn't exist to blunt timing
      differences, and its forms give a generic login error; custom FastAPI auth has to do both itself.
    java: >
      Spring Security hides UsernameNotFoundException as BadCredentialsException by default
      (hideUserNotFoundExceptions), and DaoAuthenticationProvider hashes a dummy password for unknown users.
      Custom endpoints that bypass it lose both.
    csharp: >
      ASP.NET Core Identity's SignInManager returns a generic failure, and its scaffolded forgot-password page
      shows the same confirmation whether or not the account exists. Custom endpoints written beside it often
      don't.
  related:
    - missing-rate-limiting
    - defense-in-depth
    - secure-by-default
  tell: >
    Language-neutral, for files that contain a login, sign-in, password-reset or registration handler. Two or
    more distinct failure messages in one such function where one names the account as missing ("user not
    found", "no account", "email not registered", "unknown user") and another names the password as wrong
    ("incorrect password", "wrong password", "invalid password").
  agent_prone: true
  interview_only: false
  example:
    before: |
      fn sign_in(email: str, password: str) -> Result:
          agent = support_agents.find_by_email(email)
          if agent is None:
              return error(404, "No support agent with that email")
          if not hasher.verify(password, agent.password_hash):
              return error(401, "Incorrect password")
          return start_session(agent)
    after: |
      DUMMY_HASH = hasher.hash("not-a-real-password")

      fn sign_in(email: str, password: str) -> Result:
          agent = support_agents.find_by_email(email)
          stored = agent.password_hash if agent else DUMMY_HASH
          if not hasher.verify(password, stored) or agent is None:
              return error(401, "Email or password is incorrect")
          return start_session(agent)
    note: Unknown and known emails now get the same message, the same status and the same hashing work.
  sources:
    - cite: OWASP Cheat Sheet Series, Authentication, Authentication and Error Messages (CC BY-SA 4.0)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
      how: read
    - cite: OWASP Top 10 2025, A07:2025 Authentication Failures (CC BY 3.0)
      url: https://top10.owasp.org/2025/A07_2025-Authentication_Failures/
      how: read
    - cite: MITRE CWE-204 and CWE-208
      url: https://cwe.mitre.org/data/definitions/204.html
      how: recalled
- id: missing-rate-limiting
  name: Missing rate limiting
  family: anti-pattern
  group: security
  says: >
    Endpoints accept as many requests, as large a payload and as big a page as a client cares to send, so one
    client can guess codes, scrape data, run up a third-party bill or take the service down.
  names: >
    OWASP API Security Top 10 2023, API4:2023 Unrestricted Resource Consumption (called Lack of Resources and
    Rate Limiting in the 2019 edition), with API6:2023 for abuse of business flows. MITRE's CWE-770
    (allocation without limits) and CWE-307 (excessive authentication attempts). OWASP's A01:2025 asks for
    rate limits on APIs and controllers too.
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - web-api
    - serverless
    - fullstack-web
    - platforms
  looks_like:
    - Login, one-time-code, password-reset and sign-up endpoints with no throttle or lockout.
    - Endpoints that send SMS or email, or call a paid API, once per request with no cap per user.
    - A page-size or limit parameter taken from the request with no maximum.
    - No request body size limit, upload limit or array length limit on the API.
    - GraphQL or batch endpoints that accept many operations per request, each unthrottled.
    - No rate-limit middleware, gateway policy or spending alert anywhere in the deployment.
  forces:
    - Every endpoint works fine under normal use, and abuse doesn't show up in tests.
    - Rate limiting feels like infrastructure that someone else (the gateway, the CDN) is handling.
    - Limits are a product decision nobody has made, so nobody writes a number down.
    - Serverless scales automatically, so overload turns into a bill instead of an outage and goes unnoticed.
  overuse:
    - Limits so tight that real users and integrations hit them, with no clear error or Retry-After.
    - Per-IP limits only, which punish users behind shared NAT and let attackers rotate addresses; OWASP
      advises counting login failures per account.
    - Hard lockouts that let anyone lock a victim out of their own account.
  remedy: >
    Decide limits per endpoint class and enforce them in one place (gateway or middleware), with stricter
    per-account limits on authentication and anything that costs money. Cap page size, body size, upload size
    and batch size on the server. Return 429 with Retry-After. Set spending limits or alerts with paid
    providers.
  counter: >
    Internal services behind an authenticated gateway that already enforces limits don't each need their own.
    A CLI or library has nothing to limit. For a small app, a platform-level limit (the CDN, the load
    balancer, the hosting provider) may be all that's needed, and per-endpoint tuning is premature until abuse
    shows up; authentication endpoints and paid side effects are the exceptions worth doing from day one.
  in:
    python: >
      No built-in in FastAPI or Django; slowapi and django-ratelimit are the common choices, with limits per
      route.
    typescript: >
      express-rate-limit for Express; Next.js and serverless platforms usually rely on middleware or the edge
      provider's limits.
    java: |
      Spring has no built-in limiter; Bucket4j and Resilience4j's RateLimiter are common, or the API gateway.
    csharp: >
      ASP.NET Core has built-in rate-limiting middleware since .NET 7 (AddRateLimiter, RequireRateLimiting,
      [EnableRateLimiting]), with fixed-window, sliding-window, token-bucket and concurrency policies.
    go: >
      golang.org/x/time/rate gives a token bucket; http.MaxBytesReader caps body size, which net/http doesn't
      do by default.
    rust: |
      tower's rate-limit layers and the governor crate (tower_governor for axum) are the common choices.
  related:
    - user-enumeration
    - defense-in-depth
    - secure-by-default
  tell: null
  agent_prone: true
  interview_only: false
  example:
    before: |
      route POST "/login/verify-code"
      fn verify_code(session: PendingLogin, code: str) -> Result:
          if code == session.expected_code:      # 6 digits
              return complete_login(session)
          return error(401, "Invalid code")
    after: |
      MAX_ATTEMPTS = 5

      route POST "/login/verify-code"
      fn verify_code(session: PendingLogin, code: str) -> Result:
          if session.failed_attempts >= MAX_ATTEMPTS:
              return error(429, "Too many attempts, request a new code")
          if constant_time_equal(code, session.expected_code):
              return complete_login(session)
          session.failed_attempts += 1
          return error(401, "Invalid code")
    note: A six-digit code can't be guessed in five tries, so capping attempts per pending login closes the brute
      force that an unlimited endpoint invites.
  sources:
    - cite: OWASP API Security Top 10 2023, API4:2023 Unrestricted Resource Consumption (CC BY-SA 4.0)
      url: https://api-security.owasp.org/editions/2023/en/0xa4-unrestricted-resource-consumption/
      how: read
    - cite: OWASP Cheat Sheet Series, Authentication, Login Throttling (CC BY-SA 4.0)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
      how: read
    - cite: OWASP Top 10 2025, A01:2025 Broken Access Control, prevention (CC BY 3.0)
      url: https://top10.owasp.org/2025/A01_2025-Broken_Access_Control/
      how: read
    - cite: MITRE CWE-770 and CWE-307
      url: https://cwe.mitre.org/data/definitions/770.html
      how: recalled
- id: ssrf
  name: Server-side request forgery (SSRF)
  family: anti-pattern
  group: security
  says: >
    The server fetches a URL the client supplied (a webhook, an image to import, a link preview) without
    restricting where it may go, so a client can make it call internal services or the cloud metadata endpoint
    on their behalf.
  names: "First described by Deral Heiland at ShmooCon 2008 (\"Web Portals: Gateway To Information Or A Hole In
    Our Perimeter Defenses\"), as tunnelling requests through a portal to systems behind the firewall. The
    SSRF name spread from Alexander Polyakov and Dmitry Chastukhin's (ERPScan) Black Hat USA 2012 talk \"SSRF
    vs. Business-critical Applications\". Orange Tsai's 2017 \"A New Era of SSRF\" showed URL-parser
    inconsistencies. MITRE's CWE-918. A10:2021 in the OWASP Top 10, folded into A01:2025 Broken Access
    Control, and API7:2023 in the API Security Top 10."
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - web-api
    - serverless
    - platforms
    - distributed
  looks_like:
    - An HTTP client call whose URL comes from the request (a webhook url, avatar_url, feed_url, callback,
      import from link).
    - URL checks done with string prefix matching or a block-list of hostnames such as localhost.
    - The HTTP client follows redirects after the URL was checked.
    - The host is checked, then resolved again at connect time (DNS rebinding).
    - The fetched response body or error is returned to the client.
    - PDF or image renderers, XML parsers with external entities, or headless browsers fed user URLs.
  forces:
    - Webhooks, link previews, imports and integrations are real features that need outbound fetches.
    - Fetching a URL is one line, and the internal network feels private.
    - Block-lists seem enough until someone uses a decimal IP, an IPv6 form, a redirect or a DNS name that
      resolves to 10.0.0.1.
    - Cloud metadata endpoints aren't visible to the developer writing the feature.
  overuse:
    - Blocking all outbound requests, including fixed integrations to known hosts that carry no risk.
    - Writing an elaborate URL validator in the app when an egress proxy or network policy would enforce it
      more reliably.
  remedy: >
    Where the destinations are known, allow-list them and build the URL yourself from a fixed scheme, host and
    path. Where they aren't (webhooks), resolve the host, reject private, loopback, link-local and metadata
    addresses, connect to the checked address, and disable redirects. Run fetches from an isolated network
    segment or egress proxy that can't reach internal services, require IMDSv2 on AWS, and don't return raw
    upstream responses.
  counter: >
    Server-to-server calls to fixed, configured URLs are not SSRF. Tools that run on the user's own machine (a
    CLI, a desktop app) fetching a URL the same user typed have no privilege boundary to cross. OWASP notes
    SSRF can't always be removed entirely where users must supply arbitrary URLs, so the defence is layered
    and network-level isolation does most of the work.
  in:
    python: >
      requests follows redirects by default, httpx does not (follow_redirects=False). The ipaddress module's
      is_global helps reject private targets; OWASP warns urllib.parse can read a different host from crafted
      URLs than the HTTP client does.
    typescript: >
      fetch follows redirects unless redirect is set to "manual" or "error". Checking the host string doesn't
      stop DNS rebinding; a custom agent or lookup function that checks the resolved address does.
    java: >
      java.net.http.HttpClient doesn't follow redirects by default (Redirect.NEVER); many other clients do.
      Apache Commons Validator's InetAddressValidator resists encoded-IP tricks.
    csharp: >
      HttpClientHandler follows redirects by default (AllowAutoRedirect). SocketsHttpHandler's ConnectCallback
      can check the resolved address before connecting; OWASP notes IPAddress.TryParse accepts hex and octal
      forms.
    go: >
      http.Client follows up to ten redirects unless CheckRedirect says otherwise. A net.Dialer Control
      function that rejects private addresses checks the address actually dialled, which defeats rebinding.
    rust: >
      reqwest follows redirects by default; use redirect::Policy::none() and check the resolved address with a
      custom resolver.
  related:
    - secure-by-default
    - least-privilege
    - defense-in-depth
    - validate-at-the-boundary
  tell: >
    Written for python, typescript, java, csharp, go and rust web handlers. An outbound HTTP call (requests or
    httpx get or post, fetch, axios, HttpClient send or GetAsync, http.Get, reqwest get) whose URL argument is
    read from the incoming request in the same function (a query parameter, form field or body field) with no
    allow-list lookup between them. Most real cases pass the URL through a stored record and won't show in one
    file.
  agent_prone: false
  interview_only: false
  example:
    before: |
      route POST "/feeds"
      fn subscribe(body: FeedRequest, user: User) -> Feed:
          response = http.get(body.feed_url)      # follows redirects
          feed = parse_feed(response.text)
          return feeds.save(user.id, body.feed_url, feed.title)
    after: |
      route POST "/feeds"
      fn subscribe(body: FeedRequest, user: User) -> Feed:
          url = parse_url(body.feed_url)
          if url.scheme not in ["https"]:
              return error(400, "feed must use https")
          address = resolve_public_address(url.host)   # rejects private, loopback, metadata
          response = egress.get(url, connect_to=address, follow_redirects=False)
          feed = parse_feed(response.text)
          return feeds.save(user.id, body.feed_url, feed.title)
    note: The fetch can only reach a public address that was checked at connect time, without redirects, through
      an egress client that has no route to internal services.
  sources:
    - cite: OWASP API Security Top 10 2023, API7:2023 Server Side Request Forgery (CC BY-SA 4.0)
      url: https://api-security.owasp.org/editions/2023/en/0xa7-server-side-request-forgery/
      how: read
    - cite: OWASP Cheat Sheet Series, Server Side Request Forgery Prevention (CC BY-SA 4.0)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
      how: read
    - cite: OWASP Top 10 2025, A01:2025 Broken Access Control, CWE-918 (CC BY 3.0)
      url: https://top10.owasp.org/2025/A01_2025-Broken_Access_Control/
      how: read
    - cite: Polyakov et al. (ERPScan), SSRF vs. Business-critical Applications, Black Hat USA 2012
      url: null
      how: recalled
    - cite: Orange Tsai, A New Era of SSRF, Black Hat USA 2017
      url: null
      how: recalled
- id: insecure-deserialization
  name: Insecure deserialization
  family: anti-pattern
  group: security
  says: >
    Data from outside is decoded with a format that can choose which classes to build or which code to run
    (pickle, Java serialization, BinaryFormatter, polymorphic JSON with type names), so crafted input can run
    code or build objects the program never meant to.
  names: >
    Shown at scale by Chris Frohoff and Gabriel Lawrence in "Marshalling Pickles" (AppSecCali 2015) and their
    ysoserial tool. MITRE's CWE-502, Deserialization of Untrusted Data. A8:2017 in the OWASP Top 10, now part
    of A08:2025 Software or Data Integrity Failures.
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - distributed
    - event-driven
    - ml-training
    - plugin-host
    - web-api
  looks_like:
    - pickle, joblib or torch.load on files or messages that came from users, uploads or a shared bucket.
    - yaml.load with an unsafe loader, or Java ObjectInputStream.readObject on network input.
    - .NET BinaryFormatter, NetDataContractSerializer or LosFormatter, or Json.NET with TypeNameHandling other
      than None.
    - Jackson with default typing activated or @JsonTypeInfo using class names.
    - Serialized objects in cookies, hidden form fields or queue messages without a signature.
    - Model or plugin files from the internet loaded with a format that can execute code.
  forces:
    - Native serialization round-trips any object with one call, with no schema to write.
    - Caching, sessions and queues start inside one trusted system and later get an untrusted producer.
    - Polymorphic JSON with type names solves "deserialize to the right subclass" with one setting.
    - ML tooling saved models as pickles by default for years, and examples still do.
  overuse:
    - Banning pickle or native serialization for data the process itself wrote to its own local cache, where
      the attacker would already need write access to the machine.
    - Signing every internal message between services that already share a trusted, authenticated channel.
  remedy: >
    Decode untrusted data only with data-only formats (JSON, protobuf, safe YAML) into explicit types, and map
    subtypes with an allow-list of known discriminators rather than class names. Where native serialization
    can't be avoided, sign the data and verify before decoding, and configure a class allow-list filter. For
    models, prefer weights-only formats such as safetensors.
  counter: >
    Native serialization is fine for data that never crosses a trust boundary: a process's own cache file, an
    in-memory copy, a message between two parts of the same deployment that an attacker can't write. Signed
    and integrity-checked blobs are acceptable even across boundaries. The risk lives in who can write the
    bytes, not in the library itself.
  in:
    python: >
      pickle, shelve, joblib and dill execute code on load. PyYAML's safe_load is safe, load needs an explicit
      Loader and is unsafe with Loader or UnsafeLoader. torch.load defaults to weights_only=True since PyTorch
      2.6; safetensors avoids the issue. numpy.load refuses pickles unless allow_pickle=True.
    typescript: >
      JSON.parse doesn't run code, but merging parsed objects deeply into existing ones can cause prototype
      pollution through __proto__ keys. node-serialize and eval-based decoders are unsafe. js-yaml 4's load is
      safe by default.
    java: >
      ObjectInputStream on untrusted data is the classic gadget-chain risk; JEP 290 serialization filters
      (ObjectInputFilter) give a class allow-list. Jackson is safe unless polymorphic typing by class name is
      on (activateDefaultTyping, @JsonTypeInfo with Id.CLASS). XStream and older SnakeYAML defaults are
      similar risks.
    csharp: >
      BinaryFormatter is obsolete and its implementation was removed in .NET 9; Microsoft says it can't be
      made safe. Keep Json.NET's TypeNameHandling at None or use a SerializationBinder allow-list.
      System.Text.Json only handles polymorphism through declared [JsonDerivedType] types, which is an
      allow-list.
    go: >
      encoding/json and encoding/gob build only the types the code names, so gadget chains are rare; the
      remaining risks are huge allocations from crafted input and trusting decoded fields without validation.
    rust: >
      serde builds only the declared types, so code execution through deserialization is not a practical
      concern; bound input sizes (bincode's limits) to avoid allocation attacks.
  related:
    - validate-at-the-boundary
    - trusting-client-input
    - defense-in-depth
  tell: >
    Written for python, java and csharp. pickle.load or pickle.loads, joblib.load, dill.load, yaml.load with
    Loader=yaml.Loader or UnsafeLoader, yaml.unsafe_load, torch.load with weights_only=False;
    ObjectInputStream readObject, activateDefaultTyping or enableDefaultTyping, @JsonTypeInfo(use =
    JsonTypeInfo.Id.CLASS); BinaryFormatter, NetDataContractSerializer, LosFormatter, SoapFormatter, or
    TypeNameHandling set to anything other than None. Calls in tests and on files the code wrote itself are
    false hits worth a glance, not a block.
  agent_prone: false
  interview_only: false
  example:
    before: |
      route GET "/reports"
      fn list_reports(request: Request) -> list[Report]:
          saved = request.cookie("report_filters")
          filters = native_deserialize(base64_decode(saved))   # may build any class
          return reports.search(filters)
    after: |
      class ReportFilters:
          region: str
          since: Date

      route GET "/reports"
      fn list_reports(request: Request) -> list[Report]:
          saved = verify_signed(request.cookie("report_filters"), key=COOKIE_KEY)
          filters = json_decode(saved, into=ReportFilters)     # data only, one known type
          return reports.search(filters)
    note: The cookie is checked for tampering and then decoded as plain data into one declared type, so it can't
      name a class to build.
  sources:
    - cite: OWASP Cheat Sheet Series, Deserialization (CC BY-SA 4.0)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
      how: read
    - cite: OWASP Top 10 2025, A08:2025 Software or Data Integrity Failures, CWE-502 (CC BY 3.0)
      url: https://top10.owasp.org/2025/A08_2025-Software_or_Data_Integrity_Failures/
      how: read
    - cite: Frohoff and Lawrence, Marshalling Pickles, AppSecCali 2015
      url: https://frohoff.github.io/appseccali-marshalling-pickles/
      how: recalled
    - cite: MITRE CWE-502, Deserialization of Untrusted Data
      url: https://cwe.mitre.org/data/definitions/502.html
      how: recalled
- id: trusting-client-input
  name: Trusting client input
  family: anti-pattern
  group: security
  says: >
    A rule is enforced only in the browser, the mobile app or the game client (a validation, a price, a
    permission, a hidden field), and the server accepts whatever arrives, though anyone can send the request
    without that client.
  names: MITRE's CWE-602, Client-Side Enforcement of Server-Side Security, and CWE-472 (external control of an
    assumed-immutable parameter). The OWASP Top 10 2025 maps CWE-602 to A06:2025 Insecure Design, and the
    Input Validation Cheat Sheet requires server-side checks. Game developers call the opposite
    server-authoritative design.
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - web-frontend
    - fullstack-web
    - mobile
    - games
    - web-api
  looks_like:
    - Form validation (required, max length, format) in the frontend with no matching check in the API handler.
    - Totals, prices, discounts or scores computed on the client and sent to the server, which stores them.
    - Hidden form fields or request fields for user id, role, tenant or price that the server uses as is.
    - Buttons hidden for non-admins in the UI while the API endpoint has no role check.
    - A mobile app that enforces purchase or feature limits locally.
    - Server code that relies on headers the client controls (X-Forwarded-For, X-User-Id) without a trusted
      proxy setting.
  forces:
    - The UI needs validation for instant feedback, so it gets written there first, and it seems to work.
    - Frontend and backend are written by different people or at different times, and each assumes the other
      checks.
    - Computing the total on the client avoids a round trip.
    - The API is "only called by our app", until someone opens the network tab.
  overuse:
    - Removing client-side validation because it isn't a security control; it is still the best user
      experience.
    - Recomputing on the server things that carry no risk, such as display formatting.
  remedy: >
    Treat every request as written by an attacker. Enforce each rule on the server, and keep the client checks
    for feedback only. Have the server compute anything with value (price, total, score) from its own data,
    take identity and role from the session, not from fields, and share one schema between client and server
    where the stack allows so the two checks can't drift.
  counter: >
    Single-player games, offline tools and apps with no server-side shared state have nothing to protect from
    their own user, so client checks are enough there. Peer-to-peer and latency-sensitive games trade some
    server authority for responsiveness on purpose and detect cheating after the fact. The rule is about data
    that crosses to a system someone else relies on.
  in:
    typescript: >
      Next.js server actions and API routes are public HTTP endpoints, so the zod schema or role check must
      run inside them, not only in the form component. Sharing one zod schema between the form and the handler
      keeps them in step.
    csharp: >
      Blazor WebAssembly runs in the browser, so its DataAnnotations validation is client-side only; the API
      must validate again. Blazor Server runs on the server, but the API it calls should still check.
    python: >
      FastAPI's Pydantic request models and Django forms run on the server, which makes them the place for the
      rules; a JavaScript form check in a Django template is feedback only.
  related:
    - validate-at-the-boundary
    - mass-assignment
    - broken-object-level-authorization
    - defense-in-depth
  tell: null
  agent_prone: false
  interview_only: false
  example:
    before: |
      # browser
      total = course.price * (1 - coupon.percent / 100)
      api.post("/enrolments", {"course_id": course.id, "total": total})

      # server
      route POST "/enrolments"
      fn enrol(body: EnrolmentRequest, user: User):
          charge(user, body.total)
          enrolments.create(user.id, body.course_id)
    after: |
      # browser
      api.post("/enrolments", {"course_id": course.id, "coupon": coupon.code})

      # server
      route POST "/enrolments"
      fn enrol(body: EnrolmentRequest, user: User):
          course = courses.get(body.course_id)
          discount = coupons.valid_discount(body.coupon, course, user)
          charge(user, course.price.less(discount))
          enrolments.create(user.id, course.id)
    note: The server prices the enrolment from its own data, so editing the request can't change what is charged;
      the browser can still show the same total for feedback.
  sources:
    - cite: OWASP Top 10 2025, A06:2025 Insecure Design, CWE-602 (CC BY 3.0)
      url: https://top10.owasp.org/2025/A06_2025-Insecure_Design/
      how: read
    - cite: OWASP Cheat Sheet Series, Input Validation, server-side vs client-side (CC BY-SA 4.0)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
      how: read
    - cite: MITRE CWE-602, Client-Side Enforcement of Server-Side Security
      url: https://cwe.mitre.org/data/definitions/602.html
      how: recalled
- id: swallowed-errors
  name: Swallowed Errors
  family: anti-pattern
  group: code
  says: An error is caught or returned and then dropped, so the failure goes on silently and shows up later,
    somewhere else, as wrong data or a confusing symptom.
  names: Also called Exception swallowing, Catch and ignore, Silent failure, Ignored errors. A folk name with no
    single coiner. Bloch made the rule explicit in Effective Java ("don't ignore exceptions"), and Hunt and
    Thomas argued the other side of it as "crash early" in The Pragmatic Programmer. Go's errcheck linter gave
    the Go form its everyday name.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Empty catch or except blocks, or ones holding only a comment like "should never happen".
    - Catching the broadest type (Exception, Throwable, bare except, catch-all) and returning a default such
      as null, an empty list or false.
    - Go code that discards an error with `_ =` or `x, _ :=` on a call that can fail.
    - A log line at debug level and then carrying on as if the call had worked.
    - Promises with no rejection handler, or a .catch that does nothing.
    - Bugs reported far from their cause, with nothing in the logs at the moment it went wrong.
  forces:
    - The task was to make an error go away, and the quickest way to stop seeing it is to catch it where it
      surfaces.
    - Checked exceptions or Go's error returns make every call site handle something, and an empty handler
      satisfies the compiler.
    - A misreading of resilience as "never crash".
    - Not knowing what the right handling is, so nothing is done and the decision is deferred forever.
    - A noisy dependency that throws on harmless cases, so all its errors get muted.
  overuse:
    - Letting every error crash the process, including ones the code can genuinely recover from, such as a
      cache miss or an optional file.
    - Wrapping and rethrowing at every layer, so stack traces carry ten copies of the same message.
    - Logging an error and rethrowing it at each level, so one failure produces a page of duplicate log lines.
  remedy: >
    Catch only the types the code can act on, and handle them there: retry, fall back with a stated reason, or
    translate into the caller's terms with the original attached as the cause. Let everything else propagate
    to one boundary that logs it once and decides the outcome. Where ignoring is really right, say so in the
    code with the specific error and a reason.
  counter: >
    Some errors really are safe to ignore: a failed close on a read-only file, a best-effort cache write,
    removing a temp file that's already gone, telemetry that must never break the host. Ignoring those is fine
    when it is narrow and visible in the code. A tool that must never block its host may catch broadly at the
    outermost boundary on purpose; that's a fail-open decision, not swallowing, as long as the error is still
    reported somewhere.
  in:
    python: >
      Bare except also catches KeyboardInterrupt and SystemExit. Catch Exception at most, and prefer the
      specific type. contextlib.suppress(SpecificError) is the readable way to ignore one error on purpose.
    typescript: >
      An unhandled promise rejection is swallowing by default in many runtimes and setups. The caught value is
      unknown and may not be an Error at all, so check before reading .message. Floating promises are flagged
      by typescript-eslint's no-floating-promises.
    java: >
      Checked exceptions push people into empty catch blocks to make code compile. Wrap in an unchecked
      exception with the cause instead. Catching InterruptedException and dropping it also loses the
      interrupt; restore it with Thread.currentThread().interrupt().
    csharp: >
      A catch-all is often wrapped around async void event handlers. An exception thrown inside a
      fire-and-forget Task is lost unless something observes it. Use exception filters (catch ... when) to
      narrow a catch.
    go: >
      Errors are values, so swallowing is just not looking at one. errcheck and staticcheck flag discarded
      errors. A deferred Close whose error is dropped can lose a write failure on files opened for writing.
    rust: >
      Discarding a Result is warned about (must_use), so the common forms are `let _ = ...`, `.ok()` and
      `unwrap_or_default()` on errors that mattered.
  related:
    - fail-fast
    - error-handling-policy
    - fail-open-vs-fail-closed
    - exceptions-for-control-flow
    - murphys-law
  tell: "Python only, outside test files: an except clause (bare, Exception or BaseException) whose only body is
    pass or '...'."
  agent_prone: true
  interview_only: false
  example:
    before: |
      fn import_readings(path: str) -> list:
          readings = []
          for line in read_lines(path):
              try:
                  readings.append(parse_reading(line))
              except Exception:
                  pass
          return readings
      # a corrupt export imports 3 of 9,000 rows and reports success
    after: |
      fn import_readings(path: str) -> list:
          readings = []
          rejected = []
          for number, line in enumerate(read_lines(path)):
              try:
                  readings.append(parse_reading(line))
              except MalformedReading as e:
                  rejected.append((number, e.reason))
          if len(rejected) > MAX_REJECTED:
              raise ImportFailed(path, rejected)
          log.warning("skipped rows", rejected)
          return readings
    note: Only the expected error is caught, every rejection is counted and reported, and too many of them stops
      the import instead of passing silently.
  sources:
    - cite: Joshua Bloch, Effective Java (3rd ed.), item 77, Don't ignore exceptions
      url: https://www.oreilly.com/library/view/effective-java-3rd/9780134686097/
      how: recalled
    - cite: Andrew Hunt and David Thomas, The Pragmatic Programmer, Dead Programs Tell No Lies
      url: https://pragprog.com/titles/tpp20/the-pragmatic-programmer-20th-anniversary-edition/
      how: recalled
    - cite: kisielk/errcheck, Go linter for unchecked errors
      url: https://github.com/kisielk/errcheck
      how: recalled
  matters_most_for:
    - data-pipeline
    - cli-devtool
    - web-api
    - library-sdk
    - distributed
    - plugin-host
- id: exceptions-for-control-flow
  name: Exceptions for Control Flow
  family: anti-pattern
  group: code
  says: Throwing and catching exceptions to steer ordinary, expected logic, such as ending a loop, returning a
    found value or choosing a branch, instead of using a return value or a condition.
  names: Also called Exceptions as goto, Using exceptions for flow control. Discussed by name on Ward
    Cunningham's wiki (DontUseExceptionsForFlowControl). Bloch's Effective Java states the rule as using
    exceptions only for exceptional conditions.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - A custom exception named like a result (FoundIt, Done, StopProcessing) thrown deep and caught one or two
      frames up.
    - A loop that runs until an index or iterator throws, then catches the error to finish.
    - Validation that throws on the common case (most inputs are invalid) and callers that catch it as a
      branch.
    - try/catch around a lookup where a contains or get-with-default call exists.
    - Profiles where exception construction and stack capture show up on a hot path.
  forces:
    - Exceptions are a handy way to jump out of deeply nested calls without threading a return value through
      each one.
    - The language or framework lacks a result type, and null felt worse.
    - The library only offers a throwing API, such as a parse function with no try-parse variant.
    - Python's own idioms (EAFP, StopIteration) make it look like the general rule everywhere.
  overuse:
    - Replacing real failures with sentinel return values that callers forget to check, which turns into
      Swallowed Errors.
    - Hand-rolling result types in a language whose ecosystem is built on exceptions, so every boundary has to
      convert.
  remedy: >
    Return the outcome: a boolean, an optional, a result or a small tagged value, and test it with a plain
    condition. Use the try-parse or get-with-default form of the API where one exists. Keep exceptions for
    what the caller can't reasonably expect to happen in normal use.
  counter: >
    In Python this is idiomatic and cheap: EAFP style, StopIteration ending every for loop, and KeyError
    handling are normal, so don't apply the rule there the way you would in Java or C#. Some parsers and
    interpreters use an exception on purpose to unwind a deep recursion, and that's a fair trade when it is
    local and documented. What counts as "exceptional" is a judgment call, which is why practitioners disagree
    on the line.
  in:
    python: >
      EAFP (try first, handle the error) is the documented house style, and exceptions are comparatively
      cheap. Flag it only when the exception crosses module boundaries as a hidden return path.
    java: >
      Exceptions are expensive mostly because of stack capture; Bloch's advice is to avoid them on the normal
      path. An exception can disable stack traces for a control-flow use, but that is a smell of its own.
    csharp: The framework offers TryParse and TryGetValue precisely to avoid this; prefer them. First-chance
      exceptions on a hot path show up clearly in profilers. In ASP.NET Core, throwing domain exceptions
      (NotFound, Validation) from services and mapping them to problem-details responses in one
      IExceptionHandler or middleware is a common style, but Microsoft's ASP.NET Core best-practices guidance
      says exceptions shouldn't drive normal flow, and the result-type camp agrees. Treat it as the project's
      choice, ask which one it uses, and keep exceptions out of expected, frequent outcomes such as routine
      validation failures on a hot endpoint.
    typescript: >
      No checked exceptions and no result type in the standard library, so a discriminated union return is the
      usual alternative.
    go: >
      Rare, because errors are values. The equivalent is panic and recover used as a non-local return; the
      standard library does it inside a few parsers but never lets the panic leave the package.
    rust: >
      Rare for the same reason. Using panic with catch_unwind for flow is wrong, and catch_unwind does not
      catch panics in builds that abort on panic.
  related:
    - error-handling-policy
    - swallowed-errors
    - principle-of-least-astonishment
  tell: null
  agent_prone: false
  interview_only: false
  example:
    before: |
      class SeatFound(Exception):
          seat: Seat

      fn find_free_seat(hall: Hall) -> Seat:
          try:
              for row in hall.rows:
                  for seat in row.seats:
                      if seat.is_free():
                          raise SeatFound(seat)
          except SeatFound as found:
              return found.seat
          raise HallFull(hall.id)
    after: |
      fn find_free_seat(hall: Hall) -> Seat or None:
          for row in hall.rows:
              for seat in row.seats:
                  if seat.is_free():
                      return seat
          return None

      seat = find_free_seat(hall)
      if seat is None:
          offer_waitlist(hall)
    note: Finding a seat is the normal outcome and a full hall is an expected one, so both come back as values the
      caller branches on.
  sources:
    - cite: Joshua Bloch, Effective Java (3rd ed.), item 69, Use exceptions only for exceptional conditions
      url: https://www.oreilly.com/library/view/effective-java-3rd/9780134686097/
      how: recalled
    - cite: Ward Cunningham's wiki, DontUseExceptionsForFlowControl
      url: https://wiki.c2.com/?DontUseExceptionsForFlowControl
      how: recalled
    - cite: Python glossary, EAFP
      url: https://docs.python.org/3/glossary.html#term-EAFP
      how: recalled
  matters_most_for:
    - library-sdk
    - games
- id: inconsistent-error-contract
  name: Inconsistent Error Contract
  family: anti-pattern
  group: api
  says: Endpoints or commands of one API report failure in different ways, with different status codes, body
    shapes, field names or exit codes for the same kind of error, so clients have to special-case each one.
  names: Also called Inconsistent error responses. A descriptive name, not a coined one. Problem details for
    HTTP are the standard answer, RFC 7807 (2016) by Mark Nottingham and Erik Wilde, replaced by RFC 9457
    (2023) by Nottingham, Wilde and Sanjay Dalal. Google's AIP-193 sets the same discipline for gRPC and HTTP
    APIs.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - 'One endpoint returns {"error": "..."}, another {"message": ...}, another a plain string or an HTML
      error page.'
    - 200 OK with an error in the body on some endpoints and 4xx on others for the same failure.
    - 400, 422 and 500 used interchangeably for invalid input.
    - A CLI that exits 1 for everything on some subcommands and uses distinct codes on others, or prints
      errors to stdout on some.
    - Framework default error pages leaking through for unhandled exceptions next to hand-built error bodies.
    - Client code with a per-endpoint parser for errors.
  forces:
    - Each endpoint or command was written separately, often by different people or agents, and each built its
      own error response.
    - The framework's default error handler produces one shape and handwritten handlers produce another.
    - No shared error type or middleware existed when the first endpoints were written.
    - Error handling is the last thing written under a deadline.
  overuse:
    - A rigid error envelope with dozens of mandatory fields nobody fills in meaningfully.
    - Mapping every distinct internal failure to its own public error code, which turns internals into API
      (see breaking-change surface).
  remedy: >
    Define one error shape (RFC 9457 problem details for HTTP, the google.rpc.Status model for gRPC, a
    documented exit-code table and stderr format for a CLI) and produce it from one place: a global error
    handler or middleware that maps internal error types to it. Add a contract test that every endpoint's
    error path matches the shape.
  counter: >
    An API that wraps several upstreams may have to pass some errors through as they come, and should say so.
    Changing the shape of an existing API's errors is itself a breaking change for clients that parse them, so
    on a public API the fix may need a new version rather than an in-place cleanup. For a small internal API
    with one client, a lighter convention is enough.
  in:
    python: >
      FastAPI's default validation error (422 with a "detail" list) differs from HTTPException's shape;
      register exception handlers so both produce the same body.
    java: >
      Spring's ProblemDetail and ResponseEntityExceptionHandler support RFC 9457 directly; a @ControllerAdvice
      is the one place to map exceptions.
    csharp: >
      ASP.NET Core has built-in ProblemDetails support (AddProblemDetails, UseExceptionHandler); without it,
      model validation and thrown exceptions produce different bodies.
    typescript: >
      Express and similar frameworks need an error-handling middleware registered last; errors thrown in async
      handlers may bypass it unless the framework or a wrapper forwards them.
    go: >
      net/http has no central error hook, so handlers write errors themselves; a handler type that returns
      error and one adapter that renders it keeps the shape consistent.
  related:
    - error-handling-policy
    - breaking-change-surface
    - drifting-terminology
    - principle-of-least-astonishment
    - hyrums-law
  tell: null
  agent_prone: true
  interview_only: false
  example:
    before: |
      fn get_booking(id):
          booking = bookings.find(id)
          if booking is None:
              return Response(404, {"error": "not found"})
          ...

      fn cancel_booking(id):
          booking = bookings.find(id)
          if booking is None:
              return Response(200, {"ok": False, "msg": "No such booking"})
          ...
    after: |
      class BookingNotFound(AppError):
          status = 404
          type = "booking-not-found"

      fn get_booking(id):
          booking = bookings.find(id) or raise BookingNotFound(id)
          ...

      fn cancel_booking(id):
          booking = bookings.find(id) or raise BookingNotFound(id)
          ...

      # one error handler renders every AppError as a problem-details body
    note: Both endpoints raise the same error type and a single handler turns it into one status and one body
      shape.
  sources:
    - cite: RFC 9457, Problem Details for HTTP APIs (Nottingham, Wilde, Dalal, 2023)
      url: https://www.rfc-editor.org/rfc/rfc9457
      how: recalled
    - cite: Google AIP-193, Errors
      url: https://google.aip.dev/193
      how: recalled
  matters_most_for:
    - web-api
    - fullstack-web
    - cli-devtool
    - platforms
    - serverless
- id: resource-leak
  name: Resource Leak
  family: anti-pattern
  group: code
  says: Something acquired, such as a file, socket, connection, response body, lock, goroutine or background
    task, is not released on every path, especially the error path, so the process slowly runs out of it.
  names: "Also called Handle leak, Connection leak, Goroutine leak. A long-standing term with no single coiner.
    The structural fix has named originators: RAII from Bjarne Stroustrup in C++, Python's with statement (PEP
    343, Guido van Rossum and Nick Coghlan), Java's try-with-resources (Java 7, Project Coin) and C#'s using
    statement."
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Open, connect or acquire calls with the matching close on the happy path only, after code that can throw
      or return early.
    - An HTTP response whose body is never closed or fully read.
    - Goroutines or async tasks started with no cancellation, waiting forever on a channel or a future nobody
      completes.
    - Connection pool exhaustion, "too many open files" or slowly climbing memory and thread counts in
      production.
    - Tests that pass alone and fail when run together because ports or temp files are still held.
  forces:
    - The happy path was written first and the error path added later without revisiting cleanup.
    - Garbage collection makes memory feel automatic, and the same is assumed of handles, which it isn't (or
      not promptly).
    - Starting a goroutine or task is one line; owning its lifetime is design work.
    - Short-lived scripts and tests never show the leak, so it only surfaces under production load.
  overuse:
    - Opening and closing a resource per operation when it is meant to be pooled or kept for the process's
      life (an HTTP client, a database pool).
    - Wrapping cleanup so defensively that close errors on writable files are swallowed, losing data-loss
      signals.
  remedy: >
    Tie release to scope with the language's construct (defer, using, try-with-resources, with, RAII) on the
    line after acquiring. Give every goroutine or task an owner and a way to stop it (a context, a
    cancellation token, a task group). Prefer long-lived pooled clients over per-call ones.
  counter: >
    A CLI that exits in milliseconds can let the OS reclaim handles, and that's fine. Some resources are meant
    to live as long as the process (a connection pool, a logger), and not closing them is the design.
    Finalizers and destructors are not a fix: they run late or never, and Java has deprecated finalize.
  in:
    go: >
      defer x.Close() right after the error check. Always close http.Response.Body, even when you don't read
      it. Goroutine leaks are the big one: pass a context and select on ctx.Done(), and bound the lifetime
      with errgroup or a WaitGroup. goleak catches them in tests. Don't defer inside a long loop; the deferred
      calls pile up until the function returns.
    rust: >
      RAII through Drop makes most leaks hard, but mem::forget, Rc cycles and detached tokio tasks still leak.
      Keep JoinHandles or use a JoinSet. Drop cannot report errors, so call an explicit flush or close when
      the error matters.
    python: >
      Use with for files, locks and connections. CPython often closes files promptly through reference
      counting, which hides leaks that show under PyPy or in cycles; ResourceWarning flags them in tests. Keep
      a reference to tasks from asyncio.create_task or they can vanish; prefer TaskGroup.
    java: >
      try-with-resources on anything AutoCloseable. Streams from Files.lines must be closed too. Executors
      must be shut down, and thread-local values in pooled threads leak across requests.
    csharp: >
      using declarations for IDisposable, await using for IAsyncDisposable. Event handler subscriptions that
      are never removed are the common managed leak. Don't create an HttpClient per request; use
      IHttpClientFactory or one shared instance.
    typescript: >
      No deterministic cleanup until the using declaration (TC39 explicit resource management), so use
      try/finally. Event listeners, intervals and subscriptions not removed on teardown are the common leak in
      front-end and long-running Node code; AbortController cancels fetches and listeners.
  related:
    - swallowed-errors
    - murphys-law
    - init-time-side-effects
  tell: "Python: `= open(` outside a `with` statement. Java: `new FileInputStream(` or `getConnection(` not
    inside a try-with-resources header. Go: `http.Get(`, `http.Post(`, `.Do(req` or `os.Open(` with no `Close`
    in the following few lines."
  agent_prone: false
  interview_only: false
  example:
    before: |
      fn archive_invoices(month):
          conn = db.connect()
          out = open_file("invoices-" + month + ".csv", "w")
          for row in conn.query(INVOICES_FOR, month):
              out.write(format_row(row))     # a bad row throws here
          out.close()
          conn.close()                       # skipped on any error
    after: |
      fn archive_invoices(month):
          with db.connect() as conn:
              with open_file("invoices-" + month + ".csv", "w") as out:
                  for row in conn.query(INVOICES_FOR, month):
                      out.write(format_row(row))
          # both are released on every path, in reverse order
    note: Release is tied to scope, so an error halfway through no longer leaves a connection and a file handle
      open.
  sources:
    - cite: Bjarne Stroustrup, The C++ Programming Language, resource acquisition is initialization
      url: https://www.stroustrup.com/bs_faq2.html#finally
      how: recalled
    - cite: PEP 343, The "with" Statement
      url: https://peps.python.org/pep-0343/
      how: recalled
    - cite: The Java Tutorials, The try-with-resources Statement
      url: https://docs.oracle.com/javase/tutorial/essential/exceptions/tryResourceClose.html
      how: recalled
    - cite: uber-go/goleak
      url: https://github.com/uber-go/goleak
      how: recalled
  matters_most_for:
    - web-api
    - distributed
    - databases-storage
    - tui
    - desktop
    - embedded
- id: init-time-side-effects
  name: Init-Time Side Effects
  family: anti-pattern
  group: design
  says: Real work, such as reading config or env, opening connections, registering global state or making
    network calls, runs when a module is imported or a package initialised, before the program's entry point
    has had a say.
  names: Also called Import-time side effects, Work in static initializers, init() abuse. A descriptive name.
    Peter Bourgon's "A theory of modern Go" (2017) made the Go form widely known with its advice of no
    package-level variables and no func init. Miško Hevery's testability guide named the Java form as
    constructors and static blocks doing real work.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Module-level code that reads environment variables, opens database connections or creates clients with
      credentials.
    - Go func init() that reads flags, env or files, or registers into a global registry.
    - Configuration read before command-line flags are parsed, so flags can't override it.
    - Tests that need environment variables set or network access just to import a module.
    - Slow CLI startup, or --help that fails when a service is down.
    - Import order that matters.
  forces:
    - "It is the shortest path: one global client, ready wherever you import it."
    - Frameworks and examples show module-level app and client objects.
    - Plugin and driver registration by import (database drivers, codecs) is a sanctioned pattern, and it
      spreads to things that aren't registration.
    - Passing dependencies explicitly feels like ceremony in a small program.
  overuse:
    - Banning all module-level constants and precompiled patterns, which are pure and harmless.
    - Threading every dependency through ten layers of parameters to avoid one lazily built singleton.
  remedy: >
    Move the work into an explicit construction step called from main or the app factory, after flags and
    config are parsed, and pass the results in (dependency injection by hand is enough). Where something must
    be global, build it lazily on first use behind a function.
  counter: >
    Pure, cheap initialization is fine: constants, lookup tables, compiled regexes. Registration by import
    (Go's database/sql drivers, image formats) is an accepted idiom when the init only registers and does no
    I/O. In a small script, a module-level client is honest and simple. Framework conventions (a module-level
    FastAPI or Flask app) are fine as long as configuration and connections happen at startup hooks rather
    than at import.
  in:
    go: >
      init functions run in dependency order before main and can't return errors, so they panic or log.Fatal
      instead. flag.Parse hasn't run yet, so flags read there are defaults. gochecknoinits and
      gochecknoglobals lint for these.
    python: >
      Everything at module top level runs on import, including on test collection. Use an app factory or a
      main function, and functools.cache for lazy globals. Import cost also hurts CLI startup; python -X
      importtime shows it.
    java: >
      Static initializer blocks and static fields with constructors run on class load; an exception there
      becomes ExceptionInInitializerError and the class is unusable thereafter (NoClassDefFoundError).
    csharp: An explicit static constructor runs just before the type is first used; static field initializers in a
      type without one may run at any earlier time. An exception in either becomes
      TypeInitializationException, and the type is unusable for the rest of the app domain.
    typescript: >
      Top-level code in an ES module runs on first import, and top-level await can block every importer.
      Bundlers mark modules with side effects as not tree-shakable ("sideEffects" in package.json).
    rust: >
      Rust has no life-before-main by design; statics must be const-initialized. Lazy globals use
      std::sync::LazyLock or OnceLock, which run on first use, not at load.
  related:
    - global-state
    - singleton
    - hard-to-test-code
    - fail-fast
  tell: 'Go: func init() whose body calls os.Getenv, os.LookupEnv, os.Open, os.ReadFile, flag., sql.Open or
    http.. Python, outside test files and outside scripts (files with an `if __name__ == "__main__":` block):
    a top-level statement that calls os.environ[...], os.environ.get(, os.getenv(, open(, connect( or
    requests.<fn>(.'
  agent_prone: true
  interview_only: false
  example:
    before: |
      # thumbnails.py
      STORAGE = BucketClient(env["BUCKET_URL"], env["BUCKET_KEY"])   # runs on import
      SIZES = read_json("sizes.json")

      fn make_thumbnails(image_id):
          image = STORAGE.get(image_id)
          for size in SIZES:
              STORAGE.put(thumb_key(image_id, size), resize(image, size))
    after: |
      # thumbnails.py
      class Thumbnailer:
          fn init(storage: BucketClient, sizes: list):
              self.storage = storage
              self.sizes = sizes

          fn make(image_id):
              image = self.storage.get(image_id)
              for size in self.sizes:
                  self.storage.put(thumb_key(image_id, size), resize(image, size))

      # main.py, after flags and config are parsed
      thumbnailer = Thumbnailer(BucketClient(config.bucket_url, config.bucket_key), config.sizes)
    note: Importing the module no longer needs credentials or files, and main decides where the configuration
      comes from.
  sources:
    - cite: Peter Bourgon, A theory of modern Go (2017)
      url: https://peter.bourgon.org/blog/2017/06/09/theory-of-modern-go.html
      how: recalled
    - cite: Miško Hevery, Guide to Writing Testable Code, Flaw - Constructor does real work
      url: https://testing.googleblog.com/2008/11/guide-to-writing-testable-code.html
      how: recalled
    - cite: Effective Go, The init function
      url: https://go.dev/doc/effective_go#init
      how: recalled
  matters_most_for:
    - cli-devtool
    - library-sdk
    - serverless
    - plugin-host
    - plugins-extensions
- id: terminal-escape-injection
  name: Terminal escape injection
  family: anti-pattern
  group: security
  says: >
    A program writes text it doesn't control (file names, remote data, commit messages, log lines) straight to
    a terminal, so escape and control sequences in that text are run by the terminal: they can hide or fake
    output, retitle the window, write the clipboard, or in older terminals make the terminal type commands
    back.
  names: >
    MITRE's CWE-150, Improper Neutralization of Escape, Meta, or Control Sequences, is the established
    reference. The earliest write-up beyond denial of service is H D Moore's "Terminal Emulator Security
    Issues" (2003); David Leadbeater's "ANSI Terminal security in 2023 and finding 10 CVEs" (2023) is the
    modern survey. Also called ANSI escape injection. Log injection (CWE-117) is the same flaw in log files,
    and it becomes this one when the log is read with cat or tail.
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - cli-devtool
    - tui
    - compilers-tooling
    - plugin-host
  looks_like:
    - File names, archive entry names, branch names, HTTP headers or server responses printed with plain
      print, println or fmt.Println.
    - Error messages that interpolate the user's or a remote system's input and go to stderr unescaped.
    - Log lines with request fields written raw, later read in a terminal.
    - A TUI or pager that renders remote content and passes ESC (0x1B), OSC or CSI sequences through.
    - Escaping in some output paths and not others, with no single output helper.
  forces:
    - Printing a string is the simplest thing, and test inputs never contain control characters.
    - Colour output is wanted, so the program deliberately writes escape sequences and doesn't separate its
      own from the input's.
    - Text "from the file system" or "from git" feels local and trusted, though it often came from a download
      or a clone.
    - Escaping is easy to do at one call site and forget at the next.
  overuse:
    - Stripping all non-ASCII, which mangles legitimate names in other scripts.
    - Escaping text the program fully controls, or output going to a file or pipe that the user asked to be
      byte-exact (cat-like tools, --raw modes).
    - Removing colour support altogether instead of separating the program's own sequences from input.
  remedy: >
    Neutralise at the sink: route untrusted text through one output helper that replaces C0 and C1 control
    characters and DEL (except newline and tab where wanted) with visible escapes such as \x1b or caret
    notation, before adding the program's own styling. Offer a raw mode for users who want exact bytes, and
    keep escaping when output is a terminal. Terminals' own defaults (title reporting off, OSC 52 reads
    disabled) are a second layer, not the fix.
  counter: Tools whose job is to reproduce bytes exactly (cat, a hex dump's raw mode, a pager showing a file the
    user chose) may pass input through, and users of such tools expect it; many make escaping an option
    instead. Text the program generated itself needs no escaping. Most current terminals have closed the known
    echo-back holes (title reporting off, request sequences sanitised), but new ones were still being found in
    2023 and some terminals remain exposed, so the risk is mostly deception (hidden or faked lines, misleading
    prompts) and clipboard writes, with echo-back as a tail risk. Deception is serious for tools that show
    content before a user approves an action.
  in:
    python: >
      print and logging pass control characters through; repr() or a str.translate table over the C0 and C1
      ranges neutralises them. Rich has a separate markup-injection concern, handled with rich.markup.escape.
    typescript: >
      console.log writes strings as is; JSON.stringify escapes C0 controls, and strip-ansi removes CSI and OSC
      sequences when display rather than exactness is wanted.
    go: >
      fmt's %q and strconv.Quote escape control characters; Bubble Tea and Lip Gloss render strings as given,
      so the model must clean remote text before it reaches View.
    rust: |
      The Debug format ({:?}) and str::escape_debug escape control characters; Display ({}) writes them raw.
  related:
    - injection
    - sensitive-data-in-logs
    - validate-at-the-boundary
    - trusting-client-input
    - defense-in-depth
  tell: null
  agent_prone: false
  interview_only: false
  example:
    before: |-
      fn list_archive(path: str):
          for entry in open_archive(path).entries():
              print(entry.name + "  " + human_size(entry.size))

      # an entry named "x\x1b[1A\x1b[2K" moves the cursor up and erases
      # the line above, so a malicious file can wipe another entry from view
    after: |
      fn printable(text: str) -> str:
          # C0 and C1 controls and DEL become visible escapes, e.g. "\x1b"
          return escape_controls(text)

      fn list_archive(path: str):
          for entry in open_archive(path).entries():
              print(printable(entry.name) + "  " + human_size(entry.size))
    note: Entry names now reach the terminal as visible text, so a crafted name can't move the cursor or erase
      lines.
  sources:
    - cite: MITRE CWE-150, Improper Neutralization of Escape, Meta, or Control Sequences
      url: https://cwe.mitre.org/data/definitions/150.html
      how: read
    - cite: David Leadbeater, ANSI Terminal security in 2023 and finding 10 CVEs (2023)
      url: https://dgl.cx/2023/09/ansi-terminal-security
      how: read
    - cite: H D Moore, Terminal Emulator Security Issues (2003)
      url: null
      how: recalled
    - cite: MITRE CWE-117, Improper Output Neutralization for Logs
      url: https://cwe.mitre.org/data/definitions/117.html
      how: recalled
- id: patch-where-looked-up
  name: Patching where defined, not where looked up
  family: anti-pattern
  group: testing
  says: >
    A test patches or mocks a name in the module that defines it, but the code under test looks the name up
    somewhere else (its own import, a captured reference), so the patch never takes effect and the real code
    runs.
  names: >
    The rule "patch where an object is looked up, not where it is defined" is from Python's unittest.mock
    documentation, section "Where to patch". Practitioners often just say "patching the wrong target". The
    same failure appears in other languages as a module mock that doesn't match how the code imports, or a
    mock object that the code under test never receives.
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - web-api
    - cli-devtool
    - data-pipeline
    - fullstack-web
  looks_like:
    - In Python, patch("pkg.mailer.send") while the module under test did "from pkg.mailer import send", so it
      holds its own reference.
    - A patch that is set up but never asserted on, and tests that still work only because some other patch (a
      fake host, a missing credential) makes the real call fail harmlessly.
    - Tests that pass alone but make real network calls, write real files or send real email.
    - References captured at import time (default arguments, handler tables, decorators registering a
      function) that a later patch can't reach.
    - Mock objects created in a test while the class under test builds its own dependency with new.
  forces:
    - The defining module is the obvious place to point a patch at, and it works for code that uses "import
      module" style.
    - Import style differs between files, so a patch that works in one test silently fails in another.
    - A wrong-target patch fails quietly; nothing errors, and the test passes if it asserts on nothing the
      mock would change.
    - Coding agents copy patch targets from the import line of the defining module rather than the module
      under test.
  overuse:
    - Rewriting every import to "import module" style only so tests can patch the defining module.
    - Patching the same name in every module that could reach it, to be safe, which hides which one matters.
    - Leaning harder on patching instead of giving the code a seam where the dependency is passed in.
  remedy: >
    Patch the name in the module under test (the place the lookup happens), and assert on the mock so a wrong
    target fails loudly; autospec catches signature drift too. Better still, pass the dependency in (a
    parameter, a constructor argument, a FastAPI dependency override) so no patch is needed.
  counter: >
    Patching the defining module is correct when the code under test looks the name up through it at call time
    ("import a" then "a.thing()"), and for attributes on objects or classes that every caller reaches through
    the same object. Some argue patching should be rare anyway (Freeman and Pryce's "only mock types you own";
    the classical school's preference for real objects and fakes), which makes the rule moot. For integration
    tests that should hit the real thing, the absence of a patch is the point.
  in:
    python: >
      The canonical case. With "from a import X" in module b, patch b.X; with "import a" and a.X used at call
      time, patch a.X. patch.object on the module the code under test imports is a clear way to say which.
      Captured references (default args, dicts of callbacks built at import) need the dependency passed in
      instead.
    typescript: >
      jest.mock and vi.mock replace a whole module in the registry by its specifier, which is hoisted, so they
      reach every importer. The trap is spyOn on an exported function: calls from inside the same module use
      the local binding and aren't intercepted, and ES module namespaces often can't be spied on at all.
    java: >
      Mockito has no patching; a mock works only if it is injected. Creating a mock while the class calls new
      or a static factory itself is the same failure; mockConstruction and mockStatic exist but are a sign the
      class needs a seam.
    csharp: >
      Moq and NSubstitute replace only injected interfaces or virtual members. A static call, a new inside the
      class, or a non-virtual method can't be intercepted, so the mock is never used.
    go: >
      Go can't monkey-patch. The common seam is a package-level function variable (var now = time.Now) that
      tests reassign; it fails the same way when code copies the variable into a struct or closure before the
      test reassigns it. Interfaces passed in avoid this.
    rust: "No runtime patching. The mockall_double crate's #[double] attribute, used on an import, swaps a type
      for its mockall mock under cfg(test), which is the \"where it's looked up\" rule enforced at compile
      time; otherwise traits passed in are the seam."
  related:
    - mock-everything
    - test-double-taxonomy
    - hard-to-test-code
    - global-state
    - init-time-side-effects
    - dependency-injection
    - assertion-free-test
  tell: null
  agent_prone: true
  interview_only: false
  example:
    before: |
      # reminders.py
      from sms import send_text
      fn remind_overdue(invoices):
          for inv in invoices:
              if inv.overdue: send_text(inv.phone, "Invoice overdue")

      # test_reminders.py
      with patch("sms.send_text") as fake:     # patches sms, but reminders kept its own reference
          remind_overdue([overdue_invoice])     # the real send_text runs
    after: |
      # test_reminders.py
      with patch("reminders.send_text") as fake:  # where reminders looks it up
          remind_overdue([overdue_invoice])
      fake.assert_called_once_with(overdue_invoice.phone, "Invoice overdue")

      # or give it a seam and skip patching
      fn remind_overdue(invoices, send=send_text): ...
      remind_overdue([overdue_invoice], send=fake_sender)
    note: The patch now replaces the name the code actually calls, and the assertion would fail if it ever didn't.
  sources:
    - cite: Python documentation, unittest.mock, Where to patch
      url: https://docs.python.org/3/library/unittest.mock.html#where-to-patch
      how: read
    - cite: Jest documentation, Manual mocks and jest.mock
      url: https://jestjs.io/docs/manual-mocks
      how: recalled
    - cite: mockall documentation, mocking structs and mockall_double
      url: https://docs.rs/mockall/latest/mockall/
      how: recalled
    - cite: Freeman and Pryce, Growing Object-Oriented Software, Guided by Tests (2009), only mock types you own
      url: null
      how: recalled
- id: overloaded-environment-flag
  name: Overloaded environment flag
  family: anti-pattern
  group: security
  says: >
    One environment flag (DEBUG, a dev, local or test mode) switches on several unrelated risky behaviours at
    once, such as detailed error pages, skipped auth, open CORS, weak secret checks or a fake payment
    provider, so turning it on for one reason turns on all of them, and one leaked setting opens them all.
  names: >
    No single coined name; practitioners call it debug mode in production, an environment check scattered
    through code, or a god flag. Django's documentation on DEBUG ("never deploy a site into production with
    DEBUG turned on") and its deployment checklist are the canonical warning about one flag doing many things.
    MITRE's CWE-489 (Active Debug Code) covers the debug half, and OWASP A02:2025 Security Misconfiguration
    lists unnecessary features enabled and verbose error handling. Pete Hodgson's "Feature Toggles"
    (martinfowler.com) gives the design remedy: one toggle per decision, with toggle points kept apart from
    the logic that decides them.
  applies_to:
    kinds: []
    languages: []
  contested: false
  matters_most_for:
    - web-api
    - fullstack-web
    - serverless
    - platforms
  looks_like:
    - The same check (ENV == "development", NODE_ENV !== "production", settings.DEBUG, IsDevelopment())
      repeated across modules, each gating something different.
    - One flag that mounts unauthenticated routes, relaxes secret validation and enables verbose errors.
    - CORS, cookie Secure flags, TLS verification or rate limiting relaxed under a development check.
    - A committed .env or default config that sets the flag on.
    - Staging environments run with the flag on to get one convenience, inheriting the rest.
  forces:
    - A single "am I local?" switch is quick to add, and each new convenience just reuses it.
    - Frameworks ship one DEBUG or environment setting and hook their own behaviours to it, which invites
      application code to do the same.
    - Local setup needs several shortcuts at once (no real auth provider, no TLS, a fake payment gateway).
    - Nobody owns the list of what the flag controls, so it grows without review.
  overuse:
    - A separate flag for every tiny difference, so the configuration matrix is too big to reason about and
      environments drift apart.
    - Banning environment-specific behaviour so strictly that local development needs real credentials and
      third-party services.
  remedy: >
    Split it: one named setting per behaviour (expose_error_details, allow_test_user_creation,
    cors_allowed_origins), each defaulting to the safe value and named for its risk, and decide them in one
    configuration module rather than at scattered call sites (Hodgson's decouple decision points from decision
    logic). Validate at startup that dangerous settings are off in production, and keep fakes for payment or
    email behind dependency wiring rather than an environment check.
  counter: >
    For a small app run by one team, a single development flag that only affects developer convenience (auto
    reload, a debug toolbar, pretty logs) is fine and simpler than many settings; the problem is when it also
    controls security or money. Frameworks' own DEBUG flags are hard to avoid and are acceptable if production
    config is checked at startup. Twelve-Factor's dev/prod parity argues for fewer environment differences
    overall, which reduces the need for flags of any kind.
  in:
    python: >
      Django's DEBUG controls detailed error pages, query logging and the ALLOWED_HOSTS fallback; adding
      application behaviour to the same flag is the trap. "manage.py check --deploy" checks the production
      settings. In FastAPI apps, pydantic-settings fields per behaviour replace one ENVIRONMENT string.
    typescript: >
      NODE_ENV is meant to choose build optimisation (and Express uses it for error detail); using it to
      bypass auth or open CORS is the anti-pattern. Bundlers inline it, so client code branches are visible in
      the shipped bundle.
    java: >
      Spring profiles can become an overloaded flag when one "dev" profile switches security, data sources and
      fakes together; profile-specific beans for each concern, or separate properties, keep them apart.
    csharp: >
      IWebHostEnvironment.IsDevelopment() gates the developer exception page in templates; checks of it
      scattered through application code to skip authorization are the anti-pattern. Options classes per
      concern are the usual split.
  related:
    - secure-by-default
    - test-logic-in-production
    - fail-open-vs-fail-closed
    - least-privilege
    - hard-coded-secrets
    - global-state
    - shotgun-surgery
  tell: Written for python, typescript, java, csharp and go. In one non-test file, a check of a general
    environment or debug flag (DEBUG, ENV, ENVIRONMENT, APP_ENV, NODE_ENV, an IsDevelopment call, an active
    "dev" profile) that gates at least one application-level bypass (authentication or authorization skipped,
    an unauthenticated or test-only route mounted, secret or signature validation relaxed, TLS certificate
    verification turned off) plus any other security-relevant behaviour (CORS widened, error details exposed,
    cookie Secure off). Not when the flag gates only error pages, HSTS, cookie flags or developer tooling,
    which framework templates do by design.
  agent_prone: true
  interview_only: false
  example:
    before: |
      IS_DEV = env("APP_ENV") == "development"

      fn build_app():
          app = App(show_tracebacks=IS_DEV)
          if IS_DEV:
              app.cors(allow_origins=["*"])
              app.mount(test_user_routes)            # creates users without auth
              payments = FakePaymentGateway()
          else:
              payments = StripeGateway(env("STRIPE_KEY"))
          ...
    after: |
      class Settings:
          show_tracebacks: bool = False
          cors_origins: list = []
          dangerously_allow_test_user_routes: bool = False
          payment_gateway: str = "stripe"            # or "fake"

      fn build_app(s: Settings):
          app = App(show_tracebacks=s.show_tracebacks)
          app.cors(allow_origins=s.cors_origins)
          if s.dangerously_allow_test_user_routes: app.mount(test_user_routes)
          payments = make_gateway(s.payment_gateway)
    note: Each risky behaviour has its own safe-by-default setting, so enabling one for local work no longer
      enables the others, and production checks can refuse each by name.
  sources:
    - cite: Django documentation, settings, DEBUG
      url: https://docs.djangoproject.com/en/stable/ref/settings/#debug
      how: read
    - cite: Django documentation, Deployment checklist
      url: https://docs.djangoproject.com/en/stable/howto/deployment/checklist/
      how: recalled
    - cite: Pete Hodgson, Feature Toggles (aka Feature Flags), martinfowler.com
      url: https://martinfowler.com/articles/feature-toggles.html
      how: read
    - cite: OWASP Top 10 2025, A02:2025 Security Misconfiguration (CC BY 3.0)
      url: https://top10.owasp.org/2025/A02_2025-Security_Misconfiguration/
      how: read
    - cite: MITRE CWE-489, Active Debug Code
      url: https://cwe.mitre.org/data/definitions/489.html
      how: recalled
    - cite: The Twelve-Factor App, X. Dev/prod parity
      url: https://12factor.net/dev-prod-parity
      how: recalled
