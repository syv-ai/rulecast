- id: assertion-free-test
  name: Assertion-Free Test
  family: anti-pattern
  group: testing
  says: A test runs the code but asserts nothing meaningful, so it passes as long as nothing throws. Meszaros's
    nearest names are Neverfail Test and Manual Result Verification; also called the "secret catcher" or a
    smoke-only test.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - test functions with no assert or expect call at all
    - assertions that can't fail, such as checking a result is not None right after building it, or a boolean
      asserted true with a literal
    - a test wrapped in a broad try/except that swallows the failure
    - async tests that don't await the work they start, so failures land after the test ends
  forces:
    - coverage targets, which count lines run rather than behaviour checked
    - an agent or developer asked to "add tests" with no clear expected outcome
    - not knowing what the right answer is, so the test checks only that it doesn't crash
  overuse:
    - padding every test with extra assertions on incidental details, which leads to Fragile Test and
      Assertion Roulette
  remedy: Assert on the specific returned value or observable effect, watch the test fail once before trusting
    it, and use mutation testing to find tests that never fail.
  counter: >
    A deliberate smoke test ("the app starts", "this doesn't raise on valid input") is legitimate when named
    and meant as one, and many frameworks let you assert "does not raise" explicitly. Fuzz tests often have no
    assertion beyond not crashing, and that's the point. Benchmarks and type-level tests may also have no
    runtime assertion.
  in: {}
  related:
    - mock-everything
    - manual-intervention
    - conditional-test-logic
