# rulecast lens catalog: antipatterns. Distilled 2026-10-13; see docs/references.md.
# Own words throughout; sources cited per entry (how: read | recalled).
- id: god-object
  name: God object (The Blob)
  family: anti-pattern
  group: design
  says: One class holds most of the control and data that should be spread across several, so every change goes
    through it. Brown et al. call it The Blob; Large Class is the smell it shows up as.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - one class or module that most other files import, and that turns up in most commits
    - a class whose methods fall into clusters that share no fields with each other
    - names like Manager, Controller, System or Service that cover a whole area of the product
    - small satellite classes that are only data, with the logic for them all living in the big one
  forces:
    - Each new feature is small, and the class that already knows the related data is the easiest place to put
      it.
    - Under a deadline, adding a method beats deciding where a new class should go and what it owns.
    - Procedural habits carried into an object-oriented codebase put one controller in charge and leave the
      rest as records.
  overuse:
    - Splitting until every class has two methods and following any behaviour means opening ten files
      (over-modularization).
    - Breaking a class apart by method count instead of by reason to change, so things that always change
      together end up in different places.
  remedy: Extract Class along the clusters of fields and methods that change together; Move Method to the data
    the method uses.
  counter: >
    A composition root or application wiring module is meant to know about everything, and that is fine as
    long as it only wires and holds no rules. A small program or script with one class doing one job is not a
    God object just because it is the only class. Size alone isn't the test: a long class with one reason to
    change is a long class.
  in: {}
  related:
    - solid
    - facade
    - mediator
    - large-class
    - divergent-change
    - interface-bloat
    - functional-decomposition
  tell: null
  interview_only: false
  agent_prone: true
  sources:
    - cite: Brown, Malveau, McCormick, Mowbray, AntiPatterns (1998), The Blob
      url: null
      how: recalled
    - cite: Wikipedia, Anti-pattern, In software engineering
      url: https://en.wikipedia.org/wiki/Anti-pattern
      how: read
  example:
    before: |
      class ClinicManager:
          appointments: list
          invoices: list
          sms_gateway: SmsGateway

          fn book(patient, slot): ...
          fn cancel(appointment_id): ...
          fn bill(appointment_id) -> Invoice: ...
          fn apply_insurance(invoice, policy): ...
          fn send_reminder(appointment_id): ...
          fn monthly_revenue_report() -> Report: ...
    after: |-
      class Schedule:
          appointments: list
          fn book(patient, slot): ...
          fn cancel(appointment_id): ...

      class Billing:
          invoices: list
          fn bill(appointment) -> Invoice: ...
          fn apply_insurance(invoice, policy): ...
          fn monthly_revenue_report() -> Report: ...

      class Reminders:
          sms_gateway: SmsGateway
          fn send(appointment): ...
    note: Each cluster of fields and the methods that use them becomes its own class, so a billing change no
      longer touches scheduling.
  matters_most_for:
    - mobile
    - games
    - desktop
    - fullstack-web
    - web-frontend
    - tui
- id: magic-number
  name: Magic number
  family: anti-pattern
  group: code
  says: A literal with an important meaning sits in the code with nothing saying what it is, where a named
    constant should stand.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - numeric or string literals inside conditions and arithmetic, such as a timeout, a limit or a status code
    - the same unexplained literal repeated in several files
    - a comment next to a literal explaining what it means, instead of a name
  forces:
    - The value is obvious to the person writing it at that moment.
    - Naming a constant means deciding where it lives, which feels like overhead for one use.
  overuse:
    - Naming 0, 1, 2 or 100 percent (ZERO, ONE, HUNDRED), which adds a lookup and no meaning.
    - Pulling every literal into a far-away constants file, so the reader has to jump to learn a value used in
      one place.
  remedy: Replace Magic Number with Symbolic Constant, named for what the value means, kept near where it is used.
  counter: >
    Well-known values such as 0, 1, -1, 2 for halving, or 100 for percent are clear on sight. So are literals
    in tests, where the concrete value is the point, and values whose meaning the surrounding name already
    gives (timeout_seconds = 30). A constant named after its value instead of its meaning (THIRTY) is no
    better than the literal. Lint rules for it are known for noise, so most teams configure an allowlist.
  in: {}
  related:
    - primitive-obsession
    - principle-of-least-astonishment
  tell: A numeric literal other than 0, 1 or -1 in a comparison, arithmetic, a default argument or a query
    limit, outside a constant declaration or a test file. Unit factors (60, 24, 1024) only beside a name that
    says the unit.
  interview_only: false
  agent_prone: false
  sources:
    - cite: Wikipedia, Anti-pattern, In software engineering
      url: https://en.wikipedia.org/wiki/Anti-pattern
      how: read
    - cite: McConnell, Code Complete (2nd ed.), Numbers in general
      url: null
      how: recalled
  example:
    before: |
      fn parking_fee(entered: Time, left: Time) -> Money:
          minutes = (left - entered).minutes
          if minutes <= 20:
              return Money(0)
          hours = ceil(minutes / 60)
          return Money(min(hours * 350, 2400))
    after: |
      FREE_STAY_MINUTES = 20
      HOURLY_RATE_CENTS = 350
      DAILY_CAP_CENTS = 2400

      fn parking_fee(entered: Time, left: Time) -> Money:
          minutes = (left - entered).minutes
          if minutes <= FREE_STAY_MINUTES:
              return Money(0)
          hours = ceil(minutes / 60)
          return Money(min(hours * HOURLY_RATE_CENTS, DAILY_CAP_CENTS))
    note: The business values get names; 60 minutes per hour stays a literal because everyone knows it.
  matters_most_for:
    - embedded
    - scientific
    - games
    - ml-training
- id: poltergeist
  name: Poltergeist
  family: anti-pattern
  group: design
  says: A class that owns nothing and lives for a moment, made only to kick off work that really belongs to
    other objects, then thrown away. Close to the Middle Man and Lazy Class smells.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - classes named Starter, Launcher, Invoker, Runner or Handler with one method that forwards to another
      object
    - objects created, used for one call and dropped in the same line
    - a layer of classes whose methods each make one call into the next layer
  forces:
    - A misread rule that every action needs its own class or that callers must never touch the real object
      directly.
    - Frameworks and examples that put a controller or handler class in front of everything.
    - Wanting a seam for testing where nothing actually varies.
  overuse:
    - Removing a thin class that was a real boundary, such as an adapter at a third-party API or a port in a
      hexagonal design.
    - Inlining a command object that is queued, logged or undone, which is a legitimate use of a short-lived
      class.
  remedy: Inline Class, or Remove Middle Man, so callers use the object that does the work.
  counter: >
    A thin class earns its place when it is a real boundary: it adapts a vendor API, carries a request across
    a queue, or is the Command pattern with undo or retry. Framework entry points (an HTTP handler, a CLI
    command) are thin by design and should stay thin. The test is whether removing it would lose anything.
  in: {}
  related:
    - middle-man
    - lazy-class
    - command
    - adapter
    - wrong-abstraction
  tell: null
  interview_only: false
  agent_prone: true
  sources:
    - cite: Brown, Malveau, McCormick, Mowbray, AntiPatterns (1998), Poltergeists
      url: null
      how: recalled
    - cite: Wikipedia, Anti-pattern, In software engineering
      url: https://en.wikipedia.org/wiki/Anti-pattern
      how: read
  example:
    before: |
      class PayrollRunStarter:
          fn start(month: Month):
              PayrollRun(month).execute()

      class PayslipSender:
          fn send(run: PayrollRun):
              Mailer().send_all(run.payslips())

      PayrollRunStarter().start(month)
    after: |
      fn close_month(month: Month, mailer: Mailer):
          run = PayrollRun(month)
          run.execute()
          mailer.send_all(run.payslips())
    note: The two classes added nothing but a hop, so callers talk to PayrollRun and the mailer directly.
  matters_most_for: []
- id: interface-bloat
  name: Interface bloat (bloated interface)
  family: anti-pattern
  group: design
  says: An interface carries so many methods that every client depends on far more than it uses and every
    implementer must fill in methods it has no use for. The interface segregation principle is the
    counter-ideal.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - an interface with a dozen or more methods that most implementations stub out, leave empty or make throw
      "not supported"
    - test doubles that must implement many methods to exercise one
    - clients that each call a small, different slice of the same interface
    - methods with long lists of optional parameters and mode flags
  forces:
    - One interface per concept feels tidy, so every operation on that concept goes into it.
    - Adding a method to the existing interface is the smallest change when a new caller needs something.
  overuse:
    - One-method interfaces for everything, so a single service needs five interfaces and the wiring outweighs
      the code.
    - Splitting an interface whose methods are always used together.
  remedy: Extract Interface per client role (role interfaces), and have the class implement the ones it supports.
  counter: "A wide interface is fine when clients really do use most of it, as with a collection or a file
    handle. In languages with structural typing, such as Go and TypeScript, clients can declare the small
    interface they need themselves, which makes the wide one less harmful. Splitting too far scatters one
    concept across many tiny types. Some domains really are wide, and a facade can be wide on purpose: what
    matters is whether each client depends only on what it uses."
  in:
    go: Go's convention is small interfaces (io.Reader has one method), declared in the package that uses them
      rather than the one that implements them; a large interface exported next to its only implementation is
      a sign of this.
  related:
    - solid
    - refused-bequest
    - god-object
    - speculative-generality
    - long-parameter-list
    - yagni
  tell: null
  interview_only: false
  agent_prone: false
  sources:
    - cite: "Martin, Agile Software Development: Principles, Patterns, and Practices (2002), The Interface
        Segregation Principle"
      url: null
      how: recalled
    - cite: "Wikipedia, List of software anti-patterns: Interface bloat"
      url: https://en.wikipedia.org/wiki/List_of_software_anti-patterns
      how: read
    - cite: "Brown, Malveau, McCormick & Mowbray, AntiPatterns (1998): Swiss Army Knife"
      url: null
      how: recalled
  example:
    before: |
      interface MediaStore:
          fn read(id) -> Bytes
          fn write(id, data: Bytes)
          fn delete(id)
          fn transcode(id, format)
          fn generate_thumbnail(id)
          fn set_retention(id, days)
          fn usage_report() -> Report

      class ReadOnlyMirror implements MediaStore:
          fn read(id) -> Bytes: ...
          fn write(id, data): raise NotSupported
          ...
    after: |
      interface MediaReader:
          fn read(id) -> Bytes

      interface MediaWriter:
          fn write(id, data: Bytes)
          fn delete(id)

      interface MediaProcessing:
          fn transcode(id, format)
          fn generate_thumbnail(id)

      class ReadOnlyMirror implements MediaReader:
          fn read(id) -> Bytes: ...
    note: Each client depends on the role it uses, and the mirror no longer has to fake writes.
  names: Also called Swiss army knife, kitchen sink or fat interface (Brown et al.).
  matters_most_for:
    - library-sdk
    - plugins-extensions
    - plugin-host
- id: dogma-over-pragma
  name: Dogma over pragma
  family: anti-pattern
  group: design
  says: A rule or principle is applied because it is the rule, in places where its reason does not hold and it
    does not make the code better. It differs from cargo cult programming in that the rule is known and named;
    what is missing is the judgement about when it applies.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - a lint or style rule followed to the letter where its stated reason doesn't apply, such as a mandated
      interface for a type that will never vary, kept because the rule says every service has one
  forces:
    - Rules are easier to check and argue about than judgement is.
    - A principle that once fixed a real problem gets generalised beyond that problem.
    - New team members copy what the codebase already does to be safe.
  overuse:
    - Treating every convention as negotiable, so each file is decided case by case and consistency is lost.
    - Using "pragmatism" to excuse skipping tests or error handling.
  remedy: Ask what the rule protects against, and write the rule down with its reason so exceptions can be
    judged against it.
  counter: >
    Consistency has its own value: a rule that is slightly wrong in one place but applied everywhere can beat
    a case-by-case call in a large team. Some rules, like security and data-handling rules, should be followed
    even when the reason isn't obvious locally. The fix is to know the reason, not to drop the rule.
  in: {}
  related:
    - cargo-cult-programming
    - wrong-abstraction
    - yagni
  tell: null
  interview_only: false
  agent_prone: false
  sources:
    - cite: "The developer's seed list. No canonical source; related named ideas: Goodhart's law, Chesterton's
        fence"
      url: null
      how: developer
  example:
    before: |
      # rule: no function longer than 5 lines
      fn shipping_cost(order: Order) -> Money:
          base = _base(order)
          return _cap(_surcharge(order, base))

      fn _base(order): return order.weight_kg * RATE_PER_KG
      fn _surcharge(order, base): return base + _remote_fee(order)
      fn _remote_fee(order): return REMOTE_FEE if order.address.is_remote else 0
      fn _cap(cost): return min(cost, MAX_SHIPPING)
    after: |
      fn shipping_cost(order: Order) -> Money:
          cost = order.weight_kg * RATE_PER_KG
          if order.address.is_remote:
              cost = cost + REMOTE_FEE
          return min(cost, MAX_SHIPPING)
    note: The calculation reads top to bottom again; the line limit was serving the metric, not the reader.
  matters_most_for: []
- id: business-logic-in-helpers
  name: Business logic in helpers
  family: anti-pattern
  group: design
  says: The rules of the domain live in functions in "utils", "helpers" or "common" modules instead of on the
    domain objects they are about, which are left as bare data. Close to the Anemic Domain Model.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - utils or helpers modules that import domain entities and branch on their fields
    - domain classes with only fields and accessors, while functions elsewhere take them as the first argument
    - the same business rule computed by two different helpers in different places
    - helper names that are really domain verbs, such as calculate_discount or is_eligible
  forces:
    - A helper file is the quickest place to put a function when you don't want to decide which class owns it.
    - Frameworks and ORMs that generate plain data models make adding behaviour to them feel off-limits.
    - A function that started as formatting or conversion slowly picks up rules.
  overuse:
    - Pushing infrastructure into entities, such as database or HTTP calls inside a domain object.
    - Moving genuinely generic code (string padding, date maths) onto a domain class where it doesn't belong.
  remedy: Move Method onto the entity or value object the rule is about, or Extract Class for a domain service
    when the rule spans several.
  counter: >
    In a functional or data-oriented style, rules as functions over plain data are the design, not a mistake;
    the problem there is only when they sit in a grab-bag module instead of one named after the domain. Truly
    generic helpers are fine. The test is whether a domain expert would recognise the rule.
  in: {}
  related:
    - feature-envy
    - drifting-terminology
    - functional-decomposition
  tell: null
  interview_only: false
  agent_prone: true
  sources:
    - cite: Fowler, AnemicDomainModel (2003)
      url: https://martinfowler.com/bliki/AnemicDomainModel.html
      how: recalled
  example:
    before: |
      # utils.py
      fn loyalty_points(member: Member, purchase: Purchase) -> int:
          points = floor(purchase.total / 10)
          if member.tier == "gold":
              points = points * 2
          if member.joined_days < 30:
              points = points + WELCOME_BONUS
          return points

      class Member:
          tier: str
          joined_days: int
    after: |
      class Member:
          tier: str
          joined_days: int

          fn points_for(purchase: Purchase) -> int:
              points = floor(purchase.total / 10)
              if self.tier == "gold":
                  points = points * 2
              if self.joined_days < 30:
                  points = points + WELCOME_BONUS
              return points
    note: The loyalty rule moves onto the member it is about, so there is one place to find and change it.
  matters_most_for:
    - fullstack-web
    - web-api
- id: drifting-terminology
  name: Drifting terminology
  family: anti-pattern
  group: design
  says: The same concept goes by different names in different parts of the code, or one name means different
    things, so the code stops matching how the domain is talked about. DDD's ubiquitous language is the
    counter-ideal.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - Customer, Client, Account and User used for the same thing in different modules
    - one word, such as order or account, that means different things in different modules without a stated
      boundary
    - mapping functions that only rename fields between two names for the same thing
    - code names that differ from what the product, support or the domain experts say
  forces:
    - Different people or teams name things as they go, and nobody owns the vocabulary.
    - A rename of the domain term happens in conversation but not in the code.
    - Each new piece of code is written without reading what the existing code calls the concept.
  overuse:
    - Forcing one word across bounded contexts where it genuinely means different things.
    - Large rename-only changes that churn history for a small gain.
  remedy: Agree a glossary with the domain experts, Rename to it, and draw explicit context boundaries where one
    word must mean two things.
  counter: >
    Different meanings in different bounded contexts are expected in DDD, as long as the boundary is explicit
    and translation happens at it. Public API and database names can be costly to change, so a documented
    alias at the edge is sometimes the right trade.
  in: {}
  related:
    - business-logic-in-helpers
    - principle-of-least-astonishment
  tell: null
  interview_only: false
  agent_prone: true
  sources:
    - cite: Evans, Domain-Driven Design Reference (2015), Ubiquitous Language and Bounded Context
      url: https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf
      how: recalled
  example:
    before: |
      class Parcel:
          tracking_code: str

      fn dispatch_package(pkg: Parcel): ...
      fn track_consignment(consignment_id: str): ...
      fn label_for_shipment(item: Parcel) -> Label: ...
    after: |
      class Parcel:
          tracking_code: str

      fn dispatch(parcel: Parcel): ...
      fn track(parcel_tracking_code: str): ...
      fn label_for(parcel: Parcel) -> Label: ...
    note: One concept, one name, the one the warehouse staff use, so nobody wonders whether a consignment is
      something else.
  matters_most_for:
    - web-api
    - fullstack-web
    - platforms
    - library-sdk
- id: cargo-cult-programming
  name: Cargo cult programming
  family: anti-pattern
  group: code
  says: Code, rituals or structure are copied because they appeared in working code, without understanding what
    they do or whether they apply here.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - sleeps, retries, deep copies or explicit flushes with no comment saying what they guard against
    - boilerplate copied from another project or example that does nothing in this one
    - settings or flags in config files that nobody on the team can explain
    - try/catch wrappers that log and rethrow on every function
  forces:
    - Something worked once with the code in it, and removing it feels risky.
    - Copying from a trusted source or example is faster than understanding it.
    - Fear of breaking things nobody understands.
  overuse:
    - Ripping out an odd-looking line without checking why it is there (Chesterton's fence).
  remedy: Find out what the code is for; delete it if it has no reason, or name and comment the reason if it does.
  counter: Following an established template without understanding every line is normal and often wise for
    newcomers, as long as someone understands it. Some defensive code really does guard a rare case, and its
    lack of comment is the problem, not its existence. The name is still the standard one at code scale
    (Jargon File, Wikipedia), though some, like INNOQ at architecture scale, avoid "cargo cult" for its
    colonial overtones.
  in: {}
  related:
    - dogma-over-pragma
    - copy-and-paste-programming
    - lava-flow
  tell: null
  interview_only: false
  agent_prone: true
  sources:
    - cite: Feynman, Cargo Cult Science (1974), the origin of the term
      url: null
      how: recalled
    - cite: The Jargon File, cargo cult programming
      url: null
      how: recalled
  example:
    before: |
      fn send_newsletter(issue: Issue, subscribers: list):
          issue = deep_copy(issue)
          for sub in subscribers:
              try:
                  sleep(0.5)
                  mailer.send(sub.email, render(issue))
                  mailer.flush()
              except Error as e:
                  log(e)
                  raise e
    after: |
      SEND_INTERVAL = 0.5  # provider allows two messages per second

      fn send_newsletter(issue: Issue, subscribers: list):
          for sub in subscribers:
              sleep(SEND_INTERVAL)
              mailer.send(sub.email, render(issue))
    note: The copy, the flush and the log-and-rethrow did nothing here; the sleep had a real reason, so it got a
      name.
  names: This is the code-scale lens; blind pattern following (INNOQ's renamed "cargo-culting") covers adopting
    whole architectures, tools or processes, and is kept separate.
  matters_most_for:
    - iac
    - ml-training
    - serverless
- id: lava-flow
  name: Lava flow
  family: anti-pattern
  group: code
  says: Dead or half-finished code from earlier experiments hardens into the codebase because nobody knows
    whether it is still needed and nobody dares remove it.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - commented-out blocks and functions with comments like "do not remove" or "not sure if used"
    - several versions of the same function (v2, new_, old_) side by side
    - modules with no callers that still get edited during refactors
    - branches for feature flags that were fully rolled out long ago
  forces:
    - Prototype code shipped to production without a cleanup pass.
    - The original authors left, and without tests nobody can prove a path is unused.
    - Keeping code feels safer than deleting it.
  overuse:
    - Deleting code that is reached only by reflection, configuration, plugins or external callers without
      checking.
  remedy: Remove Dead Code, backed by coverage or call-site search, and trust version control to keep the history.
  counter: >
    Code that only looks dead may be used through reflection, dynamic dispatch, a public API or a rarely run
    job; a library cannot know its callers. In those cases, deprecate and measure before deleting.
  in: {}
  related:
    - dead-code
    - boat-anchor
    - technical-debt
    - cargo-cult-programming
  tell: "All languages: a block of two or more consecutive commented-out lines that read as statements (an
    assignment, a call, a control keyword, or a line ending in ; { or }). It skips a block that follows a
    comment ending in ':' or mentioning 'example' or 'uncomment', and it skips vendored and generated files,
    including scaffold templates such as alembic env.py."
  interview_only: false
  agent_prone: true
  sources:
    - cite: Brown, Malveau, McCormick, Mowbray, AntiPatterns (1998), Lava Flow
      url: null
      how: recalled
  example:
    before: |
      fn tax_for(invoice: Invoice) -> Money:
          return tax_v3(invoice)

      fn tax_v2(invoice):   # old, keep just in case
          ...

      # fn tax_experimental(invoice):
      #     rate = lookup_rate_from_api(invoice.country)
      #     ...

      fn tax_v3(invoice): ...
    after: |
      fn tax_for(invoice: Invoice) -> Money:
          return tax_v3(invoice)

      fn tax_v3(invoice): ...
    note: The unused versions go; the history keeps them if anyone ever needs them back.
  matters_most_for:
    - ml-training
    - scientific
    - data-pipeline
- id: golden-hammer
  name: Golden hammer
  family: anti-pattern
  group: design
  says: One familiar tool, language or technique gets used for every problem, including ones it fits badly. The
    law of the instrument ("if all you have is a hammer").
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - the same database, queue or framework used for jobs it is poorly suited to, such as a relational table
      as a job queue under heavy load
    - regular expressions used to parse nested formats
    - every new feature built on one in-house framework even where it adds friction
  forces:
    - The team knows the tool well and has had success with it.
    - Adding a new technology has real costs in learning, operations and hiring.
    - A past investment in the tool that people want to justify.
  overuse:
    - Adding a new technology for every problem, so the stack sprawls and nobody knows all of it.
  remedy: Judge the problem first and the tool second; bring in a better-fitting tool where the misfit is costly.
  counter: >
    Sticking with a well-understood tool is often the right call: "choose boring technology" (Dan McKinley)
    argues that each new technology spends a limited budget. A familiar tool used slightly outside its sweet
    spot usually beats an unfamiliar one used well. It is a golden hammer only when the misfit costs more than
    the switch.
  in: {}
  related:
    - reinventing-the-wheel
    - lindy-effect
  tell: null
  interview_only: false
  agent_prone: false
  sources:
