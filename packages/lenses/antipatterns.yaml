    - platforms
    - data-pipeline
- id: big-ball-of-mud
  name: Big Ball of Mud
  family: anti-pattern
  group: architecture
  says: A system with no recognisable structure, shaped by expedient fixes, where data and logic are shared
    freely and every part can reach every other. Malignant Growth is the process that usually produces it;
    this is the canonical name for the result.
  applies_to:
    kinds: []
    languages: []
  contested: true
  agent_prone: false
  looks_like:
    - no module boundaries that the import graph respects; anything imports anything
    - global state and shared mutable data read and written from everywhere
    - the same rule implemented in several places, slightly differently
    - throwaway prototype code still in production years later
    - nobody can draw the architecture, and the diagrams that exist are aspirational
    - temporary workarounds and feature toggles that are years old and partly undocumented
    - integrations added point to point as each new need came up
  forces:
    - deadlines push structure aside, and architecture's costs arrive before its benefits
    - the right boundaries only become clear after the domain is understood, which is late
    - turnover erodes the memory of why things are where they are
    - architecture is invisible to users and managers, so nobody outside the team rewards it
    - unexpected requirements force expedient changes the original design never anticipated
    - a prototype that works gets shipped and grown instead of thrown away
    - maintenance is handed to a separate or junior team without design authority
  overuse:
    - imposing a rigid layered architecture on a young product before the domain is understood, which becomes
      a straitjacket
    - declaring the system beyond repair and starting a rewrite when containment and refactoring would do
  remedy: Contain the worst parts behind a Facade (Sweeping It Under the Rug), alternate expansion with
    consolidation, refactor continuously under tests, separate what changes at different rates (Shearing
    Layers), and treat Reconstruction as a last resort.
  counter: "Foote and Yoder, who named it, present it as a pattern rather than a pure anti-pattern: mud persists
    because it delivers, early on nobody understands the domain well enough to draw good boundaries, and
    markets reward shipping over structure. A messy first version of a poorly understood problem can be the
    best anyone could do at the time. A throwaway prototype, a spike or a short-lived script can be mud with
    no harm done. The trouble starts when the mess gets so opaque it can no longer adapt. Rewriting from
    scratch carries the second-system risk."
  in: {}
  related:
    - under-modularization
    - technical-debt
    - galls-law
    - second-system-effect
    - lehmans-laws
    - broken-windows-theory
