- id: over-engineering
  name: Over-Engineering
  family: anti-pattern
  group: architecture
  says: A system's architecture is more complex than its requirements need, usually through new technology or
    optimisation for flexibility and scale nobody has asked for. At code scale it overlaps Speculative
    Generality, which is the canonical name for the class-level form.
  applies_to:
    kinds: []
    languages: []
  contested: false
  agent_prone: true
  looks_like:
    - message brokers, orchestration engines or caches in a system with modest load and one team
    - logically related code spread across many files or modules for one simple feature
    - framework boilerplate outweighing business logic
    - a framework or platform built where a single solution would do
    - business logic arriving late or buggy because the infrastructure absorbed the effort
  forces:
    - curiosity about new concepts and frameworks, without asking whether they fit
    - premature optimisation for flexibility, extensibility or scale that isn't needed yet
    - wanting hands-on experience with new technology instead of repeating the same stack
    - not knowing the domain well enough to see the simple solution
  overuse:
    - refusing any structure until it hurts, then paying for a large retrofit
    - dismissing known, cheap safety margins (an index, a queue for slow work) as over-engineering
  remedy: Keep it simple (KISS, YAGNI), optimise only when measurements say so, build for current requirements,
    spend a limited budget of "innovation tokens", and refactor or rewrite toward the simpler design.
  counter: >
    Some requirements genuinely are demanding (regulated data, high availability, real scale), and meeting
    them isn't over-engineering. Some decisions are expensive to reverse, so a bit of foresight on those is
    cheap insurance. The judgement is about requirements you have or can see coming, not ones you imagine.
    Sometimes the real fix is a business process change, not software at all.
  in: {}
