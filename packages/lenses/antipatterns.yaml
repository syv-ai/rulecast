- id: under-modularization
  name: Under-Modularization
  family: anti-pattern
  group: architecture
  says: Splitting a system into too few modules, so each is too big to understand, secure, deploy or scale, and
    missing boundaries let unrelated parts depend on each other freely.
  applies_to:
    kinds: []
    languages: []
  contested: false
  agent_prone: false
  looks_like:
    - a shared core of domain classes, database access and utilities that every feature imports and that is
      the biggest part of the codebase
    - one deployable unit owned by several teams that block each other's releases
    - imports crossing what should be domain boundaries in every direction
    - one or two huge classes holding every variant of an entity
  forces:
    - time pressure and low budget, so nobody stops to draw boundaries
    - growth nobody steered
    - no shared vision of how the system should be cut
    - inherited project structures from older platforms
    - not enough architecture or domain knowledge to see the seams
  overuse:
    - "Over-Modularization: splitting into many tiny modules or services before the split pays off"
  remedy: Introduce module boundaries along bounded contexts, starting inside the deployable (a modular
    monolith), and split further once there's a concrete payoff such as reuse, separate team ownership, or
    performance needs.
  counter: >
    A single module is the right start for a small or new system, where the domain's seams aren't known yet
    and the cost of boundaries is pure overhead. A monolith with good internal boundaries is not
    under-modularized. Splitting only pays when there's a reason to, and a boundary drawn in the wrong place
    is worse than none.
