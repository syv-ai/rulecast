- id: misapplied-genericity
  name: Misapplied Genericity
  family: anti-pattern
  group: architecture
  says: Building a solution for a whole class of problems instead of the one in front of you, so it serves the
    current case badly and future ones no better. Speculative Generality is the code-scale smell; this is the
    system-scale version.
  applies_to:
    kinds: []
    languages: []
  contested: false
  agent_prone: true
  looks_like:
    - one generic entity or request type (everything is an Order, a Thing, a Request) configured per use case
      by metadata or flags
    - behaviour driven by rule tables, bit masks or configuration interpreted at runtime instead of by code
    - a generic product or rules model that still needs code and schema changes in every layer for each new
      case
    - hundreds of configuration options or toggles, many undocumented
    - an in-house framework with one real consumer
  forces:
    - stakeholders want to "solve it once and reuse it everywhere"
    - project managers see future savings on paper
    - developers enjoy the harder, more abstract problem
    - one influential person asking for the generic version is enough to start it
    - benefits of reuse are easy to overstate and the costs (testing, performance, onboarding) easy to
      understate
  overuse:
    - refusing to extract the shared part even after three near-identical concrete implementations exist
    - copy-pasting whole subsystems per customer because "generic is bad"
  remedy: Solve the specific problem first and generalise only after several concrete cases show what actually
    varies ("use before reuse"); to recover, make the solution more specific step by step, biggest pain first,
    rather than through a big rewrite.
  counter: >
    Some domains really are generic: a rules engine for an insurer with hundreds of tariff versions, a CMS, a
    spreadsheet. There the configurability is the product. The test is whether the variation is real and
    already observed, and whether configuring a new case is genuinely cheaper than coding it. Generic designs
    often don't remove change but move it across boundaries, which can multiply the work.
  in: {}
  related:
    - over-engineering
    - speculative-generality
