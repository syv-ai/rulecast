- id: over-modularization
  name: Over-Modularization
  family: anti-pattern
  group: architecture
  says: Cutting a system into more modules than it needs, at runtime (services, lambdas) or build time
    (packages, build modules), so the boundaries add more complexity than they remove. Nanoservices is the
    service-scale name.
  applies_to:
    kinds: []
    languages: []
  contested: false
  agent_prone: false
  looks_like:
    - many tiny services or functions where a small feature needs changes in several of them
    - modules that are always changed and deployed together
    - long chains of synchronous calls between services to serve one request
    - a central orchestrator service that every flow goes through and that causes most outages
    - many tiny build modules or packages with a handful of files each
  forces:
    - designing an "ideal" future structure up front, expecting better builds, testability or reuse
    - fear that splitting later will be hard
    - copying a big company's microservice architecture
    - a bad past experience with a monolith
    - not knowing the domain well enough to see where the real seams are
  overuse:
    - "Under-Modularization: merging everything back into one undifferentiated unit"
  remedy: Keep modules few and meaningful, cut along bounded contexts, apply YAGNI to splitting, and merge
    modules that are usually changed or deployed together, often into a modular monolith.
  counter: >
    Separate deployables are right when parts genuinely need to scale, release or fail independently, or when
    different teams own them. Fine-grained functions can be cheap and simple for spiky, independent workloads.
    The test is whether the boundaries match how the system actually changes. A related code-scale form,
    splitting classes until each does almost nothing, overlaps the shallow module smell.
