- id: spaghetti-code
  name: Spaghetti code
  family: anti-pattern
  group: code
  says: Control flow is so tangled, with jumps, flags and deep nesting, that you can't follow what happens
    without tracing it by hand.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - long functions with deep nesting and boolean flags set in one branch and checked in another
    - early exits, breaks and gotos mixed with flags so several paths reach the same lines
    - functions that read and write shared variables from many places
  forces:
    - Each fix adds one more condition where the bug showed up.
    - No tests, so nobody dares restructure.
  overuse:
    - Breaking a readable linear function into many tiny ones that you must jump between.
  remedy: Extract Method, Replace Nested Conditional with Guard Clauses, and replace control flags with early
    returns.
  counter: >
    A long, flat function that reads top to bottom is not spaghetti. Complexity metrics flag it too often to
    be a judgement on their own. Hot loops and state machines sometimes need explicit flow that looks dense; a
    clear comment can be enough.
  in: {}
  related:
    - long-method
    - big-ball-of-mud
    - kiss
  tell: null
  interview_only: false
  agent_prone: false
  sources:
    - cite: Brown, Malveau, McCormick, Mowbray, AntiPatterns (1998), Spaghetti Code
      url: null
      how: recalled
  example:
    before: |
      fn check_in(ticket: Ticket) -> str:
          ok = true
          msg = ""
          if ticket.event.started:
              if not ticket.late_entry:
                  ok = false
                  msg = "closed"
          if ok:
              if ticket.used:
                  ok = false
                  msg = "used"
              else:
                  if ticket.vip and not gate.vip: msg = "vip gate"; ok = false
          if ok: ticket.used = true; msg = "welcome"
          return msg
    after: |
      fn check_in(ticket: Ticket) -> str:
          if ticket.event.started and not ticket.late_entry:
              return "closed"
          if ticket.used:
              return "used"
          if ticket.vip and not gate.vip:
              return "vip gate"
          ticket.used = true
          return "welcome"
    note: Guard clauses replace the ok flag, so each rule reads as one line and returns at once.
  matters_most_for:
    - scientific
    - embedded
    - games
- id: copy-and-paste-programming
  name: Copy-and-paste programming
  family: anti-pattern
  group: code
  says: Code is reused by copying it and tweaking the copy, so the same logic lives in several places and a fix
    in one misses the others. Brown et al. call it Cut-and-Paste Programming; Duplicate Code is the smell.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - near-identical blocks in several files that differ in a name or a constant
    - bug-fix commits that touch the same lines in several places, or fix one copy and miss another
    - new code that re-implements a helper the codebase already has
  forces:
    - Copying working code is the fastest way to get the next case working.
    - Changing shared code feels riskier than writing a separate copy.
    - Not knowing the existing helper is there.
  overuse:
    - Merging code that merely looks alike but answers to different rules, producing the wrong abstraction.
  remedy: Extract Method or Extract Class for the shared knowledge, and call it from each place.
  counter: >
    Duplication is cheaper than the wrong abstraction (Sandi Metz). The rule of three (Don Roberts, via
    Fowler) says wait for a third copy before extracting. Copies that will diverge, such as tests or code in
    separate services that must deploy independently, are often better left apart.
  in: {}
  related:
    - dry
    - duplicate-code
    - shotgun-surgery
    - wrong-abstraction
    - reinventing-the-wheel
  tell: "All languages: five or more consecutive identical non-trivial lines that occur twice in one file. It
    leaves out tests (including Rust #[cfg(test)] modules and Go integration test directories), generated
    files (generated/ paths, .gen. and .generated. names, 'DO NOT EDIT' or 'auto-generated' headers) and
    migrations, and blocks that are only parameter lists, function signatures or declarative schema or config
    literals (sa.Column/Index lists, zod objects, service-definition structs)."
  interview_only: false
  agent_prone: true
  sources:
    - cite: Brown, Malveau, McCormick, Mowbray, AntiPatterns (1998), Cut-and-Paste Programming
      url: null
      how: recalled
  example:
    before: |-
      fn room_total(booking: Booking) -> Money:
          net = booking.nights * booking.rate
          vat = net * 0.25 if booking.country == "DK" else net * 0.2
          return net + vat

      fn extras_total(booking: Booking) -> Money:
          net = sum_prices(booking.extras)
          vat = net * 0.25 if booking.country == "DK" else net * 0.2
          return net + vat
    after: |-
      fn vat_rate(country: str) -> float:
          return 0.25 if country == "DK" else 0.2

      fn with_vat(net: Money, country: str) -> Money:
          return net + net * vat_rate(country)

      fn room_total(booking: Booking) -> Money:
          return with_vat(booking.nights * booking.rate, booking.country)

      fn extras_total(booking: Booking) -> Money:
          return with_vat(sum_prices(booking.extras), booking.country)
    note: The VAT rule lives once, so a rate change can't be applied to rooms and forgotten for extras.
  matters_most_for:
    - iac
    - data-pipeline
    - ml-training
    - web-frontend
- id: boat-anchor
  name: Boat anchor
  family: anti-pattern
  group: design
  says: A component, library or piece of infrastructure is kept in the system although it serves no purpose,
    usually because it was costly to get or might be useful later.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - dependencies in the manifest that nothing imports
    - clients, connections or services set up at startup and never called
    - configuration and deployment entries for a component no code uses
  forces:
    - The thing was paid for or took effort to integrate, and dropping it feels like waste (sunk cost).
    - We might need it later.
  overuse:
    - Removing an integration that is idle but required by contract, compliance or a planned migration.
  remedy: Remove it, along with its configuration and dependency entries.
  counter: >
    Something kept on purpose for a dated, near-term plan is not a boat anchor if the plan is written down.
    Some dependencies are used only at build time or through plugins and look unused to naive checks.
  in: {}
