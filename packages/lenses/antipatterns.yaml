- id: reinventing-the-wheel
  name: Reinventing the wheel
  family: anti-pattern
  group: design
  says: Writing your own version of something that a standard library, a mature package or the codebase itself
    already does well, usually with fewer edge cases handled.
  applies_to:
    kinds: []
    languages: []
  contested: true
  looks_like:
    - hand-written parsers for CSV, dates, URLs or JSON
    - home-grown retry, caching, crypto or argument parsing next to a library that does it
    - a new helper that duplicates one already in the project under another name
  forces:
    - Not knowing the library or the existing helper exists.
    - Distrust of dependencies, or a policy that makes adding them slow.
    - The problem looks simpler than it is ("it's just split on commas").
  overuse:
    - Pulling in a dependency for a few lines of code (the left-pad incident), adding supply-chain risk and
      upgrade work.
  remedy: Use the standard library, a well-maintained package or the existing project helper, and delete the
    home-grown version.
  counter: Writing it yourself can be right when the dependency is large for a small need, unmaintained, or a
    security risk, or when the domain needs behaviour the library can't give. Joel Spolsky argues you should
    own what is core to your business, and the Go community's "a little copying is better than a little
    dependency" (Rob Pike) favours a few lines of your own over a package. Learning by rebuilding is fine
    outside production. Crypto is the case where people agree you should never roll your own.
  in: {}
  related:
    - golden-hammer
    - copy-and-paste-programming
    - duplicate-code
  tell: null
  interview_only: false
  agent_prone: true
  sources:
    - cite: Brown, Malveau, McCormick, Mowbray, AntiPatterns (1998), Reinvent the Wheel
      url: null
      how: recalled
  example:
    before: |
      fn read_statement(text: str) -> list:
          rows = []
          for line in text.split("\n")[1:]:
              parts = line.split(",")
              rows.append(Transaction(date=parts[0], payee=parts[1], amount=parts[2]))
          return rows
    after: |
      fn read_statement(text: str) -> list:
          rows = []
          for record in csv.read_dicts(text):
              rows.append(Transaction(date=record["date"], payee=record["payee"],
                                      amount=record["amount"]))
          return rows
    note: The CSV library handles quoted payees with commas in them, which the hand-split version silently mangled.
  matters_most_for:
    - web-api
    - fullstack-web
    - scientific
- id: functional-decomposition
  name: Functional decomposition
  family: anti-pattern
  group: design
  says: Procedural code in object-oriented clothing, where classes are named after functions, each holds one
    routine, and the data travels between them as bare records.
  applies_to:
    kinds: []
    languages: []
  contested: true
  looks_like:
    - data classes with no behaviour while the rules about them sit in separate verb-named classes
  forces:
    - Developers trained in procedural design moving to an object-oriented language.
    - Designing by listing steps in a process instead of by the things the steps act on.
  overuse:
    - Forcing objects onto code that is naturally a pipeline of transformations, where plain functions read
      better.
  remedy: Group the routines with the data they work on into classes (Move Method, Extract Class), or drop the
    classes and use plain functions.
  counter: >
    In functional and data-oriented styles, functions over plain data are the intended design, and many argue
    it is clearer than objects. The anti-pattern is the mismatch: classes used as namespaces for single
    functions in a codebase that claims to be object-oriented. Single-method classes are also fine when they
    are Commands or Strategies that get passed around.
  in: {}
  related:
    - business-logic-in-helpers
    - poltergeist
    - god-object
    - data-class
  tell: null
  interview_only: false
  agent_prone: false
  sources:
    - cite: Brown, Malveau, McCormick, Mowbray, AntiPatterns (1998), Functional Decomposition
      url: null
      how: recalled
  example:
    before: |
      class LeaseRecord:
          monthly_rent: Money
          start: Date
          end: Date

      class CalculateLeaseTotal:
          fn run(lease: LeaseRecord) -> Money:
              return lease.monthly_rent * months_between(lease.start, lease.end)

      class ValidateLease:
          fn run(lease: LeaseRecord) -> bool:
              return lease.end > lease.start
    after: |
      class Lease:
          monthly_rent: Money
          start: Date
          end: Date

          fn total() -> Money:
              return self.monthly_rent * months_between(self.start, self.end)

          fn is_valid() -> bool:
              return self.end > self.start
    note: The routines join the data they act on, so Lease is an object with behaviour rather than a record passed
      through verb classes.
  matters_most_for: []
- id: wrong-abstraction
  name: Wrong abstraction (premature abstraction)
  family: anti-pattern
  group: design
  says: Code that looked alike was merged into one shared abstraction too early, and as the cases diverge it
    grows parameters and branches until it is harder to change than the duplication was. Sandi Metz's term;
    Speculative Generality is the related smell.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - 'Replace the line with: "a shared function whose body is mostly conditionals on which caller it is
      serving". Also replace the force with "A new requirement that almost fits the existing shared code, so
      adding a parameter looks cheaper than writing a new path", and change the name to "Wrong abstraction".'
  forces:
    - DRY read as "never write similar code twice".
    - A request for clean, general or future-proof code with no concrete second case.
    - The sunk cost of an existing abstraction makes adding a parameter feel cheaper than undoing it.
  overuse:
    - Refusing any abstraction and copying everything, so real shared rules drift apart.
  remedy: Inline the abstraction back into each caller, delete what each one doesn't use, then extract again
    only what is truly shared.
  counter: >
    Waiting too long has costs too: copies of a real business rule drift and cause bugs. When the duplicated
    code encodes one piece of knowledge, DRY is right even at two copies. The disagreement between DRY
    advocates and the rule-of-three and AHA ("avoid hasty abstractions", Kent C. Dodds) camp is real.
  in: {}
  related:
    - dry
    - yagni
    - speculative-generality
    - copy-and-paste-programming
    - dogma-over-pragma
    - poltergeist
  tell: null
  interview_only: false
  agent_prone: true
  sources:
    - cite: Metz, The Wrong Abstraction (2016)
      url: https://sandimetz.com/blog/2016/1/20/the-wrong-abstraction
      how: recalled
  example:
    before: |
      fn send_notice(user: User, kind: str, include_invoice: bool,
                     skip_footer: bool, is_reminder: bool):
          body = template(kind).render(user)
          if include_invoice: body = body + invoice_block(user)
          if is_reminder: body = "Reminder: " + body
          if not skip_footer: body = body + footer()
          mail.send(user.email, body)

      send_notice(user, "welcome", false, false, false)
      send_notice(user, "overdue", true, true, true)
    after: |
      fn send_welcome(user: User):
          mail.send(user.email, template("welcome").render(user) + footer())

      fn send_overdue_reminder(user: User):
          body = "Reminder: " + template("overdue").render(user)
          mail.send(user.email, body + invoice_block(user))
    note: Inlining the flag-driven function gives each notice a plain body of its own; nothing truly shared was
      lost.
  matters_most_for:
    - web-frontend
    - library-sdk
    - iac
- id: global-state
  name: Global state
  family: anti-pattern
  group: design
  says: Mutable data reachable from anywhere, as global variables, module-level state or singletons, so any code
    can change it and no caller's behaviour depends only on what it was given.
  applies_to:
    kinds: []
    languages: []
  contested: false
  looks_like:
    - module-level variables reassigned inside functions
    - singletons holding config, connections, caches or the current user
    - tests that must reset shared state between runs, or that fail when run in a different order or in
      parallel
    - functions whose result changes without any change to their arguments
  forces:
    - Passing a value through many layers is tedious, and a global is one line.
    - Singleton reads as a respectable pattern, and config or connections feel naturally "one per app".
    - Frameworks that expose a global request or app object.
  overuse:
    - Threading every constant and logger through every function signature, which bloats parameter lists for
      values that never change.
  remedy: Construct the value once at startup and pass it in (dependency injection); keep truly global values
    immutable.
  counter: >
    Immutable constants and read-only configuration loaded once at startup are harmless. Loggers and metrics
    are commonly global by convention and rarely cause trouble. Small scripts don't need injection. The cost
    is in mutable shared state, which hurts testability and concurrency.
  in:
    python: >
      A module is already a singleton; module-level mutable variables and the global keyword are the usual
      form.
    go: >
      Package-level vars set in init() are the common form; passing dependencies in struct fields is the idiom.
  related:
    - singleton
    - law-of-demeter
  tell: "TypeScript and JavaScript application code only, not scripts/ or *.config.* files: a function that
    reassigns a module-level let, or writes to a module-level object, array, Map or Set by property, index or
    a mutating method (set, push, add, delete). It has no Python or Go form."
  interview_only: false
  agent_prone: true
  sources:
    - cite: Wulf and Shaw, Global Variable Considered Harmful (1973)
      url: null
      how: recalled
  example:
    before: |
      current_tenant = None

      fn handle_request(req: Request):
          global current_tenant
          current_tenant = lookup_tenant(req.host)
          return list_projects()

      fn list_projects() -> list:
          return db.query("projects", tenant=current_tenant.id)
    after: |
      fn handle_request(req: Request):
          tenant = lookup_tenant(req.host)
          return list_projects(tenant)

      fn list_projects(tenant: Tenant) -> list:
          return db.query("projects", tenant=tenant.id)
    note: The tenant is passed in, so two concurrent requests can't see each other's tenant and the function can
      be tested alone.
  matters_most_for:
    - web-api
    - serverless
    - web-frontend
    - ml-training
    - games
    - embedded
    - tui
    - plugin-host
- id: domain-allergy
  name: Domain Allergy
  family: anti-pattern
  group: architecture
  says: Architects and developers treat the business domain as someone else's dull problem and focus on
    technology, so the system models storage formats or generic "things" instead of the real concepts.
  applies_to:
    kinds: []
    languages: []
  contested: false
  agent_prone: false
  looks_like:
    - one or two very wide tables or classes holding every kind of entity, with business logic switching on
      combinations of code values
    - classes named Thing, Item, Entity or Record carrying an attribute bag instead of named domain types
    - an internal model that mirrors an external import format field for field
    - code and docs that use technical names where the business has its own words for the concepts
    - new developers needing months to become productive because the rules live in people's heads
  forces:
    - technically interesting work is more rewarding than learning insurance law or freight tariffs
    - the domain seems boring or someone else's job, so nobody builds a shared vocabulary
    - an external feed or file format is right there, so it becomes the model
    - the people who carry the domain knowledge tacitly become indispensable and have little reason to write
      it down
  overuse:
    - modelling every distinction the business mentions as its own class hierarchy before any behaviour needs
      it
    - a ubiquitous-language exercise that stalls delivery while the team argues about names
  remedy: Learn the domain and its language (DDD's Ubiquitous Language); introduce explicit domain types behind
    an Anti-Corruption Layer and strangle the generic model gradually.
  counter: >
    A thin CRUD or reporting app whose domain really is just the data doesn't need rich modelling, and keeping
    the import format at the edge is fine as long as it is translated into domain types once, in one place.
    The fix is mostly a change of mindset; the code fallout it leaves behind (generic models, overbuilt
    infrastructure) usually needs significant refactoring, so it's cheaper caught early.
  in: {}
  related:
    - misapplied-genericity
    - over-engineering
    - under-modularization
    - primitive-obsession
  tell: null
  interview_only: false
  example:
    before: |
      fn monthly_cost(row: map) -> money:
          # row comes straight from the listings feed
          if row["type_cd"] == "R" and row["flag_2"] == "1":
              return row["amt_1"] + row["amt_3"]
          if row["type_cd"] == "R":
              return row["amt_1"]
          if row["type_cd"] == "S":
              return mortgage_estimate(row["amt_1"]) + row["amt_4"]
          ...
    after: |
      class Rental:
          rent: money
          furnished_surcharge: money

      class SaleListing:
          asking_price: money
          service_charge: money

      fn from_feed_row(row: map) -> Rental | SaleListing:
          ...   # the only place that knows type_cd, flag_2, amt_1

      fn monthly_cost(listing: Rental) -> money:
          return listing.rent + listing.furnished_surcharge
    note: The feed's codes are translated once at the boundary, so the rest of the code talks about rentals and
      sale listings instead of type_cd and amt_3.
  sources:
    - cite: INNOQ, Architecture Antipatterns, Domain Allergy
      url: https://architecture-antipatterns.tech/patterns/domain_allergy.html
      how: read
    - cite: "INNOQ, Architecture Antipatterns, case study: Flattening the Hierarchy"
      url: https://architecture-antipatterns.tech/case_studies/two_huge_domain_classes_represent_all_legal_forms_for_companies_unions_and_foundations.html
      how: read
  matters_most_for:
    - fullstack-web
    - web-api
    - platforms
- id: infrastructure-ignorance
  name: Infrastructure Ignorance
  family: anti-pattern
  group: architecture
  says: Designing and building without regard for the environment the system will actually run in (hardware,
    network, power, security, legal constraints), so it fails requirements in ways that are hard to fix later.
  applies_to:
    kinds: []
    languages: []
  contested: false
  agent_prone: false
  looks_like:
    - no deployment config, target-hardware test or load test until late in the project
    - chatty service-to-service calls designed as if the network were free and reliable
    - personal data written to append-only stores (event logs, streams) with no deletion path
    - a whole platform stack (service mesh, sidecars, encryption everywhere) adopted wholesale without
      measuring what it costs in latency
  forces:
    - attention goes to business logic, and the target environment feels like ops' problem
    - trust that the cloud or a platform standard takes care of it
    - pressure to launch now and fix the rest later
    - the real environment isn't available to developers, so the laptop becomes the reference
  overuse:
    - designing for exotic failure modes and scale the system will never see
    - blocking all development until a production-identical environment exists
  remedy: Set quality goals and concrete quality scenarios early, build a walking skeleton deployed to the real
    target, and test load, failure and compliance (deletion, residency) from the start.
  counter: >
    A throwaway prototype or an internal tool on a well-understood standard platform can reasonably ignore
    most of this. The point is not to front-load every infrastructure decision but to find out early which
    constraints are hard. INNOQ's page is marked as still in progress and has no case study yet; the fallacies
    of distributed computing cover much of the network side.
  in: {}
  related:
    - fallacies-of-distributed-computing
    - distributed-monolith
    - over-modularization
  tell: null
