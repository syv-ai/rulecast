    - prototype
    - data-clumps
    - spaghetti-code
    - dry
    - pareto-principle
    - memento
    - exceptions-for-control-flow
    - resource-leak
  probes:
    - find: "Frame-time and memory budgets or checks in the code or CI, and platform-specific branches. For features
        merged in the last year or so: later commits that reference the same issue or pull request, or touch
        the same files within a few weeks with a fix-style message. Sort them by cause: performance, memory on
        the weakest platform, certification."
      ask: >
        "Features mostly came back for <cause> (<examples>), and <no / a> budget check runs. I'd require
        <budget X> from a feature's first commit because <reason>. Is that what holds features at almost
        done?"
      settled_when: |
        Budgets are already checked in CI. The agent confirms it.
      grounded_in:
        - Ninety-ninety rule
    - find: |
        Which systems have automated tests and which don't, and what recent fixes touched.
      ask: >
        "<systems> are tested and <systems> aren't; recent fixes were mostly in <x>. Should <x> stay
        play-tested only? I'd add tests for <deterministic logic in x> because <reason>."
      settled_when: |
        Coverage already matches where fixes land. The agent confirms it.
      grounded_in:
        - Developers Not Writing Tests
    - find: >
        Code written for speed (manual pooling, unsafe code, SIMD, cache-layout tricks, hand-unrolled loops),
        and for each, whether a comment, commit or benchmark points to a measurement.
      ask: >
        "<N> optimisations cite a profile or benchmark; <M> don't (<files>). I'd require a measurement for new
        ones and <leave / simplify> the unmeasured ones, because <reason>."
      settled_when: |
        Every optimisation already links a measurement. The agent confirms it.
      grounded_in:
        - Premature optimization
        - Gilb's law
    - find: >
        The project's age and history, release and build pipelines, platform targets, and store or
        certification config.
      ask: >
        "This has <no release pipeline and N months of history / a store build and platform targets>. Is it a
        prototype that may be thrown away, or something you'll maintain for years? I'd <recommend> because
        <reason>."
      settled_when: |
        The signals are unambiguous (shipping builds on several platforms). The agent confirms it.
      grounded_in:
        - YAGNI
        - Gall's law
plugins-extensions:
  hinge: Living inside someone else's process and API, using only the public surface, cleaning up after itself,
    and never taking the host down when something fails.
  lenses:
    - init-time-side-effects
    - fail-open-vs-fail-closed
    - swallowed-errors
    - error-handling-policy
    - resource-leak
    - global-state
    - adapter
    - tolerant-reader
    - hyrums-law
    - breaking-change-surface
    - contract-test
    - liskov-substitution-principle
    - least-privilege
    - secure-by-default
    - validate-at-the-boundary
    - principle-of-least-astonishment
    - zawinskis-law
    - yagni
    - speculative-generality
    - dead-code
    - incomplete-library-class
    - inappropriate-intimacy
    - long-method
    - hard-to-test-code
    - functional-core-imperative-shell
  probes:
    - find: >
        Every host API the plugin uses, checked against the host's public docs or types: private symbols,
        internal imports, patched host objects, reliance on undocumented timing or order.
      ask: >
        "<N> calls reach into <internal host APIs> (<files>). I'd <wrap them in one module / replace them with
        <public API>> because <the host can change them without warning>. Are any unavoidable?"
      settled_when: |
        The plugin uses only the public API. The agent confirms it.
      grounded_in:
        - Hyrum's law
    - find: Helpers that do what the host's API already offers, with the host API that covers each. For each, the
        minimum host version the plugin supports (manifest, CI) against the host version that introduced that
        API (host changelog or docs), and any comment or commit saying why the helper exists.
      ask: >
        "<helpers> do what <host API> already does. I'd switch to the host's version because <reason>. Is
        there a reason I'm missing, such as supporting older host versions?"
      settled_when: |
        No overlap found. The agent says so.
      grounded_in:
        - Not Invented Here
    - find: |
        What tests run against (a real host, a fake host, nothing) and which style recent tests use.
      ask: >
        "Tests run against <real host / fake / nothing>. I'd have new code follow <approach> because <reason>.
        Agree?"
      settled_when: Tests exist and all run one way (a real host or a fake), recent tests included. The agent
        confirms it. No tests at all is always raised.
      grounded_in:
        - Developers Not Writing Tests
    - find: >
        The host versions pinned in the manifest and CI, whether CI tests against the latest host, and fix
        commits that followed a host release.
      ask: >
        "CI tests against <host version X only>, and <fix commits> followed host releases. I'd add a run
        against the latest host because <reason>. Should that be required?"
      settled_when: |
        CI already tests the minimum supported and latest host. The agent confirms it.
      grounded_in:
        - Hyrum's law
        - Production Bugs
plugin-host:
  hinge: The extension contract, treated as a public API, and how much a plugin may do, see and break when it
    misbehaves.
  lenses:
    - microkernel
    - breaking-change-surface
    - versioned-plugin-protocol
    - hyrums-law
    - contract-test
    - semantic-versioning-discipline
    - deprecation-policy
    - non-exhaustive-types
    - liskov-substitution-principle
    - interface-bloat
    - least-privilege
    - secure-by-default
    - fail-open-vs-fail-closed
    - validate-at-the-boundary
    - parse-dont-validate
    - insecure-deserialization
    - error-handling-policy
    - swallowed-errors
    - init-time-side-effects
    - global-state
    - principle-of-least-astonishment
    - law-of-leaky-abstractions
    - inner-platform-effect
    - inappropriate-intimacy
    - resource-leak
  probes:
    - find: >
        The documented plugin contract compared with what plugins in reach (bundled, examples, tests) actually
        use: internal objects, undocumented hooks, call order. Issues from plugin authors about breakage.
      ask: >
        "Plugins in this repo rely on <undocumented behaviour> (<files>). I'd <document it / give them a
        public alternative> because <reason>. What else do outside authors rely on?"
      settled_when: |
        Never fully: outside plugins can't be seen from here.
      grounded_in:
        - Hyrum's law
    - find: >
        CODEOWNERS on the contract files, an RFC or proposal process, changelog entries for contract changes,
        and whether issues from plugin authors preceded those changes.
      ask: >
        "Contract changes are made by <people>, and <no / a> process asks plugin authors first. Who decides,
        and should authors be heard before a change ships? I'd <recommend> because <reason>."
      settled_when: |
        A documented process exists and the history follows it. The agent confirms it.
      grounded_in:
        - Conway's law
    - find: >
        Compatibility shims, deprecated contract parts still supported, workarounds around the plugin system,
        and TODOs about redesigning it.
      ask: >
        "<parts> carry <shims / workarounds> (<files>). Would you design them differently now, and what keeps
        them? I'd <recommend> because <reason>."
      settled_when: |
        Never by code alone: why the parts stay is the developer's call.
      grounded_in:
        - Emotional Attachment
        - Sunk cost fallacy
    - find: >
        Whether the plugin contract is defined in one place (a types file, a schema) and whether CI compares
        it across releases.
      ask: >
        "The contract <is in <file> / is spread across <files>>. I'd <keep it in one file and check it across
        releases> because <reason>."
      settled_when: |
        It's already in one place with a check in CI. The agent confirms it.
      grounded_in:
        - Breaking-Change Surface
        - Hyrum's law
compilers-tooling:
  hinge: How the tree and its passes are represented, how diagnostics and error recovery work, and
    output-pinning tests that catch regressions without freezing incidental detail.
  lenses:
    - make-illegal-states-unrepresentable
    - golden-master-test
    - property-based-test
    - visitor
    - switch-statements
    - composite
    - pipes-and-filters
    - long-method
    - error-handling-policy
    - postels-law
    - parse-dont-validate
    - fragile-test
    - pesticide-paradox
    - premature-optimization
    - flyweight
    - immutability-by-default
    - builder
    - parallel-inheritance-hierarchies
    - breaking-change-surface
    - hyrums-law
    - principle-of-least-astonishment
    - functional-core-imperative-shell
    - global-state
    - swallowed-errors
  probes:
    - find: >
        Authors per area (type checker, code generation, parser error recovery, the optimiser) over the whole
        history and the last year, and what is written down about each: design docs, module-level comments,
        references to the papers or algorithms they implement.
      ask: >
        "Only <person> has changed <area> in <period>, and what's written down is <a few comments / nothing>.
        If they were away, could anyone change it safely? I'd write down <the invariants of X> first, because
        <reason>."
      settled_when: >
        Several people change each area and design docs exist. On a solo project the ask shrinks to what
        should be written down.
      grounded_in:
        - Bus factor
    - find: >
        Reviews on changes to those areas: who reviewed, how long the review took relative to the diff, and
        whether review comments discuss the algorithm, its invariants and its test cases or only naming and
        style.
      ask: >
        "Changes to <area> were reviewed by <people>, and the comments are mostly about <style / the
        algorithm>. I'd require <a test case for each new rule / a second reviewer who knows the area> because
        <reason>. Does that fit how you work?"
      settled_when: |
        Reviews already engage with the algorithm. For a solo maintainer the agent notes it and moves on.
      grounded_in:
        - Linus's law
    - find: >
        Fix commits and linked issues, and whether the snapshot tests covering that code existed before the
        fix. Commits that updated snapshots alongside a code change without saying why, and commits that
        re-accepted many snapshots at once.
      ask: >
        "<N> fixes were for bugs the snapshots should have shown, and <commits> re-accepted <k> snapshots in
        bulk. Has a snapshot ever been accepted while wrong? I'd require a stated reason for every snapshot
        change in a commit, because a bulk-accepted snapshot checks nothing."
      settled_when: >
        Never fully: the history shows fixes, not which ones reached users or which snapshots were wrong when
        accepted.
      grounded_in:
        - Production Bugs
        - Buggy Tests
    - find: >
        Fuzz targets, property tests, input generators, reducers and corpus directories, and whether CI runs
        them.
      ask: >
        "Tests cover only hand-written programs; nothing generates inputs. I'd add <a fuzz target for the
        parser / a property test for X> because hand-written cases stop finding new bugs after a while.
        Agree?"
      settled_when: |
        Fuzzing or generated inputs already run in CI. The agent confirms it.
      grounded_in:
        - Pesticide paradox
        - Property-Based Test
databases-storage:
  hinge: What the code guarantees about durability and consistency when a write fails halfway, and how far the
    storage engine's behaviour is allowed to leak into callers.
  lenses:
    - resource-leak
    - cap-theorem
    - murphys-law
    - property-based-test
    - injection
    - law-of-leaky-abstractions
    - variant-drift
    - n-plus-one-queries
    - unit-of-work
    - data-mapper
