      ask: >
        "<modules> haven't changed since <date>, and <some> carry <certification markers>. Certified, proven,
        or feared? I'd exempt <certified ones> from new conventions and <require characterisation tests> for
        the rest, because <reason>."
      settled_when: Certification records list exactly which modules are frozen, and no other module is long
        untouched. The agent cites them. Untouched modules without certification are never settled by code
        alone.
      grounded_in:
        - Never Change a Running System
    - find: |
        Authors of drivers, interrupt handlers and the linker script, and what is written down about them.
      ask: >
        "Only <person> has changed <drivers / interrupt handlers / linker script>, and <little / nothing> is
        written down. Could anyone else change them safely? I'd write <X> down first because <reason>."
      settled_when: >
        Several people change these parts and docs exist. For a solo developer the ask is only what to write
        down.
      grounded_in:
        - Bus factor
    - find: >
        Watchdog configuration, fault and assert handlers, safe-state code, and how each module handles errors
        (reset, safe state, carry on degraded).
      ask: >
        "<modules> <reset / enter a safe state / carry on> on failure (<files>). What must happen when it
        fails on the device? I'd make <behaviour> the system-wide rule, with <exceptions>, because <reason>."
      settled_when: |
        One system-wide policy is implemented and documented. The agent confirms it.
      grounded_in:
        - Murphy's law
        - Inversion
games:
  hinge: How game state is owned and shared between systems, and which hot paths are allowed to trade clarity
    for speed.
  lenses:
    - god-object
    - global-state
    - premature-optimization
    - state
    - composition-over-inheritance
    - observer
    - command
    - functional-core-imperative-shell
    - magic-number
