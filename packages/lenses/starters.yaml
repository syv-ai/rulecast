    - bridge
    - make-illegal-states-unrepresentable
    - validate-at-the-boundary
    - swallowed-errors
    - frequent-debugging
    - secure-by-default
    - long-method
    - dependency-injection
    - flyweight
  probes:
    - find: >
        Fix commits sorted by where the bug showed (on hardware, in the field, off target), what off-target
        tests cover (logic versus drivers), and whether a hardware-in-the-loop setup exists.
      ask: "\"<k> of the last <N> fixes only showed on hardware (<examples>), in code off-target tests don't reach
        because <it calls registers directly / it is timing-dependent>. I'd <move logic out of X behind an
        interface> so it can be tested off target, because <reason>. Were there field bugs that don't show in
