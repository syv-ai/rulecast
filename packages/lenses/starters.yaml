    - erratic-test
    - pesticide-paradox
    - fake-over-mock
    - slow-tests
    - event-sourcing
    - identity-map
    - least-privilege
    - primitive-obsession
  probes:
    - find: >
        Engine parts with no changes for a long time, who wrote them, how much other code depends on them, and
        comments that warn people off. Whether those parts have tests that pin their behaviour.
      ask: >
        "<parts> haven't changed since <date>, only <person> has ever changed them, and <they have / lack>
        tests that pin their behaviour. Is that confidence or fear? I'd <require characterisation tests before
        any change> because <reason>."
      settled_when: |
        Never by code alone: the repo shows which parts are untouched, not why.
      grounded_in:
        - Never Change a Running System
    - find: >
        How writes reach disk (fsync and its error handling, write ordering, checksums), what tests exist for
        failure (crash injection, fault injection, a model check, randomised testing against a reference), and
        fix commits about durability or corruption.
      ask: >
        "<fix commits> were about <torn writes / lost fsync errors>, and no test <injects crashes / faults>.
        Which durability or corruption bugs reached users? I'd add <crash injection for X> because <reason>."
      settled_when: >
        Never fully: which bugs reached users isn't in the repo, though the testing gaps the agent found
        always are.
      grounded_in:
        - Production Bugs
        - Murphy's law
    - find: "Authors of the recovery and on-disk format code over the whole history and the last year. For changes
        to it: who reviewed, whether anyone other than the author did, and whether review comments discuss
        invariants, crash cases and tests or only naming and style. What is written down about its
        invariants."
      ask: >
        "Only <person> changes and reviews <recovery / format code>. Who else could review a change to it? I'd
        <write down its invariants / pair a second reviewer> because <reason>."
      settled_when: >
        Several reviewers already engage with those changes. For a solo maintainer the ask is only what to
        write down.
      grounded_in:
        - Bus factor
        - Linus's law
    - find: >
        On-disk and wire format version constants, upgrade and downgrade code, compatibility tests, fixtures
        written by older versions, and what the docs promise.
      ask: >
        "Formats carry <version>, and fixtures cover <versions>. Which formats must older versions still read,
        and must newer versions still write for old readers? I'd <promise X and test it with fixtures> because
        <reason>."
      settled_when: |
        The promise is documented and fixtures cover it. The agent cites it and asks only whether it holds.
      grounded_in:
        - Breaking-Change Surface
        - Postel's Law
scientific:
  hinge: Whether results can be trusted and reproduced, which decides how constants, units, inputs and tests of
    the numerics are handled.
  lenses:
    - long-method
    - magic-number
    - global-state
    - assertion-free-test
    - long-parameter-list
    - data-clumps
    - value-object
    - primitive-obsession
    - duplicate-code
    - lava-flow
    - property-based-test
    - golden-master-test
    - validate-at-the-boundary
    - reinventing-the-wheel
    - premature-optimization
    - amdahls-law
    - gustafsons-law
    - spaghetti-code
    - strategy
    - immutability-by-default
    - functional-core-imperative-shell
    - fail-fast
    - swallowed-errors
  probes:
    - find: >
        Tests against known analytic cases, comparisons with another implementation or published values,
        convergence checks, seed handling, and scripts or notes that validate results.
      ask: >
        "Results are checked against <X / nothing I could find>. When a result looks right, what do you check
        before you believe it? I'd add <an analytic case for Y> because <a plausible-looking result is the
        easiest one to trust wrongly>."
      settled_when: |
        A validation suite against known cases runs regularly. The agent confirms it.
      grounded_in:
        - Confirmation bias
    - find: |
        Which numerical routines have tests, and which are only exercised by scripts that produce plots.
      ask: >
        "<routines> have tests; <routines> are only checked by plots. I'd test <the riskiest one> first,
        against <a known case>, because <reason>. Agree?"
      settled_when: |
        All numerical code is tested. The agent confirms it and asks only about new code.
      grounded_in:
        - Developers Not Writing Tests
    - find: >
        An analysis of whether someone else could rerun the analysis from scratch: environment pinning
        (lockfile, container), where input data comes from and whether it's versioned, one entry point (a
        Makefile or workflow file), seeds, hard-coded paths, and manual steps in the README.
      ask: >
        "Rerunning from scratch would need <missing pieces: an unpinned environment, data at a local path, a
        manual step>. I'd fix <X> first because <reason>. Anything else only you know?"
      settled_when: |
        A pinned environment and one command reproduce the results. The agent confirms it.
      grounded_in:
        - Bus factor
    - find: >
        Routines written by hand that a standard library provides (linear algebra, integrators, statistics),
        with any comment or commit saying why.
      ask: >
        "<routines> do what <library> does. I'd switch because <reason>. Is there a reason to keep them, such
        as matching a published method exactly?"
      settled_when: |
        A reason is recorded that still holds. The agent cites it.
      grounded_in:
        - Not Invented Here
    - find: >
        Signals of how long the code is meant to live: packaging, version tags, tests, a citation file, other
        projects that depend on it, and how the history clusters around deadlines.
      ask: >
        "This has <signals>. Is it code for one paper, or meant to be maintained and reused? I'd <recommend a
        light or a full set of conventions> because <reason>."
      settled_when: |
        The signals are unambiguous (a released package with dependents). The agent confirms it.
      grounded_in:
        - YAGNI
platforms:
  hinge: How tenants are kept apart and given only what they need, and what the platform promises the teams and
    customers building on its contracts, since every observable behaviour ends up depended on.
  lenses:
    - broken-object-level-authorization
    - tenant-isolation
    - least-privilege
    - breaking-change-surface
    - hyrums-law
    - defense-in-depth
    - validate-at-the-boundary
    - injection
    - shared-database
    - missing-rate-limiting
    - inconsistent-error-contract
    - deprecation-policy
    - contract-test
    - secure-by-default
    - ssrf
    - error-handling-policy
    - mass-assignment
    - parse-dont-validate
    - trusting-client-input
    - sensitive-data-in-logs
    - hard-coded-secrets
    - tolerant-reader
    - inner-platform-effect
    - swallowed-errors
    - fat-controller
  probes:
    - find: >
        The platform's module and service boundaries, CODEOWNERS, which teams edit what, and which consuming
        teams' requests (issues, commits referencing them) touched which modules.
      ask: >
        "Boundaries follow <platform teams' split>, and requests from <consumer> touched <several modules>.
        Should the boundaries follow the platform's teams or what the teams building on it need? I'd
        <recommend> because <reason>."
      settled_when: >
        CODEOWNERS matches the boundaries and consumer requests land in one module each. The agent confirms it.
      grounded_in:
        - Conway's law
    - find: >
        Commits or pull requests for customer-facing features that spanned several platform teams' code, and
        how long those took compared with single-team ones.
      ask: >
        "<N> features needed changes from <teams> (<examples>), and took <longer>. I'd <recommend> because
        <reason>. Is that coordination something you want conventions to reduce?"
      settled_when: |
        Features rarely span teams. The agent confirms it.
      grounded_in:
        - Horizontalism
    - find: >
        Platform components (orchestrators, meshes, gateways, queues), when each came in, and decision records
        or commits that give a reason.
      ask: >
        "<component> came in with <commit> (<reason / none given>). Would you pick it again today? I'd
        <recommend> because <reason>."
      settled_when: |
        Decision records give reasons that still hold. The agent cites them.
      grounded_in:
        - Blind Pattern Following
        - Emotional Attachment
    - find: >
        How tenants are kept apart in code (tenant filters on queries, row-level security, per-tenant keys),
        queries or endpoints without the tenant filter, tests that try cross-tenant access, contract tests for
        what consumers rely on, and fix commits mentioning tenants or contract changes.
      ask: >
        "<queries> don't filter by tenant (<files>), and no test tries cross-tenant access. Which recent
        incidents came from a leak or a contract change? I'd add <a cross-tenant test / a contract check>
        because <reason>."
      settled_when: |
        Never fully: incidents aren't in the repo, though missing tenant filters are always raised.
      grounded_in:
        - Production Bugs
        - Tenant isolation
