# The 30 agent-prone tells, run as rulecast rules over a 12-repository corpus. Per rule: hits, hits per repository,
# sampled hits and how many were real; verdict keep (>=70% real), rewrite, or null. `run`: 2026-10-13 is the first run (regex
# and ast-grep only); the 18 tells kept or rewritten then were re-measured on 2026-10-14 with detectors chosen in the order
# linter, command, ast-grep, regex (`detectors` says which and why). The rules are in tell-rules/<lens-id>.yaml; the
# rules behind the 12 null verdicts were removed, and their numbers here are the record. Seed for the catalog-rules plan.
