    lens/sensitive-data-in-logs-cs: "regex fallback: no .NET analyzer installed"
    lens/sensitive-data-in-logs-go: "regex fallback: golangci-lint not installed"
    lens/sensitive-data-in-logs-rs: "regex fallback: clippy has no such lint"
  hits:
    lens/sensitive-data-in-logs-py: 0
    lens/sensitive-data-in-logs-ts: 0
    lens/sensitive-data-in-logs-java: 0
    lens/sensitive-data-in-logs-cs: 3
