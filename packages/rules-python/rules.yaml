# Published with the "python/" id prefix. "@" paths in context are relative to this directory.
- id: no-silent-except
  name: No silently swallowed exceptions
  description: "Flags try-except-pass (ruff S110): a broad except whose only statement is pass hides the failure."
  files: '\.py$'
  severity: error
  detect:
    linter: { tool: ruff, rules: [S110] }
  message: "{{file}}:{{line}} swallows an exception with pass. Handle it, log it, or let it propagate."
  context:
    - "@errors.md#swallowed-exceptions"
  examples:
    good:
      - path: app/users.py
        code: |
          def get():
              try:
                  fetch()
              except Exception:
                  log.exception("fetch failed")
      # A typed except is left to the project: S110 flags one only with check-typed-exception.
      - path: app/users.py
        code: |
          def get():
              try:
                  fetch()
              except KeyError:
                  pass
    bad:
      - path: app/users.py
        code: |
          def get():
              try:
                  fetch()
              except Exception:
                  pass
