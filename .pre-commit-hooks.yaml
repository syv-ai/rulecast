# The stage names pre-commit/pre-push need pre-commit ≥ 3.2.0; consumers' configs should set
# minimum_pre_commit_version: "3.2.0", and the README snippet does.
#
# language: system, running the rulecast the agent hooks run: the project's own
# node_modules/.bin/rulecast, else the standalone binary installed in the cache home
# (rulecast binary install), else one on the PATH. The entries are gitHookCommand() in
# packages/rulecast/src/core/binary-home.ts, and a test holds them to it.
- id: rulecast
  name: rulecast
  description: Check staged files against the project's rulecast rules.
  entry: sh -c 'H=${RULECAST_HOME:-${XDG_CACHE_HOME:+$XDG_CACHE_HOME/rulecast}}; H=${H:-${HOME:+$HOME/.cache/rulecast}}; [ -x ./node_modules/.bin/rulecast ] && exec ./node_modules/.bin/rulecast run; if [ -n "$H" ] && [ -x "$H/bin/rulecast" ]; then "$H/bin/rulecast" run; S=$?; [ "$S" -lt 126 ] && exit "$S"; fi; exec rulecast run' --
  language: system
  pass_filenames: false
  always_run: true
  stages: [pre-commit]
- id: rulecast-push
  name: rulecast (pushed commits)
  description: Check the commits being pushed.
  # pre-commit sets PRE_COMMIT_FROM_REF/PRE_COMMIT_TO_REF for pre-push, including a usable
  # from-ref on a branch's first push, which @{upstream} does not have.
  entry: sh -c 'H=${RULECAST_HOME:-${XDG_CACHE_HOME:+$XDG_CACHE_HOME/rulecast}}; H=${H:-${HOME:+$HOME/.cache/rulecast}}; [ -x ./node_modules/.bin/rulecast ] && exec ./node_modules/.bin/rulecast run --from-ref "$PRE_COMMIT_FROM_REF" --to-ref "$PRE_COMMIT_TO_REF"; if [ -n "$H" ] && [ -x "$H/bin/rulecast" ]; then "$H/bin/rulecast" run --from-ref "$PRE_COMMIT_FROM_REF" --to-ref "$PRE_COMMIT_TO_REF"; S=$?; [ "$S" -lt 126 ] && exit "$S"; fi; exec rulecast run --from-ref "$PRE_COMMIT_FROM_REF" --to-ref "$PRE_COMMIT_TO_REF"' --
  language: system
  pass_filenames: false
  always_run: true
  stages: [pre-push]
