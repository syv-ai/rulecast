# Generated by `pnpm manifest` from packages/rules-*/rules.yaml. Do not edit by hand.

- id: generated-code
  name: Generated code is never edited by hand
  description: Flags edits to generated files. Override files to match your generator's output directory.
  files: \.gen\.[cm]?[jt]sx?$|(^|/)__generated__/
  severity: error
  detect:
    path: {}
  message: "{{file}} is generated. Change its source and regenerate it; never edit it by hand."
  context:
    - "@packages/rules-general/generated-code.md"
  examples:
    bad:
      - path: frontend/src/client/sdk.gen.ts
        code: |
          export const listUsers = () => request("/users")
      - path: src/__generated__/schema.ts
        code: |
          export type Query = { users: User[] }
- id: loop-safety/no-skipped-tests-python
  name: No new skipped or expected-to-fail Python tests
  description: "For agents that run unattended: flags a new pytest skip or xfail, or a unittest skip, in a test file. Skipping a red test is the cheapest way for a loop to make pytest pass."
  files: (^|/)(test[^/]*|[^/]*_test|conftest)\.py$|(^|/)tests?/.*\.py$
  severity: warning
  escalate: true
  detect:
    ast-grep:
      language: python
      rule:
        any:
          - pattern: $MARK.$KIND
          - pattern: $SELF.skipTest($$$)
      constraints:
        MARK:
          regex: ^(pytest\.)?mark$|^(unittest|pytest)$
        KIND:
          regex: ^(skip|skipif|xfail|skipIf|skipUnless|expectedFailure|SkipTest)$
  message: "{{file}}:{{line}} skips a test ({{text}}). Make the test pass by fixing the code. If you believe the test is wrong, leave it running and report which test and why."
  context:
    - "@packages/rules-loop-safety/loop-safety.md#skipped-and-focused-tests"
    - "@packages/rules-loop-safety/loop-safety.md#when-a-test-is-wrong"
  examples:
    good:
      - path: tests/test_pricing.py
        code: |
          @pytest.mark.parametrize("percent", [10, 25])
          def test_discount(percent):
              assert discount(100, percent) == 100 - percent
      - path: tests/conftest.py
        code: |
          SKIP_SLOW = os.environ.get("SKIP_SLOW") == "1"
          pytest_plugins = ["fixtures.db"]
    bad:
      - path: tests/test_pricing.py
        code: |
          @pytest.mark.skip(reason="flaky")
          def test_total():
              assert total([1, 2]) == 3
      - path: app/rates_test.py
        code: |
          def test_rates_fresh():
              pytest.xfail("no rates service in CI")
              assert rates.age() < 3600
      - path: shop/tests.py
        code: |
          class CartTests(TestCase):
              @unittest.skip("flaky")
              def test_total(self):
                  self.assertEqual(total([1, 2]), 3)
- id: loop-safety/no-skipped-tests-ts
  name: No new skipped or focused TypeScript tests
  description: "For agents that run unattended: flags a new .skip, .only, .todo, .failing, xit, fit or this.skip() in a .ts test file. Skipping a red test, or focusing on the green ones, makes a test run pass without fixing anything."
  files: \.(test|spec|cy|e2e)\.[cm]?ts$|(^|/)(__tests__|tests?|e2e|cypress)/.*\.[cm]?ts$
  severity: warning
  escalate: true
  detect:
    ast-grep:
      language: typescript
      rule:
        any:
          - pattern: $FN.$MOD
          - pattern: $X($NAME, $$$)
          - pattern: this.skip($$$)
      constraints:
        FN:
          regex: ^(describe|it|test|suite|context|specify|bench)(\.[A-Za-z]+)*$
        MOD:
          regex: ^(skip|only|todo|fixme|skipIf|runIf|failing|fails|fail)$
        X:
          regex: ^(xit|xdescribe|xtest|xcontext|xspecify|fit|fdescribe|ftest)$
        NAME:
          any:
            - kind: string
            - kind: template_string
  message: "{{file}}:{{line}} skips or focuses tests ({{text}}). Run every test and make it pass by fixing the code. If you believe a test is wrong, leave it running and report which test and why."
  context:
    - "@packages/rules-loop-safety/loop-safety.md#skipped-and-focused-tests"
    - "@packages/rules-loop-safety/loop-safety.md#when-a-test-is-wrong"
  examples:
    good:
      - path: src/cart.test.ts
        code: |
          it("totals the lines", () => {
            expect(total([1, 2])).toBe(3)
          })
      - path: tests/queue.spec.ts
        code: |
          const only = queue.skip(1).filter(isReady)
          test("takes the ready items", () => expect(only).toHaveLength(2))
      - path: src/model.test.ts
        code: |
          const model = fit(points)
          test("fits a line", () => expect(model.slope).toBe(2))
    bad:
      - path: src/cart.test.ts
        code: |
          const id = <T>(x: T) => x
          describe.only("cart", () => {
            it("totals the lines", () => expect(id(3)).toBe(3))
          })
      - path: tests/rates.spec.mts
        code: |
          it.skip("rates are fresh", async () => {
            expect(await rates.age()).toBeLessThan(3600)
          })
      - path: src/cart.test.ts
        code: |
          test.failing("totals the lines", () => expect(total([1, 2])).toBe(3))
- id: loop-safety/no-skipped-tests-js
  name: No new skipped or focused JavaScript and TSX tests
  description: "For agents that run unattended: flags a new .skip, .only, .todo, .failing, xit, fit or this.skip() in a .js, .jsx or .tsx test file. Skipping a red test, or focusing on the green ones, makes a test run pass without fixing anything."
  files: \.(test|spec|cy|e2e)\.([cm]?js|jsx|tsx)$|(^|/)(__tests__|tests?|e2e|cypress)/.*\.([cm]?js|jsx|tsx)$
  severity: warning
  escalate: true
  detect:
    ast-grep:
      language: tsx
      rule:
        any:
          - pattern: $FN.$MOD
          - pattern: $X($NAME, $$$)
          - pattern: this.skip($$$)
      constraints:
        FN:
          regex: ^(describe|it|test|suite|context|specify|bench)(\.[A-Za-z]+)*$
        MOD:
          regex: ^(skip|only|todo|fixme|skipIf|runIf|failing|fails|fail)$
        X:
          regex: ^(xit|xdescribe|xtest|xcontext|xspecify|fit|fdescribe|ftest)$
        NAME:
          any:
            - kind: string
            - kind: template_string
  message: "{{file}}:{{line}} skips or focuses tests ({{text}}). Run every test and make it pass by fixing the code. If you believe a test is wrong, leave it running and report which test and why."
  context:
    - "@packages/rules-loop-safety/loop-safety.md#skipped-and-focused-tests"
    - "@packages/rules-loop-safety/loop-safety.md#when-a-test-is-wrong"
  examples:
    good:
      - path: src/Cart.test.tsx
        code: |
          test("shows the total", () => {
            render(<Cart lines={[1, 2]} />)
            expect(screen.getByText("3")).toBeTruthy()
          })
      - path: __tests__/flags.js
        code: |
          const only = flags.filter((flag) => flag.on)
          it("keeps the flags that are on", () => expect(only).toEqual([on]))
      - path: src/model.test.js
        code: |
          const model = fit(points, { degree: 2 })
          test("fits a curve", () => expect(model).toBeTruthy())
    bad:
      - path: src/Cart.test.jsx
        code: |
          xit("shows the total", () => {
            render(<Cart lines={[1, 2]} />)
          })
      - path: e2e/checkout.cjs
        code: |
          test.todo("pays with a saved card")
      - path: test/rates.js
        code: |
          it("rates are fresh", function () {
            if (!process.env.RATES) this.skip()
          })
- id: loop-safety/no-new-suppressions
  name: No new checker suppressions
  description: "For agents that run unattended: flags a new noqa, type: ignore, eslint-disable, @ts-ignore, biome-ignore or coverage pragma. Silencing the checker is how a loop makes lint, types or coverage pass without fixing the code."
  files: \.(py|pyi|[cm]?[jt]sx?)$
  severity: warning
  escalate: true
  detect:
    regex:
      pattern: "#\\s*([Nn][Oo][Qq][Aa]\\b|type:\\s*ignore\\b|pyright:\\s*(ignore|basic)\\b|mypy:\\s*(ignore-errors|disable-error-code)\\b|pylint:\\s*disable\\b|(ruff|flake8):\\s*[Nn][Oo][Qq][Aa]\\b|pyre-(ignore|fixme)\\b|nosec\\b|nosemgrep\\b|(pragma|PRAGMA)[:\\s]?\\s*(no|NO)\\s*(cover|COVER|branch|BRANCH)\\b)|(//|/\\*)\\s*(eslint-disable(-next-line|-line)?\\b|@ts-(ignore|expect-error|nocheck)\\b|biome-ignore(-all|-start)?\\b|oxlint-disable(-next-line|-line)?\\b|deno-lint-ignore(-file)?\\b|(istanbul|c8|v8)\\s+ignore\\b)"
  message: "{{file}}:{{line}} silences a checker ({{text}}). Fix what the checker reports. If you believe it is wrong here, leave the finding and report it."
  context:
    - "@packages/rules-loop-safety/loop-safety.md#checker-suppressions"
    - "@packages/rules-loop-safety/loop-safety.md#when-a-test-is-wrong"
  examples:
    good:
      - path: app/pricing.py
        code: |
          # We never use noqa here: fix what ruff reports instead.
          def discount(price: float, percent: float) -> float:
              return price * (1 - percent / 100)
      - path: src/cart.ts
        code: |
          // typed: see the eslint config for why lines are numbers
          export const total = (lines: number[]) => lines.reduce((a, b) => a + b, 0)
    bad:
      - path: app/rates.py
        code: |
          import requests  # type: ignore[import]
      - path: app/compat.py
        code: |
          import os, sys  # NOQA: E401
      - path: src/cart.ts
        code: |
          // eslint-disable-next-line no-console
          console.log(total(lines))
- id: loop-safety/no-lowered-thresholds
  name: No changed coverage or failure thresholds
  description: "For agents that run unattended: flags an edit to a coverage threshold (fail_under, --cov-fail-under, coverageThreshold, thresholds, c8 and nyc --lines, codecov target and threshold) or to --max-warnings. Lowering the bar is how a loop makes a coverage or lint gate pass."
  files: (^|/)(pyproject\.toml|setup\.cfg|tox\.ini|\.coveragerc|pytest\.ini|noxfile\.py|Makefile|package\.json|(jest|vitest|vite)\.config\.[cm]?[jt]s|\.nycrc(\.json|\.ya?ml)?|\.c8rc(\.json)?|\.?codecov\.ya?ml)$
  severity: warning
  escalate: true
  detect:
    regex:
      pattern: \bfail_under\s*=\s*\d+(\.\d+)?|--cov-fail-under[= ]+\d+|--fail-under[= ]+\d+|\bcoverageThreshold\b|\bthresholds\s*:|"?\b(branches|functions|lines|statements)"?\s*:\s*\d+(\.\d+)?|--(branches|functions|lines|statements)[= ]+\d+|"?\b(target|threshold)"?\s*:\s*"?\d+(\.\d+)?%|--max-warnings[= ]+\d+
  message: "{{file}}:{{line}} changes a quality threshold ({{text}}). Never lower one to make a run pass: fix the code, or report that the threshold cannot be met. If you raised it, or the task asked for this change, keep it and say in your report what it was and what it is now."
  context:
    - "@packages/rules-loop-safety/loop-safety.md#quality-thresholds"
    - "@packages/rules-loop-safety/loop-safety.md#when-a-test-is-wrong"
  examples:
    good:
      - path: pyproject.toml
        code: |
          [tool.coverage.run]
          branch = true
          source = ["app"]
      - path: vitest.config.ts
        code: |
          export default defineConfig({ test: { coverage: { provider: "v8", reporter: ["text"] } } })
    bad:
      - path: pyproject.toml
        code: |
          [tool.coverage.report]
          fail_under = 70
      - path: jest.config.ts
        code: |
          export default { coverageThreshold: { global: { lines: 60 } } }
      - path: codecov.yml
        code: |
          coverage:
            status:
              project:
                default:
                  target: 80%
      - path: package.json
        code: |
          { "scripts": { "test": "c8 --check-coverage --lines 95 node --test" } }
- id: loop-safety/protected-loop-config
  name: The checks that judge a run are not changed by it
  description: "For agents that run unattended: flags edits to CI workflows and actions, git hooks, .rulecast-config.yaml and .claude/settings*.json, and refuses them in unattended mode. These decide what done means, so the run being judged must not change them."
  files: ^\.github/(workflows|actions)/|^\.gitlab-ci\.yml$|^\.circleci/|^azure-pipelines\.ya?ml$|^\.buildkite/|^Jenkinsfile$|(^|/)\.?lefthook(-local)?\.(ya?ml|toml|jsonc?)$|^\.lefthook/|^\.husky/|^\.pre-commit-config\.yaml$|^\.rulecast-config\.yaml$|^\.claude/settings(\.local)?\.json$
  severity: warning
  escalate: true
  refuse_write: unattended
  detect:
    path: {}
  message: "{{file}} configures the checks that judge this run. Leave it unchanged. If it is wrong, report what and why instead of editing it."
  context:
    - "@packages/rules-loop-safety/loop-safety.md#loop-configuration"
    - "@packages/rules-loop-safety/loop-safety.md#when-a-test-is-wrong"
    - "@packages/rules-loop-safety/loop-safety.md#changing-these-on-purpose"
  examples:
    bad:
      - path: .github/workflows/test.yml
        code: |
          jobs:
            test:
              steps:
                - run: pytest -q --deselect tests/test_rates.py
      - path: lefthook.yml
        code: |
          pre-commit:
            commands: {}
      - path: .lefthook.yml
        code: |
          pre-commit: {}
      - path: .github/actions/setup/action.yml
        code: |
          runs:
            using: composite
      - path: .rulecast-config.yaml
        code: |
          repos: []
      - path: .claude/settings.json
        code: |
          { "hooks": {} }
- id: python/no-httpexception-in-services
  name: Services raise domain exceptions, not HTTPException
  description: Flags HTTPException raised in the service layer, which must stay independent of HTTP.
  files: (^|/)services/.*\.py$
  severity: error
  detect:
    regex:
      pattern: raise\s+HTTPException\b
  message: "{{file}}:{{line}} raises HTTPException in the service layer. Raise a domain exception; the API layer maps it to an HTTP response."
  context:
    - "@packages/rules-python/errors.md#services-raise-domain-exceptions"
  examples:
    good:
      - path: app/services/users.py
        code: |
          def get_user(session, user_id):
              user = crud.get_user(session, user_id)
              if user is None:
                  raise UserNotFound(user_id)
              return user
    bad:
      - path: app/services/users.py
        code: |
          def get_user(session, user_id):
              user = crud.get_user(session, user_id)
              if user is None:
                  raise HTTPException(status_code=404)
              return user
- id: python/no-queries-in-services
  name: Services reach the database through CRUD functions
  description: Flags database queries written directly in the service layer.
  files: (^|/)services/.*\.py$
  severity: error
  detect:
    regex:
      pattern: \b(session|db)\.(exec|execute|query|scalars?)\(
  message: "{{file}}:{{line}} queries the database from the service layer. Move the query into a CRUD function."
  context:
    - "@packages/rules-python/layering.md#data-access-goes-through-crud"
  examples:
    good:
      - path: app/services/users.py
        code: |
          def list_users(session):
              return crud.list_users(session)
    bad:
      - path: app/services/users.py
        code: |
          def list_users(session):
              return session.exec(select(User)).all()
- id: python/layering
  name: Route, service and CRUD layering
  description: Delivers the layering conventions the first time an agent works on a route, service or CRUD module.
  files: (^|/)(api|routers?|routes|services|crud)(/.*)?\.py$
  exclude: (^|/)tests?/
  stages:
    - touch
  context:
    - "@packages/rules-python/layering.md"
- id: python/no-silent-except
  name: No silently swallowed exceptions
  description: Flags an except clause whose only statement is pass, which hides the failure.
  files: \.py$
  severity: error
  detect:
    ast-grep:
      language: python
      rule:
        kind: except_clause
        has:
          kind: block
          has:
            kind: pass_statement
  message: "{{file}}:{{line}} swallows an exception with a bare pass. Handle it, log it, or let it propagate."
  context:
    - "@packages/rules-python/errors.md#swallowed-exceptions"
  examples:
    good:
      - path: app/services/users.py
        code: |
          def get():
              try:
                  fetch()
              except ValueError:
                  log.warning("missing")
    bad:
      - path: app/services/users.py
        code: |
          def get():
              try:
                  fetch()
              except ValueError:
                  pass
- id: python/thin-routes
  name: Route handlers stay thin
  description: A model judges whether a route does more than parse input, call a service and return. Sends file contents to your configured LLM provider.
  files: ^app/(api|routers)/.*\.py$
  severity: warning
  detect:
    llm:
      model: haiku
      question: |
        Does this route handler do more than parse input, call a service and return the result — business logic, database access, or error translation written inline? Report each offending line.
  message: "{{file}}:{{line}} does work that belongs in a service. {{reason}}"
  context:
    - "@packages/rules-python/layering.md#business-logic-goes-in-services"
- id: react/no-fetch-in-components
  name: Components get server data through query hooks
  description: Flags network calls (fetch, axios) made directly in components.
  files: (^|/)components/.*\.[jt]sx$
  severity: warning
  detect:
    regex:
      pattern: \bfetch\(|\baxios\.(get|post|put|patch|delete|request)\(
  message: "{{file}}:{{line}} calls the network from a component. Fetch server data through a query or mutation hook."
  context:
    - "@packages/rules-react/data-fetching.md"
  examples:
    good:
      - path: src/components/UserList.tsx
        code: |
          export function UserList() {
            const { data } = useUsers()
            return <List items={data} />
          }
    bad:
      - path: src/components/UserList.tsx
        code: |
          export function UserList() {
            const [users, setUsers] = useState([])
            useEffect(() => {
              fetch("/api/users").then((r) => r.json()).then(setUsers)
            }, [])
            return <List items={users} />
          }
- id: react/data-fetching
  name: Server state lives in the query layer
  description: Delivers the data-fetching conventions the first time an agent works on a component, route or hook.
  files: (^|/)(components|routes|hooks)/.*\.[jt]sx?$
  stages:
    - touch
  context:
    - "@packages/rules-react/data-fetching.md"
- id: react/no-inline-style
  name: No inline style props
  description: Flags style={{ ... }} on JSX elements, which bypasses the design system.
  files: (^|/)(components|routes)/.*\.[jt]sx$
  severity: warning
  detect:
    ast-grep:
      language: tsx
      rule:
        pattern:
          context: <div style={{ $$$PROPS }}/>
          selector: jsx_attribute
  message: "{{file}}:{{line}} styles inline with {{text}}. Use the design system's classes so the value stays themeable."
  context:
    - "@packages/rules-react/styling.md#inline-styles"
  examples:
    good:
      - path: src/components/Card.tsx
        code: |
          export const Card = () => <div className="p-2">x</div>
    bad:
      - path: src/components/Card.tsx
        code: |
          export const Card = () => <div style={{ padding: 8 }}>x</div>
