- id: loop-safety/no-deleted-assertions-python
  name: No removed Python assertions
  description: "For agents that run unattended: flags a Python test file with fewer assert statements, unittest assert* calls, mock assert_* calls or pytest.raises blocks than it had before the change. Deleting the assertion that fails is a way to make pytest pass."
  files: (^|/)(test[^/]*|[^/]*_test|conftest)\.py$|(^|/)tests?/.*\.py$
  severity: warning
  escalate: true
  scope: removed
  detect:
    ast-grep:
      language: python
      rule:
        any:
          - kind: assert_statement
          - kind: call
            has:
              field: function
              regex: \.\s*assert(_\w*|[A-Z]\w*)?$|^pytest\s*\.\s*(raises|warns|deprecated_call|fail)$
  message: "{{file}}:{{line}} removes assertions ({{text}}). Put them back and make the test pass by fixing the code. If you believe an assertion is wrong, leave it in place and report which one and why. If you combined assertions on purpose, such as several into one parametrized test or one comparison, keep it and say so in your report."
  context:
    - "@packages/rules-loop-safety/loop-safety.md#deleted-assertions"
    - "@packages/rules-loop-safety/loop-safety.md#when-a-test-is-wrong"
  examples:
    good:
      - path: tests/test_pricing.py
        code: |
          def test_discount():
              # assert discount(100, 15) == 85
              result = discount(100, 15)
    bad:
      - path: tests/test_pricing.py
        code: |
          def test_discount():
              assert discount(100, 15) == 85
      - path: shop/tests.py
        code: |
          class CartTests(TestCase):
              def test_total(self):
                  self.assertEqual(total([1, 2]), 3)
      - path: tests/test_rates.py
        code: |
          def test_rejects_none():
              with pytest.raises(ValueError):
                  total(None)
              mailer.send.assert_called_once()
