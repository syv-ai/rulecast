      constraints:
        FN:
          regex: ^(describe|it|test|suite|context|specify|bench)(\.[A-Za-z]+)*$
        MOD:
          regex: ^(skip|only|todo|fixme|skipIf|runIf|failing|fails|fail)$
        X:
          regex: ^(xit|xdescribe|xtest|xcontext|xspecify|fit|fdescribe|ftest)$
        NAME:
          any:
            - kind: string
            - kind: template_string
  message: "{{file}}:{{line}} skips or focuses tests ({{text}}). Run every test and make it pass by fixing the code. If you believe a test is wrong, leave it running and report which test and why."
  context:
    - "@packages/rules-loop-safety/loop-safety.md#skipped-and-focused-tests"
    - "@packages/rules-loop-safety/loop-safety.md#when-a-test-is-wrong"
  examples:
    good:
      - path: src/Cart.test.tsx
        code: |
          test("shows the total", () => {
            render(<Cart lines={[1, 2]} />)
            expect(screen.getByText("3")).toBeTruthy()
          })
      - path: __tests__/flags.js
        code: |
          const only = flags.filter((flag) => flag.on)
          it("keeps the flags that are on", () => expect(only).toEqual([on]))
      - path: src/model.test.js
        code: |
          const model = fit(points, { degree: 2 })
          test("fits a curve", () => expect(model).toBeTruthy())
    bad:
      - path: src/Cart.test.jsx
        code: |
          xit("shows the total", () => {
            render(<Cart lines={[1, 2]} />)
          })
      - path: e2e/checkout.cjs
        code: |
          test.todo("pays with a saved card")
      - path: test/rates.js
        code: |
          it("rates are fresh", function () {
            if (!process.env.RATES) this.skip()
          })
- id: loop-safety/no-deleted-assertions-python
  name: No removed Python assertions
  description: "For agents that run unattended: flags a Python test file with fewer assert statements, unittest assert* calls, mock assert_* calls or pytest.raises blocks than it had before the change. Deleting the assertion that fails is a way to make pytest pass."
  files: (^|/)(test[^/]*|[^/]*_test|conftest)\.py$|(^|/)tests?/.*\.py$
  severity: warning
  escalate: true
  scope: removed
  detect:
    ast-grep:
      language: python
      rule:
        any:
          - kind: assert_statement
          - kind: call
            has:
              field: function
              regex: \.\s*assert(_\w*|[A-Z]\w*)?$|^pytest\s*\.\s*(raises|warns|deprecated_call|fail)$
  message: "{{file}}:{{line}} removes assertions ({{removed}} of {{baseline}} removed). Put them back and make the test pass by fixing the code. If you believe an assertion is wrong, leave it in place and report which one and why. If you combined assertions on purpose, such as several into one parametrized test or one comparison, keep it and say so in your report."
  context:
    - "@packages/rules-loop-safety/loop-safety.md#deleted-assertions"
    - "@packages/rules-loop-safety/loop-safety.md#when-a-test-is-wrong"
  examples:
    good:
      - path: tests/test_pricing.py
        code: |
          def test_discount():
              # assert discount(100, 15) == 85
              result = discount(100, 15)
    bad:
      - path: tests/test_pricing.py
        code: |
          def test_discount():
              assert discount(100, 15) == 85
      - path: shop/tests.py
        code: |
          class CartTests(TestCase):
              def test_total(self):
                  self.assertEqual(total([1, 2]), 3)
      - path: tests/test_rates.py
        code: |
          def test_rejects_none():
              with pytest.raises(ValueError):
                  total(None)
              mailer.send.assert_called_once()
