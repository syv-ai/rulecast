- id: loop-safety/no-new-suppressions
  name: No new checker suppressions
  description: "For agents that run unattended: flags a new noqa, type: ignore, eslint-disable, @ts-ignore, biome-ignore or coverage pragma. Silencing the checker is how a loop makes lint, types or coverage pass without fixing the code."
  files: \.(py|pyi|[cm]?[jt]sx?)$
  severity: warning
  escalate: true
  detect:
    regex:
      pattern: "#\\s*([Nn][Oo][Qq][Aa]\\b|type:\\s*ignore\\b|pyright:\\s*(ignore|basic)\\b|mypy:\\s*(ignore-errors|disable-error-code)\\b|pylint:\\s*disable\\b|(ruff|flake8):\\s*[Nn][Oo][Qq][Aa]\\b|pyre-(ignore|fixme)\\b|nosec\\b|nosemgrep\\b|(pragma|PRAGMA)[:\\s]?\\s*(no|NO)\\s*(cover|COVER|branch|BRANCH)\\b)|(//|/\\*)\\s*(eslint-disable(-next-line|-line)?\\b|@ts-(ignore|expect-error|nocheck)\\b|biome-ignore(-all|-start)?\\b|oxlint-disable(-next-line|-line)?\\b|deno-lint-ignore(-file)?\\b|(istanbul|c8|v8)\\s+ignore\\b)"
  message: "{{file}}:{{line}} silences a checker ({{text}}). Fix what the checker reports. If you believe it is wrong here, leave the finding and report it."
  context:
    - "@packages/rules-loop-safety/loop-safety.md#checker-suppressions"
    - "@packages/rules-loop-safety/loop-safety.md#when-a-test-is-wrong"
  examples:
    good:
      - path: app/pricing.py
        code: |
          # We never use noqa here: fix what ruff reports instead.
          def discount(price: float, percent: float) -> float:
              return price * (1 - percent / 100)
      - path: src/cart.ts
        code: |
          // typed: see the eslint config for why lines are numbers
          export const total = (lines: number[]) => lines.reduce((a, b) => a + b, 0)
    bad:
      - path: app/rates.py
        code: |
          import requests  # type: ignore[import]
      - path: app/compat.py
        code: |
          import os, sys  # NOQA: E401
      - path: src/cart.ts
        code: |
          // eslint-disable-next-line no-console
          console.log(total(lines))
- id: loop-safety/no-config-suppressions-python
  name: No weakened Python checker configuration
  description: "For agents that run unattended: flags a new mypy ignore_missing_imports, ignore_errors, disable_error_code or follow_imports = skip, a loosened mypy flag, a ruff or flake8 ignore or per-file-ignores entry, a pylint disable list, a lowered pyright typeCheckingMode or report setting, and pytest --deselect, -k, --ignore or -p no: for a checking plugin in Python tool configuration. Silencing the checker in its config is the same shortcut as a noqa on the line."
  files: (^|/)(pyproject\.toml|setup\.cfg|tox\.ini|pytest\.ini|\.?mypy\.ini|\.?ruff\.toml|\.flake8|pyrightconfig\.json|\.?pylintrc)$
  severity: warning
  escalate: true
  detect:
    regex:
      pattern: (?<!#[^\n]*)(?<!^[ \t]*;[^\n]*)(?:\b(ignore_missing_imports|allow_untyped_globals|allow_redefinition(_new)?|implicit_optional|implicit_reexport)\s*=\s*(true|True|1)\b|\bignore_errors\s*=\s*(true|True|1)\b(?<=^\[\[?(tool\.)?mypy\b[^\]\n]*\]\]?[^\n]*(\n(?![ \t]*\[)[^\n]*)*\n[ \t]*ignore_errors\s*=\s*(true|True|1))|\b(disallow_\w+|check_untyped_defs|strict\w*|warn_\w+)\s*=\s*(false|False|0)\b|\bfollow_imports\s*=\s*["']?(skip|silent)\b|\b(disable_error_code|disable|(extend[-_])?ignore|(extend[-_])?per[-_]file[-_]ignores)\s*=\s*(\[[^\]]*\]|[^\n]*(\n[ \t]+[^\s=][^\n=]*)*)|^\[[^\]\n]*per-file-ignores\](\n(?!\s*\[)[^\n]*)*|"?\btypeCheckingMode"?\s*[:=]\s*["']?(off|basic|standard)\b|"?\breport[A-Z]\w*"?\s*[:=]\s*["']?(false|none|warning|information)\b|--deselect\b|--ignore(-glob)?[= ]|(^|[\s"'\[,])-k[= ]|-p\s*no:(warnings|doctest|cov|randomly|timeout|mypy|ruff|flake8|pylint|typeguard|beartype)\b)
      flags: m
  message: "{{file}}:{{line}} weakens a checker in its configuration ({{text}}). Fix what the checker or the test reports instead. If you believe the setting is right, or the task asked for it, keep it and say in your report what it was and what it is now."
  context:
    - "@packages/rules-loop-safety/loop-safety.md#checker-configuration"
    - "@packages/rules-loop-safety/loop-safety.md#when-a-test-is-wrong"
  examples:
    good:
      - path: pyproject.toml
        code: |
          [tool.mypy]
          strict = true
          disallow_untyped_defs = true

          [tool.ruff.lint]
          select = ["E", "F", "B"]
      - path: pyproject.toml
        code: |
          [tool.bumpversion]
          allow_dirty = true

          [tool.semantic_release]
          allow_zero_version = true

          [tool.coverage.report]
          ignore_errors = true
      - path: pytest.ini
        code: |
          [pytest]
          # Select with -k, or leave a test out with --deselect, on the command line only.
          addopts = -q -p no:cacheprovider
    bad:
      - path: pyproject.toml
        code: |
          [[tool.mypy.overrides]]
          module = "legacyrates"
          ignore_missing_imports = true
      - path: ruff.toml
        code: |
          [lint.per-file-ignores]
          "app/rates.py" = ["ANN401"]
      - path: setup.cfg
        code: |
          [flake8]
          extend-ignore =
              E203,
              F401
      - path: pytest.ini
        code: |
          [pytest]
          addopts = -q --deselect tests/test_rates.py::test_live
      - path: pyrightconfig.json
        code: |
          { "typeCheckingMode": "basic" }
      - path: setup.cfg
        code: |
          [mypy-legacyrates.*]
          ignore_errors = True
      - path: pyproject.toml
        code: |
          [tool.pylint."messages control"]
          disable = ["missing-docstring"]
- id: loop-safety/no-config-suppressions-js
  name: No weakened JavaScript and TypeScript checker configuration
  description: "For agents that run unattended: flags an ESLint or Biome rule set to off (or ESLint's 0), Biome's linter or recommended set switched off, and a tsconfig strictness flag (strict, noImplicitAny and the other no* checks) set to false. Silencing the checker in its config is the same shortcut as an eslint-disable on the line."
  files: (^|/)(\.eslintrc(\.(json|jsonc|js|cjs|mjs|ya?ml))?|eslint\.config\.[cm]?[jt]s|biome\.jsonc?|[jt]sconfig[^/]*\.json|package\.json)$
  severity: warning
  escalate: true
  detect:
    regex:
      pattern: (?<!^[ \t]*(//|#|/?\*)[^\n]*)(?:["']?(?<![\w@/.-])(@?[\w.-]*[-/][\w/.-]*|(no|use)[A-Z]\w*|eqeqeq|curly|camelcase|complexity|radix|semi|quotes|indent|yoda|strict)["']?\s*:\s*\[?\s*(["']off["']|off\b|0\b)|"(strict\w*|noImplicit\w+|noUnused\w+|noUnchecked\w+|noFallthroughCasesInSwitch|noPropertyAccessFromIndexSignature|exactOptionalPropertyTypes|useUnknownInCatchVariables|alwaysStrict|recommended)"\s*:\s*false\b|"enabled"\s*:\s*false\b(?<="linter"\s*:\s*\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*"enabled"\s*:\s*false))
      flags: m
  message: "{{file}}:{{line}} weakens a checker in its configuration ({{text}}). Fix what the checker reports instead. If you believe the setting is right, or the task asked for it, keep it and say in your report what it was and what it is now."
  context:
    - "@packages/rules-loop-safety/loop-safety.md#checker-configuration"
    - "@packages/rules-loop-safety/loop-safety.md#when-a-test-is-wrong"
  examples:
    good:
      - path: tsconfig.json
        code: |
          { "compilerOptions": { "strict": true, "skipLibCheck": true, "target": "es2022" } }
      - path: eslint.config.js
        code: |
          export default [{ rules: { "no-console": "error", eqeqeq: ["error", "always"] } }]
      - path: biome.json
        code: |
          {
            "vcs": { "enabled": false },
            "formatter": { "enabled": false },
            "assist": { "actions": { "source": { "organizeImports": "off" } } }
          }
      - path: package.json
        code: |
          { "name": "shop", "renovate": { "enabled": false } }
      - path: eslint.config.js
        code: |
          export default [{
            rules: {
              // "no-console": "off",
              "no-console": "error",
            },
          }]
    bad:
      - path: tsconfig.json
        code: |
          { "compilerOptions": { "strict": false } }
      - path: tsconfig.app.json
        code: |
          { "compilerOptions": { "noImplicitAny": false } }
      - path: eslint.config.mjs
        code: |
          export default [{ rules: { "@typescript-eslint/no-explicit-any": "off" } }]
      - path: .eslintrc.yml
        code: |
          rules:
            no-console: off
      - path: biome.json
        code: |
          { "linter": { "rules": { "suspicious": { "noExplicitAny": "off" } } } }
      - path: biome.json
        code: |
          { "linter": { "include": ["src"], "enabled": false } }
- id: loop-safety/no-lowered-thresholds
  name: No changed coverage or failure thresholds
  description: "For agents that run unattended: flags an edit to a coverage threshold (fail_under, --cov-fail-under, coverageThreshold, thresholds, c8 and nyc --lines, codecov target and threshold) or to --max-warnings. Lowering the bar is how a loop makes a coverage or lint gate pass."
  files: (^|/)(pyproject\.toml|setup\.cfg|tox\.ini|\.coveragerc|pytest\.ini|noxfile\.py|Makefile|package\.json|(jest|vitest|vite)\.config\.[cm]?[jt]s|\.nycrc(\.json|\.ya?ml)?|\.c8rc(\.json)?|\.?codecov\.ya?ml)$
  severity: warning
  escalate: true
  detect:
    regex:
      pattern: \bfail_under\s*=\s*\d+(\.\d+)?|--cov-fail-under[= ]+\d+|--fail-under[= ]+\d+|\bcoverageThreshold\b|\bthresholds\s*:|"?\b(branches|functions|lines|statements)"?\s*:\s*\d+(\.\d+)?|--(branches|functions|lines|statements)[= ]+\d+|"?\b(target|threshold)"?\s*:\s*"?\d+(\.\d+)?%|--max-warnings[= ]+\d+
  message: "{{file}}:{{line}} changes a quality threshold ({{text}}). Never lower one to make a run pass: fix the code, or report that the threshold cannot be met. If you raised it, or the task asked for this change, keep it and say in your report what it was and what it is now."
  context:
    - "@packages/rules-loop-safety/loop-safety.md#quality-thresholds"
    - "@packages/rules-loop-safety/loop-safety.md#when-a-test-is-wrong"
  examples:
    good:
      - path: pyproject.toml
        code: |
          [tool.coverage.run]
          branch = true
          source = ["app"]
      - path: vitest.config.ts
        code: |
          export default defineConfig({ test: { coverage: { provider: "v8", reporter: ["text"] } } })
    bad:
      - path: pyproject.toml
        code: |
          [tool.coverage.report]
          fail_under = 70
      - path: jest.config.ts
        code: |
          export default { coverageThreshold: { global: { lines: 60 } } }
      - path: codecov.yml
        code: |
          coverage:
            status:
              project:
                default:
                  target: 80%
      - path: package.json
        code: |
          { "scripts": { "test": "c8 --check-coverage --lines 95 node --test" } }
- id: loop-safety/protected-loop-config
  name: The checks that judge a run are not changed by it
  description: "For agents that run unattended: flags edits to CI workflows and actions, git hooks, .rulecast-config.yaml and .claude/settings*.json, and refuses them in unattended mode. These decide what done means, so the run being judged must not change them."
  files: ^\.github/(workflows|actions)/|^\.gitlab-ci\.yml$|^\.circleci/|^azure-pipelines\.ya?ml$|^\.buildkite/|^Jenkinsfile$|(^|/)\.?lefthook(-local)?\.(ya?ml|toml|jsonc?)$|^\.lefthook/|^\.husky/|^\.pre-commit-config\.yaml$|^\.rulecast-config\.yaml$|^\.claude/settings(\.local)?\.json$
  severity: warning
  escalate: true
  refuse_write: unattended
  detect:
    path: {}
  message: "{{file}} configures the checks that judge this run. Leave it unchanged. If it is wrong, report what and why instead of editing it."
  context:
    - "@packages/rules-loop-safety/loop-safety.md#loop-configuration"
    - "@packages/rules-loop-safety/loop-safety.md#when-a-test-is-wrong"
    - "@packages/rules-loop-safety/loop-safety.md#changing-these-on-purpose"
  examples:
    bad:
      - path: .github/workflows/test.yml
        code: |
          jobs:
            test:
              steps:
                - run: pytest -q --deselect tests/test_rates.py
      - path: lefthook.yml
        code: |
          pre-commit:
            commands: {}
      - path: .lefthook.yml
        code: |
          pre-commit: {}
      - path: .github/actions/setup/action.yml
        code: |
          runs:
            using: composite
      - path: .rulecast-config.yaml
        code: |
          repos: []
      - path: .claude/settings.json
        code: |
          { "hooks": {} }
- id: python/no-silent-except
  name: No silently swallowed exceptions
  description: "Flags try-except-pass (ruff S110): a broad except whose only statement is pass hides the failure."
  files: \.py$
  severity: error
  detect:
    linter:
      tool: ruff
      rules:
        - S110
  message: "{{file}}:{{line}} swallows an exception with pass. Handle it, log it, or let it propagate."
  context:
    - "@packages/rules-python/errors.md#swallowed-exceptions"
  examples:
    good:
      - path: app/users.py
        code: |
          def get():
              try:
                  fetch()
              except Exception:
                  log.exception("fetch failed")
      - path: app/users.py
        code: |
          def get():
              try:
                  fetch()
              except KeyError:
                  pass
    bad:
      - path: app/users.py
        code: |
          def get():
              try:
                  fetch()
              except Exception:
                  pass
